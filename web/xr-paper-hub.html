决的问题","body":"盲人与低视力（BLV）用户的真实需求不是\"找到任意一只杯子\"，而是\"找到**我的**那只\"。现有两条路线都不解决这个：\n- **手机/可穿戴自助系统**：把负担全压在用户身上——用户必须走遍空间、反复调整相机朝向，直到物体进入视野。视野外的物体对识别器而言**永远不存在**。\n- **VLN 策略直接套用**：以\"导航稳定停止\"作为任务完成标志。但对个性化寻物，稳定停止**不等于身份正确**。"},{"h":"方法详解","body":"职责分离：机器人提供移动能力与视角，智能手机（BLV 用户最易用的界面）负责指定目标与获知结果。\n\n### 四个智能体\n1. **Target Teaching Agent**：把带引导的手机录制转换成语义目标画像 + **可复用的多视角参考库**。采集流程含 **AR 引导、语音与触觉反馈、屏幕阅读器支持**，一次教学后后续任务直接引用，无需重复。\n2. **Navigation Agent**：探索环境并提出候选目标。\n3. **Verification Agent**：把每个候选与存储的参考比对。\n4. **Coordination and Recovery Agent**：完成任务，或触发恢复与继续搜索。\n\n### 核心设计决策\n**导航停止 = 候选提议，而非完成判定。** 只有 Verification Agent 通过，任务才算完成；`NOT VERIFIED` 触发恢复与继续搜索。这是把误报率从 75% 压到 5% 的直接原因。"},{"h":"实验与结果","body":"**设置**：10 个目标（6 个上下文稳定、4 个可移动），场景中含 0–2 个指定干扰物。\n\n| 方法 | 试验数 | 成功率 | 误报成功率 |\n|---|---|---|---|\n| Sequential first-stop（重建基线） | 20 | 25.0% | 75.0% |\n| **RoboFind** | 20 | **85.0%** | **5.0%** |\n| GPT-6 Astra-only（6 个共享目标，独立执行） | 12 | 5/12 | — |\n| **RoboFind（同 6 目标）** | 12 | **10/12** | — |\n\n- 17 次成功试验到目标的**中位时间 165.8 s**。\n- 6 个共享目标上平均成功耗时：RoboFind 225.4 s、Astra 134.6 s、sequential 177.1 s。**作者诚实指出这些均值来自不同成功子集，不构成配对的速度排序**——RoboFind 是以中等的耗时增加换取正确率的大幅提升。\n- 失败案例剖析：6 次试验在连续三次 `STOP` 输出后仍给出错误候选，说明**停止一致性不能确立个性化物品身份**；一次绿植试验中 100 条导航记录里 62 条只有转向动作；唯一的误报成功接受了 S=0.672 且上下文 `MATCH` 的错误棕色椅子候选。"},{"h":"创新点与贡献","body":"1. **把终止判据从\"导航置信度\"换成\"实例身份\"**——这是本工作最可迁移的方法论贡献。\n2. 一次教学、多次复用的参考库设计，配合完整的无障碍采集流（AR 引导 + 语音 + 触觉 + 屏幕阅读器）。\n3. 大规模真机验证（32 次任务）并公开失败案例与边界条件分析。\n4. 论文附有**生成式 AI 使用披露**：OpenAI Codex 辅助代码与文稿编辑，作者独立复核，所有结果来自真实实验运行。这是负责任的做法，值得记录。"},{"h":"局限与风险","body":"- 仅 10 个目标、单一四足平台、20 次主试验，统计强度有限。\n- 中位 165.8 s 的耗时对日常使用仍偏长。\n- 验证器仍会误判（1 次误报成功，S=0.672 被接受），阈值需进一步校准。\n- Astra 基线为 12 次独立试验、目标仅 6 个，与 RoboFind 的对比不完全配对。\n- 代码\"即将公开\"。"},{"h":"与文献库的关系","body":"**新增 + 取代一个评测/设计范式**。\n\n- 取代证据：`arXiv:2609.20330` Table —— sequential first-stop 范式（VLN 直接套用于个性化寻物）误报成功率 75.0%，RoboFind 5.0%；成功率 25.0% vs 85.0%。**“稳定停止即完成”这一约定在实例级任务上已被证明不可靠。**\n\n**未被取代**：RoboFind 本身为 CURRENT（2026-09-17 提交）。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 即将公开 |\n| 数据 | 真机试验记录，Mission 结果人工标注（独立于自动验证器） |\n| 硬件 | 四足机器人 + 智能手机；导航用 Uni-NaVid |"},{"h":"行动建议","body":"- **无障碍产品团队**：直接借鉴\"候选—验证—恢复\"的三段式闭环，这是把通用导航策略改造成个性化任务的最小改动方案。\n- **AR 引导采集**：其 Target Teaching 的无障碍采集流程（AR + 语音 + 触觉 + 屏幕阅读器）可作为同类产品的设计参考。\n- **任何\"实例级\"机器人任务**：终止判据的设计原则（身份 > 置信度）可直接迁移。"}]},{"file":"../papers/notes/2609.20589__RawSLAM在线HDR高斯SLAM.md","id":"2609.20589","title":"RawSLAM: Online HDR Gaussian SLAM from Linear Radiance","title_zh":"RawSLAM：从线性辐射度出发的在线 HDR 高斯 SLAM","track":"重建与SLAM","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"S","value":4.5,"evidence":"FULL","tags":["HDR","线性辐射度","高斯泼溅","稠密SLAM","RAW图像","极端光照鲁棒性"],"flags":[],"sections":[{"h":"一句话结论","body":"首个**在线**高斯 SLAM 框架，直接在单曝光 16-bit 线性 HDR 影像上做跟踪与建图。在自建 RawSLAM 数据集上把 ATE 从 MonoGS 的 56.84 cm 降到 24.15 cm（**−57.5%**），且**无一次跟踪失败**（对比 SplaTAM 失败 3 个序列、Gaussian SLAM 失败 1 个）。"},{"h":"要解决的问题","body":"现有稠密视觉 SLAM 几乎全部建立在 **8-bit tone-mapped sRGB（LDR）** 输入上。相机的 ISP 流水线在这里做了三件事：去马赛克 → 色彩校正 → **色调映射 + 8 bit 量化**。最后一步把传感器实际捕获的宽动态范围压缩掉，且把更多比特分配给暗部。\n\n后果是明确的：**阴影区与高光区的亮度信息被丢弃**，在强对比场景下引发跟踪漂移乃至建图崩溃。AR 头显恰恰是这类场景的重灾区——室内窗边、逆光走廊、金属反光、室外正午。\n\n反观已有的 RAW / HDR 重建管线（如 LE3D），全部是**离线**的：依赖 SfM 预处理，无法处理大帧间运动，更无法在线运行。"},{"h":"方法详解","body":"基线框架为 MonoGS，在其上做三处改造：\n\n### 1. HDR 高斯泼溅模块（无 MLP 的对数参数化）\n标准 3DGS 用球谐（SH）或与视角无关的 RGB 特征表示颜色，本质上是为**非线性 tone-mapped sRGB** 优化的。线性 HDR 的像素强度分布极度偏斜（暗部与中间调被压到极小的数值），直接归一化后优化会崩溃。\n\n离线方法（LE3D）的对策是引入**辅助颜色 MLP**，代价是计算与显存。RawSLAM 的对策更简洁——**直接对颜色特征取对数**：\n\n$$f_i = \\log(\\max(c_p^k, \\epsilon)), \\quad \\epsilon = 10^{-6}, \\qquad c_i = \\exp(f_i)$$\n\n链式法则给出梯度：\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial f_i} = \\frac{\\partial \\mathcal{L}}{\\partial c_i} \\cdot \\exp(f_i) = \\frac{\\partial \\mathcal{L}}{\\partial c_i} \\cdot c_i$$\n\n关键洞察：Adam 会按梯度运行幅值归一化更新，因此 $f_i$ 的**步长大小与 $c_i$ 无关**，而在对数空间中定长步长等价于**颜色的百分比变化**。暗基元（$c_i \\to 0$）因此收到与亮基元**相对一致的小绝对更新**，不会一步overshoot到中间调。\n\n### 2. Reinhard 区间压缩光度目标\n对线性辐射度做区间压缩，避免高光主导损失。\n\n### 3. 结构引导的空间梯度加权\n按场景结构调制光度梯度的空间权重。\n\n### 评测指标的选择（值得单独记一笔）\n作者指出 **tone-mapping 会掩盖物理辐射误差**，因此主指标采用 $\\text{PSNR-}\\mu$（$\\mu=5000$，对线性辐射度直接做 $\\mu$-law 对数压缩），防止极端镜面高光在光度误差中占比失衡。这是一个方法论层面的正确选择。"},{"h":"实验与结果","body":"**自建 RawSLAM 数据集**：Intel RealSense D435i，10 段室内序列（平均 ~1,860 帧，总计 >18,600 帧），16-bit raw DNG；毫米级 OptiTrack 提供 6-DoF 真值；**同时提供未处理的 16-bit 线性 HDR 流与 ISP 处理后的 8-bit sRGB LDR 流**，以便公平对比。\n\n硬件：Intel i7-14700K + NVIDIA Quadro RTX 5000，输入下采样到 360×640。全流程 Docker 容器化发布。\n\n| 方法 | ATE RMSE (cm) ↓ | PSNR-μ (dB) ↑ | PSNR (dB) ↑ | SSIM ↑ | Depth L1 (cm) ↓ |\n|---|---|---|---|---|---|\n| SplaTAM | 89.29（**3 次失跟**） | — | 19.13 | 0.706 | 104.83 |\n| Gaussian SLAM | 86.93（**1 次失跟**） | — | 21.86 | 0.803 | 55.46 |\n| MonoGS | 56.84 | — | 18.36 | 0.483 | 154.72 |\n| Vanilla HDR（MonoGS 直接 HDR 适配） | 49.43 | 20.96 | 17.33 | 0.529 | 159.36 |\n| **Ours (LDR)** | **25.97** | — | 20.12 | 0.548 | 107.32 |\n| **Ours (HDR)** | **24.15** | **22.96** | 18.92 | 0.515 | 118.10 |\n\n关键读数：\n- Ours (HDR) 相对 Vanilla HDR **−51.1%** ATE；PSNR-μ **+2.00 dB**。\n- Ours (LDR) 相对 MonoGS 基线**近乎减半**（25.97 vs 56.84 cm）——即**同一套改造在标准 8-bit 输入上也成立**，这是本工作泛化价值最强的一点。\n- 渲染质量上 SplaTAM / Gaussian SLAM 的 PSNR/SSIM 更高，但它们的**轨迹误差高达 86–89 cm 且存在整段失跟**——在 SLAM 任务上不可接受。\n- **TUM RGB-D 泛化**（Table 2）：三个序列平均 ATE 从 1.84 cm 降到 1.64 cm，说明改造不损害常规良好光照下的性能。\n- **效率**：LDR 配置 1.29 FPS（比 MonoGS 的 1.11 FPS 快 16.2%）；HDR 配置 1.22 FPS（比 Vanilla HDR 快 13.0%）。\n- **迁移性**：HDR 高斯模块可无缝接入 SplaTAM、Gaussian SLAM、DROID-W，**消除这些系统在挑战光照序列上的全部跟踪失败**。"},{"h":"创新点与贡献","body":"1. 首个在线单曝光 16-bit 线性 HDR 高斯 SLAM。\n2. **无 MLP 的对数颜色参数化**——用一行指数映射替换了离线方法整个辅助颜色网络，并给出了 Adam 归一化下的步长不变性论证。\n3. 指出并解决了\"tone-mapping 掩盖辐射误差\"的评测盲区，主推 PSNR-μ。\n4. 发布 RawSLAM 数据集（16-bit RAW + 对齐深度 + IMU + OptiTrack 真值）与 Docker 化完整管线。"},{"h":"局限与风险","body":"- **1.22–1.29 FPS** 远未达到 AR/VR 所需的实时（≥30 FPS）。这是当前最大的落地障碍，论文未讨论加速路径。\n- 仅在**室内** 10 段序列验证，未覆盖室外强日光下的超大动态范围。\n- 输入下采样到 360×640，分辨率较低。\n- 代码与数据集\"即将公开\"（`will be made publicly available soon`），当前不可获取。\n- PSNR/SSIM 在 tonemapped 评估下低于 SplaTAM/Gaussian SLAM——虽然作者以轨迹误差为由论证取舍合理，但若目标是渲染而非定位，需谨慎。"},{"h":"与文献库的关系","body":"**新增 + 使一条既有路线降级为次优**。\n\n- 取代证据：`arXiv:2609.20589` Table 1 —— 8-bit LDR 稠密 SLAM（MonoGS 56.84 cm；SplaTAM 89.29 cm 且 3 段失跟；Gaussian SLAM 86.93 cm 且 1 段失跟）在极端光照下全部劣于 RawSLAM（24.15 cm，0 失跟）。\n- 补充证据：RawSLAM 的 HDR 模块迁移到 SplaTAM / Gaussian SLAM / DROID-W 后**消除全部跟踪失败**，说明瓶颈在输入表示而非架构。\n\n**注意（避免误判）**：`arXiv:2609.19518`（AMB3R-SLAM）与 `arXiv:2609.20012`（GRF-Recon）虽然同属 SLAM 赛道，但分别解决**公里级大规模**与**长序列前馈重建**问题，与 RawSLAM 的**光照鲁棒性**是**互补而非竞争**关系，不构成取代。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 即将公开（含修改后的 CUDA kernel） |\n| 数据 | RawSLAM 数据集，即将公开 |\n| 环境 | Docker 容器化，含评测脚本 |\n| 硬件 | i7-14700K + Quadro RTX 5000 |"},{"h":"行动建议","body":"- **AR 头显 / 户外机器人定位团队**：把 HDR/RAW 输入纳入下一代 SLAM 前端的技术选型，本工作给出了最低成本的实现路径（无需 MLP）。\n- **想在现有 MonoGS/SplaTAM 上提升鲁棒性**：直接移植其 HDR 高斯模块，论文已验证跨架构有效。\n- **关注但暂不落地**：1.2 FPS 的实时性缺口需要自行解决；可等待代码公开后评估。"}]},{"file":"../papers/notes/2609.20649__DexTouch-WM人类触觉世界模型.md","id":"2609.20649","title":"DexTouch-WM: Learning Action-Conditioned Tactile World Models from Human Touch for Dexterous Robot Manipulation","title_zh":"DexTouch-WM：从人类触觉学习动作条件的触觉世界模型，用于灵巧机器人操作","track":"触觉与多模态","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"A","value":4.0,"evidence":"FULL","tags":["触觉","世界模型","灵巧操作","人机迁移","压阻阵列","WAN2.2"],"flags":[],"sections":[{"h":"一句话结论","body":"核心洞察是：**只要把触觉观测与动作空间做成兼容，人类与机器人的操作就共享可迁移的接触动力学**。在真机监督固定（5 小时）的前提下，把人类交互数据从 0 增到 100 小时，**留出机器人域的视觉、几何与接触预测均获显著改善**，且人机任务集**完全不相交**。"},{"h":"要解决的问题","body":"富接触的灵巧操作由**无法从图像直接观测**的物理交互状态决定：视觉上相似的运动可能对应完全不同的接触压力、滑移或即将发生的卡死，尤其当手遮挡物体时。**触觉对感知与控制这类交互是必要的**。\n\n只预测视频的世界模型**无法表示决定操作结果的接触动力学**。已有的视觉—触觉世界模型虽然联合预测视觉与触觉观测，但数据获取是主要障碍：**绝大多数通过机器人遥操作采集触觉轨迹，把每个数据集绑定到特定本体与传感器配置**。\n\n问题的结构性约束在于：**每一条训练样本都需要在接触界面上部署物理传感器**——人类的手是廉价的、可规模化的，机器人的手不是。"},{"h":"方法详解","body":"### 问题形式化\n给定初始 RGB 观测 $\\mathbf{v}_0$、双侧触觉图 $\\mathbf{x}_0$、语言指令 $\\ell$ 与未来位姿序列 $\\mathbf{a}_{1:T}$，学习：\n\n$$p_\\theta(\\mathbf{v}_{1:T}, \\mathbf{x}_{1:T} \\mid \\mathbf{v}_0, \\mathbf{x}_0, \\mathbf{a}_{1:T}, \\ell)$$\n\n### 跨本体兼容的三个关键设计\n1. **共享传感布局**：在人手与灵巧机器手上部署**柔性压阻阵列**，采用相同的传感布局；\n2. **动作空间重定向**：把人手运动重定向到机器人本体，**两个域使用相同的 67 维位姿表示**（双侧腕部运动 + 双侧 20-DoF 手部构型 + 头部相机运动）；\n3. **解剖感知触觉 token（anatomy-aware tactile tokens）** + 对齐的动作条件。\n\n### 架构\n视觉专家由 **Wan2.2-TI2V-5B** 及其 video VAE 初始化，配一个轻量触觉专家。遵循 Mixture-of-Transformers：两个流在**每一层 Transformer** 通过带掩码的联合 self-attention 交换上下文，同时**保留各自模态专属的前馈通路**。初始 RGB 帧由冻结的 video VAE 编码。\n\n### 三种下游用法\n1. 视觉 + 触觉联合预测；\n2. 作为**策略评估的替代环境**（surrogate environment）；\n3. 作为**合成轨迹生成器**，产出数据用于真机策略学习。"},{"h":"实验与结果","body":"**核心实验设计（本文最值得学的地方）**：真机监督量**固定 5 小时**，把人类交互数据从 0 增到 100 小时，观察留出机器人域的性能变化。人类与机器人任务集**完全不相交**——因此任何改善都不能归因于任务重叠。\n\n结果：在留出的机器人域上，**视觉、几何与接触预测均获显著改善**。\n\n**与 Astronex-World 的关系**：两者都以 Wan2.2-TI2V-5B 为视觉先验起点，DexTouch-WM 在其上追加触觉专家——说明该基座正在成为触觉/视觉世界模型的事实起点。"},{"h":"创新点与贡献","body":"1. 把\"人类触觉\"确立为一条**可规模化的互补数据轴**，而非机器人数据的廉价替代品——论文强调的是 complementary data axis，不是 replacement。\n2. 给出了跨本体触觉迁移的**可操作配方**：共享传感布局 + 动作空间重定向 + 统一 67 维表示。\n3. 实验设计（真机监督固定、人机任务集不相交）**排除了任务泄漏**，使结论可信。\n4. 同时验证了预测、策略评估、合成数据生成三种用途，不局限于单一指标。"},{"h":"局限与风险","body":"- 仍需在人手与机器手上**部署压阻阵列**——并未实现\"零仪器\"（对比同批 `arXiv:2609.20414` TouchSight 用纯自我中心视觉预测力，无需采集端仪器）。\n- 录用为 **IROS 2026 Workshop 的 Lightning Talk**，并非主会论文，篇幅与评审深度有限。\n- 论文给出的多为\"显著改善\"的定性表述，本轮抽取的全文段落中未见完整的分档数值表。\n- 人类与机器人动力学毕竟不同（手指尺寸、皮肤刚度、驱动方式），重定向误差未量化。\n- 未开源。"},{"h":"与文献库的关系","body":"**新增 + 取代一个数据采集范式**。\n\n- 取代证据：`arXiv:2609.20649` §I —— \"Most existing approaches collect tactile trajectories through robot teleoperation, coupling each dataset to a specific embodiment and sensor configuration.\" 本文以共享传感布局 + 动作重定向打破该耦合，并在真机监督固定的受控实验中验证收益。\n\n**互补关系**：`arXiv:2609.20414`（TouchSight）走的是**完全无仪器**路线（纯自我中心视觉 → 力），本工作走**轻量仪器 + 规模化**路线。二者是同一问题的两种解法，**不构成取代**；XR 场景若要求零佩戴，优先 TouchSight。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开 |\n| 数据 | 人类交互数据 0–100 小时 + 真机 5 小时；未公开 |\n| 硬件 | 柔性压阻阵列（人手 + 机器手，共享布局） |\n| 模型 | Wan2.2-TI2V-5B 初始化 |"},{"h":"行动建议","body":"- **灵巧操作数据稀缺的团队**：把人类触觉采集纳入数据策略，先做小规模的 0→100 小时对照实验验证迁移收益。\n- **XR 触觉/遥操作**：若目标是无佩戴方案，转向 TouchSight（`arXiv:2609.20414`）；若允许轻量手套且追求力预测精度，本路线更合适。\n- **等待完整版**：Workshop Lightning Talk 篇幅有限，建议跟踪后续主会版本获取完整消融。"}]},{"file":"../papers/notes/2609.20818__SplashSplat飞溅液体重建.md","id":"2609.20818","title":"SplashSplat: Reconstructing Splashing Liquids from Real-World Multi-View Videos","title_zh":"SplashSplat：从真实多视角视频重建飞溅液体","track":"内容生成","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"S","value":4.22,"evidence":"FULL","tags":["动态重建","3D高斯泼溅","液体","多视角数据集","level-set","拉格朗日载体"],"flags":[],"sections":[{"h":"一句话结论","body":"同时给出**首个真实飞溅液体同步多视角基准**（20 场景 / 7 台同步标定 4K 相机 @ 60fps）与**SplashSplat 方法**：核心原则是\"**只在观测能约束的地方施加物理结构**\"——用 level-set 输运得到粗速度场、以拉格朗日载体沿流场输运并解码局部高斯，从而在真实拍摄上超过 SOTA 动态高斯泼溅方法。"},{"h":"要解决的问题","body":"飞溅液体是动态重建的\"极端工况\"：\n- 液体外观**随视角变化且几乎无纹理**，对应关系难以建立；\n- 薄片、韧带、液滴在几帧内生灭，**没有任何几何能持续存在**供跟踪；\n- 模拟器所需的边界条件（入流速率、总体积）**无法从图像观测**。\n\n结果是：已有工作只能处理烟、合成液体或轻微形变表面。**此前不存在同步多视角的真实飞溅液体数据集**。"},{"h":"方法详解","body":"### 设计原则：只在观测能约束之处施加物理结构\n作者明确否定了基于动量的求解器——它需要压力与边界条件，而这些**在真实拍摄中不可观测**；一旦设定错误，会产出\"自洽但与观测液体不符\"的运动（论文 §5.2 有对照）。\n\n因此只保留**流体运动学**：可观测几何 + 近似不可压下的界面输运 + 连续介质形变。\n\n### 1. 从多视角 mask 得到观测场（§4.1）\n- **观测几何**：每帧把标定训练视角的 mask 用 visual-hull carving 在体素网格上融合，计算 SDF $\\phi_t$（$\\phi_t<0$ 为液体内部）。\n- **关键认识**：visual hull 是**非对称证据**——在其外部的点至少被一个视角否定；而内部仍不确定（没有视角能雕刻出的凹面会被保留）。这决定了运动模型在何处可以被观测推翻。\n- **观测运动**：运动受观测约束远弱于几何。但演化界面提供运动学约束——在近似不可压（$\\nabla\\cdot u \\approx 0$）下近似满足 level-set 方程 $\\partial_t\\phi + u\\cdot\\nabla\\phi = 0$，由此在相邻观测间拟合粗速度场。\n\n### 2. 预报—校正—重播种的拉格朗日载体（§4.2）\n载体沿流场输运，每遇新观测校正一次，覆盖丢失处重新播种。\n\n### 3. 解码为局部高斯（§4.3–4.4）\n每个载体持有 32 维特征，由三个线性头（偏移、尺度、不透明度）与一个 64 宽两层颜色 MLP（以视角方向为条件）解码，产生 $K=2$ 个高斯子代。\n\n渲染：$\\hat{I}_{t,v} = \\mathcal{R}(\\mathcal{G}^{\\text{bg}} \\cup \\mathcal{G}^{\\text{fg}}_t; \\Pi_v)$\n\n### 训练细节\n液体仅占原始图像 5–8%，因此按多视角前景 mask 并集的包围盒裁剪，平均输入分辨率 1200×1800。静态背景先优化 20k 迭代后固定。"},{"h":"实验与结果","body":"**基准**：20 个真实场景（从连贯水流到剧烈飞溅），7 台同步标定 4K 相机 @ 60 fps，人工精修的逐视角液体/容器 mask，固定评测划分。\n\n**合成验证**：NeuroFluid 数据集（DFSPH 生成，Blender 渲染，5 个正面相机）。\n\n**基线**：Deformable-3DGS（D3G）、SpacetimeGaussians（STG）、4D-Scaffold-GS（4DSG）。\n\n**指标**：新视角合成用 PSNR / SSIM / LPIPS；**物理保真度**沿用 GaussFluids——SPH 密度估计的每帧标准差 $\\sigma_D$（不可压性）与机械能相对单调耗散的偏差 $\\Delta E$（耗散合理性）。\n\n- 在真实拍摄与合成基准上**均超过 SOTA 动态高斯泼溅方法**，运动物理上更合理，**训练成本更低**。\n- **时间插值**：把方法与最强基线 4DSG 只拟合偶数帧、在**扣留的奇数帧**上比较——4DSG 把下落水流衰减成一条淡带，而本文保持其颜色、粗细，并落在扣留真值所在位置。原因是载体由**观测几何**定位，形变场只能插值外观，而输运载体是真正**搬运物质**。\n- **风格迁移**：SDF 与载体位置固定、材质替换后，只需重解光传输即可（光线沿射线的光程 + 界面朝向），**无需提取网格或重新优化**。染料去除后变为清水、容器依然可见；吸收性介质随累积体积颜色加深。"},{"h":"创新点与贡献","body":"1. **首个真实飞溅液体的同步多视角基准**（含扫描的容器网格与精修 mask），填补了数据空白。\n2. 明确提出并贯彻\"只在观测可约束处施加物理结构\"的原则，给出可操作的判定（visual hull 的非对称性）。\n3. 证明了**拉格朗日输运 vs 形变场插值**在时间泛化上的本质差异。\n4. 表示解耦了光学属性与几何，换来零成本风格迁移。"},{"h":"局限与风险","body":"- 依赖**同步标定的多视角相机阵列 + 人工精修 mask**，采集门槛极高，方法难以迁移到单目/ casual 拍摄。\n- 仅保留运动学、不含压力/边界条件推断，因此**无法外推**到未观测的动力学（如改变入流速率）。\n- 液体占比小，需裁剪后处理，实际有效分辨率受限。\n- 未开源（仅项目页）。\n- 论文 §5.2 自述：基于动量的求解器若参数设定不当会产出\"自洽但与观测不符\"的运动——这既是其设计论证，也提示本方法对 mask 质量高度敏感。"},{"h":"与文献库的关系","body":"**新增 + 取代一条具体路线**。\n\n- 取代证据：`arXiv:2609.20818` §5 —— 在真实飞溅拍摄上，Deformable-3DGS / SpacetimeGaussians / 4D-Scaffold-GS 均被超过；时间插值实验中 4DSG 把下落水流退化为淡带。这些方法的共同前提是**几何持久性**，而飞溅场景中该前提不成立。\n\n**注意**：这是**场景特定的取代**（飞溅液体），不代表上述方法在一般动态场景上失效，不应扩大解读。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开 |\n| 数据 | 20 场景基准，论文描述完整；是否公开未明确 |\n| 硬件 | 未明确给出 |"},{"h":"行动建议","body":"- **VFX / 数字资产团队**：这是目前唯一能在真实飞溅上给出物理合理运动的路线，值得作为技术预研。\n- **具身 AI 仿真**：其动态资产输出可直接用于训练数据增广。\n- **想做单目版本**：先解决 mask 质量与视角覆盖问题，否则核心的 visual-hull 几何不可用。"}]},{"file":"../papers/notes/2609.21176.md","id":"2609.21176","title":"4DGS-Fixer: Generative Sparse-View 4D Gaussian Splatting with Iterative Refinement Guided by Video Diffusion Priors","title_zh":"4DGS-Fixer：视频扩散先验引导的稀疏视图 4DGS 迭代精修","track":"神经渲染","date":"2026-09-18","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.85,"evidence":"FULL","tags":["4DGS","稀疏视图","视频扩散","迭代精修"],"flags":[],"sections":[{"h":"一句话结论","body":"针对稀疏视图动态场景合成这一病态问题，先用稠密几何初始化，再以视频扩散先验做参考引导的视频修复与新视图轨迹采样，配合缓存伪监督迭代精修动态高斯。"},{"h":"要解决的问题","body":"从稀疏视图视频做动态场景合成是病态问题：现有几何先验/自适应优化/密度控制仍无法根本解决观测不足导致的不稳定与错误几何；动态 4DGS 在少视图下尤为脆弱。"},{"h":"方法详解","body":"**4DGS-Fixer**：\n- **稠密几何初始化**：提供稳定起点。\n- **视频扩散引导迭代精修**：① 参考引导的视频修复（reference-guided video restoration）用扩散先验补全缺失/模糊区域；② 新视图轨迹采样（novel-view trajectory sampling）生成多样新视点监督；③ 缓存伪监督（cached pseudo-supervision）复用已生成帧，降低反复推理成本。\n- 以伪监督迭代优化动态 3D 高斯。"},{"h":"实验与结果","body":"数据集 Neural3DV（6 个动态场景，18–21 相机，2704×2028@30fps），采用 4C4D 协议：取空间最分离的 4 相机（1/10/13/20）训练，其余测试。对比 STGS、4DGS、4DGaussians、4C4D（同协议报告结果）。"},{"h":"创新点与贡献","body":"① 把视频扩散先验系统性引入 4DGS 稀疏视图精修；② 缓存伪监督降低扩散推理成本，是工程亮点；③ 新视图轨迹采样增强几何一致性。"},{"h":"局限与风险","body":"依赖扩散先验质量，可能引入幻觉几何；稀疏到极端的边界情况仍可能失败；计算成本（多轮扩散）未给明确预算。"},{"h":"与文献库的关系","body":"库内 4DGS/动态 GS 方法有 GARO（动态 GS 冗余优化）、GrapeSplat；4DGS-Fixer 在\"稀疏视图 + 扩散先验\"上形成互补，属动态重建的质量增强路线。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；依赖视频扩散模型，复现门槛中等。"},{"h":"行动建议","body":"做动态场景稀疏视图重建时，参考其\"扩散伪监督 + 缓存\"范式；关注幻觉几何的核验。"}]},{"file":"../papers/notes/2609.21347.md","id":"2609.21347","title":"Cube-Splat: High-Fidelity 360° Gaussian Splatting SLAM via Cubemap Factorization and Adjoint-Consistent Optimization","title_zh":"Cube-Splat：基于 cubemap 分解与伴随一致优化的 360° 高斯泼溅 SLAM","track":"重建与SLAM","date":"2026-09-18","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":4.05,"evidence":"FULL","tags":["360°SLAM","高斯泼溅","cubemap","全景","伴随优化"],"flags":[],"sections":[{"h":"一句话结论","body":"首个全景（360°）高斯泼溅 SLAM：将每帧 360° 图像分解为共享单一光心的 cubemap 四固定朝向虚拟针孔视图，并用伴随一致的多面优化统一位姿，跨全景基准取得准确鲁棒跟踪与高保真重建。"},{"h":"要解决的问题","body":"现有 3DGS 稠密 SLAM 多针对针孔相机；全景/鱼眼相机因超大视场与严重深度歧义导致地图崩塌与结构伪影，且全景与针孔 GS-SLAM 的收益（更宽 FoV vs 算法贡献）难以解耦。"},{"h":"方法详解","body":"**Cubemap 相机模型 + 伴随一致优化**：\n- 将每帧 360° 图像路由为 4 个固定朝向、共享同一光心的虚拟针孔视图，保留透视渲染稳定性同时最大化覆盖。\n- 导出伴随映射（adjoint mapping）把各面梯度聚合到单一主位姿状态，得到面不变优化，在宽 FoV 下改善收敛。\n- 系统含跟踪与建图双线程，支持全景基准上的在线稠密 SLAM。"},{"h":"实验与结果","body":"数据集：PALVIO、OmniBlender、自建 SynPano（全景）。对比 Photo-SLAM、MonoGS、S3PO-GS：复杂室内基线模糊、S3PO-GS 边界云状伪影；大规模室外传统窄 FoV 方法因深度歧义地图崩塌，Cube-Splat 保持锐利几何边界与无伪影远景。消融解耦了 FoV 增益与多面位姿优化贡献。"},{"h":"创新点与贡献","body":"① 首个全景 GS-SLAM 框架；② cubemap 分解 + 伴随一致多面优化，工程上解决了全景几何一致性；③ 给出 FoV 与算法的受控消融。"},{"h":"局限与风险","body":"依赖全景图像输入（需全景/鱼眼传感器）；四固定面分解在极端遮挡下的面间一致性仍有上限；实时性未给出明确帧率结论（仅运行时间分析）。"},{"h":"与文献库的关系","body":"与库内 MonoGS/Photo-SLA M/S3PO-GS 路线同源，但把战场从针孔扩展到全景——是对\"GS-SLAM\"赛道的必要补齐（库内此前无全景 GS-SLAM）。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；依赖 cubemap 渲染实现，复现需自行搭建全景光栅化。"},{"h":"行动建议","body":"若做全景/宽视场 SLAM 或机器人环视感知，优先作为基线；关注其是否开源 cubemap 高斯光栅化算子。"}]},{"file":"../papers/notes/2609.21498.md","id":"2609.21498","title":"VoxelTTO: Voxel-Aligned Feed-Forward 3D Gaussian Splatting with Test-Time Optimization","title_zh":"VoxelTTO：体素对齐的前馈 3DGS + 测试时优化","track":"神经渲染","date":"2026-09-18","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.85,"evidence":"FULL","tags":["前馈3DGS","体素对齐","测试时优化","无姿态"],"flags":[],"sections":[{"h":"一句话结论","body":"把前馈 3DGS 从逐像素基元改为体素对齐：聚合密集像素特征为全局体素特征，用稀疏 3D 体素 U-Net 与自分裂解码器回归高斯属性，并用测试时优化（TTO）修正位姿、以随机实心体渲染提升几何精度。"},{"h":"要解决的问题","body":"前馈 3DGS 通常逐像素回归高斯基元，导致过度重叠与伪影，且预测相机位姿不准时新视图合成错位；全局结构脆弱、基元数绑定图像分辨率与视图数。"},{"h":"方法详解","body":"**VoxelTTO**：\n- **体素对齐**：把密集像素特征聚合为全局体素特征，打破逐像素耦合。\n- **稀疏 3D 体素 U-Net + 自分裂解码器**：回归高斯属性，解耦基元数与图像分辨率。\n- **随机实心体渲染（stochastic solid volume rendering）**：训练与推理取代 3DGS 光栅化，提升几何精度。\n- **测试时优化（TTO）**：用位姿监督的轻量 LoRA 模块对齐预测相机参数与给定先验，降低位姿估计误差并显著改善测试视图 NVS。"},{"h":"实验与结果","body":"数据集：Replica、Tanks and Temples、DTU（室内/室外、合成/真实、场景级/物体级）。对比 AnySplat、YoNoSplat、DepthAnything3、MapAnything 等 VFM 基线与 VolSplat、MVSplat 等像素对齐基线；TTO 降低 VFM 主干的位姿误差并大幅提升 NVS。"},{"h":"创新点与贡献","body":"① 体素对齐缓解逐像素高斯重叠/伪影；② TTO 把位姿修正做成测试时轻量适配，泛化好；③ 随机实心体渲染替代光栅化，几何更准。"},{"h":"局限与风险","body":"体素分辨率带来内存/精度权衡；TTO 依赖位姿先验质量；与最新端到端前馈方法的极限指标尚需横向对比。"},{"h":"与文献库的关系","body":"库内 GrapeSplat（无姿态前馈 3DGS）、D3GS（深度-DINO-扩散引导）等同属\"前馈/无姿态 3DGS\"赛道；VoxelTTO 在\"几何精度 + 位姿鲁棒性\"上形成差异化。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；方法依赖 VFM 主干（如 VGGT 类），复现需对应权重。"},{"h":"行动建议","body":"做无姿态/前馈 3DGS 时优先对比 VoxelTTO 与 GrapeSplat；关注其 TTO 是否可迁移到自身管线。"}]},{"file":"../papers/notes/2609.21502.md","id":"2609.21502","title":"Adaptive World Memory 3D Foundation Model for Scalable 3D Mapping, Localization, and Rendering","title_zh":"Adaptive World Memory：可扩展 3D 建图/定位/渲染的记忆型 3D 基础模型","track":"世界模型与仿真","date":"2026-09-18","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":4.12,"evidence":"FULL","tags":["3D基础模型","世界记忆","高斯泼溅","可扩展建图"],"flags":[],"sections":[{"h":"一句话结论","body":"提出记忆中心（adaptive world memory）的 3D 基础模型，用门控循环空间状态 + 测试时时空记忆调节统一可扩展建图、定位与高斯渲染，在视频深度/相机位姿/稠密重建/渲染四项上取得一致领先。"},{"h":"要解决的问题","body":"现有 3D 基础模型（VFM）具备泛化几何推理，但缺乏持久记忆、可扩展性与可渲染场景建模；大场景与多平台数据下难以兼顾定位精度、重建质量与实时渲染。"},{"h":"方法详解","body":"整体为\"双阶段自适应世界记忆 + 前馈高斯世界表示\"：\n- **双阶段自适应世界记忆**：① 门控循环空间状态（Gated Recurrent Spatial State）压缩历史观测；② 测试时时空记忆调节（Test-Time Temporal–Spatial Memory Regulation）依据新观测动态门控记忆读写；③ 双阶段记忆更新（局部子图 + 全局）。\n- **前馈高斯世界表示（Feed-forward Gaussian World Representation）**：直接从 RGB 回归可渲染高斯，兼顾几何与外观。\n- **渐进式建图与跟踪**：子图感知局部建图/跟踪 + 基于 SL(4) 流形的回环检测与全局优化（Relative Submap Alignment / Loop Closure / Global Optimization on SL(4) Manifold）。\n- **训练目标**：pointmap 回归损失 + 位姿损失 + 高斯渲染损失 + 高斯正则 + 课程学习。"},{"h":"实验与结果","body":"在视频深度估计、相机位姿估计、稠密重建、高斯渲染四项评测上对比 SoTA；另有真实多平台数据评估与运行时间/显存分析、消融实验。论文给出子图/回环/SL(4) 全局优化的完整链路，工程完整度高。"},{"h":"创新点与贡献","body":"① 将\"世界记忆\"概念落地到可渲染 3D 高斯表示，统一建图-定位-渲染；② SL(4) 流形上的全局优化区别于常见 SE(3)/Sim(3) 范式；③ 测试时记忆调节提升多平台扩展性。"},{"h":"局限与风险","body":"仍依赖前馈高斯表示的容量上限；真实机器人闭环的长期记忆一致性、跨场景遗忘问题未充分讨论；基准以已有数据集为主，缺统一的大规模机器人基准。"},{"h":"与文献库的关系","body":"库内已有大量 3DGS/SLAM 单点方法（MonoGS、Photo-SLAM、S3PO-GS 等，见 Cube-Splat/Elevator-VIGS 笔记）；本篇是\"基础模型 + 记忆\"层面的整合者，属上层范式而非单点算法。"},{"h":"可复现性","body":"论文声明代码/数据，属 arXiv preprint；未提供确认的开源链接（需待作者释放）。建议跟踪 GitHub。"},{"h":"行动建议","body":"作为\"3D 基础模型/世界模型\"赛道的标杆候选持续跟踪；若开源，优先在自身机器人栈做建图-渲染统一基线替换。"}]},{"file":"../papers/notes/2610.00195__GS-PQM面向压缩高斯泼溅的参数域质量度量.md","id":"2610.00195","title":"GS-PQM: A Parameter-Domain Quality Metric for Compressed Gaussian Splatting","title_zh":"GS-PQM：面向压缩高斯泼溅的参数域质量度量","track":"神经渲染","date":"2026-09-18","batch":"2026-10-03","batchLabel":"2026-10-03","grade":"A","value":3.85,"evidence":"FULL","tags":["3D Gaussian Splatting","压缩","质量度量","率失真"],"flags":[],"sections":[{"h":"一句话结论","body":"提出 GS-PQM，首个在 3D 高斯泼溅参数域直接运算的全参考质量度量：用支持向量回归（SVR）从一组参数域失真误差估计感知质量，免去渲染预设视角，且比 25 个图像/视频/点云度量更准确高效。"},{"h":"要解决的问题","body":"GS 压缩后需要客观质量评估来比较压缩方法、指导编解码器开发；现有评估依赖图像/视频质量度量，需渲染预设视角，质量估计随视角选择而变，且不反映'参数域'失真。"},{"h":"方法详解","body":"在 GS 参数域计算失真误差集合（位置/尺度/旋转/不透明度/球谐系数等逐参数比对），用 SVR 将该组误差映射为单一质量分数（全参考，需原始与失真后 GS）。"},{"h":"实验与结果","body":"与 25 个图像、视频、点云质量度量比较，在人类主观评分相关性上更优；计算高效（无需渲染），且质量估计与所选渲染视角无关。"},{"h":"创新点与贡献","body":"首次把 GS 质量评估从'渲染后图像域'移到'参数域'；视角无关；为 GS 编解码器的率失真（rate-distortion）优化提供可直接优化的目标。"},{"h":"局限与风险","body":"全参考（需原始 GS）；SVR 训练数据的分布外泛化待验证；未覆盖动态/4DGS 与无参考场景。"},{"h":"与文献库的关系","body":"新增——库内 GS 压缩论文众多，但缺统一、视角无关的质量度量。"},{"h":"可复现性（代码/数据/硬件）","body":"度量方法描述清晰，预期释出代码/模型。"},{"h":"行动建议","body":"作为 GS 压缩方向的评估标准候选，跟进其是否被社区采纳为基准度量。"}]},{"file":"../papers/notes/2609.22913.md","id":"2609.22913","title":"AVTR-1: Open Stack for Real-Time Interactive Avatars","title_zh":"AVTR-1：实时交互式虚拟化身的开源全栈系统","track":"化身与人体","date":"2026-09-19","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":4.0,"evidence":"FULL","tags":["实时化身","对话式avatar","流音频","开源栈"],"flags":[],"sections":[{"h":"一句话结论","body":"开源的实时交互式虚拟化身全栈：153M 参数自回归流匹配动作生成器，以双通道音频为条件，并用自蒸馏把音频编码器改造成流式，把分块生成变成用户与化身的实时对话。"},{"h":"要解决的问题","body":"说话头/双人模型已能实时推理，但\"快\"不等于\"可交互\"：实时系统需把模型输出与外部语音代理的语音同步、调度视频帧播放并处理打断，现有方案缺乏完整可部署栈。"},{"h":"方法详解","body":"**AVTR-1 全栈**：\n- **紧凑动作模型**：153M 参数自回归 flow-matching 运动生成器，条件为对话双方音频。\n- **流式音频编码器**：通过自蒸馏把音频编码器改造为流式，支持分块流式推理。\n- **推理系统**：把分块生成编排成用户与化身之间的实时对话，处理中断与帧调度。\n- 评估引入 Reference-Based Directed Granger Gain (R-DGG) 度量\"说话人语音对听话人运动的额外预测贡献\"。"},{"h":"实验与结果","body":"在 SI-184（Seamless Interaction 即兴对话测试集，184 个说话人-听话人对，11.90 小时 @30fps）上沿视觉质量、说话质量、反应式倾听三轴评估；R-DGG 使用 1457 个倾听段（3.46h @25fps）。提供区域输出头与完整推理系统描述。"},{"h":"创新点与贡献","body":"① 首个面向\"实时双向对话\"的开源化身全栈（含推理系统而非仅模型）；② R-DGG 度量填补了\"倾听反应性\"的评估空白；③ 流式自蒸馏实践对部署有意义。"},{"h":"局限与风险","body":"核心创新偏系统集成与评估，方法新颖度中等；依赖外部语音代理；真实端到端延迟/并发数据有限。"},{"h":"与文献库的关系","body":"库内已有 VibeAvatar（语音运动学+美学解耦说话人化身）等单点方法；AVTR-1 补齐\"交互式对话系统\"这一更高层形态，并开源，属工程与生态贡献。"},{"h":"可复现性","body":"明确开源（open stack，CC BY 4.0），含推理系统与模型，可复现性强——这是其关键加分项。"},{"h":"行动建议","body":"若做实时对话式 avatar，直接以其为基线 fork；重点学习其流式自蒸馏与中断处理实现。"}]},{"file":"../papers/notes/2609.23005.md","id":"2609.23005","title":"Compressing 3D Gaussian Splatting via Cross-Representation Priors","title_zh":"CRP-GS：跨表示先验的 3DGS 压缩","track":"系统与平台","date":"2026-09-19","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.93,"evidence":"FULL","tags":["3DGS压缩","跨表示先验","COHS","熵编码"],"flags":[],"sections":[{"h":"一句话结论","body":"CRP-GS：用\"对应导向的分层结构（COHS）+ 共享特征聚合 + 熵编码\"挖掘锚点之间的跨表示冗余，在 3DGS 压缩上以更低比特取得更优率失真，补齐了现有锚点压缩只压\"基元内\"冗余的短板。"},{"h":"要解决的问题","body":"3DGS 因密集高斯基元带来高昂存储/传输成本；现有锚点式压缩（anchor-based）降低了\"基元内\"冗余，但锚点之间的跨表示冗余基本未被利用，压缩率仍有空间。"},{"h":"方法详解","body":"**CRP-GS（Cross-Representation Priors for Gaussian Splatting）**：\n- **对应导向的分层结构（COHS）**：先构建 Correspondence-Oriented Hierarchical Structure，再对 COHS 做熵编码（COHS Entropy Coding），把跨锚点的结构性冗余显式建模进码流。\n- **共享特征聚合（Shared Feature Aggregation）**：聚合跨基元/锚点的共享特征，减少重复表达。\n- **损失设置与训练进度**：联合几何/外观与码率约束优化。\n- 整体在\"表示层\"而非\"基元层\"做压缩。"},{"h":"实验与结果","body":"实验：Setup、Baselines（对比现有 3DGS 压缩方法）、Performance Evaluation（率失真/质量）、Ablation（各组件贡献）。论文给出在压缩比特率与渲染质量上的领先与消融证据。"},{"h":"创新点与贡献","body":"① 首次系统利用 3DGS 的\"跨锚点跨表示\"冗余，区别于仅压基元内冗余的锚点压缩；② COHS + 熵编码把结构冗余变成可编码项；③ 共享特征聚合进一步降冗余。"},{"h":"局限与风险","body":"压缩率依赖场景冗余度，极简/稀疏场景收益有限；熵编码与训练耦合，部署需配套编解码；与最新隐式/量化压缩的横向极限对比需补充。"},{"h":"与文献库的关系","body":"库内已有 LiteTex-GS（轻量纹理化）等同属\"3DGS 表示效率\"赛道；CRP-GS 在\"压缩\"维度形成直接进阶，是沉浸式内容分发（传输成本）的关键支撑。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；方法依赖锚点式 3DGS 主干（如 Scaffold 类），复现需对应实现。"},{"h":"行动建议","body":"做 3DGS 压缩/传输时优先作为基线；关注其 COHS 熵编码是否可迁移到自身表示。"}]},{"file":"../papers/notes/2609.24140.md","id":"2609.24140","title":"BayesianGS-SLAM: Uncertainty-Aware Neural Rendering SLAM via Probabilistic Formulation","title_zh":"BayesianGS-SLAM：概率化不确定度感知的神经渲染 SLAM","track":"重建与SLAM","date":"2026-09-21","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":4.05,"evidence":"FULL","tags":["神经渲染SLAM","不确定性","贝叶斯","关键帧"],"flags":[],"sections":[{"h":"一句话结论","body":"用概率化框架为神经渲染 SLAM 引入显式可靠度：以预测不确定性归一化跟踪残差、以预测惊奇驱动关键帧选择，在跟踪/渲染/不确定度/真实机器人数据上验证有效。"},{"h":"要解决的问题","body":"神经渲染 SLAM 依赖渲染 RGB-D 残差做跟踪与建图，但残差可靠性因传感器噪声、观测覆盖不足与地图不完整而差异巨大；无显式可靠度估计时，不可靠残差会误导优化。"},{"h":"方法详解","body":"**贝叶斯神经渲染 SLAM**：\n- **映射的预测不确定性建模**：对渲染预测给出概率分布而非点估计。\n- **不确定性归一化跟踪**：用预测不确定度加权/归一化残差，低可靠区域降权。\n- **预测惊奇（predictive surprise）关键帧选择**：仅在高信息增益处插入关键帧，降低冗余。\n- 整体框架将概率可靠度嵌入跟踪-建图闭环。"},{"h":"实验与结果","body":"在跟踪、渲染与不确定度、关键帧选择、消融（跟踪与关键帧模块、跟踪损失）以及真实机器人数据上评估。消融验证了跟踪与关键帧选择模块、跟踪损失的各自贡献；真实机器人数据实验增强落地可信度。"},{"h":"创新点与贡献","body":"① 把\"不确定性感知\"从被动正则升级为驱动跟踪与关键帧的主动信号；② 预测惊奇作为关键帧判据是清晰的新意；③ 在真实机器人数据上验证，而非仅合成。"},{"h":"局限与风险","body":"概率建模带来额外计算；不确定性校准本身需要充分监督；与 Gaussian-SLAM 类方法的接口依赖其渲染后端。"},{"h":"与文献库的关系","body":"库内已有 MonoGS/Photo-SLAM/Cube-Splat 等确定性 GS-SLAM；本篇在\"可靠度\"维度形成互补/进阶，是同类方法的鲁棒性增强路线。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；核心是不确定性头 + 惊奇关键帧，可在现有 Gaussian-SLAM 上改造。"},{"h":"行动建议","body":"作为\"鲁棒 GS-SLAM\"的高优先级候选；若复现，可先在 MonoGS 上叠加不确定性头做对照。"}]},{"file":"../papers/notes/2609.24158.md","id":"2609.24158","title":"Relightable 3D Avatar Reconstruction with Semantic-Adaptive Motion-Illumination Responses","title_zh":"Relightable 3D Avatar：语义自适应运动-光照响应的单目可重光照化身","track":"化身与人体","date":"2026-09-21","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.85,"evidence":"FULL","tags":["可重光照","单目","3D头像","PBR","语义自适应"],"flags":[],"sections":[{"h":"一句话结论","body":"从单目视频重建可重光照的 3D 头部化身：用网格绑定高斯化身，并以语义自适应残差调制（运动响应）与语义自适应光照响应因子（光照响应）+ 延迟 PBR 着色实现解耦重光照。"},{"h":"要解决的问题","body":"从单目视频重建可表达且可重光照的 3D 头部化身需同时精确建模非刚性面部运动与光照相关外观；现有高斯化身常用全局耦合表示，高斯基元无法分离\"运动\"与\"光照\"，难以真实重光照。"},{"h":"方法详解","body":"**Mesh-Bound Gaussian Avatar + 语义自适应双响应**：\n- **网格绑定高斯化身**（Mesh-Bound Gaussian Avatar）为几何基底。\n- **语义自适应运动响应**：UV 对齐条件输入 + 语义自适应残差调制 + 残差预测，使不同面部语义（如皮肤/五官）对动作有不同响应。\n- **语义自适应光照响应**：材质与法线参数化 + 语义自适应响应因子 + 延迟 PBR（deferred PBR）着色与重光照，解耦几何与光照。\n- 训练目标含运动与重光照一致性约束。"},{"h":"实验与结果","body":"实验：自重演（self-reenactment）、交叉重演（cross-reenactment）、重光照（relighting comparisons + material decomposition）；消融验证语义自适应运动响应与光照响应各自的贡献；组件分析区分几何与外观解耦效果。"},{"h":"创新点与贡献","body":"① 把\"语义自适应\"同时用于运动与光照响应，比全局耦合更细腻；② 延迟 PBR 着色实现真实重光照而非贴图伪造；③ 单目输入即可，落地门槛低。"},{"h":"局限与风险","body":"单目重光照本质是病态逆问题，材质分解为近似；极端光照/表情外推仍可能失败；依赖网格模板质量。"},{"h":"与文献库的关系","body":"库内 VibeAvatar（说话人化身，语音-运动学解耦）与 AVTR-1（实时对话化身）属同一\"化身\"赛道；本篇在\"可重光照 + 单目\"维度补齐，是头像保真度的关键能力。"},{"h":"可复现性","body":"arXiv preprint；未确认开源；依赖 PBR 材质先验，复现需对应渲染器。"},{"h":"行动建议","body":"做高保真单目头像（含重光照）时作为优先基线；关注其材质分解的可迁移性。"}]},{"file":"../papers/notes/2609.24253.md","id":"2609.24253","title":"OpenFlyScan: A Quality-Guided Aerial Reconstruction System for Consumer Drones","title_zh":"OpenFlyScan：消费级无人机的质量引导航拍重建系统","track":"重建与SLAM","date":"2026-09-21","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.93,"evidence":"FULL","tags":["航拍重建","消费级无人机","质量引导","3DGS"],"flags":[],"sections":[{"h":"一句话结论","body":"面向消费级无人机的\"质量引导\"航拍重建系统：先预测区域重建质量，再针对性复飞补缺，把预设航线导致的复杂表面欠观测在大场景重建前就发现并补采。"},{"h":"要解决的问题","body":"3DGS 为大规模具身仿真提供高保真场景，但消费级设备建大规模城市场景受昂贵设备与\"质量反馈延迟\"制约：预设航拍在复杂表面观测不足，缺陷往往重建后才发现，返工成本高。"},{"h":"方法详解","body":"**OpenFlyScan 三段式**：\n- **自动采集与反馈**：无人机按航线下飞并实时反馈。\n- **区域重建质量预测**：预测每个区域的重建质量（哪些表面会欠观测/缺陷）。\n- **针对性复飞与联合重建**：依据质量预测自动规划复飞，补齐弱观测区域后联合重建。"},{"h":"实验与结果","body":"围绕三个问题评估：Q1 区域重建质量预测精度；Q2 支撑质量预测的信息；Q3 复飞增益及在无人机仿真中的使用。给出预测模型与复飞策略的有效性证据。"},{"h":"创新点与贡献","body":"① 把\"重建质量预测\"前置到采集阶段，闭环优化航拍路径；② 面向消费级无人机的可部署系统定位清晰；③ 质量引导范式可推广到其他主动重建。"},{"h":"局限与风险","body":"依赖质量预测模型的准确性；复飞规划的计算与飞行成本需权衡；大规模城市实测的端到端指标（如总飞行时间 vs 质量）披露有限。"},{"h":"与文献库的关系","body":"库内已有 VDGS（可见性驱动大规模航拍 3DGS）、OpenFlyScan 与之同源但强调\"质量引导复飞\"，是大规模航拍重建的采集合成闭环补全。"},{"h":"可复现性","body":"arXiv preprint；系统形态利于复现（质量预测 + 航线规划），但需自搭无人机接口；未确认开源。"},{"h":"行动建议","body":"若做无人机/大规模城市场景采集，重点参考其质量预测+复飞闭环；可与 VDGS 的可见性方法组合。"}]},{"file":"../papers/notes/2609.25002.md","id":"2609.25002","title":"Passthrough Rigidity: The Behavioral and Visuomotor Costs of Mediated Perception","title_zh":"Passthrough Rigidity：中介式感知（VR 穿透显示）的行为与视动代价","track":"空间计算与UI","date":"2026-09-21","batch":"2026-09-23","batchLabel":"2026-09-23","grade":"A","value":3.85,"evidence":"FULL","tags":["VR穿透","中介式感知","行为实验","视动代价"],"flags":[],"sections":[{"h":"一句话结论","body":"一项量化研究：当 VR 头显以\"穿透显示（passthrough）\"中介用户对真实环境的感知时，会带来可测量的行为偏差与视动（visuomotor）代价，揭示穿透式感知并非透明窗口。"},{"h":"要解决的问题","body":"VR 穿透显示让用户看到真实环境视频流而非直接光学透视；这种\"中介式感知（mediated perception）\"是否引入行为/运动代价长期缺乏严格量化，影响安全关键场景（如行走、操控）的设计。"},{"h":"方法详解","body":"**受控行为实验**：\n- 任务与实验设计（Task and Experimental Design）：对比穿透显示 vs 直接/光学透视下的感知-动作表现。\n- 被试（Participants）、流程（Procedure）、设备与材料（Apparatus）、数据收集与测量（Data Collection and Measures）、统计分析（Statistical Analysis）完整。\n- 同时考察行为表现与视动一致性（visuomotor）。"},{"h":"实验与结果","body":"采用参与者实验 + 统计推断；同时测量行为指标与视动指标，给出穿透显示相对基线的代价量化。属用户/行为实验，样本与统计方法依论文报告。"},{"h":"创新点与贡献","body":"① 首次（据其所称）系统量化穿透显示的视动代价；② 把\"中介式感知\"从概念变为可测变量；③ 为 XR 安全与显示设计提供实证依据。"},{"h":"局限与风险","body":"行为实验外推性受任务/被试群体限制；未给出可计算的显示管线改进方案（偏发现而非方法）；与具体头显硬件强相关。"},{"h":"与文献库的关系","body":"库内已有 VR 头像/交互用户研究（手部 vs 控制器化身、VR 触觉反馈）；本篇在\"感知-显示中介\"维度补齐，与 EMooly/Generative Tutorial 同属空间计算与 UI 的人因分支。"},{"h":"可复现性","body":"arXiv preprint；方法为行为实验协议，可复现性强（需伦理审批与设备）。"},{"h":"行动建议","body":"做 VR 穿透显示/安全关键交互设计时，将其代价结论纳入人因约束；可借鉴其实验范式做自身头显评估。"}]},{"file":"../papers/notes/2609.15795__SURE_Map_自校正流式几何基础模型_SLAM_替代_.md","id":"2609.15795","title":"SURE-Map: Self-Correcting Streaming Geometric Foundation Models","title_zh":"SURE-Map：自校正流式几何基础模型（SLAM 替代）","track":"重建与SLAM","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":4.05,"evidence":"FULL","tags":["\"几何基础模型\"","\"自校正\"","\"在线重建\"","\"尺度漂移\""],"flags":[],"sections":[{"h":"一句话结论","body":"流式几何基础模型的自校正框架：显式建模\"跨视角几何不确定性\" + \"多时间尺度自校正\"（快帧推断保流式效率，稀疏关键帧窗口提供长程几何证据周期重标定尺度）；KITTI ATE 24.00→17.24 m、Oxford 5.11→4.74 m、VBR 31.37→28.58 m，加回环后 15.17/4.63/22.12 m。"},{"h":"要解决的问题","body":"流式几何基础模型作为 SLAM 替代方案，每帧预测上下文有限，易受动态物体/弱纹理影响，局部误差累积成严重几何畸变与长程尺度漂移。"},{"h":"方法详解","body":"- **跨视角几何不确定性**：不只单视图深度/点置信，而是直接度量\"联合预测的位姿+深度是否诱导几何一致的跨视角像素对应\"；\n- **多时间尺度自校正**：快连续帧推断保留流式效率；稀疏关键帧窗口推断提供更长程几何证据，周期性重标定近期轨迹的尺度。"},{"h":"实验与结果","body":"- KITTI / Oxford Spires / VBR 长程基准；ATE 显著下降（见上）；\n- 加入 loop-closure 精细化进一步改善；\n- FPS 由 11.68 略降至 9.17，仍保持流式。"},{"h":"创新点与贡献","body":"把\"自校正\"思想系统引入流式重建，并提出新的不确定性定义与多时间尺度机制，是几何基础模型取代 SLAM 的关键一步。"},{"h":"局限与风险","body":"仍是 feed-forward 几何，极端稠密/动态场景待验证；FPS 略有下降；与 3DGS SLAM 的互补关系需厘清。"},{"h":"与文献库的关系","body":"库内\"SLAM 替代/几何基础模型\"方向；与 09-23 的 Adaptive World Memory（记忆型 3D 基础模型）同属\"在线建图\"但侧重\"校正 vs 记忆\"。"},{"h":"可复现性","body":"项目页公开（mingkai-liu.github.io/projects/sure-map），可复现性较好（REP=3）。"},{"h":"行动建议","body":"长程/弱纹理场景基准优先采用；关注其与 3DGS SLAM 的混合（几何基础模型做全局校正 + 3DGS 做局部高保真）。"}]},{"file":"../papers/notes/2609.24531__动态热高斯_多模态_4D_高斯泼溅_热成像动态重建_.md","id":"2609.24531","title":"Dynamic Thermal Gaussians: Multimodal 4D Gaussian Splatting","title_zh":"动态热高斯：多模态 4D 高斯泼溅（热成像动态重建）","track":"神经渲染","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"B","value":3.2,"evidence":"FULL","tags":["\"4DGS\"","\"热成像\"","\"多模态\"","\"动态重建\""],"flags":["⚠️ 应用为热成像/军事，XR 相关度偏弱但 4DGS 技术相关"],"sections":[{"h":"一句话结论","body":"Dynamic Thermal Gaussians 提出多模态 4D 高斯泼溅，对热成像场景做高保真时空重建（外观 + 温度），在热与 RGB 双模态达到 SOTA（32.24 dB PSNR / 0.947 SSIM / 0.119 LPIPS，超最强基线 +1.52 dB），但应用面向热成像/军事，XR 相关度偏弱。"},{"h":"要解决的问题","body":"热成像在军事与热分析中重要；3D 热重建已从 2D 扩展到 3D，但现有工作假设静态温度分布，忽略热量随时间演化的动态特性。"},{"h":"方法详解","body":"- 把多模态 4D Gaussian Splatting 用于热成像动态重建；\n- 联合建模外观与温度随时间的演化；\n- 分辨率一致配对处理（640×480 / 320×240）。"},{"h":"实验与结果","body":"- 热与 RGB 双模态 SOTA；\n- 32.24 dB PSNR、0.947 SSIM、0.119 LPIPS，超最强基线 +1.52 dB PSNR；\n- 在动态场景中优于静态多模态方法。"},{"h":"创新点与贡献","body":"把 4DGS 扩展到热成像多模态动态重建，是 4DGS 技术谱系的应用拓展。"},{"h":"局限与风险","body":"应用为热成像/军事，与 XR 显示/交互直接关联弱（故 XR 相关度评级偏弱，IMP=3、TRL=2）；真实散热物理建模有限。"},{"h":"与文献库的关系","body":"库内\"神经渲染/4DGS\"方向的新成员，验证了 4DGS 在异质模态的通用性。"},{"h":"可复现性","body":"论文称代码公开，但 FULL 证据中未见明确链接（REP=2 偏保守）。"},{"h":"行动建议","body":"若做\"热/多模态 XR 感知\"（如工业巡检热可视化）可借鉴；否则仅作 4DGS 技术储备。"}]},{"file":"../papers/notes/2609.25036__4DGS_JEPA_动态高斯泼溅的时间组合联合嵌入预测.md","id":"2609.25036","title":"4DGS-JEPA: Temporally Compositional Joint-Embedding Prediction for Dynamic Gaussian Splatting","title_zh":"4DGS-JEPA：动态高斯泼溅的时间组合联合嵌入预测","track":"世界模型与仿真","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.82,"evidence":"FULL","tags":["\"4DGS\"","\"世界模型\"","\"JEPA\"","\"时间组合\"","\"预测动力学\""],"flags":[],"sections":[{"h":"一句话结论","body":"高斯原生的联合嵌入预测（JEPA）架构 4DGS-JEPA，对动态高斯场景做因果多步预测；核心原则是\"时间组合\"——不同时间路径到达同一未来应产生兼容预测状态；理论刻画了零损失路径一致与有限误差 rollout 累积。"},{"h":"要解决的问题","body":"动态 Gaussian Splatting 提供显式的演化 3D 场景表示，但现有工作主要优化重建/未来生成/渲染，而非学习可复用的预测动力学。"},{"h":"方法详解","body":"- 层次化表示：场景级 / 运动组级 / Gaussian 级 + 水平条件转移算子（支持直接预测与递归 rollout）；\n- 端点与多水平路径监督锚定预测；选择性几何解码器 + 几何级组合把动力学锚定在一致组运动与 Gaussian 几何上（无需完整未来外观重建）；\n- 混合对应机制：持久规范身份 + 残差最优传输匹配（抗重排与拓扑变化）。"},{"h":"实验与结果","body":"- 3 个受控机制实验：时间组合降低潜在路径依赖且保留预测精度；几何级组合改善解码运动一致性；混合对应在对应模糊时仍鲁棒；\n- 理论：零损失路径一致的刻画 + 有限误差 rollout 累积界。"},{"h":"创新点与贡献","body":"把 JEPA 的\"预测表征\"思想引入动态高斯世界，并提出\"时间组合\"原则与理论保证，是动态场景世界模型的重要范式。"},{"h":"局限与风险","body":"多为机制级/合成验证，缺大规模真实动态场景基准；TRL 低（2）；实时性未论证。"},{"h":"与文献库的关系","body":"库内\"世界模型/动态 GS\"方向；与 09-23 的 Adaptive World Memory（记忆型建图）互补——一个学预测动力学，一个做可扩展记忆。"},{"h":"可复现性","body":"论文未提供代码（FULL 中未见链接）。"},{"h":"行动建议","body":"关注\"组合性\"对长程预测的价值；等待其在真实动态基准（如驾驶/人体）上的验证再评估。"}]},{"file":"../papers/notes/2609.25422__VR_晕动症早期眼动动态与不适进展预测.md","id":"2609.25422","title":"How Early Can You Tell? Early Eye Gaze Dynamics and Cybersickness Progression in Virtual Reality","title_zh":"VR 晕动症早期眼动动态与不适进展预测","track":"感知与认知","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.7,"evidence":"FULL","tags":["\"VR\"","\"晕动症\"","\"眼动\"","\"舒适性\"","\"用户研究\""],"flags":[],"sections":[{"h":"一句话结论","body":"用 VR 暴露前 1–5 分钟的眼动动态（注视时长/离散/扫视幅度/速度/偏心）表征后续晕动症进展——早期**注视离散度**与后续不适进展一致相关，但**不能**区分最终严重程度高低组。"},{"h":"要解决的问题","body":"晕动症（cybersickness）的 onset 与 progression 个体差异大；既往工作多聚焦聚合凝视测量或暴露后评估，早期眼动动态与不适进展的关系未被充分探索。"},{"h":"方法详解","body":"- 计算暴露前 1–5 分钟轨迹上的：注视时长、注视离散、扫视幅度、扫视速度、注视偏心；\n- 评估这些早期指标与后续不适进展的关联；\n- 比较暴露后低/高晕动严重度组的早期眼动差异。"},{"h":"实验与结果","body":"- 22 名参与者（两组：11M/11F，均值年龄 23.45；11M/8F，均值年龄 22.8）；\n- 早期**注视离散度**与后续不适进展一致相关；\n- 晕动严重度组间早期眼动**无显著差异**。"},{"h":"创新点与贡献","body":"首次指出\"早期眼动（尤其注视离散）→ 进展预测\"而非\"最终严重度\"，为晕动症的早期预警信号提供线索。"},{"h":"局限与风险","body":"样本小（22）；仅静态 VR 暴露；未给出可部署的实时预测模型；因果性未建立。"},{"h":"与文献库的关系","body":"库内\"VR 舒适性/感知认知\"方向（09-23 有 Passthrough Rigidity 穿透显示的行为与视动代价）。"},{"h":"可复现性","body":"实验论文，需眼动仪 + VR 头显；未提供代码。"},{"h":"行动建议","body":"作为\"早期晕动预警\"信号候选；应结合 VERA 远程大数据（见 2609.26203）做跨样本验证。"}]},{"file":"../papers/notes/2609.25466__基于_Transformer_的_OpenXR_实时手势识别.md","id":"2609.25466","title":"Real-Time Hand Gesture Recognition for OpenXR Using Transformer-Based Machine Learning","title_zh":"基于 Transformer 的 OpenXR 实时手势识别","track":"交互与输入","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"B","value":3.28,"evidence":"FULL","tags":["\"OpenXR\"","\"手势识别\"","\"Transformer\"","\"HCI\"","\"交互\""],"flags":[],"sections":[{"h":"一句话结论","body":"基于 Transformer 的机器学习模型，利用 OpenXR 标准在 Unity 中采集的手部关节位置与腕部旋转角数据，做实时手势识别，精度较基线显著提升，并规划了\"动作流（手势间过渡）\"检测作为未来工作。"},{"h":"要解决的问题","body":"手势识别是 HCI（尤其 VR/游戏/机器人）的关键交互组件；如何基于标准 OpenXR 手部追踪数据做鲁棒、实时的手势分类，是 XR 交互落地的工程问题。"},{"h":"方法详解","body":"- 通过 OpenXR 标准在 Unity 中捕获手部关节位置与腕旋转角；\n- 用 Transformer 建模短手势窗口内的时序依赖；\n- 跨手势朝向与尺寸鲁棒地分类。"},{"h":"实验与结果","body":"- 结果显示手势分类精度显著提升（论文未给具体数值）；\n- 提出未来扩展：检测动作流（手势间过渡）。"},{"h":"创新点与贡献","body":"把 OpenXR 标准手部数据与 Transformer 时序建模结合，方法实用、TRL 高（已落地于 Unity/OpenXR 标准），但方法本身增量有限（NOV=3）。"},{"h":"局限与风险","body":"实验细节与具体精度数字缺失（仅摘要级）；数据集规模与泛化未充分说明；TEC=3。"},{"h":"与文献库的关系","body":"库内\"交互与输入\"方向的 XR 原生（OpenXR）HCI 工作，补齐标准接口侧的交互方法。"},{"h":"可复现性","body":"基于 OpenXR/Unity 标准，工程可复现性高（TRL=4）。"},{"h":"行动建议","body":"作为 XR 手势交互的落地基线；需补充公开数据集与具体精度数字后再评估价值。"}]},{"file":"../papers/notes/2609.25527__数字孪生驱动的_VR_手术机器人遥操作_多视角空间感知_.md","id":"2609.25527","title":"Digital Twin-Driven VR Teleoperation with Multi-View Spatial Perception for Surgical Robots","title_zh":"数字孪生驱动的 VR 手术机器人遥操作（多视角空间感知）","track":"空间计算与UI","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":4.08,"evidence":"FULL","tags":["\"VR遥操作\"","\"数字孪生\"","\"手术机器人\"","\"HMD\"","\"多视角渲染\""],"flags":[],"sections":[{"h":"一句话结论","body":"用\"数字孪生 + HMD 多视角渲染\"替代固定控制台与视频透视式遥操作，手术机器人遥操作的路径长度降低 86%、jerk 降低 95%，深度感知置信达到或超过传统控制台。"},{"h":"要解决的问题","body":"现有机器人辅助微创手术（RMIS，如 da Vinci）依赖固定控制台观看立体内镜图，或研究者提议的 HMD 视频透视方案——二者都把操作者限制在单一内镜视角，并削弱深度感知。如何在不牺牲深度线索的前提下，提供多视角、可自然视差的遥操作界面，是手术 XR 化的核心瓶颈。"},{"h":"方法详解","body":"- 通过无标记（markerless）感知构建手术环境的数字孪生，流式推送到 HMD 显示；\n- 用数字孪生实现多视角渲染与自然运动视差，从而解耦\"用户手姿势\"与\"器械严格对齐\"；\n- 采用 VR 手柄扩展遥操作工作空间，并比多数 prior 采用的\"手追踪\"方案更鲁棒、更稳定；\n- 系统端到端延迟约 59.7 ms（报告值）。"},{"h":"实验与结果","body":"- 15 名参与者在 da Vinci Research Kit（dVRK）上的用户研究；\n- 对比最先进的 HoloLens 2 混合现实基线：路径长度 **-86%**、jerk **-95%**；\n- 深度感知置信在所有条件下 comparable to 或 exceeding 传统控制台；\n- 9 人有 prior dVRK 经验，11 人有 prior VR/AR 暴露。"},{"h":"创新点与贡献","body":"将\"数字孪生多视角渲染\"与\"视频透视\"明确区分，并提供手柄扩展工作空间——是 XR 手术遥操作从\"看屏\"走向\"沉浸空间\"的代表性系统工作。"},{"h":"局限与风险","body":"仅在 dVRK 单平台验证；未涉及真实软组织形变与力反馈；临床转化需监管与安全性论证；延迟 59.7ms 对精细操作仍偏紧。"},{"h":"与文献库的关系","body":"库内\"空间计算/遥操作/VR 穿透显示\"方向的新成员；与 09-23 批次的 Passthrough Rigidity（VR 穿透显示的行为与视动代价）形成\"系统实现 ↔ 认知代价\"互补。"},{"h":"可复现性","body":"系统型论文，未提供开源代码（仅方法描述）；实验依赖开源 dVRK 平台，可被复现但门槛较高。"},{"h":"行动建议","body":"关注其\"多视角渲染\"对穿透显示晕动/认知成本的影响；若做 XR 手术训练或远程操作，应将其作为基线之一，并补做真实组织与力反馈验证。"}]},{"file":"../papers/notes/2609.25604__随机高斯泼溅去噪的超快神经推理_Stochastic_2DGS_时序去噪_.md","id":"2609.25604","title":"Ultra-fast Neural Inference for Stochastic Gaussian Splatting Denoising","title_zh":"随机高斯泼溅去噪的超快神经推理（Stochastic 2DGS 时序去噪）","track":"神经渲染","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS\"","\"实时渲染\"","\"时序去噪\"","\"免排序渲染\""],"flags":[],"sections":[{"h":"一句话结论","body":"对随机（无排序/无 alpha 混合）高斯泼溅渲染做时序神经去噪，在保留\"免排序\"光栅化性能的同时输出时间稳定结果；去噪开销低于去掉排序/混合所省下的时间。"},{"h":"要解决的问题","body":"随机渲染消除了高斯泼溅中的排序与 alpha 混合过程，但代价是引入空间噪声；如何在免排序前提下获得稳定、清晰的输出，是端侧实时 3DGS 的关键。"},{"h":"方法详解","body":"- 时序神经去噪器，部署在视图一致的随机泼溅渲染共享的像素流上；\n- 组成：双路 EMA 累积 + 每像素学习信任预测（历史校验）+ 固定各向异性空间滤波 + 方差门控合成与稳定化；\n- 在自由相机导航中抑制噪声，同时保留免排序/免混合的光栅化性能。"},{"h":"实验与结果","body":"- 验证于随机 2DGS 渲染；\n- 与排序 alpha-blend 渲染保留约 1 dB 平均 PSNR 差距，但去噪开销小于省下的排序/混合时间；\n- 实现实时。"},{"h":"创新点与贡献","body":"轻量时序去噪（信任预测 + 方差门控）与\"免排序渲染\"协同，是 VR/AR 端侧实时 3DGS 的潜在加速路径。"},{"h":"局限与风险","body":"仍保留约 1 dB PSNR 差距；依赖随机渲染器的存在与质量；未与 foveated 等端侧优化结合。"},{"h":"与文献库的关系","body":"库内\"3DGS 实时渲染/渲染与显示\"方向新成员，偏管线与性能。"},{"h":"可复现性","body":"论文未提供代码（FULL 中未见链接）。"},{"h":"行动建议","body":"作为端侧实时 3DGS 的加速候选评估；关注其与注视点渲染（foveated）结合以进一步降负载。"}]},{"file":"../papers/notes/2609.25633__鲁棒_估计器无关的动态_3DGS_压缩.md","id":"2609.25633","title":"Robust, Estimator-Agnostic Dynamic 3DGS Compression","title_zh":"鲁棒、估计器无关的动态 3DGS 压缩","track":"系统与平台","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":4.07,"evidence":"FULL","tags":["\"3DGS\"","\"动态压缩\"","\"BD-rate\"","\"流式传输\""],"flags":[],"sections":[{"h":"一句话结论","body":"将动态 3DGS 的\"时序冗余\"转换为\"空间冗余\"（帧拼接 + 静态 codec），与底层估计器无关；在 6 个 N3DV 序列、6 个静态 codec 上，tracked 集 BD-rate 达 -42.0% ~ -71.8%，替换 D-FCGS 的 I 帧后整体 -46.2%。"},{"h":"要解决的问题","body":"动态 3DGS 为每帧维护一套 Gaussian，存储/传输开销巨大；现有压缩方法多依赖特定的 temporal estimator，难以通用。"},{"h":"方法详解","body":"- 将若干帧拼接为一组 Gaussian 并附加 frame index，再喂给一个**静态（非时序）** 3DGS codec，从而把时序相关性变成空间相关性；\n- 拼接后的集合做空间分块以限制显存；\n- 不需要运动模型，也不需要知道训练方法；\n- 提出用帧间相似度指标 \"trackedness\" 可视化时序跟踪质量。"},{"h":"实验与结果","body":"- 6 个 N3DV 序列 × 6 个静态 codec；\n- tracked 集：所有 codec 相对逐帧编码获得 -42.0% ~ -71.8% BD-rate 收益；\n- untracked 集：除 HGSC 外仍与逐帧编码竞争（-3.5% ~ +5.0%）；\n- 用本方法替换 D-FCGS 的 I 帧（保留其 P 帧），整体 BD-rate **-46.2%**。"},{"h":"创新点与贡献","body":"\"估计器无关\"的鲁棒压缩思路 + 时序→空间冗余转换 + trackedness 度量，是动态 3DGS 落地（流式 XR/VR 传输）的关键工程基础。"},{"h":"局限与风险","body":"untracked（无跟踪）序列收益有限；依赖底层静态 codec 的质量上限；对剧烈拓扑变化场景未充分验证。"},{"h":"与文献库的关系","body":"补齐库内 3DGS 压缩方向（此前多为静态/锚点压缩如 CRP-GS）的\"动态\"短板。"},{"h":"可复现性","body":"项目页公开（wcjj1236.github.io/d3dgs-benchmark），并提供 benchmark，可复现性高（REP=4）。"},{"h":"行动建议","body":"动态场景 XR/VR 流式传输的压缩评估应首选此方法作基线；关注其静态 codec 可替换为更优编解码器后的上限。"}]},{"file":"../papers/notes/2609.25746__双协方差高斯泼溅_SLAM_解耦渲染与配准.md","id":"2609.25746","title":"Dual Covariance Gaussian Splatting SLAM: Decoupling Rendering and Registration for Robust Real-Time Tracking","title_zh":"双协方差高斯泼溅 SLAM：解耦渲染与配准","track":"重建与SLAM","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":4.05,"evidence":"FULL","tags":["\"3DGS\"","\"SLAM\"","\"双协方差\"","\"RGB-D\"","\"实时跟踪\""],"flags":[],"sections":[{"h":"一句话结论","body":"给每个 Gaussian 拆出\"渲染协方差\"（mapper 优化）与\"跟踪协方差\"（RGB-D 噪声模型派生），解耦渲染与配准的冲突需求；在 TUM/ScanNet/Replica 及室外实测 ~60 FPS、漂移更低，TUM 上 97.5% 场景鲁棒。"},{"h":"要解决的问题","body":"基于 ICP 的 3DGS SLAM 用同一套协方差既做渲染又做配准：mapper 为最小化光度误差把协方差\"压扁\"到表面，而这恰恰损害了鲁棒配准所需的不确定性表达。"},{"h":"方法详解","body":"- **双协方差参数化**：每个 Gaussian 单一均值 + 两个协方差——渲染协方差由 mapper 优化；跟踪协方差由 RGB-D 传感器噪声模型派生；\n- 用跟踪协方差作为图像角点的 Gaussian 锚，在深度几何弱的方向提供约束；\n- 实质上把\"测量不确定性\"显式引入配准，而非让单一协方差兼顾两职。"},{"h":"实验与结果","body":"- TUM RGB-D / ScanNet / Replica / 2 个 RealSense D435i 室外（wheeled & handheld）序列；\n- 跟踪 **~60 FPS**；TUM RGB-D 上 97.5% 场景鲁棒；平均 ATE 最低，快速运动 desk 场景更优。"},{"h":"创新点与贡献","body":"核心洞见是\"渲染与配准对协方差的需求相互冲突\"，并用噪声模型派生跟踪协方差作锚——是 3DGS SLAM 鲁棒性的重要范式修正，而非新表示。"},{"h":"局限与风险","body":"依赖 RGB-D 深度输入；室外仅 2 个序列；未与最新隐式/神经 SLAM 全面对比；闭环未涉及。"},{"h":"与文献库的关系","body":"库内 3DGS SLAM 簇（Cube-Splat / BayesianGS-SLAM / ArborSplat）的新成员，侧重\"解耦\"而非\"新表示\"。"},{"h":"可复现性","body":"论文未提供代码（FULL 证据中未见链接），复现需自行实现双协方差与噪声模型。"},{"h":"行动建议","body":"作为 3DGS SLAM 鲁棒性基线重点跟踪；关注其 RGB-D 噪声模型向单目/双目设置的迁移。"}]},{"file":"../papers/notes/2609.26203__基于_VERA_平台的大规模远程_VR_晕动症研究_N_263_.md","id":"2609.26203","title":"Beyond the Lab: Large-Scale Remote Cybersickness Research in Virtual Reality Using the VERA Platform","title_zh":"基于 VERA 平台的大规模远程 VR 晕动症研究（N=263）","track":"感知与认知","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.65,"evidence":"FULL","tags":["\"VR\"","\"晕动症\"","\"远程研究\"","\"VERA\"","\"用户研究\""],"flags":[],"sections":[{"h":"一句话结论","body":"通过 VERA 平台对 N=263 名自带消费级 VR 头显的用户进行远程标准化晕动测试，结果与既往实验室数据集在方向与时间上一致，证明远程研究可产生可比较的晕动发现，且样本更大更多样。"},{"h":"要解决的问题","body":"晕动症知识大多来自小样本、同质化的实验室研究，生态效度与可推广性存疑。"},{"h":"方法详解","body":"- 在 Virtual Experience Research Accelerator（VERA）上部署标准化 Cybersicker testbed 的远程适配版；\n- 收集 N=263 名使用自有消费级 VR 头显参与者的数据；\n- 与已发表实验室数据集及人口匹配子集对比。"},{"h":"实验与结果","body":"- N=263 远程样本；\n- 跨队列晕动结果在方向与时间上一致（部分指标 28.8% / 41.8% / 75.6% 等）；\n- 表明远程研究能产出与实验室可比的发现，且提升人口多样性与生态效度。"},{"h":"创新点与贡献","body":"方法学贡献为主：用大规模远程实证验证\"远程 VR 研究\"的可行性，是晕动症（乃至 XR 用户研究）范式的重要补充。"},{"h":"局限与风险","body":"非技术突破（方法是标准 testbed 的远程化）；设备/环境异质引入噪声；需校正远程 vs 实验室偏差。"},{"h":"与文献库的关系","body":"与 2609.25422 同属 VR 舒适性，互为\"大数据实证\"与\"机制探索\"补充。"},{"h":"可复现性","body":"VERA 平台可托管后端，方法可复现（REP=3）。"},{"h":"行动建议","body":"作为晕动症生态效度基准；关注远程研究中的设备/环境偏差校正方法。"}]},{"file":"../papers/notes/2609.26315__ArborSplat_面向果园的在线语义高斯泼溅_SLAM.md","id":"2609.26315","title":"ArborSplat: Online Semantic Gaussian Splatting SLAM for Orchards","title_zh":"ArborSplat：面向果园的在线语义高斯泼溅 SLAM","track":"重建与SLAM","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS\"","\"语义SLAM\"","\"LiDAR\"","\"结构约束\""],"flags":[],"sections":[{"h":"一句话结论","body":"在线语义 3DGS SLAM：用 LiDAR 里程计跟踪、以类特定高度带约束直接在 Gaussian 地图优化语义；果园 12 趟遍历 ATE < 0.5 m，超 SGS-SLAM/GS3LAM 训练视图 0.23~0.50、held-out mIoU 0.15~0.36，速度快 1.7~7.5×，而 SemGauss-SLAM 在 6 例全部 OOM。"},{"h":"要解决的问题","body":"3DGS SLAM 优化偏外观驱动，薄结构（树干/棚架/果实）像素深度常来自背景表面，导致语义向 3D 点迁移不可靠。"},{"h":"方法详解","body":"- 在线语义 3DGS SLAM，用 LiDAR 里程计跟踪；\n- 每关键帧立体点云拟合地面平面 → 派生类特定高度带，约束 Gaussian 地图语义优化；\n- 多视角证据融合语义点云并拒斥与局部地面或单目深度不一致的标签；\n- 类约束精炼为欠代表结构保留 Gaussian 容量（预算分配）。"},{"h":"实验与结果","body":"- 苹果/梨园（休眠/开花/收获三期）；\n- 全路线 12 趟 ATE < 0.5 m；\n- 共享 301 帧段：超 SGS-SLAM/GS3LAM 训练视图 0.23~0.50、mIoU 0.15~0.36；\n- 速度 1.7~7.5×；SemGauss-SLAM 在 6 例全 OOM。"},{"h":"创新点与贡献","body":"把\"几何高度带约束 + 在线语义融合 + 容量预算\"结合，解决 3DGS SLAM 的语义稀疏/薄结构难题。"},{"h":"局限与风险","body":"领域特定（果园）；依赖 LiDAR；室外光照/季节变化鲁棒性待验；未推广到通用室内。"},{"h":"与文献库的关系","body":"库内 3DGS SLAM 簇新成员，强调\"语义 + 结构约束\"（与 Dual Covariance 的\"渲染/配准解耦\"互补）。"},{"h":"可复现性","body":"论文未提供代码（FULL 中未见链接）。"},{"h":"行动建议","body":"农业/结构化环境 XR 巡检的参考架构；关注其通用化到室内语义 SLAM 的潜力。"}]},{"file":"../papers/notes/2609.26795___RIE_从照片级重建到可交互环境_3DGS_可移动仿真资产_.md","id":"2609.26795","title":"\\phi-RIE: From Photorealistic Reconstruction to Interactive Environments","title_zh":"φ-RIE：从照片级重建到可交互环境（3DGS→可移动仿真资产）","track":"内容生成","date":"2026-09-23","batch":"2026-09-24","batchLabel":"2026-09-24","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS\"","\"可交互环境\"","\"仿真资产\"","\"场景补全\""],"flags":[],"sections":[{"h":"一句话结论","body":"高斯原生管线 φ-RIE 把选定物体转成可移动仿真资产并同时补全背景，核心是把\"资产构建\"与\"源移除\"耦合（同一物体身份同时定义可移动资产与要移除/补全的场景内容）；ScanNet++ 50 场景匹配 F1@20mm 0.336→0.383、Chamfer 距离 -25.1%。"},{"h":"要解决的问题","body":"3DGS 能照片级重建场景，但表示本身不支持物理交互；物体外观常与背景纠缠，且隐藏物体几何与被遮挡背景内容未被观测。"},{"h":"方法详解","body":"- Scene Observation 提供共享证据 → Coupled Scene Construction 生成已注册资产与补全的背景 Gaussian，用于\"可交互环境\"中的仿真驱动渲染；\n- 关键观察：一个物体身份应同时定义\"可移动资产\"和\"要移除并补全的场景内容\"，二者耦合可避免编辑冲突并保留未编辑的 Gaussian。"},{"h":"实验与结果","body":"- 50 个 ScanNet++ 场景；\n- 证据选择 + 注册重试：匹配 F1@20mm 0.336→0.383（固定保留率下）；\n- Chamfer 距离降低 25.1%（重试增加构建时间）；\n- 每场景约 70.82 分钟；转换的视觉代价为 1.144 dB PSNR 损失。"},{"h":"创新点与贡献","body":"\"资产构建 + 源移除耦合\"是关键设计，使 3DGS 重建可一键转为可交互/可仿真场景——直击 XR/数字孪生的\"静态重建→动态交互\"断裂。"},{"h":"局限与风险","body":"计算昂贵（~70 min/场景）；仅静态场景→仿真；1.14 dB PSNR 视觉代价；未涉及动态物体物理。"},{"h":"与文献库的关系","body":"库内\"重建→交互/数字孪生\"方向的新成员；与手术遥操作、世界模型形成\"场景即资产\"主题。"},{"h":"可复现性","body":"论文未提供代码（FULL 中未见链接），复现门槛高。"},{"h":"行动建议","body":"关注其对\"可交互场景生成\"的实用化；可与具身/仿真数据生成（如 PhyVisGen）结合，把真实场景转为训练资产。"}]},{"file":"../papers/notes/2609.27235__CoBranchMR：混合现实中并行设计与冲突解决的支撑系统.md","id":"2609.27235","title":"CoBranchMR: Supporting Parallel Design and Conflict Resolution in Mixed Reality","title_zh":"CoBranchMR：混合现实中并行设计与冲突解决的支撑系统","track":"空间计算与UI","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"B","value":3.05,"evidence":"FULL","tags":["\"MR\"","\"协同设计\"","\"分支合并\"","\"空间计算\""],"flags":[],"sections":[{"h":"一句话结论","body":"CoBranchMR 是一个让分布式协作者在不同地点并行编辑\"同一物理对象的数字表示\"的混合现实系统：用户把对象分支为可编辑虚拟副本、独立定制后合并回共享对象，合并时在表面显示潜在冲突并提供多种解决选项（选其一 / 混合两者 / 撤销合并），把分支-合并工作流与冲突协商引入具身 MR 协同。"},{"h":"要解决的问题","body":"远程创意协作中，多人需对同一数字-物理对象做并行修改并解决冲突，但现有 MR 协同缺乏\"并行分支 + 冲突可视化解决\"的机制。"},{"h":"要解决的问题（细化）","body":"如何在不覆盖他人工作的前提下支持并行设计，并让表面级冲突可见、可协商。"},{"h":"方法详解","body":"- **分支-合并**：对象可拆分为可编辑虚拟副本，各自独立定制后合并；\n- **冲突解决**：合并时在对象表面高亮潜在冲突，提供\"选一/混合/撤销\"三类解决选项；\n- **具身协同**：把 CSCW 的协调/觉察/共享工件/冲突协商延伸到 MR 场景。"},{"h":"实验与结果","body":"论文以原型（prototype）形式呈现，侧重交互模型与系统构建；未给出大规模量化用户研究或基线对比（实验强度偏弱）。"},{"h":"创新点与贡献","body":"把成熟的\"分支-合并\"软件工程工作流映射到具身 MR 远程创意协作，是一个清晰的系统/交互贡献，填补了 MR 并行设计空白。"},{"h":"局限与风险","body":"仍属早期原型：无严格用户研究、无量化性能/可用性对比；冲突解决仅表面级（几何/语义深层冲突未涉及）；实际工程化与多用户规模化未验证。"},{"h":"与文献库的关系","body":"库内\"空间计算与UI\"方向新增\"MR 协同设计\"系统工作；与 09-24 批次的 CoBranchMR 无（同日新）；与 VR 手术遥操作（空间计算）主题邻近。"},{"h":"可复现性","body":"系统型原型，未提供开源；复现需重建 MR 应用与分支-合并引擎，门槛中等。"},{"h":"行动建议","body":"做 MR 远程协作/协同设计产品时，CoBranchMR 的\"分支-合并 + 表面冲突解决\"可作交互范式参考；需补做用户研究验证可用性增益。"}]},{"file":"../papers/notes/2609.27264__GaussPDE：基于图的偏微分方程驱动的 3D 高斯泼溅渲染.md","id":"2609.27264","title":"GaussPDE: Graph-Based Partial Differential Equation-Driven Rendering for 3D Gaussian Splatting","title_zh":"GaussPDE：基于图的偏微分方程驱动的 3D 高斯泼溅渲染","track":"神经渲染","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.62,"evidence":"FULL","tags":["\"3DGS\"","\"PDE\"","\"图拉普拉斯\"","\"动态可视化\"","\"相机感知正则\""],"flags":[],"sections":[{"h":"一句话结论","body":"GaussPDE 在不做网格化/体素化/重训练的前提下，把\"物理结构化 PDE 动力学\"注入预训练 3DGS 场景：先以相机感知正则（CamReg）抑制相机近处浮点与大基元以稳定图拓扑，再用协方差感知距离 + 不透明度/外观/边界感知电导构建\"活跃高斯图\"，在其上做质量加权图拉普拉斯 PDE 演化，并把演化标量态耦合回渲染（修改直流球谐颜色系数、保持几何/不透明度/视角相关渲染）；在真实与合成场景上产生稳定、可控、空间连贯的动态可视化，且跨边界泄漏低于基线。"},{"h":"要解决的问题","body":"如何让重建得到的静态 3DGS 场景进一步承载演化标量场（如热扩散）——要求既有准确外观，又有可靠的离散计算域。"},{"h":"方法详解","body":"- **CamReg**：重建期正则，抑制会破坏图拓扑的浮点/大基元；\n- **高斯图**：活跃节点集 𝒱={i:α_i≥τ_α}；协方差感知距离 d²_ij=(μ_i−μ_j)ᵀ(Σ_i+Σ_j+εI)⁻¹(μ_i−μ_j) 选邻居；电导 W_ij=exp(−d²_ij/2σ²_g)(α_iα_j)^γ·exp(−λ_c‖c_i−c_j‖²) 并乘边界电导（SAM 分割掩码提供边界分数 b_i 衰减入射边）；\n- **PDE 演化**：质量加权图拉普拉斯直接在基元上演化标量态，几何/图连接固定。"},{"h":"实验与结果","body":"- 实现：Nerfstudio Splatfacto、每场景 30K 迭代；DTU/LLFF/NeRF-Synthetic；8×A100 各场景一卡；\n- 受控 PDE 验证：两片各 41×31 各向异性高斯薄板，g/h∈{0.35,0.5,0.7,1.0}，与独立网格参考低跨面泄漏且吻合；\n- 场景示例展示完整管线与 CamReg 效果。"},{"h":"创新点与贡献","body":"首次把\"图拉普拉斯 PDE 直接在 3DGS 基元上演化\"并耦合回渲染，为静态 3DGS 赋予动态物理可视化能力，是一个干净的方法增量。"},{"h":"局限与风险","body":"仅验证合成热扩散类任务，对真实动态（如流体/形变）未充分覆盖；性能依赖重建几何与视觉线索质量；未给出与专门动态 3DGS 的量化对比。"},{"h":"与文献库的关系","body":"库内\"神经渲染\"方向新增\"PDE/物理驱动动态\"子方向；与 TopoGS（静态大规模）互补，与 09-21 批次 SplashSplat（液体重建）主题邻近但方法不同。"},{"h":"可复现性","body":"方法描述完整、依赖 Nerfstudio，但无公开代码链接；复现中等。"},{"h":"行动建议","body":"若需在已重建 3DGS 场景上叠加\"可控标量场/动态可视化\"，GaussPDE 是低风险尝试；优先验证其在真实动态场景的泛化。"}]},{"file":"../papers/notes/2609.27509__KYS-SLAM：层级语义-运动先验驱动的特征匹配立体视觉 SLAM.md","id":"2609.27509","title":"Know-Your-Scene (KYS)-SLAM: Hierarchical Semantic-Motion Priors for Feature Matching in Stereo Visual SLAM","title_zh":"KYS-SLAM：层级语义-运动先验驱动的特征匹配立体视觉 SLAM","track":"重建与SLAM","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":4.0,"evidence":"FULL","tags":["\"立体SLAM\"","\"语义先验\"","\"动态物体\"","\"ORB-SLAM3\"","\"特征调制\""],"flags":[],"sections":[{"h":"一句话结论","body":"把\"上下文不可信度\"表达为连续量而非二元剔除：KYS-SLAM 是 ORB-SLAM3 的模块化扩展，用层级兼容公式融合语义/全景/运动先验，对每keypoint 做连续对应度调制（而非丢弃），在 KITTI（11 序列）与 EuRoC（10 序列）上以固定参数取得相对 ORB-SLAM3 的一致 ATE RMSE 下降，且在最具独立运动的动态序列上 Dyn%↓ 更明显。"},{"h":"要解决的问题","body":"基于局部描述子的立体视觉 SLAM 受语义歧义、实例级混淆、独立运动物体三重困扰，破坏数据关联并累积为轨迹漂移。主流语义/动态 SLAM 用\"二元特征剔除\"牺牲对应密度换取离群抑制——过度且粗糙。"},{"h":"方法详解","body":"- 把上下文证据重述为\"对应代价（correspondence cost）\"：语义类别与实例身份强制结构合理性，零样本运动分数下调独立运动物体上的特征权重；\n- 运动分数来自一个免训练的模块：对背景光流拟合\"深度感知的自运动模型\"并分类；\n- 几何后端（ORB-SLAM3）完全不动，仅在特征匹配阶段调制，模块化、可插拔。"},{"h":"实验与结果","body":"- KITTI Odometry 全 11 序列 + EuRoC 全 10 序列（排除 V203），所有参数跨序列跨数据集固定一次；\n- 与 ORB-SLAM3/2、Stereo-DSO、DynaSLAM、VDO-SLAM、AirDOS、RSO-SLAM、多版 Semantic 等方法对比；\n- 平均 ATE RMSE 相对 ORB-SLAM3 下降，且在标记 ∗ 的高动态序列上 Dyn%↓ 更突出（具体数值见论文 Table 1）。"},{"h":"创新点与贡献","body":"\"连续调制 vs 二元剔除\"的范式重述，是对动态/语义 SLAM 长期做法的纠偏：在保留对应密度的同时抑制离群，几何后端零修改即可获得增益。"},{"h":"局限与风险","body":"依赖外部语义/全景分割质量；零样本运动分数在强动态但低纹理场景可能失效；仅 ORB-SLAM3 重跑于本机硬件，其余基线取已发表数字，存在复现口径差异。"},{"h":"与文献库的关系","body":"库内 SLAM 方向新增\"特征级语义-运动调制\"路线，与 RawSLAM（在线 HDR 高斯 SLAM）、AMB3R-SLAM（分层后端）、双协方差 GS-SLAM 等方法互补而非取代。"},{"h":"可复现性","body":"作为 ORB-SLAM3 模块化扩展，若开源则复现性高；论文未明示代码链接，但方法描述足够具体。"},{"h":"行动建议","body":"动态城市场景 SLAM 基线应把 KYS-SLAM 与 DynaSLAM/VDO-SLAM 同台对比；重点验证其\"运动分数免训练模块\"在你的传感器组合下的鲁棒性。"}]},{"file":"../papers/notes/2609.27560__渲染化化身畸变下的意图识别：视觉质量为何会误导.md","id":"2609.27560","title":"When Visual Quality Misleads: Intent Recognition under Rendered Avatar Distortions","title_zh":"渲染化化身畸变下的意图识别：视觉质量为何会误导","track":"化身与人体","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.85,"evidence":"FULL","tags":["\"化身\"","\"质量评估\"","\"用户研究\"","\"IQS\"","\"行为实验\""],"flags":[],"sections":[{"h":"一句话结论","body":"通过受控行为实验揭示\"质量-准确性解离\"：在 59 名参与者、2688 条判断、126 个畸变单元中，24.6%（31 个）呈现\"误导性质量\"——视觉质量高于平均却导致动作识别准确率低于平均；时间性与几何性畸变误导率最高（50.0% 与 31.1%）；并据此提出结合识别正确性与置信的\"意图质量分数（IQS）\"作为客观指标的行为目标。"},{"h":"要解决的问题","body":"Avatar 流式系统普遍用 IQA/VQA 指标评估，隐含地把\"视觉保真度\"当作\"沟通成功\"的代理。这一假设在渲染化化身畸变下是否成立，此前缺乏受控实证。"},{"h":"方法详解","body":"- **刺激**：5 个风格化化身（Ready Player Me）× 2 套骨骼动画（Adobe），得 10 个\"化身-动作\"单元；每单元在 15 种条件（14 畸变 + 1 原始）下渲染，共 150 刺激；畸变涵盖几何/光度/时间/组合四类；\n- **行为实验**：59 名参与者经 Web 端 Three.js 自由环绕观察，每刺激选感知动作（3–5 个语义相近选项）、评置信度（5 级）、评视觉质量（5 级 ACR）；\n- **指标**：IQS = a·c − λ(1−a)·c，惩罚高置信误识；在 λ∈{0,0.25,0.5,0.75,1.0} 下结论一致；\n- **客观指标评估**：24 个直接打分 IQA/VQA 指标 + 3 个有监督特征回归基线。"},{"h":"实验与结果","body":"- 59 参与者、2688 判断；纳入 9 个内容（剔除共识<0.6 的 E5）；\n- 126 畸变单元中 31 个（24.6%）为\"误导性质量\"；时间性畸变误导率 50.0%、几何性 31.1% 最高；\n- 24 个 IQA/VQA 指标与 3 个监督基线在对齐行为目标上表现有限（具体对齐度见论文）。"},{"h":"创新点与贡献","body":"首次用受控行为实验量化\"视觉质量≠沟通成功\"，并提出 IQS 作为面向化身沟通的客观评估目标——对 XR 化身压缩/传输/流式系统的质量指标选型有直接的纠偏意义。"},{"h":"局限与风险","body":"仅 5 个风格化化身、Web 端 2D 观察（非头显内 3D 沉浸）；畸变为受控近似而非真实生产编解码输出；结论对\"真实头像（photoreal）\"外推需谨慎。"},{"h":"与文献库的关系","body":"库内\"化身与人体\"方向新增\"评估/质量\"这一子方向，与 ARS-Avatar/VibeAvatar（建模）互补；也呼应 09-24 批次的 VR 晕动用户研究（同为\"感知-质量\"主题）。"},{"h":"可复现性","body":"给出刺激构造与实验协议，复现需重建 Three.js 实验与化身资源，门槛中等。"},{"h":"行动建议","body":"凡涉及化身流式/压缩的团队，应将\"动作识别准确率/IQS\"纳入评估，而非仅看 PSNR/SSIM；时间性畸变（如帧率/插值伪影）的误导风险最高，应优先治理。"}]},{"file":"../papers/notes/2609.27595__ViMoWear：视觉运动引导的 sEMG-IMU 跨被试拇指手势识别.md","id":"2609.27595","title":"ViMoWear: Visual Motion-Guided sEMG-IMU Representation Learning for Subject-Independent Thumb Gesture Recognition","title_zh":"ViMoWear：视觉运动引导的 sEMG-IMU 跨被试拇指手势识别","track":"交互与输入","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.85,"evidence":"FULL","tags":["\"手势识别\"","\"AR输入\"","\"sEMG\"","\"IMU\"","\"跨被试\""],"flags":[],"sections":[{"h":"一句话结论","body":"ViMoWear 用同步的 3D 手部运动作为\"仅训练期监督\"、推理时只用可穿戴 sEMG-IMU，通过运动引导跨被试对比学习（MGCL）与拇指感知掩码运动重建（TMMR）学到跨被试鲁棒的穿戴表征；在 31 名参与者、留一受试者（LOSO）协议下，多传感配置一致优于监督基线，并支持无分类器检索。"},{"h":"要解决的问题","body":"可穿戴传感（sEMG/IMU）对 AR/假肢控制的人机交互手势识别很直观，但跨被试识别困难——穿戴信号只是手部运动的间接且高度个体化的观测。直接要求视觉信号参与推理会增加传感复杂度、限制部署。"},{"h":"方法详解","body":"- **数据**：自采三模态同步数据集（腕戴 sEMG 4×4 阵列 + IMU + 多视角视频），33 名右撇参与者（有效 31 名）；7 类拇指手势（含自然移动轨迹）；\n- **两阶段**：先以同步可穿戴 + 3D 姿态序列做表征预训练（视觉运动作特权监督），下游冻结穿戴编码器做线性探针（LP）或无分类器检索（CFR）；\n- **MGCL**：促进跨被试鲁棒表征；**TMMR**：以掩码运动重建保留细粒度运动信息，拇指地标权重 1.0、非拇指 0.2。"},{"h":"实验与结果","body":"- 协议：LOSO，28 个被试各做一次未见测试，训练/验证/测试被试互斥，28 折平均；\n- 配置：sEMG 模型 / IMU 模型 / sEMG+IMU 融合模型；对比多种监督基线；\n- 结论：训练期视觉运动监督在不增加推理期传感负担的前提下，一致提升跨被试泛化（具体准确率见论文）。"},{"h":"创新点与贡献","body":"\"训练期特权监督、部署期轻量传感\"的范式对 AR 可穿戴交互尤其实用——用富视觉监督换得推理期极简传感，是 wearable HCI 的高性价比路线。"},{"h":"局限与风险","body":"仅 7 类拇指手势、单被试群（右撇）；实验室采集，真实 AR 场景下手腕遮挡/汗湿等未验证；视觉运动监督质量依赖姿态估计精度。"},{"h":"与文献库的关系","body":"库内\"交互与输入\"方向新增\"可穿戴手势（肌电+惯性）\"子方向；与 09-24 批次的 OpenXR 手势识别（Transformer/视觉）形成\"穿戴 vs 视觉\"互补。"},{"h":"可复现性","body":"自建数据集（31 参与者）若开源则价值高；论文未明示数据/代码链接，复现需重建采集与预训练。"},{"h":"行动建议","body":"AR 手环/指环类手势输入应把\"视觉运动特权监督\"作为跨被试泛化的首选方案；优先验证在真实头显遮挡场景下的退化。"}]},{"file":"../papers/notes/2609.27600__ARS-Avatar：可动画可重光照的 Surfel 化身.md","id":"2609.27600","title":"ARS-Avatar: Animatable and Relightable Surfel Avatars with Learnable Ambient Occlusion","title_zh":"ARS-Avatar：可动画可重光照的 Surfel 化身","track":"化身与人体","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.85,"evidence":"FULL","tags":["\"化身\"","\"重光照\"","\"Surfel\"","\"PBR\"","\"环境光遮蔽\""],"flags":[],"sections":[{"h":"一句话结论","body":"ARS-Avatar 用 Surfel 表示从多视角图像（未知光照）构建可动画、可重光照的人体化身：从模板提取形变先验增强 surfel 属性估计，延迟着色估计 BRDF 材质，并提出\"可微分屏幕空间环境光遮蔽（SSAO）\"以有限差分对遮挡半径做梯度优化，实时逼近光照可见性；在 AvatarReX 与 ActorsHQ 上相对 3DGS-Avatar/WebAvatar/MeshAvatar/Relighting4D 取得更高保真外观与物理材质估计。"},{"h":"要解决的问题","body":"从多视角图像构建可动画、可重光照化身很难：姿态相关形变、材质、光照可见性在图像中本征耦合。"},{"h":"方法详解","body":"- **Surfel 化身**：每 surfel 参数化位置/旋转/尺度/不透明度/方向色，PBR 下增定反照率与粗糙度；由 StyleUNet 从位置图估计姿态相关 surfel 属性；\n- **形变先验**：从模板提取并注入估计，聚焦手/足等大形变区；\n- **延迟着色 + BRDF**：估计可重光照材质；\n- **可微分 SSAO**：以有限差分对\"身体部位专属遮挡半径\"做梯度优化，把光照可见性纳入训练且高效（无需网格提取/额外组件）。"},{"h":"实验与结果","body":"- 数据集：AvatarReX（4 角色）+ ActorsHQ（2）；与 3DGS-Avatar、WebAvatar、MeshAvatar、Relighting4D 等对比；\n- 结果：外观重建 + 物理材质估计更优，新姿态/新光照下动画与重光照真实（定性图见论文）。"},{"h":"创新点与贡献","body":"把\"可微分 SSAO\"引入 3DGS/Surfel 管线做光照可见性优化，是重光照化身工程上的实用增量；Surfel 表示在保真度/几何一致性上优于隐式方法且渲染更快。"},{"h":"局限与风险","body":"形变先验依赖预定义先验，难以覆盖多样着装信息；半径优化理论上可并入 StyleUNet 但留作未来；未见大规模跨身份/换装验证。"},{"h":"与文献库的关系","body":"库内\"化身与人体\"方向（VibeAvatar、Zing-0.5、ARS-Avatar 同日）新增\"可重光照 + Surfel\"子方向；与 09-24 批次的 VibeAvatar（语音-运动学解耦）互补。"},{"h":"可复现性","body":"方法描述具体，但无公开代码/数据链接；依赖 AvatarReX/ActorsHQ，复现门槛中等偏高。"},{"h":"行动建议","body":"做 XR 虚拟人/数字人重光照时，ARS-Avatar 的可微分 SSAO 是值得借鉴的轻量光照可见性方案；关注其换装/跨身份泛化短板。"}]},{"file":"../papers/notes/2609.27702__DAVIO：前馈初始化 + 位姿条件映射的稠密单目-惯性 SLAM.md","id":"2609.27702","title":"DAVIO: Dense Monocular-Inertial SLAM with Feed-Forward Initialization and Pose-Conditioned Mapping","title_zh":"DAVIO：前馈初始化 + 位姿条件映射的稠密单目-惯性 SLAM","track":"重建与SLAM","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":4.05,"evidence":"FULL","tags":["\"VIO\"","\"3DGS\"","\"Depth-Anything-3\"","\"稠密重建\"","\"AR定位\""],"flags":[],"sections":[{"h":"一句话结论","body":"用单一多视角深度前馈模型 Depth Anything 3 同时驱动 VIO 的\"冷启动\"与\"建图\"：在 EuRoC 上比同等位姿下的 SOTA 前馈建图器更早启动、定位误差更低、建图更准；在楼宇级 ORI 序列上与 SOTA 建图器持平或更优，且用估计位姿替换真值时退化远更小。"},{"h":"要解决的问题","body":"相机 + IMU 是 AR 度量定位与稠密建图的最小传感器配置，但经典 VIO 滤波器必须等视差出现才能启动、且只保留稀疏路标；前馈几何模型虽能从少量图像预测稠密结构，却不提供度量尺度与重力方向。二者能力互补却长期割裂。"},{"h":"方法详解","body":"- **冷启动**：五张图像窗口 + 预积分 IMU 构成一个\"无特征\"的线性系统，其经条件数检查的解通过缓冲回放引导 VIO 滤波器启动；\n- **跟踪期建图**：滤波器给出的度量位姿\"条件化\"深度模型，使前馈深度获得正确尺度；\n- **残差尺度修正**：仅沿视线方向修正尺度残差，保留度量相机基线；\n- **漂移门控重访**：重力保持的子图图优化 + 漂移门控重访精炼地图。"},{"h":"实验与结果","body":"- EuRoC 与楼宇级 ORI 序列；DAVIO 启动明显更早、定位误差更低、建图更准；\n- 在\"相同里程计\"设定下与 SOTA 前馈建图器对比，ORI 楼宇级持平或更优；\n- 用估计位姿替换 GT 位姿时，DAVIO 的退化远小于 SOTA 建图器（对 VIO 闭环更鲁棒）。"},{"h":"创新点与贡献","body":"把\"前馈稠密深度\"作为 VIO 的可微分几何先验，而非独立的重建后处理——是\"滤波器 + 前馈模型\"协同定位建图的清晰范式，直接服务 AR 头显的最小传感器栈。"},{"h":"局限与风险","body":"仍依赖 VIO 后端的正确性；前馈深度在弱纹理/极端光照下的失效会回灌到滤波器；楼宇级实验未给出逐序列量化对比表（仅定性\"持平或更优\"）。"},{"h":"与文献库的关系","body":"库内 SLAM 方向（RawSLAM、AMB3R-SLAM、SURE-Map、双协方差 GS-SLAM、ArborSplat）多为 3DGS/基础模型路线；DAVIO 代表\"前馈深度 + 经典 VIO\"的互补路线，扩充了 SLAM 子方向的多样性。"},{"h":"可复现性","body":"论文给出方法描述但未见公开代码链接；依赖 Depth Anything 3 与标准 VIO 框架，复现需自行搭建，门槛中等。"},{"h":"行动建议","body":"做 AR 头显\"单目+IMU\"定位建图基线时，应将 DAVIO 与 3DGS-SLAM 路线并列评估；重点关注其在无 GT 位姿下的退化表现是否真如论文所述稳健。"}]},{"file":"../papers/notes/2609.27778__VISTA-GS：可见性引导的结构化测度流类别条件 3D 高斯生成.md","id":"2609.27778","title":"Visibility-Guided Structured Measure Flow for Class-Conditioned 3D Gaussian Generation","title_zh":"VISTA-GS：可见性引导的结构化测度流类别条件 3D 高斯生成","track":"内容生成","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.92,"evidence":"FULL","tags":["\"3DGS\"","\"生成式\"","\"测度流\"","\"多视角一致性\"","\"基准\""],"flags":[],"sections":[{"h":"一句话结论","body":"VISTA-GS 把 3DGS 对象建模为\"由不透明度、各向异性协方差、多视角可见性加权的结构化高斯测度\"，提出可见性感知测度 VAE + 渲染一致测度流 + 结构保持块传输，在自建 VISTA-Obj30（30 类）基准上相对 GaussianCube/L3DG/DiffGS/Atlas Gaussians/SplatFlow/GaussianAnything 等基线，在几何（CD、F@1）、外观（LPIPS、SSIM）、多视角一致性（MVC）与生成速度上取得一致增益。"},{"h":"要解决的问题","body":"3DGS 虽实时高保真，但把它变成\"原生生成空间\"仍是开放难题：高斯基元无序、变尺寸、局部稠密、对渲染行为高度敏感，难以直接套用网格/三平面/Token 序列式生成。"},{"h":"方法详解","body":"- **可见性加权重测度**：将 3DGS 对象转为 μ_𝒢，按不透明度/协方差/可见性编码为 𝒵=(𝐳_g,{𝐳_m})，对象级语义 + 局部块语义解耦；\n- **测度 VAE**：固定锚点（最远点采样）+ 软分配到局部测度块，得到置换不变、变尺寸兼容、渲染感知的隐空间；\n- **测度流**：把类别条件先验输运到学习到的 3DGS 测度分布，并用渲染一致性对齐解码对象与多视角渲染分布；\n- **块传输**：保持局部高斯布局与空间对应。"},{"h":"实验与结果","body":"- 基准 VISTA-Obj30：ShapeNetCore/Objaverse/ABO/3D-FUTURE/OmniObject3D，70/10/20 划分，仅给类别标签（无文本/图像/逐实例优化）；\n- 指标：CD(10⁻³)、F@1、LPIPS、SSIM、MVC（24 视角）、单对象生成时间；\n- 相对 6 个 3DGS 生成基线在几何、外观、MVC、速度上一致占优（具体数字见论文表）。"},{"h":"创新点与贡献","body":"首次把 3DGS 当作\"带可见性/测度/传输结构的数学对象\"来生成，而非压平为序列或网格——为 3DGS 原生生成空间奠定了表示基础，并给出首个类别条件 3DGS 生成基准。"},{"h":"局限与风险","body":"仅类别条件（无文本/图像条件）；测度 VAE 的固定锚点可能对极端稀疏/高变对象不够灵活；生成速度优势来自表示而非大模型。"},{"h":"与文献库的关系","body":"库内此前无\"3DGS 生成\"方向（多为重建/流式/语义）；VISTA-GS 与同日 Fusion-Aware 同属该新方向，二者方法收敛（均走\"高斯块 + 隐空间流\"），构成\"路线观察\"而非取代。"},{"h":"可复现性","body":"给出基准与对比协议，但未见公开代码链接；依赖多公开 3D 数据集，复现成本中等。"},{"h":"行动建议","body":"做 3DGS 内容生成/虚拟资产自动生成时，应把 VISTA-GS 与 Fusion-Aware 并列作为基线，并比较二者在你目标类别上的 MVC 与速度。"}]},{"file":"../papers/notes/2609.27779__融合感知的分层高斯块隐空间直接 3D 高斯生成.md","id":"2609.27779","title":"Fusion-Aware Direct 3D Gaussian Generation with Structured Patch Latent Flows","title_zh":"融合感知的分层高斯块隐空间直接 3D 高斯生成","track":"内容生成","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.92,"evidence":"FULL","tags":["\"3DGS\"","\"生成式\"","\"Rectified-Flow\"","\"高斯块\"","\"渲染反馈\""],"flags":[],"sections":[{"h":"一句话结论","body":"Fusion-Aware 把不规则高斯集分解为规范局部块、编码为分层隐表示（全局语义 + 局部几何/外观 + 空间对应 + 渲染敏感线索），在其上设计带块位置条件、全局-局部耦合速度预测、密度感知速度加权的\"结构感知 Rectified Flow\"，并以渲染反馈学习连接隐空间流优化与解码多视角渲染质量；在 34 类混合数据集上相对 3DGS 生成基线与图像空间生成骨干的直接改造取得更连贯、更细致、视角更一致的生成。"},{"h":"要解决的问题","body":"现有 3DGS 生成多依赖多视图合成/重建/ lifts 2D 先验，主要在\"观测视图\"上融合信息，而非建模 3D 高斯对象的内在结构分布——导致生成对象局部布局崩坏、视角不一致。"},{"h":"方法详解","body":"- **分层高斯块表示**：不规则高斯集 → 规范局部块 → 分层隐 𝒵=(𝐳^g,{𝐳^p_m})，融合全局语义、块几何/外观、空间对应、渲染线索；\n- **结构感知 Rectified Flow**：块位置条件 + 全局-局部耦合速度 + 密度感知速度加权；\n- **渲染反馈学习**：把隐空间流优化与解码后的多视角渲染质量直接对接，闭环提升保真度。"},{"h":"实验与结果","body":"- 混合数据集：ShapeNetCore/Objaverse/ABO/3D-FUTURE/InteriorGS，统一为 34 类；\n- 与 3DGS 生成基线及\"图像空间生成骨干的直接改造\"对比，生成连贯性、细节、视角一致性更优（具体指标见论文）。"},{"h":"创新点与贡献","body":"与 VISTA-GS 几乎同期、方法收敛：同样走\"高斯块 + 隐空间流（此处为 Rectified Flow）+ 渲染反馈\"。差异在于 Fusion-Aware 强调\"分层全局-局部耦合\"与\"渲染反馈\"，VISTA-GS 强调\"可见性测度 + 测度传输\"。"},{"h":"局限与风险","body":"同 VISTA-GS：仅类别条件；两条同期路线高度相似，社区可能快速收敛到其中一种表示；未见公开代码。"},{"h":"与文献库的关系","body":"与 VISTA-GS 共同开辟\"3DGS 生成\"新方向，是库内内容生成赛道的增量；注意二者同质度高，后续应关注哪条路线胜出或被统一。"},{"h":"可复现性","body":"协议与数据集公开，但无显式代码链接；复现需重建分层 VAE + Rectified Flow 训练。"},{"h":"行动建议","body":"把\"3DGS 生成\"作为内容生成赛道的新基线群；在选型时同时评估 VISTA-GS 与 Fusion-Aware，并关注二者是否会合并为标准表示。"}]},{"file":"../papers/notes/2609.27850__GaussianDS：深度监督的语义高斯泼溅场景理解.md","id":"2609.27850","title":"GaussianDS: Depth-supervised Semantic Gaussian Splatting for Scene Understanding","title_zh":"GaussianDS：深度监督的语义高斯泼溅场景理解","track":"感知与认知","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.85,"evidence":"FULL","tags":["\"语义3DGS\"","\"深度监督\"","\"SAM2\"","\"场景理解\"","\"几何锚定\""],"flags":[],"sections":[{"h":"一句话结论","body":"GaussianDS 把\"语义提升\"当作监督对齐问题而非简单投影：用深度监督 + 几何锚定抑制 3DGS 语义漂移与边界泄漏，在从零联合优化 RGB 外观、渲染深度、紧凑语义的同时，借助 SAM2 在\"位姿感知伪视频轨迹\"上传播视图一致掩码；在语义场景理解上优于仅做 2D 提升的基线，且保留高保真重建与实时渲染。"},{"h":"要解决的问题","body":"给高斯附加语义属性做开词汇场景理解时，把视图相关的 2D 基础模型输出提升到 3D 会带来跨视图不一致与弱几何锚定，导致严重语义漂移与边界泄漏。"},{"h":"方法详解","body":"- **伪视频轨迹**：把无序多视角图像按位姿组织为\"伪视频\"，用 SAM2 传播视图一致掩码；\n- **联合优化**：从零联合优化 RGB 外观 + 渲染深度 + 紧凑语义；\n- **几何锚定**：尺度-位移对齐的单目深度监督 + 深度全变分正则稳定几何；\n- **边界锚定**：深度边缘感知细化损失把语义跳变显式锚定到物理几何不连续处。"},{"h":"实验与结果","body":"- 端到端框架在保留高保真 3D 重建与实时渲染的同时，语义理解显著优于基线（具体 mIoU/边界指标见论文）；\n- 关键消融验证深度监督、伪视频掩码传播、深度边缘感知损失各自贡献。"},{"h":"创新点与贡献","body":"\"语义提升 = 监督对齐 + 几何锚定\"的提法，比\"2D→3D 直接投影\"更系统；深度边缘感知损失把语义边界钉在几何不连续上，是抑制泄漏的实用手段。"},{"h":"局限与风险","body":"依赖 SAM2 掩码质量与单目深度估计精度；\"伪视频\"构造对位姿噪声敏感；开词汇语义的评测协议未充分展开。"},{"h":"与文献库的关系","body":"库内\"感知与认知\"方向（此前多为晕动/眼动用户研究）新增\"语义 3D 场景理解\"技术方向；与库内 3DGS 重建类（CADSplat 等）共享表示但目标不同（理解 vs 重建）。"},{"h":"可复现性","body":"方法自洽、描述具体，但无公开代码链接；依赖 SAM2 与单目深度模型，复现中等。"},{"h":"行动建议","body":"做 XR 场景语义理解/开词汇分割时，GaussianDS 的深度监督 + 几何锚定应作为优于\"纯 2D 提升\"的基线；重点验证在弱纹理/动态场景的语义边界。"}]},{"file":"../papers/notes/2609.27868__TopoGS：面向大规模 3D 高斯泼溅的拓扑感知锚点特征聚合.md","id":"2609.27868","title":"TopoGS: Topology-Aware Anchor Feature Aggregation for Large-Scale 3D Gaussian Splatting","title_zh":"TopoGS：面向大规模 3D 高斯泼溅的拓扑感知锚点特征聚合","track":"神经渲染","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":3.77,"evidence":"FULL","tags":["\"3DGS\"","\"八叉树\"","\"大规模\"","\"特征聚合\"","\"PSNR\""],"flags":[],"sections":[{"h":"一句话结论","body":"TopoGS 针对八叉树 3DGS 各层级特征独立优化、拓扑利用不足的缺陷，提出两件套轻量组件：层级锚点耦合（双向跨层梯度通路 + 残差 MLP）与结构感知包含聚合（用八叉树包含关系 + 哈希匹配区分\"有父子关系\"与\"孤立\"锚点并软加权）；在 Mill19/UrbanScene3D/Tanks&Temples/MatrixCity/WHU 共 10 个场景上一致优于 SOTA，相对最强基线的平均 PSNR 增益分别为 2.13/1.78/0.29 dB。"},{"h":"要解决的问题","body":"八叉树 3DGS 用多层锚点做 LOD 渲染，但各层特征通常独立优化，八叉树拓扑在特征学习中未被充分利用；且均匀跨层聚合产生不对称效应——细层受益于粗层上下文，而粗层需要来自后代的选择性信息。"},{"h":"方法详解","body":"- **层级锚点耦合（Hierarchical Anchor Coupling）**：用每层级上下文三元组 + 残差 MLP 建立双向跨层梯度通路；\n- **结构感知包含聚合（Structure-Aware Containment Aggregation）**：用八叉树包含关系 + 哈希匹配区分\"有合法父子关系\"的锚点与孤立锚点，再以软加权适应拓扑稀疏度变化。"},{"h":"实验与结果","body":"- 10 个大规模场景（Mill19、UrbanScene3D、Tanks&Temples、MatrixCity、WHU）；\n- 相对最强报告基线的平均 PSNR 增益：2.13 / 1.78 / 0.29 dB（不同数据集）；一致优于 SOTA。"},{"h":"创新点与贡献","body":"把\"八叉树拓扑结构\"显式纳入特征聚合，而非把各层当作独立袋——是大规模 3DGS 效率/质量权衡的实用增量，组件轻量、即插即用。"},{"h":"局限与风险","body":"仅相对八叉树 3DGS 路线做增益，未与最新非八叉树大规模方法充分对比；0.29 dB 的某些数据集增益偏小；对极小/极稀疏场景未讨论。"},{"h":"与文献库的关系","body":"库内\"神经渲染\"方向（CADSplat、MoQSplat、SplashSplat、TopoGS 同日）扩充\"大规模/LOD\"子方向；与 GaussPDE（动态可视化）无重叠。"},{"h":"可复现性","body":"方法轻量、描述具体，但无公开代码链接；依赖多个公开大规模 3D 数据集，复现中等。"},{"h":"行动建议","body":"做大规模城市场景/数字孪生 3DGS 时，TopoGS 的拓扑感知聚合应作为八叉树 3DGS 的默认增强；关注其与非八叉树路线的对比。"}]},{"file":"../papers/notes/2609.27938__指尖上的远程表面：基于电振动触觉的机器人遥操作触感反馈.md","id":"2609.27938","title":"Remote Surfaces at Your Fingertips: Electrovibration-Based Tactile Feedback for Robot Teleoperation via Touchscreen Interfaces","title_zh":"指尖上的远程表面：基于电振动触觉的机器人遥操作触感反馈","track":"触觉与多模态","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"B","value":3.4,"evidence":"FULL","tags":["\"触觉\"","\"电振动\"","\"遥操作\"","\"触摸屏\""],"flags":["⚠️ 方法为电振动触觉在遥操作中的应用型工作，非基础方法突破"],"sections":[{"h":"一句话结论","body":"该工作用\"电振动（electrovibration）触觉\"把远程表面交互实时映射给操作者，规避动觉反馈在刚性接触时的不稳定与机械作动器的延迟局限；用户研究（N=21）对比\"视觉反馈\"与\"电振动触觉反馈\"两种力反射条件，在可用性、临场感、操作负荷及路径跟随精度/响应时间上评估，结果表明触觉反馈带来益处。"},{"h":"要解决的问题","body":"机器人遥操作中让操作者自然感知并交互远程表面是根本挑战；现有动觉反馈在刚性接触时不稳定且对通信延迟敏感，而视觉力反馈增加认知负荷、难以持续态势感知。"},{"h":"方法详解","body":"- **界面**：触摸屏 + 电振动触觉，把远程接触力反射为指尖可感纹理/力度；\n- **对照**：视觉反馈 vs 电振动触觉反馈两种力反射条件；\n- **表征实验**：评估路径跟随精度与响应时间；**用户研究（N=21）**：可用性、临场感、操作负荷。"},{"h":"实验与结果","body":"- N=21 用户研究 + 表征实验；路径跟随精度与响应时间在两种条件下评估；\n- 结果：触觉反馈在可用性/临场感/负荷/精度上呈现正向收益（具体数值见论文）。"},{"h":"创新点与贡献","body":"把电振动触觉作为遥操作力反射的\"稳定且低延迟\"替代，是一个面向 XR/遥操作的应用型贡献；⚠️ 属应用创新而非基础方法突破。"},{"h":"局限与风险","body":"样本量 N=21 偏小；仅在触摸屏遥操作设定下验证，未接入头显沉浸式遥操作；电振动的\"力度\"表达维度有限（以纹理/电压调制为主）。"},{"h":"与文献库的关系","body":"库内\"触觉与多模态\"方向新增\"电振动遥操作触觉\"实例；与 09-20/21 批次的触觉相关论文少，方向稀缺但重要。"},{"h":"可复现性","body":"系统依赖特定触摸屏 + 电振动硬件，复现需搭建实验台；无公开代码。"},{"h":"行动建议","body":"做遥操作/远程维修/VR 触觉时，电振动是低成本、低延迟的力反射选项，但应补做大样本与头显内沉浸验证。"}]},{"file":"../papers/notes/2609.28131__DEAL-Grasp：解耦对齐表示下的几何感知灵巧抓取生成.md","id":"2609.28131","title":"DEAL-Grasp: Decoupled Alignment Representation for Geometry-Aware Dexterous Grasp Generation","title_zh":"DEAL-Grasp：解耦对齐表示下的几何感知灵巧抓取生成","track":"化身与人体","date":"2026-09-24","batch":"2026-09-25","batchLabel":"2026-09-25","grade":"A","value":4.05,"evidence":"FULL","tags":["\"灵巧抓取\"","\"VR\"","\"数字人\"","\"流匹配\"","\"Procrustes\""],"flags":[],"sections":[{"h":"一句话结论","body":"把灵巧抓取合成重述为\"对齐空间（DEAL）生成\"：交互状态 = 任务空间几何锚点 + 关节角，刚体位姿由闭式 Procrustes 解析恢复（Kabsch 充当表示诱导求解器而非学习位姿头），再在异构状态上做带\"仅训练期时间自适应物理正则\"的流匹配；在 MultiDex 与零样本 RealDex 上取得高抗力扰动成功率，并在 UR10e + Shadow Hand 上完成物理可行性验证。"},{"h":"要解决的问题","body":"现有灵巧抓取合成多在关节空间回归/去噪，把全局刚体运动与局部关节耦合在一起，导致样本不稳定、接触物理不可信。VR/数字人/具身智能需要既物理可行又跨具身泛化的抓取。"},{"h":"方法详解","body":"- **DEAL 表示**：解耦\"任务空间锚点 𝒳\"与\"关节角 𝜽\"；刚体 SE(3) 由锚点的闭式 Procrustes（Kabsch）解析恢复，局部关节保持独立；\n- **异构状态流匹配**：对混合状态用分量式向量场建模，训练期引入时间自适应物理正则（GPU 并行化 GWN 算子）；\n- **推理**：仅积分学习到的向量场即可得到抓取，无需测试期优化或外部物理引导。"},{"h":"实验与结果","body":"- 数据集：DexGraspNet（标准划分）；单卡 RTX 5090（32GB），batch 200、61 万步，物理损失仅增加约 24% 训练时长；\n- 基准：MultiDex 与零样本 RealDex；高\"抗力扰动（force-perturbation）\"成功率，且跨数据集泛化；\n- 物理可行性：UR10e 机械臂 + Shadow Dexterous Hand 实测验证。"},{"h":"创新点与贡献","body":"核心洞见是\"刚性变换应被表示诱导而非被学习\"——把几何对齐显式解耦出来，使抓取生成在保持物理可行性的同时获得解析可恢复性，是抓取表示学习的重要范式修正。"},{"h":"局限与风险","body":"跨具身（cross-embodiment）/动态操作/更丰富材质反馈仍列为未来工作；训练依赖 DexGraspNet 的\"有效抓取\"定义；真实硬件仅做可行性验证而非大规模部署。"},{"h":"与文献库的关系","body":"库内\"化身与人体/数字人\"方向（VibeAvatar、ARS-Avatar 等侧重渲染）新增\"交互生成\"这一子方向；与 09-23 批次的 4DGS-JEPA（世界模型）无重叠，互补。"},{"h":"可复现性","body":"给出训练配置与硬件细节，但未见公开代码链接；依赖 SAPIEN 合成深度、DexGraspNet，复现需重建 CUDA GWN 算子。"},{"h":"行动建议","body":"做 VR/数字人手部交互或机器人抓取时，DEAL 表示可作为比\"关节空间回归\"更稳健的基线；关注其闭式对齐是否可推广到工具使用等更复杂接触。"}]},{"file":"../papers/notes/2609.28645__PePESeg3D：感知先验增强的多尺度 3D 高斯泼溅分割.md","id":"2609.28645","title":"PePESeg3D: Perception Prior Enhances Multi-Scale Segmentation for 3D Gaussian Splatting","title_zh":"PePESeg3D：感知先验增强的多尺度 3D 高斯泼溅分割","track":"感知与认知","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS\"","\"语义分割\"","\"感知先验\"","\"单体深度\"","\"多尺度\""],"flags":[],"sections":[{"h":"一句话结论","body":"PePESeg3D 把\"感知先验\"同时注入 3D 高斯泼溅的**上游几何重建**与**下游特征对比学习**，解决现有多尺度分割方法中\"几何 unaware of 语义结构、特征学习依赖不完整 mask 监督\"两个痛点，使语义结构与几何对齐、分割更连贯。"},{"h":"要解决的问题","body":"现有方法先以高斯基元重建场景、再独立学习多尺度分割特征，导致几何对语义结构无感知、特征学习受限于不完整的 mask 监督，分割边界与几何错位。"},{"h":"方法详解","body":"- **PePE Reconstruction**：在上游重建中引入单体深度（monocular depth）与 mask 约束，保证语义一致的目标结构；\n- **PePE Contrastive Learning**：把感知先验也融入对比特征学习，使高斯特征在语义一致区域内更紧凑、跨区域更可分；\n- 整体是一个把感知先验注入多尺度 3D 高斯分割流水线的统一框架。"},{"h":"实验与结果","body":"- 在公开 3DGS 分割/重建基准上报告分割准确率与重建质量，并做关键消融验证单体深度约束、mask 约束与对比学习各自的贡献（摘要未列逐项数字）；\n- 相对不注入感知先验的基线，语义结构与几何对齐改善。"},{"h":"创新点与贡献","body":"把\"感知先验\"从单纯的下游特征正则前移到上游几何重建，是对 3DGS 语义分割流程的清晰修正，强调\"几何-语义共同感知\"。"},{"h":"局限与风险","body":"- 仍依赖单体深度与 2D 分割先验的质量，弱纹理/动态场景可能退化；\n- 多尺度分割的\"尺度\"定义与跨场景泛化未充分讨论。"},{"h":"与文献库的关系","body":"库内\"感知与认知\"方向（GaussianDS 语义 3DGS、SplatLabel 动态语义占据）新增\"多尺度感知先验分割\"子方向；与 GaussianDS 共享 3DGS 表示但前者侧重语义提升对齐、PePESeg3D 侧重几何-语义共感知，互补。"},{"h":"可复现性","body":"方法描述具体，但未见公开代码链接；依赖公开数据集与单体深度模型，复现中等。"},{"h":"行动建议","body":"做 XR 场景语义理解/开词汇分割时，PePESeg3D 的\"先验同时注入重建与特征\"应作为优于\"单纯下游投影\"的基线；重点验证其在弱纹理场景的几何-语义对齐。"}]},{"file":"../papers/notes/2609.28930__PlenoCI：基于光场特性的视角依赖感知变化分类.md","id":"2609.28930","title":"PlenoCI: Plenoptic CharacterIstics for View Dependence Aware Change Classification","title_zh":"PlenoCI：基于光场特性的视角依赖感知变化分类","track":"神经渲染","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS\"","\"变化检测\"","\"光场特性\"","\"解析导数\"","\"误报抑制\""],"flags":[],"sections":[{"h":"一句话结论","body":"PlenoCI 从 3D 高斯泼溅近似的\"光场\"派生出闭式解析的**光场特性（Plenoptic Characteristics）**特征，直接刻画视角依赖的丰富视觉行为而忽略朗伯纹理，对未约束重建具有构造性鲁棒性，在不变化区域两次独立重建之间的误报数比同期方法低两个数量级，用于视角依赖感知的变化分类。"},{"h":"要解决的问题","body":"辐射场表示（含 3DGS）原生编码遮挡与视角依赖等复杂视觉现象，但优化欠约束——即使未变化区域，独立优化的重建也会收敛到不同的基元配置，使变化检测产生大量误报。"},{"h":"方法详解","body":"- **PlenoCI 特征**：从 3DGS 近似的光场构造，直接捕获富视觉行为、忽略朗伯纹理；\n- **闭式解析导数**：从 3DGS 表示推导解析光场梯度，高效检测这些 5D 结构；\n- **变化分类**：基于 PlenoCI 做视角依赖感知的变化检测与分类。"},{"h":"实验与结果","body":"- 在不变场景的两次独立重建之间，PlenoCI 报告的误报数比同期方法低**两个数量级**；\n- 在变化检测/分类基准上验证有效性（具体指标见论文）。"},{"h":"创新点与贡献","body":"首次把\"光场解析导数\"作为 3DGS 的鲁棒不变特征用于变化检测，是对欠约束重建下稳定性问题的一个干净解法。"},{"h":"局限与风险","body":"- 聚焦\"不变区域误报抑制\"，对真实变化（结构改变）的检测边界与漏报未充分量化；\n- 仅以 3DGS 为表示载体，向 NeRF 等其他辐射场的推广未讨论。"},{"h":"与文献库的关系","body":"库内\"神经渲染\"方向（CADSplat、TopoGS、OceanXL 等侧重重建/效率）新增\"光场解析特征/变化检测\"技术子方向；与 3DGS 压缩（Observation-Gram/COSA-GS）共享表示但目标不同（检测 vs 压缩），互补。"},{"h":"可复现性","body":"给出解析推导与对比协议，但无公开代码；复现需重建 3DGS + 光场导数，中等。"},{"h":"行动建议","body":"做 3DGS 场景变化检测/异常检测时，PlenoCI 的\"构造性鲁棒特征\"应作为优于对比式方法的基线；关注其在真实变化漏报上的权衡。"}]},{"file":"../papers/notes/2609.28997__Observation-Gram：3D 高斯泼溅视角依赖外观的观测压缩度.md","id":"2609.28997","title":"Only What Was Seen: Observation-Gram Compaction of View-Dependent Appearance in 3D Gaussian Splatting","title_zh":"Observation-Gram：3D 高斯泼溅视角依赖外观的观测压缩度量","track":"神经渲染","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS压缩\"","\"球谐\"","\"观测Gram\"","\"率失真\"","\"Compressed3D\""],"flags":[],"sections":[{"h":"一句话结论","body":"Observation-Gram 指出 3D 高斯泼溅的内存主要被球谐（SH）颜色系数占用、而每个高斯只在训练相机窄锥形视角内被观测，并据此提出**逐高斯的观测 Gram 矩阵**作为\"系数变化 → 平方图像误差\"的精确一阶映射；在此度量下，阶数约简=闭式投影（推广截断）、阶数分配=拉格朗日率失真、矢量量化=矩阵加权 Lloyd（Compressed3D 的标量量化是其特例），替换进 Compressed3D 后在不改其余部分的条件下令 PSNR 提升 +0.49 dB（微调前）。"},{"h":"要解决的问题","body":"3DGS 模型存贮大多花在 SH 系数上，而每个高斯仅从训练相机方向的窄锥被看到——现有压缩（如 Compressed3D）的量化/截断缺乏对\"哪些系数方向真正影响成像\"的度量，造成浪费或失真。"},{"h":"方法详解","body":"- **观测 Gram 矩阵**：由观测方向与混合权重累积得到，是系数变化到平方图像误差的精确一阶映射，仅需模型与相机位姿；\n- **三件套统一框架**：阶数约简→闭式投影（推广截断）；阶数/系数分配→拉格朗日率失真问题；矢量量化→矩阵加权 Lloyd 算法（Compressed3D 的标量量化为特例）。"},{"h":"实验与结果","body":"- 将 Observation-Gram 度量**原样替换进 Compressed3D**（其余不变），微调前即令 PSNR 提升 **+0.49 dB**；\n- 给出率失真分配与矩阵加权量化的收益（具体曲线/表格见论文）。"},{"h":"创新点与贡献","body":"把\"被观测视角锥\"转化为可解析的失真度量，是 3DGS 压缩理论上的清晰一步，且即插即用于现有压缩器，实用性强。"},{"h":"局限与风险","body":"- 度量基于一阶（线性化）近似，大系数扰动下的高阶误差未充分讨论；\n- 仅验证与 Compressed3D 的组合，与最新空间上下文压缩器的协同未覆盖。"},{"h":"与文献库的关系","body":"库内\"神经渲染/系统与平台\"方向（COSA-GS 锚点因果上下文压缩、Morton 编码、From Scattered Gaussians 等）新增\"观测 Gram 失真度量\"理论工具；与 COSA-GS 互补（度量 vs 上下文编码）。"},{"h":"可复现性","body":"推导自洽、改动局部（替换量化度量），但无公开代码；复现需搭 Compressed3D 基线，中等。"},{"h":"行动建议","body":"做 3DGS 压缩/流式传输时，Observation-Gram 的\"按被观测方向分配精度\"应作为优于均匀截断的默认度量；优先验证其与空间上下文编码（如 COSA-GS）的叠加收益。"}]},{"file":"../papers/notes/2609.29041__双阶段 Morton 排序的高斯泼溅高效编码.md","id":"2609.29041","title":"From Scattered Gaussians to Structured Maps: Efficient Gaussian Splatting Coding via Dual-phase Morton Sorting","title_zh":"双阶段 Morton 排序的高斯泼溅高效编码","track":"系统与平台","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.65,"evidence":"FULL","tags":["\"3DGS编码\"","\"Morton\"","\"视频编码\"","\"MPEG\"","\"投影映射\""],"flags":[],"sections":[{"h":"一句话结论","body":"针对\"把 3D 高斯泼溅属性投影成 2D 图以复用 HEVC/VVC 等视频编码（MPEG 正在标准化）\"的主流压缩路线中\"投影视频空间相干性不足\"的短板，提出**双阶段 Morton 空间排序**算法，同时降低计算开销并提升投影图的相关性保留，优于 PLAS 与原始 Morton 排序。"},{"h":"要解决的问题","body":"投影式视频编码是 3DGS 压缩的领先路线（MPEG 标准化中），但其有效性高度依赖投影视频的空间相干性；现有排序策略（PLAS 计算昂贵、Morton 相关性保留有限）未能兼顾效率与相关性。"},{"h":"方法详解","body":"- **双阶段 Morton 排序**：在两阶段中分别应用 Morton 空间排序，兼顾计算成本与投影图相关性；\n- 目标是让 3DGS 属性投影到 2D 图后，相邻高斯在图上仍相邻，从而视频编码器（HEVC/VVC）获得更高压缩比。"},{"h":"实验与结果","body":"- 在 3DGS 投影编码基准上，相对 PLAS 与原始 Morton，在相关性保留（压缩效率）与排序计算开销上同时改善（具体 BD-rate/时间见论文）。"},{"h":"创新点与贡献","body":"是对\"投影式 3DGS 视频编码\"工程链路的实用增量，与 MPEG 标准化方向对齐，落地价值高。"},{"h":"局限与风险","body":"- 仅改进排序，未触及属性量化/熵编码本身；\n- 对极稀疏/极不规则场景的相干性增益未充分讨论。"},{"h":"与文献库的关系","body":"库内\"系统与平台\"方向（COSA-GS 锚点上下文压缩、From Scattered Gaussians、Observation-Gram）新增\"投影排序\"工程方案；与 COSA-GS（锚点编码）互补（排序 vs 上下文）。"},{"h":"可复现性","body":"算法轻量、描述具体，但无公开代码；复现较低（排序算法改动小）。"},{"h":"行动建议","body":"做 3DGS 投影式视频编码（对接 MPEG/HEVC/VVC）时，双阶段 Morton 排序应作为 PLAS 的高效替代；优先验证其与属性上下文编码的协同。"}]},{"file":"../papers/notes/2609.29073__工具增强的度量空间推理：给小 VLM 配上几何求解器.md","id":"2609.29073","title":"Seeing Is Not Measuring: Tool-Augmented Metric Spatial Reasoning for Vision-Language Models","title_zh":"工具增强的度量空间推理：给小 VLM 配上几何求解器","track":"空间计算与UI","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"VLM\"","\"空间推理\"","\"度量深度\"","\"工具增强\"","\"ReVSI-Bench\""],"flags":[],"sections":[{"h":"一句话结论","body":"该工作把\"度量 3D 推理\"从 VLM 权重中剥离出来，装进显式几何工具：给小模型 Qwen3.5-4B 配上 3D 目标检测、度量深度估计与距离/尺寸/方位的确定性求解器，每物体在各自最佳视角帧内检测、工具用该帧位姿把检测抬升到统一世界帧——在 ReVSI-Bench 四项任务中三项大幅领先，绝对距离 MRA 0.46→0.74、相对距离 39.1%→67.4%。"},{"h":"要解决的问题","body":"视觉-语言模型擅长描述场景，但对绝对距离、物理尺寸、自我中心方向等**度量 3D 结构**推理很差；把度量计算塞进模型权重既不准也不可控。"},{"h":"方法详解","body":"- **模块化工具增强框架**：predictor-agnostic，小 VLM（Qwen3.5-4B）仅负责识别/指代，几何交给外部工具；\n- **工具库**：3D 目标检测、度量深度估计、以及距离/尺寸/方位的确定性求解器；\n- **逐最佳视角检测**：每个物体在\"能最好看到它的相机帧\"中被检测，工具用该帧位姿把每个检测抬升到**一个共享世界帧**，从而把度量计算移出模型权重、交给显式求解器。"},{"h":"实验与结果","body":"- 基准 ReVSI-Bench 四项任务中三项获得大增益：配合强单体检测器 WildDet3D，绝对距离 MRA 由 **0.46 升至 0.74**，相对距离由 **39.1% 升至 67.4%**；\n- 其余一项（具体见论文）亦较基线改善。"},{"h":"创新点与贡献","body":"\"把度量计算从权重搬到工具\"的范式，对 VLM 的空间推理是稳健且可控的解法——小模型 + 显式求解器即可逼近大模型的度量能力，工程价值高。"},{"h":"局限与风险","body":"- 依赖外部检测器/深度估计质量，工具链路任一环失败会级联到最终度量；\n- 仅验证四个 ReVSI 任务，对更复杂空间关系（拓扑/遮挡推理）泛化未覆盖。"},{"h":"与文献库的关系","body":"库内\"空间计算与UI\"方向新增\"工具增强度量空间推理\"子方向；与现有 AR 空间标注/语义理解工作互补，提供\"小模型可部署\"的轻量路径。"},{"h":"可复现性","body":"框架模块化、依赖公开 VLM 与检测/深度模型，但无显式代码链接；复现中等。"},{"h":"行动建议","body":"做 AR 空间计算/机器人交互时，优先采用\"VLM 指代 + 显式几何求解器\"而非端到端回归；关注工具链路在遮挡/动态场景的鲁棒性。"}]},{"file":"../papers/notes/2609.29106__WildHSR：基于 3D 基础模型的度量前馈 4D 人-景重建.md","id":"2609.29106","title":"WildHSR: Metric Feed-Forward 4D People-Scene Reconstruction from a 3D Foundation Model","title_zh":"WildHSR：基于 3D 基础模型的度量前馈 4D 人-景重建","track":"重建与SLAM","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"4D重建\"","\"人-景\"","\"基础模型\"","\"度量尺度\"","\"前馈\""],"flags":[],"sections":[{"h":"一句话结论","body":"WildHSR 问：一个\"只到尺度（up-to-scale）\"的 3D 基础模型，能否通过轻量适配同时补齐度量人-景重建缺的两个输出——**度量尺度**与**持续人体身份**？用精选网络视频中的人体给出近似闭式尺度伪标签预训练 Scale Readout，再以真实视频精确度量监督微调轻量适配器，推理时头部直接从基础模型 token 预测度量尺度、无需标尺。"},{"h":"要解决的问题","body":"3D 基础模型单前向恢复视频相机与几何，但最强模型只到尺度；联合人-景重建还需要度量尺度与持续人物身份两个缺失输出。精确度量标签稀缺，而未经标注的野生视频海量。"},{"h":"方法详解","body":"- **伪标签初始化**：用精选网络视频中的人体——一个带位姿的度量身体 + 2D 关键点给出近似的闭式尺度伪标签；\n- **Scale Readout 预训练**：用上述伪标签预训练尺度读出头；\n- **轻量适配器 + 精确监督微调**：用标准真实视频训练划分的精确度量监督，与轻量适配器一起微调；\n- **推理**：头部从基础模型 token 预测度量尺度，无需标尺/标定。"},{"h":"实验与结果","body":"- 在野生/真实视频的人-景度量重建基准上，相对只到尺度的基线显著恢复度量尺度与持续身份（具体指标见论文）；\n- 验证伪标签预训练 + 精确微调两阶段的有效性。"},{"h":"创新点与贡献","body":"把\"尺度歧义\"用极廉价的闭式伪标签 + 轻量适配解决，是\"基础模型 up-to-scale → 度量重建\"的实用路径，对野生视频 4D 人-景重建直接可用。"},{"h":"局限与风险","body":"- 伪标签来自网络视频人体，对无清晰人体/极端姿态场景尺度恢复退化；\n- 身份持续性在多人交叉/长时序重识别上的鲁棒性未充分量化。"},{"h":"与文献库的关系","body":"库内\"重建与SLAM\"方向（DAVIO、KYS-SLAM、FMCW-LIO 等侧重定位/建图）新增\"前馈度量人-景重建\"子方向；与 4D 人体（Ego-Exo4D-HM）共享人体重建主题但方法（基础模型适配 vs 数据集重建）不同，互补。"},{"h":"可复现性","body":"给出两阶段训练协议，但无公开代码；依赖 3D 基础模型与真实视频基准，复现较高。"},{"h":"行动建议","body":"做 4D 人-景/野生视频重建时，WildHSR 的\"闭式尺度伪标签 → 轻量适配器\"应作为比重训练更省力的基线；关注其在无清晰人体场景的退化。"}]},{"file":"../papers/notes/2609.29292__PHOSA：照片级真实 3D 手语化身建模与基准.md","id":"2609.29292","title":"PHOSA: Photorealistic 3D Sign Avatar Modeling and Benchmark","title_zh":"PHOSA：照片级真实 3D 手语化身建模与基准","track":"化身与人体","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.9,"evidence":"FULL","tags":["\"手语化身\"","\"SMPL-X\"","\"多视角\"","\"可访问性\"","\"基准\""],"flags":[],"sections":[{"h":"一句话结论","body":"PHOSA 针对聋人社群沟通刚需的\"照片级真实手语化身\"，提出首个与聋人专家共同设计的多视角手语数据集 MVSign，并以\"解耦身体/头/手 + 动作感知采样\"的表示建模复杂手语手势与细腻表情，在多项指标上优于现有化身方法。"},{"h":"要解决的问题","body":"照片级真实手语化身对与聋人社群的 effective communication 至关重要，但手语包含复杂手部手势与细腻面部表情，现有通用人体化身在细粒度手部与表情上明显不足，且缺少面向手语的多视角数据与标准基准。"},{"h":"方法详解","body":"- **MVSign 数据集**：首个与聋人专家共同设计的多视角中国手语数据集，含多样手势与丰富标注；开发混合拟合管线产出精确的 body/hand/facial 参数（SMPL-X），并可推广到单目设置。\n- **解耦手语化身表示**：把身体、头、手组件隔离，分别捕捉复杂关节运动。\n- **动作感知采样策略**：处理运动模糊并平衡手势多样性。"},{"h":"实验与结果","body":"- 在自建 MVSign 上与现有关键化身方法进行对比，在重建精度/保真度上取得更优结果（论文给出具体数值与消融，摘要未列逐项数字）；\n- 消融验证解耦表示与动作感知采样各自的贡献。"},{"h":"创新点与贡献","body":"首个\"照片级真实手语化身 + 多视角手语基准 + 解耦建模\"三位一体工作，且与终端用户（聋人）共同设计，对可访问性研究具有方法学示范意义。"},{"h":"局限与风险","body":"- 数据规模与手势覆盖相对通用人体数据集仍有限，跨手语语种（如 ASL）泛化未验证；\n- 仍依赖 SMPL-X 参数化与多视角采集，单目设置下精度退化需进一步评估。"},{"h":"与文献库的关系","body":"库内\"化身与人体\"方向（VibeAvatar、ARS-Avatar、DEAL-Grasp 等侧重渲染/重光照/抓取）新增\"手语/可访问性\"子方向；与 PHOSA 同属照片级化身但目标人群与方法（解耦手势）不同，互补。"},{"h":"可复现性","body":"给出 MVSign 数据集、混合拟合管线与代码/数据链接（摘要声明 companion 资源），复现性较高。"},{"h":"行动建议","body":"做无障碍 XR/虚拟人时，PHOSA 的\"与终端用户共设计 + 解耦手势建模\"是优于通用化身的基线；关注其在单目与跨语种上的落地。"}]},{"file":"../papers/notes/2609.29374__FMCW-LIO：基于多普勒 FMCW 激光雷达-惯导里程计.md","id":"2609.29374","title":"FMCW-LIO: A Doppler LiDAR-Inertial Odometry","title_zh":"FMCW-LIO：基于多普勒 FMCW 激光雷达-惯导里程计","track":"重建与SLAM","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"SLAM\"","\"LiDAR\"","\"多普勒\"","\"运动补偿\"","\"LIO\""],"flags":[],"sections":[{"h":"一句话结论","body":"FMCW-LIO 利用新型 FMCW 多普勒激光雷达除测距外还能捕获**逐点瞬时多普勒速度**这一独有特性，设计运动补偿方法并引入多普勒辅助的观测模型进行 on-manifold 状态估计，从而有效剔除动态点、提升激光-惯导里程计/SLAM 在动态与退化场景下的鲁棒性。"},{"h":"要解决的问题","body":"传统 LIO/SLAM 重度依赖环境几何特征，因为激光雷达只提供测距而非运动测量；在动态物体多、几何退化的场景，纯几何方法易受污染与失效。"},{"h":"方法详解","body":"- **多普勒测量接入**：FMCW 多普勒雷达提供逐点瞬时多普勒速度（由多普勒效应得到）；\n- **运动补偿**：设计补偿方法消除传感器运动对多普勒测量的影响；\n- **多普勒辅助观测模型**：在 on-manifold 状态估计中纳入多普勒观测；\n- **动态点剔除**：借助多普勒有效移除动态点。"},{"h":"实验与结果","body":"- 在含动态物体与退化场景的序列上，相对不含多普勒的 LIO/SLAM 基线，轨迹精度与鲁棒性提升（具体 ATE/漂移指标见论文）；\n- 验证多普勒辅助观测与动态点剔除的贡献。"},{"h":"创新点与贡献","body":"首次系统地把\"FMCW 多普勒速度\"作为 LIO 的一等观测，是把新传感器物理量转化为定位鲁棒性的清晰范例。"},{"h":"局限与风险","body":"- 依赖 FMCW 多普勒雷达（非标清机械/固态雷达），硬件门槛存在；\n- 多普勒观测在高噪声/低反射率表面的可靠性未充分讨论。"},{"h":"与文献库的关系","body":"库内\"重建与SLAM\"方向（DAVIO、KYS-SLAM、RawSLAM、双协方差 GS-SLAM、AMB3R-SLAM 等）新增\"多普勒激光雷达\"传感器路线，与几何/学习式 SLAM 互补而非取代。"},{"h":"可复现性","body":"方法描述具体，但无公开代码；依赖 FMCW 雷达数据与标准 LIO 基准，复现较高（硬件依赖）。"},{"h":"行动建议","body":"做高动态/退化场景 SLAM 时，若具备 FMCW 多普勒雷达，FMCW-LIO 的多普勒辅助观测应作为优于纯几何基线的方案；关注其硬件可得性与噪声边界。"}]},{"file":"../papers/notes/2609.29603__MoSign：面向匿名 VR 用户的挑战-应答式运动水印身份认证.md","id":"2609.29603","title":"MoSign: Challenge-Response Motion-Watermark Authentication for Anonymous Virtual-Reality Users","title_zh":"MoSign：面向匿名 VR 用户的挑战-应答式运动水印身份认证","track":"交互与输入","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09
