'","'4D-reconstruction'","'gaze'","'transformer'","'SOTA'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"首个从单目第一视角 RGB 视频统一重建「观察者(view)」与「视角(viewer)」4D 动态的前馈框架，联合建模多模态信号、推理比同类快 10–100×。"},{"h":"问题背景","body":"可穿戴前摄等第一视角设备能捕捉人与环境的连续交互；但现有方法要么依赖预计算相机轨迹、要么把场景感知与人体自运动建模割裂、要么推理慢，难以支撑 AR/VR/AI 眼镜的实时 4D 重建。"},{"h":"方法","body":"将任务表述为对多模态信号（RGB 视频、相机轨迹、注视方向、全身运动、手部运动、深度）联合概率分布 p(𝒳,𝒴) 的学习；用 Masked Generative Egocentric Transformer 在单一前馈架构内同时重建时间一致的 4D 表征，绕过易出错的级联相机跟踪。统一离散 tokenization + 多模态掩码目标迫使模型学到鲁棒的生物力学合理运动先验。"},{"h":"实验","body":"在 HoloAssist、HOT3D、ARCTIC、Aria Digital Twin、TACO 多基准上评测；全身/手/注视重建与相机跟踪达 SOTA，深度估计具竞争力。比 EgoAllo 快约 100×、比 UniEgoMotion 快约 10×；即使不输入相机轨迹也优于用 GT 相机的基线（PA-MPJPE 88.6、Similarity 0.751、FID 0.442、推理 0.7s）。消融证实参数规模关键（127M 轻量变体明显退化）、性能随数据量扩展。"},{"h":"贡献与局限","body":"统一联合分布建模避免级联相机误差、首次 holistic 第一视角 4D 重建；局限：依赖大规模多模态数据集，轻量变体性能下降明显，真实部署需算力。"},{"h":"与文献库关系","body":"与库内 VGGT-BC（2610.09274，硬件感知校准聚类注意力，3.73）互补而非取代——ReViV 更 holistic（增注视/深度/手）且更快；同属第一视角几何重建方向，建议持续追踪其取代/归一信号。"},{"h":"适用 XR 场景","body":"AR/VR/AI 眼镜实时第一视角 4D 重建、注视估计、具身智能体场景理解。"}]},{"file":"../papers/notes/2607.19479__ModPack-teleop.md","id":"2607.19479","title":"ModPack: Extensible Teleoperation Interface for Bimanual Mobile Manipulation","title_zh":"ModPack：可扩展双臂移动操控遥操作接口（可穿戴背包+触觉反馈，全开源）","track":"交互与输入","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"B","value":3.45,"evidence":"FULL","tags":["'teleoperation'","'haptic'","'open-source'","'robotics'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"模块化可扩展双臂移动操控遥操作框架，可穿戴背包核心+插件式能力模块（触觉反馈/移动操控/主动感知），硬件软件全开源。"},{"h":"问题背景","body":"现有遥操作系统常绑定特定机器人硬件与任务域，扩展性与适应性受限。"},{"h":"方法","body":"ModPack：模块化可扩展遥操作框架；核心是可穿戴「背包」集成板载计算/电源/通信/存储；其上支持即插即用能力模块——关节级遥操作+触觉反馈、移动操控、主动感知。完整硬件设计+软件栈开源。"},{"h":"实验","body":"两个机器人平台、真实移动操控任务验证；比无机器人替代方案收集更高质量数据。布艺放置（主动感知）头摄 22/25 成功、腕摄仅 3/25；箱体搬运（触觉反馈）验证触觉通道价值。"},{"h":"贡献与局限","body":"统一接口支持多样本体、高 TRL、全开源；更偏机器人遥操作，与 XR 关联在「远程呈现/化身控制」间接相关。局限：主要面向机器人数据收集，XR 直接映射有限。"},{"h":"与文献库关系","body":"与库内触觉与多模态（TouchScale 2610.10288 数据集）互补，补「遥操作接口+触觉反馈」系统侧。"},{"h":"适用 XR 场景","body":"远程呈现/化身控制、触觉反馈遥操作、机器人-AI 眼镜协同。"}]},{"file":"../papers/notes/2608.12759__NavSight-lowvision-AR.md","id":"2608.12759","title":"NavSight in the Wild: Understanding Real-World Use of a Mobile Augmented Reality Application for People with Low Vision in Outdoor Navigation","title_zh":"NavSight：面向低视力户外导航的移动端 AR 应用（真实世界 7 日日记研究）","track":"空间计算与UI","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"A","value":3.73,"evidence":"FULL","tags":["'assistive-AR'","'low-vision'","'navigation'","'in-the-wild'","'HCI'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"面向低视力户外导航的移动端 AR 应用，首个真实世界 in-the-wild 日记研究，提炼 AI 辅助无障碍 AR 设计启示。"},{"h":"问题背景","body":"低视力(PLV)户外安全独立导航困难且重要；现有低视力 AR 多在理想实验室环境评估，缺真实世界可行性与挑战研究。"},{"h":"方法","body":"NavSight：移动 AR 应用，识别重要户外物体（路缘、车辆等）并渲染实时视觉增强；iOS/Unity/CoreML 设备端推理；对 YOLO11l-seg 做户外物体微调。"},{"h":"实验","body":"12 名 PLV 真实世界 7 日日记研究；刻画对场景感知影响、用户对「增强什么/如何增强」的配置策略、识别错误处理、公共场合社交可接受性；识别环境影响（天气/光照/阴影/非标道路标线）与日常可用性问题。微调模型 mAP50 0.256→0.588、mAP75 0.129→0.305、mAP 0.136→0.318。"},{"h":"贡献与局限","body":"首个低视力 AR 真实世界 in-the-wild 研究，给出环境/可用性/设计启示；局限：n=12 小样本、iOS 专属、识别错误时用户应对策略待系统性化。"},{"h":"与文献库关系","body":"与库内空间计算/UI（多为 VR 探索/导航世界模型如 SPW-Nav 2610.08941）互补，补「无障碍 AR 真实部署」视角。"},{"h":"适用 XR 场景","body":"无障碍 AR 导航、AI 眼镜辅助视障、公共空间信息增强。"}]},{"file":"../papers/notes/2610.08941__spw-nav.md","id":"2610.08941","title":"SPW-Nav: A Streaming Panoramic World Model for Language-Guided Navigation","title_zh":"SPW-Nav：流式全景世界模型（语言引导导航/VR 探索）","track":"空间计算与UI","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["世界模型","全景视频","语言引导","具身智能体","VR探索"],"flags":[],"sections":[{"h":"一句话总结","body":"一个流式全景世界模型：在已生成的全景中解释每条语言指令，流式输出 1 分钟 2K 360° 视频（26.6 FPS），把\"语言\"变成探索生成世界的实用接口。"},{"h":"问题背景","body":"- 现有全景视频生成按预定义轨迹走；交互式世界模型多用低层动作在透视视图中作用。\n- 语言引导的全景世界模型（用于交互式 3D 场景探索、VR 体验、具身智能体训练）此前缺失。"},{"h":"方法","body":"- **流式全景世界模型**：在先前生成的全景中解释当前语言指令，逐块流式生成。\n- **球面旋转解耦（SRD）**：使旋转精确（避免累积旋转误差）。\n- **位姿对齐条件**：平移输入有界，避免漂移。\n- **噪声尾迹轨迹学习 + 反向轨迹引导**：增强对指令的平移跟随。\n- 架构：视频 backbone + 视觉-语言 backbone（解释指令并定位目标）。"},{"h":"实验与结果（关键数字）","body":"- 基准 SPW-NavBench：40 条位移指令 + 60 条可见目标指令。\n- 相机跟随：TDE 56.66°（基线 ≥62.07°）；FVD 351.6（基线 ≥628.8）；RE 不到基线 1/4。\n- 相机控制生成：RE≈1（接近精确旋转）。\n- 导航微调：显式指令准确率 0.663→0.925；目标指令 0.154→0.692；无全景时目标定位降到 0（说明目标在图中而非凭词猜）。\n- 生成速度快于播放 → 可在流播放过程中发出新指令。"},{"h":"贡献与局限","body":"- 贡献：首个语言引导的流式全景世界模型；旋转精确、平移跟随强、长闭环接近精确。\n- 局限：(1) 远距离重访一致性仍开放；(2) 平移轨迹形状有待改进；(3) 未来方向：姿态索引 3D 记忆提升远距离一致性、更多训练轨迹改善平移形状。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"世界模型/全景生成\"方向互补；VR 探索与具身智能体训练的直接供给。"},{"h":"适用 XR 场景","body":"- 交互式 VR 世界探索、具身智能体训练数据合成、语言即界面的生成式场景漫游。"}]},{"file":"../papers/notes/2610.08978__s2tok.md","id":"2610.08978","title":"S2Tok: Streaming 3D Gaussian Reconstruction with Persistent Spatial Tokens","title_zh":"S2Tok：基于持久空间令牌的流式 3DGS 重建","track":"重建与SLAM","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["流式重建","3DGS","空间令牌","前馈","在线SLAM"],"flags":[],"sections":[{"h":"一句话总结","body":"一个前馈框架，维护\"尺寸自适应的持久潜在场景状态（空间令牌）\"，从未经标定的图像流中增量重建 3D 高斯场景，每来一帧都能渲染当前已观测内容。"},{"h":"问题背景","body":"- 流式 3D 重建需要的不是一串几何预测，而是一个能持续并入新证据、且始终可渲染的持久场景状态。\n- 潜在空间令牌是理想表示，但从图像集合构建后，如何在\"在线、每帧新观测到达\"时维护仍是开放问题。"},{"h":"方法","body":"- **编码器（ViT）**：将第 i 帧图像块编码为帧令牌（隐含于该帧相机坐标系）。\n- **Stream-Spatial (SS) Transformer**：联合更新帧令牌与已有空间令牌 S_{i-1}；含全局注意力、场景局部注意力、帧局部注意力三层。\n- **学习式准入（Admission）模块**：选择性地把帧令牌追加进场景状态，形成 S_i（尺寸自适应，M+δ 个令牌）。\n- **层次解码器 + 高斯头**：从 S_i 及 SS-Transformer 两层令牌预测高斯候选（每令牌对应 h 个高斯）。\n- S_i 带入下一步，实现因果流式更新。"},{"h":"实验与结果（关键数字）","body":"- 训练：DL3DV + RealEstate10K；测试：DL3DV / RealEstate10K / Mip-NeRF 360 / ScanNet++。\n- 协议：Final（用整序列后最终重建渲染目标视图）与 Intermediate（每步用当前重建渲染对应目标视图）两设定；流式方法增量更新，非流式方法全局对齐。\n- 50-view 流式在单张 NVIDIA A100 80GB 上测每视重建时间与峰值显存；对比 StreamSplat 等（StreamSplat 仅评 Intermediate，因其时间条件重建不产生全局相机对齐的最终场景）。"},{"h":"贡献与局限","body":"- 贡献：将\"持久空间状态\"做成尺寸自适应的前馈流式 3DGS；引入学习式准入控制状态增长。\n- 局限：跨数据集泛化与更高分辨率、更长时间跨度的稳定性待验证；摘要未给绝对 PSNR 数值（声称优于基线）。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"流式/前馈 3DGS 重建\"方向互补，是 SLAM/在线重建的算法侧供给。"},{"h":"适用 XR 场景","body":"- 实时/在线 3DGS 重建、移动端场景扫描、XR 内容实时捕获与持久化。"}]},{"file":"../papers/notes/2610.09274__vggt-bc-attention.md","id":"2610.09274","title":"Hardware-aware Calibrated Clustered Attention for Efficient Visual Geometric Transformers","title_zh":"硬件感知校准聚类注意力（高效视觉几何 Transformer / VGGT）","track":"重建与SLAM","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.73,"evidence":"FULL","tags":["VGGT","聚类注意力","模型压缩","边缘部署","3D重建加速"],"flags":[],"sections":[{"h":"一句话总结","body":"把 VGGT（视觉几何接地 Transformer）的 24 个全局注意力层替换为\"校准块聚类注意力（BC attention）\"，在几乎无损精度下大幅压缩序列长度、降低延迟，使其可部署到边缘/XR 设备。"},{"h":"问题背景","body":"- VGGT 首次单 pass 联合推断相机位姿、深度、密集几何，但全局注意力层需极长序列 → 高延迟瓶颈，难在资源受限设备运行。"},{"h":"方法","body":"- **块聚类注意力（BC attention）**：用校准超平面（calibrated hyperplane）对 query 聚类，分块计算注意力，压缩 query 长度（压缩因子 γ）。\n- **硬件感知**：考虑块大小与延迟的协同选择；误差补偿 + 块大小选择消融。\n- 将预训练 VGGT-1B 的 24 个全局层替换为 BC attention，其余不变。"},{"h":"实验与结果（关键数字）","body":"- ETH3D 点图估计（深度+相机头解投影到 3D）：γ=3（query 长度 ×3 压缩）总体损失 ~1%；γ=4 损失 <5%；**随机超平面**则损失 >17%（说明校准是关键）。\n- DTU（结构光毫米级真值）：校准 BC 注意力损失 <0.05 mm。\n- 与 ToMeSD 对比：校准 BC 在精度-压缩权衡上更优。\n- 延迟显著降低（边缘部署可行）。"},{"h":"贡献与局限","body":"- 贡献：把\"聚类注意力\"用于 VGGT 且用校准超平面保精度；硬件感知的块大小/延迟协同。\n- 局限：是 VGGT 的增量加速方案，不改进上游精度；极端压缩（γ 更大）精度损失上升。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"高效 3DGS/几何 Transformer\"方向互补——VGGT 类单 pass 几何推理是 XR 设备端 SLAM/重建的候选 backbone，本工作解决其部署瓶颈。"},{"h":"适用 XR 场景","body":"- 设备端实时 3D 重建/SLAM（VGGT 类）、XR 几何推理加速。"}]},{"file":"../papers/notes/2610.09304__emg2face.md","id":"2610.09304","title":"emg2face: Expressive Facial Animation with High-Density Surface EMG","title_zh":"基于高密度表面肌电的表情动画（HMD 遮挡下面部捕捉）","track":"化身与人体","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["面部动画","表面肌电","HMD遮挡","头像","隐私友好"],"flags":[],"sections":[{"h":"一句话总结","body":"用高密度表面肌电（HD-sEMG）直接预测面部表情 blendshape 权重，使表情驱动在 VR 头显（HMD）遮挡面部、光学方法失效的场景下仍可用，且无需摄像头、隐私友好。"},{"h":"问题背景","body":"- 光学面部捕捉在面部被 HMD 遮挡时不可用；即使无遮挡也带来隐私问题并需头戴采集装置。\n- 社交临场感依赖细微表情（抬眉、眨眼、微笑、说话），这些信号对 VR 头像驱动至关重要。"},{"h":"方法","body":"- **采集设施**：32 通道纺织 HD-sEMG 电极网格（额头——通常被 HMD 遮挡——与右脸颊各一），采样 2048 Hz；正面摄像头 4K@29.97fps 同步录视频；被试躯干约束以保持头部在视场。\n- **同步方案**：音频 tone 标记准备/运动起点/休息，分别在被试音频与 EMG 辅助通道检测 onset，两时钟固定偏差在偏移中抵消。\n- **数据**：25 名被试（19–70 岁），8 种表情（抬眉/皱眉/眨眼/微笑 + 数 1–5），每动作重复至多 8 次。\n- **预测**：从 HD-sEMG 预测 GNM 表情 blendshape 权重；眼睑交叉校正；网络结合每帧前/后各 1.27 s 的 EMG（非因果）。"},{"h":"实验与结果（关键数字）","body":"- 指标：各 blendshape 预测与拟合权重的 Pearson 相关 r；网格顶点平均距离；R²（预测解释拟合面部运动方差的比例）。均在 25 名被试 held-out 试次上计算，仅可见面部 5101 顶点。\n- 应用验证：面部遮挡下解码、仅用额头（被 HMD 遮挡）解码、影响/不可见表情解码、表情迁移、次级效应（牙齿/舌头）。"},{"h":"贡献与局限","body":"- 贡献：首个在 HMD 遮挡下仍能解码上半脸表情的 sEMG 方案；提供 25 人同步 EMG-视频数据集与处理流程。\n- 局限：(1) 非因果，约 1.3 s 延迟，不适实时动画；(2) 实验室 bulky 设备，穿戴化需大量工程；(3) 每被试单独训练（需同步视频 session），换人需重采；(4) 干电极接触质量显著影响精度；(5) 尚未泛化自由对话。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"高斯头部化身/表情\"方向（如 Heartian 2609.28539）互补：emg2face 解决\"输入信号从哪来\"，头像方法解决\"如何渲染\"，可形成\"肌电→表情→头像\"链路。无取代、无同质重复。"},{"h":"适用 XR 场景","body":"- VR/MR 社交头像的无摄像头表情驱动；隐私敏感场景；神经接口式表情输入。"}]},{"file":"../papers/notes/2610.09444__lightrocc.md","id":"2610.09444","title":"LighTROcc: Lightweight 4D Occupancy Forecasting via Instance-Centric 3D Gaussians","title_zh":"LighTROcc：基于实例中心 3D 高斯的轻量 4D 占据预测","track":"感知与认知","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.65,"evidence":"FULL","tags":["占据预测","实例中心","3D高斯","环视相机","时空一致性"],"flags":[],"sections":[{"h":"一句话总结","body":"用紧凑的\"实例中心 3D 高斯\"表示可移动物体，从环视相机历史预测 4D 占据（当前+未来），避免密集体素/BEV 的高成本，并保持实例身份与时间一致性。"},{"h":"问题背景","body":"- 环视相机 4D 占据预测以往依赖密集体素/BEV，成本随空间分辨率与预测时域快速增长；且不显式保持物体身份 → 实例一致性差。"},{"h":"方法","body":"- **实例中心表示**：用紧凑学习查询集表示可移动物体（GMO），而非密集时空特征；每查询预测置信、深度、高斯混合参数、未来轨迹。\n- **注意力引导前向提升（forward lifting）**：把查询定位到 3D；用 3D 高斯混合建模物体；传播到未来帧。\n- **Transformer Query Decoder**：共享图像编码器提取多尺度特征；为令牌补 2D 正弦位置、相机参数+自车位姿嵌入、相机 ID 嵌入、时间嵌入；N_q 学习查询经交叉/自注意力精炼。\n- 设定：T_p=2 过去帧，T_f=4 未来帧（0.5/1.0/1.5/2.0 s）。连续高斯体光栅化为占据序列。"},{"h":"实验与结果（关键数字）","body":"- 数据：nuScenes + nuScenes-Occupancy（700 训练 / 150 评估；序列含 2 过去+1 当前+4 未来占据）。\n- 范围 [−51.2,51.2]²×[−5,3] m，512×512×40 网格，体素 0.2 m。\n- 指标：体素 IoU + 实例 AP（IoU 0.1/0.2/0.3 均值）；中心定位 AP_ctr / Recall_loc（1m）。单张 RTX Pro 6000 评估。\n- 结果：比密集方法更轻量紧凑，定性更准捕捉物体位置与实例一致性。"},{"h":"贡献与局限","body":"- 贡献：把\"实例中心 3D 高斯\"引入占据预测，兼顾轻量与实例一致性；注意力引导提升替代密集特征。\n- 局限：主体面向自动驾驶基准；XR 迁移需替换为头显环视/深度输入；长时域（>2s）预测未覆盖。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。虽基准在自动驾驶，但\"实例中心 3D 高斯占据\"机制可迁移库内 XR 场景理解/遮挡推理/空间计算方向，属跨域可迁移供给。"},{"h":"适用 XR 场景","body":"- XR 场景理解、遮挡推理、空间计算（需替换为头显传感器输入）。"}]},{"file":"../papers/notes/2610.09455__rlhnd.md","id":"2610.09455","title":"RLHND: Video Foundation Models as Physically Grounded Hand Trackers for Robot Learning","title_zh":"RLHND：视频基础模型驱动的物理接地手部追踪","track":"交互与输入","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["手部追踪","视频基础模型","触觉","物理接地","机器人学习"],"flags":[],"sections":[{"h":"一句话总结","body":"基于预训练视频基础模型（Cosmos 3 + LoRA）的物理接地手部追踪器：同时输出 MANO 姿态与逐顶点接触/力信号，使手部追踪具备物理一致性，直接提升机器人策略训练质量。"},{"h":"问题背景","body":"- 现有手追踪多从裁剪帧回归姿态，对手部运动与物体交互先验有限，且缺少接触/力等物理线索 → 估计不准确、物理不一致。\n- 机器人策略训练依赖高质量人类视频手追踪标签，物理不一致会拖累策略。"},{"h":"方法","body":"- **清洁潜变量编码器**：用 Cosmos 3 预训练编码器的 conditioning 接口（非空噪声去噪接口），LoRA 微调 patch embedding 与生成通路，得到确定性时空特征网格。\n- **Pose Expert Stream（阶段1）**：从视频特征预测 MANO 参数（shape β^、articulation θ^、全局腕旋转）、度量相机空间平移 τ^、每帧手部存在/可见性。\n- **Tactile Expert Stream（阶段2，冻结 pose）**：从同一视频特征以独立权重预测逐顶点触觉——接触概率 c^（778 MANO 顶点）与力 f^，解耦触觉与姿态预测。"},{"h":"实验与结果（关键数字）","body":"- 姿态：HOT3D/ARCTIC held-out + EgoDex zero-shot；触觉：OpenTouch / PressureVisionDB（PVDB）测试拆分，及 HOT3D/DexYCB/ARCTIC 网格派生接触标签（仅接触）。\n- 手腕深度中位偏差 2.3 cm，比 HaWoR 低 17.8%。\n- 取得 SOTA 运动重建与触觉估计；跨 5 种灵巧手平滑重定向；DPP + RLHND 在无人工标注下超越原 tracker。\n- 将释放实现与预训练权重。"},{"h":"贡献与局限","body":"- 贡献：把\"视频基础模型的强运动/交互先验\"转成确定性手部特征；首次在前馈手追踪中联合输出接触与力；即插即用于机器人策略。\n- 局限：依赖预训练视频 backbone 规模；触觉精度受标注数据量限制；跨域（非手部交互）通用性待验证。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"手势/手追踪\"方向互补，新增\"物理接地（接触+力）\"维度，对 VR/AR 手交互与触觉反馈有直接价值。"},{"h":"适用 XR 场景","body":"- VR/AR 手势与手部交互、机器人遥操作、触觉反馈生成、具身智能体训练。"}]},{"file":"../papers/notes/2610.09821__efficient-head-avatar-edge.md","id":"2610.09821","title":"Efficient 3D Gaussian Head Avatars for Edge Devices","title_zh":"面向边缘设备的高效 3D 高斯头部化身","track":"化身与人体","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.73,"evidence":"FULL","tags":["高斯头像","边缘部署","轻量生成器","FLAME先验","移动端"],"flags":[],"sections":[{"h":"一句话总结","body":"一个高效生成器架构，把 3D 高斯头部化身的合成计算降 94% FLOPs、70% 参数、81% 模型大小，使完整合成可在 CPU/移动端浏览器完成，无需 GPU。"},{"h":"问题背景","body":"- 生成式 3D 高斯头部化身渲染质量高、效率高，但\"合成高斯表示\"本身计算昂贵，难部署到资源受限/边缘设备。"},{"h":"方法","body":"- **高效生成器**：参数高效合成块 + 深度可分离卷积。\n- **FLAME 几何先验**：高斯采样于 FLAME 网格表面，零卷积预测偏移 → 软几何正则，鼓励跨视角/位姿一致头几何。\n- **高斯属性图（UV map）**：StyleGAN2 backbone 以潜在码 z + 相机位姿 p 生成；C=13（最终）/ C=22（含一度球谐视相关）。\n- **部署**：ONNX 导出 + 移动端 CPU 推理；动画由 SVD 基 + onnx runtime + FLAME 数据驱动。"},{"h":"实验与结果（关键数字）","body":"- 训练/评估：FFHQ（70k 人脸，MODNet 去背景）。\n- 指标：FID、FLOPs、推理延迟、文件大小、FID_3D、PSNR_MV/SSIM_MV。\n- 对比 AGORA：参数量 −70%、FLOPs −94%、模型大小 −81%；512² FID 4.15 vs AGORA 3.17（质量略降但可接受）。\n- 完整合成在 CPU/移动端浏览器（无 GPU/专用软件）；转移大小 75.59 MiB / 24 文件，缓存后重启快。"},{"h":"贡献与局限","body":"- 贡献：首次把\"生成新 3D 高斯头部化身\"做到边缘端完整合成；FLAME 软几何正则保一致性。\n- 局限：质量略低于重 backbone（FID 4.15 vs 3.17）；依赖 FFHQ 类前脸数据，大姿态/遮挡泛化待验。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"高斯头部化身\"方向（Heartian 2609.28539、高效化身类）互补：本工作聚焦\"边缘部署的合成效率\"，是 XR 社交头像落地的关键一环。"},{"h":"适用 XR 场景","body":"- 边缘/移动端头部化身、轻量 VR 社交头像、实时avatar生成。"}]},{"file":"../papers/notes/2610.09853__deltasplat.md","id":"2610.09853","title":"DeltaSplat: Iterative Gaussian Refinement for Pose-Free Feed-Forward 3D Gaussian Splatting","title_zh":"DeltaSplat：免位姿前馈 3DGS 的迭代高斯精炼","track":"重建与SLAM","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["3DGS","免位姿","前馈","残差精炼","即插即用"],"flags":[],"sections":[{"h":"一句话总结","body":"给\"免位姿前馈 3DGS\"加一个轻量迭代精炼模块：把图像空间渲染残差通过几何引导（Plücker 射线 + 渲染深度）提升为 3D 更新，仅 ~2.2% 额外参数即显著提升质量。"},{"h":"问题背景","body":"- 免位姿前馈 3DGS 从稀疏无位姿图像单 pass 预测全局场景与相机；相机估计误差会传播进预测高斯，叠加几何/光度误差。\n- 单 pass 预测与上相机误差共同导致质量瓶颈。"},{"h":"方法","body":"- **迭代高斯精炼**：以 backbone 前馈输出 G^(0) 初始化，逐步渲染上下文视图得到残差 r_i^(k)，精炼模块 h_φ 渐进改进高斯集。\n- **几何引导残差编码**：将 2D 残差条件于每像素 Plücker 射线与渲染深度，把 2D 证据提升为 3D 更新。\n- **Delta Decoder**：双分支 mixer + 逐属性头，更新位置 μ、不透明度 α、颜色 c。\n- 全前馈推理路径，仅约 2.2% 额外参数。"},{"h":"实验与结果（关键数字）","body":"- 训练 DL3DV-10K，测试 140 场景，224²，6/12/24 上下文视图。\n- 6 视图已知内参 PSNR 26.64 dB，比 YoNoSplat（同协议）高 +1.75 dB，且超过所有\"给真值相机\"的基线（26.64 vs 最好 24.72 dB）——精炼收益大于 backbone 获得精确相机的收益。\n- 全无校准（内参也预测）：6 视图 25.69 dB，仍高于所有给真值相机基线；随视图增多优势扩大（+1.16→+1.49 dB）。\n- ScanNet++ 跨数据集泛化（32/64/128 视图）有效。"},{"h":"贡献与局限","body":"- 贡献：即插即用的质量精炼阶段，对任意免位姿前馈 backbone 通用；几何引导残差避免 2D 残差直接回灌的歧义。\n- 局限：尚未扩展到更高分辨率与其他前馈 backbone（文末指明为下一步）。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。**同质关注**：与库内 AESplat / GrapeSplat（均属\"免位姿前馈 3DGS\"）标题 Jaccard 0.40–0.43（<0.62，非同质重复），属同赛道方法收敛，建议关注是否归一，非取代关系。"},{"h":"适用 XR 场景","body":"- 免标定/在线 3DGS 重建、XR 场景扫描、机器人感知。"}]},{"file":"../papers/notes/2610.10538__ledger-never-look-back.md","id":"2610.10538","title":"Never Look Back: Understanding Persistence in 3D Object Memory from Egocentric Videos","title_zh":"第一视角视频的 3D 物体记忆持久性（Ledger）","track":"感知与认知","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["具身记忆","第一视角","3D物体记忆","空间问答","认知辅助"],"flags":[],"sections":[{"h":"一句话总结","body":"提出 Ledger——一种持久 3D 物体记忆（几何 + 上下文描述 + 事件记录），从第一视角视频离线构建，使具身助手能回答\"当下无法预见、未来才可能用到\"的空间问题，且精度不随记录时长下降。"},{"h":"问题背景","body":"- 人在日常活动中会遇到\"稍后才相关\"的物体（如\"之前把东西放哪了\"\"容器里是什么\"），具身助手需从第一视角视频构建类似记忆。\n- 关键问题：为回答未来不可预见的空间问题，应保留哪些证据？区分\"表示失败\"与\"检索/推理失败\"。"},{"h":"方法","body":"- **Ledger（Long-horizon Egocentric Descriptions, Geometry, and Event Records）**：结合几何观测与上下文描述的持久 3D 物体记忆。\n- **离线构建**：从采样的第一视角记录构建（用提供或估计的相机位姿）；开放词汇目标检测；关联与整合；持久化 + 上下文描述；多视图精炼。\n- **查询时推理**：回答空间问题——物体位置、内容、运动历史、路径与场所、场景变化。\n- 与 ConceptGraphs / 3D-Mem / ReMEmbR / EgoRAG / VL-KnG 等对比，Ledger 在\"处理/未处理物体、运动历史、路径场所、RGB、场景变化\"等维度全 ✓。"},{"h":"实验与结果（关键数字）","body":"- 基准：HD-EPIC、UCS-Bench（206 段记录，3264 问题）、VQ3D（164 查询）。\n- UCS-Bench 准确率：Ledger single-shot 39.0% / agent 42.1%；对比 ReMEmbR 41.4%、DirectMe 41.4%、48-frame reader 33.1%、blind 30.1%。\n- VQ3D（1m 内定位占比）：Ledger 47.6% / agent 49.4%；基线显著更低。\n- **关键发现**：结构化记忆精度不随记录长度下降；而 48-frame reader 每翻倍长度精度下降（EPIC-Kitchens 内 p=0.05）。失败分析：最大损失在 answerer 读记录之前（表示/检索阶段）——给 GT 轨迹 +12 分、命名所依 fixtures +25 分，固定规则仅 +3 分。"},{"h":"贡献与局限","body":"- 贡献：系统界定\"物体记忆该保留什么\"；提出全维度覆盖的 Ledger；用长度扫描实验证明结构化记忆优于帧读取。\n- 局限：构建依赖检测/位姿质量；跨天持久性有限（R4DSG 类似）；失败多在检索/表示而非推理。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"第一视角/空间记忆/认知\"方向（如 EgoLAP、4D 人-景重建）互补，是 AR 认知辅助的核心供给。"},{"h":"适用 XR 场景","body":"- 具身 XR 助手、第一视角空间问答、AR 认知辅助、日常活动记忆。"}]},{"file":"../papers/notes/2610.10539__tetris3d.md","id":"2610.10539","title":"Tetris3D: 3D Scene Generation With Objects That Fit Together","title_zh":"Tetris3D：物体严丝合缝的 3D 场景生成","track":"内容生成","date":"2026-10-08","batch":"2026-10-09","batchLabel":"2026-10-09","grade":"A","value":3.85,"evidence":"FULL","tags":["3D场景生成","物体中心","物理一致","遮挡补全","仿真数据集"],"flags":[],"sections":[{"h":"一句话总结","body":"一个物体中心 3D 场景生成框架：显式把每个物体的生成条件于\"邻近几何 + 物理关系\"，并用 VLM 推断依赖顺序自回归生成，产出几何与物理都严丝合缝的场景。"},{"h":"问题背景","body":"- 单图 3D 场景生成常独立生成物体或隐式耦合，缺乏对相邻物体细粒度空间兼容的引导 → 穿透、不稳定等物理无效配置。"},{"h":"方法","body":"- **Pose-Aligned 物体生成**：从深度图定义物体网格，沿相机射线把图像特征反投影进网格，直接在场景空间（输入相机坐标系）生成位姿对齐的形状（免去单独位姿估计/后对齐）。\n- **Object Interaction-Aware**：空间上下文（邻物几何排布，避免穿透）+ 关系类型（目标与邻物物理关系）双重条件。\n- **V2I（Visible-to-Invisible）交叉注意力**：用可见令牌聚合信息补全被遮挡区域。\n- **ComOb**：基于仿真的大规模场景数据集，含物理稳定配置与交互标注。\n- **推理**：VLM 推断物理依赖顺序，按依赖自回归生成（先生成所依赖的邻物）。"},{"h":"实验与结果（关键数字）","body":"- 训练物体源与 Toys4K 不交叠；用 ComOb 组合评估场景（均给真值深度）。\n- 真实/接触丰富场景：Picasso、MessyKitchens（用 MoGe3 估计深度 + VLM 推断关系）。\n- 三视角评估：场景级质量（CD-S/F1-S/IoU-B）、物体级质量、物理稳定性（穿透深度 PD、峰值动能 E_peak，在物理引擎中仿真是否掉落/漂移）。\n- 对比 SAM-3D / ShapeR / WorldSculpt / SceneMaker / SceneGen / MIDI / Amodal3R+FoundationPose：在重建质量与物理一致性上改善。"},{"h":"贡献与局限","body":"- 贡献：把\"物理/几何兼容\"显式做成生成条件；提出 ComOb 仿真数据集与 V2I 遮挡补全；自回归依赖顺序生成。\n- 局限：依赖深度估计与 VLM 关系推断质量；复杂多物体长程依赖仍挑战。"},{"h":"与文献库关系","body":"- **状态：CURRENT**。与库内\"3D 场景/内容生成\"方向互补，新增物理一致性约束。"},{"h":"适用 XR 场景","body":"- XR 内容生成、虚拟场景布局、AR 物体放置与碰撞感知。"}]},{"file":"../papers/notes/2610.10811__masking-judder-foveated.md","id":"2610.10811","title":"Masking Judder in Foveated Rendering with Phase-Shifted Noise","title_zh":"Masking Judder：用相位偏移噪声掩盖注视点渲染中的抖动（judder）","track":"渲染与显示","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.78,"evidence":"FULL","tags":["注视点渲染","judder","foveated","渲染与显示","感知"],"flags":[],"sections":[{"h":"一句话结论","body":"提出用相位偏移噪声掩盖注视点渲染中因低帧率产生的 judder（时域混叠），在不增加高频内容损失的前提下让用户容忍更高相机角速度。"},{"h":"要解决的问题","body":"注视点渲染在 periphery 降低时空分辨率以省算力，但低帧率导致 judder（时域混叠）降低感知质量；时域滤波/模糊可抑制但增加算力且损失细节。"},{"h":"方法详解","body":"从频域建模 judder（时域混叠）：judder 表现为时域频率域的混叠；用相位偏移的噪声占据混叠频带，掩盖 alias 而非消除——在 judder 可察觉的速度处，混叠副本位于远低于注视点截止的空间频率，故去高频既不能隐藏 alias 也不能移除其低频能量，须用平滑移动的噪声能量占据该频带。"},{"h":"实验与结果","body":"用户研究（12 名学生，eccentricity 28/35/42°，Forest/City 两地图，5 条件：无 foveation / 两档 foveation / 同两档自适应噪声）。配对 t 检验 + Holm 校正。结果：自适应噪声在高 foveation 下将可容忍角速度提升 1.96×（相对全分辨率）、1.62–1.66× 相对模糊；低 foveation 下噪声吸引力评分与模糊无差异（p=0.83），高 foveation 下 +0.67（p=0.004）表明噪声开始可分辨并分散注意力。"},{"h":"创新点与贡献","body":"首次从频域给出 judder 的 masking 方案；用 StelaCSF 量化噪声可见性随刷新率变化。"},{"h":"局限与风险","body":"样本量 12 人偏小；高 foveation 下噪声可被察觉（distraction +0.67）。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"直接补强库内'渲染与显示'赛道（注视点渲染/省算力），与 10-08 Foveated Compression 互补（彼为 VLM 应用、此为渲染质量机制）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；实验用 60Hz 显示器（更常见的显示类型验证）。"},{"h":"行动建议","body":"XR 头显注视点渲染省算力的实用技术，值得纳入渲染管线评估与硬件实现。"}]},{"file":"../papers/notes/2610.10945__gharp-head-animation.md","id":"2610.10945","title":"GHARP: Real-time Gaussian Head Animation from Large-scale Reconstruction Prior","title_zh":"GHARP：基于大规模重建先验的实时高斯头部动画","track":"化身与人体","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.7,"evidence":"FULL","tags":["头部化身","高斯","实时","avatar","化身与人体"],"flags":[],"sections":[{"h":"一句话结论","body":"GHARP 在学习的规范高斯表示上实时动画 3D 头部化身，用 8× 更少高斯、数量级更低推理成本达到 SOTA 质量；BAN 提升时序稳定性。"},{"h":"要解决的问题","body":"实时头部化身需兼顾保真度/质量/速度；多视角输入下动画成本随视角数增长，难以即开即用。"},{"h":"方法详解","body":"解耦为身份阶段（离线建规范高斯表示，固定规模高斯捕捉几何与外观）+ 动画阶段（运行时在规范表示上预测表情残差）。Body Alignment Network（BAN）在训练中解决身体外观不一致，提升动画时序稳定。"},{"h":"实验与结果","body":"Ava-256 / Internal10K；AKD/CSIM 最优；仅 65K 高斯（vs Avat3r 182K–730K、FastGHA 150K–602K）；推理 1.92ms、iPhone 17 Pro 上 1.45ms；BAN 使 body 时序 σ 低一个数量级；跨身份重定目标 AED 5.35（优于基线）。"},{"h":"创新点与贡献","body":"规范表示解耦使动画成本与视角数无关；BAN 身体稳定；8× 更少高斯 + 数量级更低推理成本。"},{"h":"局限与风险","body":"依赖标定相机位姿（估计不准会传播）；未做时序噪声鲁棒/材质分解；仅限头部。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'化身与人体/实时高斯头部化身'方向（与 10-09 边缘头部化身、Fresco++ 互补）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；Ava-256/Internal10K 数据集。"},{"h":"行动建议","body":"移动端实时头像的强候选；关注其与 Fresco++ 的优化范式差异。"}]},{"file":"../papers/notes/2610.11011__pcasplat.md","id":"2610.11011","title":"PCAsplat: Gaussian Splatting with Local PCA Regularization","title_zh":"PCAsplat：基于局部 PCA 正则化的 3D 高斯泼溅（抑制游离高斯）","track":"神经渲染","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.77,"evidence":"FULL","tags":["3DGS","floaters","正则化","神经渲染","重建"],"flags":[],"sections":[{"h":"一句话结论","body":"提出 PCAsplat，用局部 PCA 正则化约束 3D 高斯的方向/尺度，抑制被遮挡/少贡献高斯漂移产生的游离（floater）伪影。"},{"h":"要解决的问题","body":"现有 3DGS 主要用光栅化损失监督，仅当 splat 贡献于采样射线时才被监督；被遮挡/少贡献高斯获得弱或零几何梯度，漂离表面产生 floaters。"},{"h":"方法详解","body":"几何感知的局部 PCA 正则化框架：约束每个高斯的形状（方向/尺度）贴合其局部表面结构，使不在采样射线上的高斯基也能获得几何约束而不漂离。"},{"h":"实验与结果","body":"NeRF Synthetic / ScanNet++ / DTU；对比多种 SOTA（用各自 GitHub 最新超参复现，保证可复现性一致口径）；VGGT-Ω 用深度反投影+相似变换对齐坐标系。结果 Tab.1/Tab.3 报告几何与渲染指标。"},{"h":"创新点与贡献","body":"针对性解决 3DGS floaters 的几何正则，不改表示、易插入现有 pipeline。"},{"h":"局限与风险","body":"正则化强度需调；对极度稀疏视角可能不足；消融细节依赖复现。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'神经渲染/3DGS'赛道（与 TileSkipper/PePESeg3D/ManifoldSplat 等 3DGS 质量方向互补）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；多数据集公开。"},{"h":"行动建议","body":"3DGS 重建质量提升的实用组件；关注其与库内'逐高斯压缩/结构化表示'路线的关系。"}]},{"file":"../papers/notes/2610.11070__facegan-talking-head.md","id":"2610.11070","title":"No Distillation Needed: Single-Pass Real-Time Talking Heads via Acausal Noise Shaping","title_zh":"No Distillation Needed：单遍实时说话头（免蒸馏、因果噪声整形）","track":"化身与人体","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.78,"evidence":"FULL","tags":["说话头","telepresence","GAN","实时","化身与人体","Meta"],"flags":[],"sections":[{"h":"一句话结论","body":"提出 FaceGAN，用单遍 GAN + 因果噪声整形实现实时音频驱动说话头，25Hz、40ms 音频前瞻，质量匹配/超越扩散模型且无需蒸馏。"},{"h":"要解决的问题","body":"音频驱动面部动画需在线流式运行（每帧由截至当前的音频生成）；扩散模型需多次网络评估不适合流式；单遍 GAN 受限于'随机结构'——因果时不变生成器无法在不坍塌逐帧创新的情况下抑制某频段谱。"},{"h":"方法详解","body":"解耦身份与动画；证明障碍在噪声通路而非容量。FaceGAN 通过'因果噪声整形'（acausal noise shaping）化解：驱动噪声是合成的，其未来可现在采样，故音频-表情路径保持因果，模型支持完全因果运行。单前向 pass 每帧输出表情+头部姿态，有界注意力窗口，可无限生成不漂移。"},{"h":"实验与结果","body":"对比 MemoryTalker / DiffPoseTalk / 扩散模型（Table 7 等）；25Hz、40ms 前瞻；质量 match/outperform SOTA；实时基准显示单遍前向延迟低、支持无限长生成不漂移。"},{"h":"创新点与贡献","body":"论证该领域单遍 GAN 已足够，推翻扩散主导假设；acausal noise shaping 化解频谱限制而不牺牲因果性。"},{"h":"局限与风险","body":"来自 Meta Reality Labs，闭源可能性高；'低维流形'假设可能不适用于极端表情/身份。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'化身与人体/实时说话头'方向（与 GaussianAvatars 等互补，属'流式低延迟'路线）。"},{"h":"可复现性（代码/数据/硬件）","body":"Meta Reality Labs；代码未公开（v1）；方法基于 StyleGAN-T 等现代 GAN 基线。"},{"h":"行动建议","body":"实时数字人/telepresence 的关键实用路线；持续跟踪其是否开源与移动端部署。"}]},{"file":"../papers/notes/2610.11181__mate4d.md","id":"2610.11181","title":"MATE4D: Matrix-Guided Editable 4D Generation from a Single Image","title_zh":"MATE4D：从单张图像生成可编辑的 4D 内容（矩阵引导）","track":"内容生成","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.7,"evidence":"FULL","tags":["4D生成","单图","可编辑","内容生成","视频扩散"],"flags":[],"sections":[{"h":"一句话结论","body":"MATE4D 从单张图像生成可编辑的动态 4D 内容，用'图像矩阵模块(IMM)'+'背景编辑(BEM)'+'动态信息输入(DII)'，在 Objaverse-XL / Diffusion4D 上 FVD 大幅领先。"},{"h":"要解决的问题","body":"单图→4D 因单视角结构线索有限、运动证据弱，难以生成时序稳定且真实的可编辑 4D。"},{"h":"方法详解","body":"构建时空多视角图像矩阵（文本引导背景操纵）提供视角/外观/运动一致监督；IMM 保证多视角一致；BEM 文本引导背景/光照编辑；DII 注入动态信息。"},{"h":"实验与结果","body":"Objaverse-XL（千万级 3D 物体渲染多视角序列）、Diffusion4D；FVD-F/FVD-Diag/FVD4D 全面领先（MATE4D 273.9/457.3/397.3 vs 次优 Gaussian-Flow 370.5/555.6/618.8）。消融：全模型 CLIP-I 0.962/PSNR 38.76/FVD4D 175.8；去 IMM FVD4D 升至 421.6 证明 IMM 不可或缺；加 DII 后 FVD4D 降至 213.7。"},{"h":"创新点与贡献","body":"单图可编辑 4D 生成；用图像矩阵提供一致监督是核心。"},{"h":"局限与风险","body":"依赖多视角图像矩阵的合成质量；复杂/快速运动泛化待验；编辑一致性依赖文本引导。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'内容生成/4D 生成'方向（与 4DGS-JEPA/ VISTA-GS 互补，属'单图→4D'路线）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；Objaverse-XL/Diffusion4D 公开。"},{"h":"行动建议","body":"单图 4D 内容创作的实用框架；关注其 4D 一致性指标与库内 4DGS 路线的对比。"}]},{"file":"../papers/notes/2610.11412__fresco-head-avatar.md","id":"2610.11412","title":"Fresco++: Frequency-Guided and Canonical-Consistent Optimization for Fine-Grained Head Avatar Modeling","title_zh":"Fresco++：频率引导+规范一致优化的精细头部化身建模","track":"化身与人体","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.7,"evidence":"FULL","tags":["头部化身","优化","频率课程","规范共识","化身与人体"],"flags":[],"sections":[{"h":"一句话结论","body":"Fresco++ 是精细且视角一致的头部化身统一优化框架，用'空间局部频率课程'+'规范组共识(CGC)'稳定优化、跨视图一致，可迁移到 GaussianAvatars/TensorGA。"},{"h":"要解决的问题","body":"头部化身高度耦合优化易陷不稳定局部解：高频细节在可靠粗结构形成前被拟合，局部外观/结构跨视图漂移。"},{"h":"方法详解","body":"不重设计表示，从两方面规范优化：空间局部频率课程（粗→细，先稳定低频再细化高频）+ CGC（在规范域建立对应、多视图共识形成可靠跨视图监督）。主实现用混合 mesh–Gaussian（FLAME 面部 + 3DGS 头发/周边）。"},{"h":"实验与结果","body":"新视角合成 + reenactment 对比；受控消融（频率课程顺序、CGC vs UV-space 一致性）；表示可迁移性研究（GaussianAvatars/TensorGA，额外训练成本但推理效率不变）；四个互补视角评估。"},{"h":"创新点与贡献","body":"频率课程 + 规范组共识的通用优化范式；可迁移到不同高斯化身表示。"},{"h":"局限与风险","body":"仍需底层表示训练；额外训练成本（迁移时）；未覆盖极端姿态/光照。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"与 GHARP、库内头部化身方向互补（优化范式层面，与 10-09 边缘头像、GHARP 形成'表示/优化/实时'三角）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；对比 GaussianAvatars/TensorGA 等。"},{"h":"行动建议","body":"头部化身训练稳定性的通用改进；关注其迁移到库内现有化身表示的收益。"}]},{"file":"../papers/notes/2610.11815__fast-pose-tracking.md","id":"2610.11815","title":"Fast Pose Tracking of Rigid Objects with Compact Pose Graph Optimization","title_zh":"Fast Pose Tracking：紧凑位姿图优化的刚体快速 6D 位姿跟踪","track":"重建与SLAM","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.78,"evidence":"FULL","tags":["6D位姿","姿态跟踪","SLAM","AR","机器人"],"flags":[],"sections":[{"h":"一句话结论","body":"提出轻量跟踪模块，叠在多种对应估计方法之上，用紧凑位姿图优化（不确定性感知 PGO）保持 6D 位姿跟踪低漂移、快速度，适用于机器人操作与 AR。"},{"h":"要解决的问题","body":"长时程 6D 位姿跟踪需昂贵 onboarding 或全程维护重建，对机器人操作/AR 不实用；需要即开即用、实时。"},{"h":"方法详解","body":"避免点基优化，改用紧凑位姿图；关键思想是不在点云里逐点优化，而是用不确定性感知 PGO——在几何歧义（无纹理/薄物体）情况下建模不确定性提升鲁棒性。"},{"h":"实验与结果","body":"HOI4D 刚体物体 5 类；AUC@10° 旋转精度领先 3/5 非 CAD 类、平均 46.5 vs BundleTrack 44.2 / BundleSDF 43.5 / UNOPose 40.8 / FoundationPose(CAD) 32.2；定性显示不确定建模改善纹理少/薄物体鲁棒性。"},{"h":"创新点与贡献","body":"与上游对应估计方法解耦的即插即用跟踪；不确定性感知 PGO 在歧义场景下防漂移。"},{"h":"局限与风险","body":"仅刚体；依赖上游对应估计质量；长时程/非刚体未覆盖。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'重建与SLAM/姿态跟踪'赛道（与 VGGSfM/VGGT/FoundationPose 类互补）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；未明示代码；HOI4D 公开数据集。"},{"h":"行动建议","body":"AR 物体跟踪/机器人操作的实用组件；关注其对接主流对应估计器的泛化。"}]},{"file":"../papers/notes/2610.12299__me-world-multiagent.md","id":"2610.12299","title":"Multi-Agent Egocentric World Model with Fine-Grained Embodied Interaction","title_zh":"Multi-Agent Egocentric World Model：细粒度具身交互的多智能体第一视角世界模型","track":"世界模型与仿真","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.7,"evidence":"FULL","tags":["世界模型","多智能体","具身","第一视角","仿真"],"flags":[],"sections":[{"h":"一句话结论","body":"ME-World 将多智能体第一视角世界模型建模为共享世界中多 agent 经细粒度动作交互的同步 ego-stream 生成，联合去噪多流、共享环境记忆，提升共享世界一致性/动作控制/视频质量。"},{"h":"要解决的问题","body":"现有第一视角世界模型多为单 agent；多 agent 世界模型只用粗粒度动作（移动/相机/离散指令），细粒度具身交互未充分探索；需跨视图动作一致性、共享环境一致性、交互引发状态更新的传播。"},{"h":"方法详解","body":"在共享 token 序列联合去噪多 ego 流；每流条件于所有 agent 的目标视角位姿；共享环境记忆（SEM）grounding 生成。基于 Cosmos-Predict2.5 2B 微调 DiT（冻结 VAE/文本编码器，rectified-flow，A100×4 训练，35 步推理、CFG 7.0）。"},{"h":"实验与结果","body":"真实+合成多 agent 数据；提出共享世界一致性指标（环境/更新/身份一致性）；对比多视图视频生成（GEN3C/AnyView-DVS）、单 ego 世界模型（EgoSim/JointControlVideo）、通用世界模型（DreamX-World/LingBot-World）及多 agent 基线（MultiWorld/Solaris/γ-World/MetaWorld）。ME-World 全部指标最优；消融：SEM + Joint Gen + Shared Action 逐步提升（Senv 0.456）。"},{"h":"创新点与贡献","body":"细粒度具身交互的多 agent 第一视角世界模型；共享环境记忆；新一致性指标。"},{"h":"局限与风险","body":"基于扩散 Transformer，算力重；真实数据规模有限；交互种类受数据集约束。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'世界模型与仿真'方向（与 World SLAM Model/Dexterous Tactile World Model 互补，属'多 agent 共享世界'拓展）。"},{"h":"可复现性（代码/数据/硬件）","body":"项目页 cvlab-kaist.github.io/ME-World；KAIST；Cosmos-Predict2.5 开源 backbone。"},{"h":"行动建议","body":"具身多智能体仿真/社交 XR 的关键方向；关注其共享世界一致性指标是否成为基准。"}]},{"file":"../papers/notes/2610.12442__lego-exo2ego.md","id":"2610.12442","title":"LEGO: A Lifting-Free Approach for Exocentric-to-Egocentric Video Generation","title_zh":"LEGO：免提升的外中心→内中心视频生成（新视角合成）","track":"感知与认知","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.7,"evidence":"FULL","tags":["新视角合成","自我中心","视频扩散","lifting-free","感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"LEGO 提出 lifting-free 的外中心→内中心视频生成：用学习的视图合成器（LVSM 式 transformer，无需深度/点云/重投影）直接渲染内中心视图作为视频扩散模型的条件，避免深度误差导致的内容错位。"},{"h":"要解决的问题","body":"从单张外中心视频生成内中心视频是难的新视角合成（两相机重叠少、目标视图多未观测）；SOTA 显式重建（深度→点云→重投影渲染）的确定性映射把每个像素指派到单一重投影位置，保留纹理但把深度误差转成错位内容（手/近物最明显）。"},{"h":"方法详解","body":"论证条件应'先对齐再清晰'——生成器更易恢复细节而非纠正错位内容；用学习的视图合成器渲染内中心视图（LVSM 式，内部解决跨视图对应），其概率映射按学习到的对应分布对候选源位置取平均，保留结构、细纹理被平均掉；置信门控 + ARC（无需重训练的引导）。"},{"h":"实验与结果","body":"Ego-Exo4D（按 EgoX 协议）seen/unseen 两 split；优于 EgoX 所有图像指标与 FVD（seen：PSNR 15.52 vs 13.74、LPIPS 0.545 vs 0.573、FVD 332.41 vs 421.83；unseen 类似）。消融：条件输入（合成器渲染 > 点云渲染 > 空）、门控、引导逐项贡献；无 GT 的 in-the-wild 视频上差距更大。"},{"h":"创新点与贡献","body":"lifting-free conditioning 范式；置信门控 + 训练免费引导；冻结合成器可零重训练迁移到新场景/录制。"},{"h":"局限与风险","body":"细纹理被平均掉（概率映射的代价）；依赖 LVSM 合成器质量；未覆盖极端相机轨迹。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'感知与认知/新视角合成/自我中心'方向（与 EgoLAP/库内 ego 视频生成互补）。"},{"h":"可复现性（代码/数据/硬件）","body":"代码+HF 已发布（github.com/suhwan-cho/lego）；GenGenAI；Ego-Exo4D 公开。"},{"h":"行动建议","body":"第一视角视频生成/AR 巡检的实用方法（已开源）；优先纳入 ego→exo 工具链评估。"}]},{"file":"../papers/notes/2610.12461__ouroworld-3d-cinemagraph.md","id":"2610.12461","title":"OuroWorld: Bringing Any 3D World Alive as Diverse, Endlessly Looping 3D Cinemagraphs","title_zh":"OuroWorld：将任意 3D 高斯场景变为多样、无缝循环的动态 3D 电影图","track":"内容生成","date":"2026-10-09","batch":"2026-10-10","batchLabel":"2026-10-10","grade":"A","value":3.9,"evidence":"FULL","tags":["3DGS","4DGS","cinemagraph","内容生成","世界模型"],"flags":[],"sections":[{"h":"一句话结论","body":"OuroWorld 将任意静态 3D 高斯场景自动转化为多视角无缝循环、含多样运动的 3D 电影图（cinemagraph），无需遮罩。"},{"h":"要解决的问题","body":"现有 3D 世界模型生成的场景是'冻结在时间中'的静态可探索场景，缺乏让场景生动循环运动的能力；多数方法需遮罩或只能产生短暂/不连贯循环。"},{"h":"方法详解","body":"mask-free 框架：VLM 推断合理动力学并引导视频模型合成参考视频 → 提升到多视角视频 → 提出 Inconsistency-Robust Periodic 4DGS（傅里叶级数表示周期运动）学习；引入 scene-view consistent optimization（SVCO）与 VLM 过滤缓解不完美监督带来的不一致；提出 ground-truth-free 的 Vividness 指标（Motion/Illumination/Visual Variation）。"},{"h":"实验与结果","body":"39 个评估场景（Mip-NeRF 360 / HY-World 2.0 / Marble / Lyra 2.0）。Vividness 全面超越 Gaussians-to-Life / 3D Cinemagraphy / LoopGaussian / 3D-MOM——Illumination Variation 0.0518 vs 各基线 ≤0.0248、Motion Variation 0.0413 vs 0.0588（Gaussians-to-Life 仅循环 0.5s 故 MV 高但 MALF 低）。消融：去除 grounding 主要降低 Motion Variation（0.0413→0.0324）；去除 SVCO 一致性/清晰度最差。含用户研究。"},{"h":"创新点与贡献","body":"首个 mask-free 的 3D cinemagraph 框架；周期性 4DGS 表示；无真值生动度指标。"},{"h":"局限与风险","body":"受视频生成先验约束，不合理生成会传播到最终场景（VLM 过滤缓解）；单参考视频在宽视角范围产生更大遮挡与不一致；生成多参考视频是改进方向。"},{"h":"与文献库的关系（新增 / 改进 / 取代 X）","body":"补强库内'内容生成/世界模型'方向（与 VISTA-GS/Fusion-Aware 等 3DGS 生成互补，属'静态→动态'拓展）。"},{"h":"可复现性（代码/数据/硬件）","body":"arXiv v1；项目页未明示代码；评估用 39 场景数据集（部分来自生成式世界模型库）。"},{"h":"行动建议","body":"关注其与库内 3DGS 生成路线的范式关系；若开源则纳入动态场景生成基准。"}]},{"file":"../papers/notes/2610.13309__NovaSplat免模型6D位姿估计.md","id":"2610.13309","title":"NovaSplat: Model-Free 6D Object Pose Estimation via 3D Gaussian Splatting Onboarding and Refinement","title_zh":"NovaSplat：免模型 6D 物体位姿估计（3DGS 引导+精化）","track":"感知与认知","date":"2026-10-12","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.65,"evidence":"FULL","tags":["6D 位姿","免 CAD","3DGS","onboarding","物体追踪"],"flags":[],"sections":[{"h":"一句话结论","body":"免 CAD 模型的 6D 物体位姿估计：onboarding 阶段用一段智能手机视频训练出高质量 3DGS 物体模板，推理阶段以该模板同时充当位姿假设源与精化目标，把免模型方法的精度差距补齐到模型-based 方法的可用区间。"},{"h":"要解决的问题","body":"无 CAD 模型的 6D 位姿估计必须现场从零构建物体表示，长期落后于模型-based 方法；核心难点是 onboarding 表示的质量直接决定后续位姿假设的质量，而智能手机视频的视角覆盖与质量都有限。"},{"h":"方法详解","body":"两阶段流水线：① onboarding——从短视频重建 3DGS 物体模板（SSIM+MS-SSIM 光度损失，因小物体渲染分辨率限制采用 3 尺度而非标准 5 尺度 MS-SSIM）；② inference——以 3DGS 模板做位姿估计与迭代精化。附完整运行时分析（分阶段耗时拆解、内存画像）与 onboarding 预算/视角密度/SfM 位姿等系统消融。"},{"h":"实验与结果","body":"在标准免模型基准上相对既有免模型方法取得显著提升并逼近模型-based 精度区间；分阶段运行时分析定位粗位姿估计为耗时瓶颈并给出优化；onboarding 视角密度与重建预算的影响被量化。"},{"h":"创新点与贡献","body":"① 把 3DGS 从「渲染表示」复用为「位姿任务的几何-外观联合模板」，一套表示服务假设生成与精化两职；② 免模型 onboarding 的系统性消融（视角密度/预算/SfM）为该子领域提供了少有的工程地图。"},{"h":"局限与风险","body":"① onboarding 需要短视频拍摄，时延与失败恢复未充分讨论；② 强遮挡/无纹理物体的鲁棒性未验证；③ 与需要 CAD 的方法在同基准的最终差距未完全消除。"},{"h":"与文献库的关系","body":"与库内免训练目标感知精化（3D 高斯语言地图检索，10-17）共享「3DGS 模板服务识别任务」思路；与 NovaSplat 同类的物体级理解为 AR 交互提供感知底座。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-12，10-12 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，88704 字符）；加权 3.65 → A 级。"}]},{"file":"../papers/notes/2610.13498__H2-Ray混合层级光线追踪3DGS渲染.md","id":"2610.13498","title":"A Hybrid and Hierarchical Ray Tracing Method for Efficient 3D Gaussian Rendering","title_zh":"混合层级光线追踪：高效 3D 高斯渲染","track":"渲染与显示","date":"2026-10-12","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.65,"evidence":"FULL","tags":["3DGS","光线追踪","渲染系统","BVH","GPU"],"flags":[],"sections":[{"h":"一句话结论","body":"面向 3D 高斯渲染的混合层级光线追踪架构 H²-Ray：负载均衡空间 BVH（LB-SBVH）把全局倾斜的高斯分布转为均衡遍历区，射线簇路径复用（RCPR）共享邻射线的遍历，在 RTX A5000 上较 RaySplats 取得几何平均 3.77×（最高 9.26×）加速，PSNR 仅降 0.034 dB。"},{"h":"要解决的问题","body":"3DGS 依赖光栅化求速度，但光栅化难以支持二次光照、大形变相机与景深等效果；光线追踪 3DGS 则面临高斯空间分布极不均匀、邻射线遍历冗余、硬件 RT Core 适配三大挑战。"},{"h":"方法详解","body":"① LB-SBVH：密度感知的空间划分，把倾斜分布转为均衡遍历区域；② RCPR：邻射线簇共享 BVH 遍历，消除冗余访存；③ 修改版 RT Core 的 cycle-accurate 建模，把微架构行为纳入设计闭环。"},{"h":"实验与结果","body":"8 个代表场景（Mip-NeRF 360 + Deep Blending）几何平均加速 3.77×、最大 9.26×（vs RaySplats，RTX A5000）；多视图匹配评测下 PSNR 平均仅降 0.034 dB。"},{"h":"创新点与贡献","body":"① 首个针对 3DGS 非均匀分布专门设计的负载均衡 BVH；② 「微架构建模+算法协同设计」的方法论对后续神经渲染系统工作有示范意义。"},{"h":"局限与风险","body":"① 收益依赖特定 GPU 架构（RT Core 行为），跨代际硬件的可移植性未验；② 二次光照的实际画质收益未在本工作中端到端展示；③ 场景规模扩大后的内存行为待测。"},{"h":"与文献库的关系","body":"与库内 Masking-Judder（注视点渲染）、OuroWorld（内容生成）分属渲染系统不同层；H²-Ray 补上库内「3DGS 光线追踪系统」空白，与神经渲染方法族（80 篇）形成「方法-系统」闭环。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-12，10-12 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，58130 字符）；加权 3.65 → A 级。"}]},{"file":"../papers/notes/2610.16143__All-St3R实时动态RGBSLAM.md","id":"2610.16143","title":"All-St3R SLAM: Real-time RGB Dynamic SLAM with Pixel-wise Motion Masking","title_zh":"All-St3R SLAM：像素级运动掩蔽的实时动态 RGB SLAM","track":"重建与SLAM","date":"2026-10-14","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.65,"evidence":"FULL","tags":["SLAM","动态环境","运动掩蔽","实时","单目"],"flags":[],"sections":[{"h":"一句话结论","body":"密集几何驱动的动态 RGB SLAM：逐像素运动掩蔽替代物体级分割/检测，把 All-Tracker 改造成两帧成对推理以消除序列开销，约 10 FPS（30 FPS 流每 3 帧 subsample）实时运行，显著优于 1–2 FPS 的既有动态 SLAM。"},{"h":"要解决的问题","body":"动态环境 SLAM 有重大实用价值，但既有路线要么依赖重型物体级分割/检测（慢且漏检即失败），要么过度移除动态内容损伤建图质量，计算成本也普遍在实时线以下。"},{"h":"方法详解","body":"① 逐像素运动掩蔽：由密集几何直接驱动，免物体级先验；② All-Tracker 的两帧成对推理改造，去除序列推理开销；③ 轻量几何过滤流水线，纯单目 RGB 输入。"},{"h":"实验与结果","body":"标准动态 SLAM 基准上实时性约 10 FPS（vs 既有 SOTA 1–2 FPS 量级）且保持有竞争力的跟踪精度；消融验证掩蔽策略对跟踪与建图的双重贡献。"},{"h":"创新点与贡献","body":"① 用「密集几何驱动逐像素掩蔽」绕开物体级检测的脆弱性；② 两帧成对推理的工程改造把 tracker 类方法真正推入实时区间。"},{"h":"局限与风险","body":"① 纯 RGB 的尺度未恢复（单目固有）；② 极端动态（人群/大幅形变）下的掩蔽质量未充分验证；③ 与库内 LIN-SLAM（LiDAR-惯性）传感器假设不同，不可直接横评。"},{"h":"与文献库的关系","body":"与库内 RootSLAM（VIO 平方根 BA）、Physical SLAM（物理感知 4D）、RoboAtlas（主动 SLAM）构成 SLAM 方法族的不同切面；All-St3R 的「动态实时」维度与 10-10 的 Fast-Pose-Tracking 互补。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-14，10-14 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，43280 字符）；加权 3.65 → A 级。"}]},{"file":"../papers/notes/2610.16177__DIGS免训练开放词汇3D高斯分割.md","id":"2610.16177","title":"DIGS: Distribution-Informed Gaussian Splatting for Training-Free Open-Vocabulary 3D Segmentation","title_zh":"DIGS：分布信息引导的免训练开放词汇 3D 高斯分割","track":"感知与认知","date":"2026-10-14","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.65,"evidence":"FULL","tags":["3DGS","开放词汇","语义分割","免训练","贝叶斯"],"flags":[],"sections":[{"h":"一句话结论","body":"免训练开放词汇 3D 高斯分割：诊断出既有方法的两大失效模式——尺度主导（大高斯单帧获得不成比例的增量）与闭环反馈（渲染标签图驱动下一帧关联并自我强化），以广义贝叶斯推断（safe-Bayesian 似然回火）引入逐高斯逐帧学习率稳定训练，边界高斯不再被迫做单一特征承诺。"},{"h":"要解决的问题","body":"开放词汇 3D 高斯分割通常把语义特征绑到 per-Gaussian 状态，依赖 per-scene 梯度训练（1–4 小时）或闭式蒸馏；两者都把每个 primitive 提交给单一特征，跨多个 2D 实例的边界高斯被迫硬决策，检索精度与掩蔽边界稳定性双损。"},{"h":"方法详解","body":"① 分布保持设计（DP）：承认边界高斯的语义分布而非强制单峰承诺；② 稳定性过滤器（SF）；③ 逐高斯逐帧学习率 η_i(t)：以 tempering 的 Dirichlet 后验做安全贝叶斯更新，抑制尺度主导与闭环反馈；④ LLM 融合增强检索；LERF-OVS/LERF-Mask 双协议逐组件消融（SF/DP/LLM fusion）。"},{"h":"实验与结果","body":"LERF-OVS（mIoU/mAcc）与 LERF-Mask（mIoU/mBIoU）上对 LangSplat、LangSplatV2、LaGa 与免训练对照 SFS 取得竞争优势；消融显示各组件（SF/DP/LLM 融合）对检索 mIoU 的增量贡献可分离。"},{"h":"创新点与贡献","body":"① 首次把动态 3DGS 分割的失效归因到「尺度主导+闭环反馈」两个可操作机制；② 用贝叶斯回火给出逐 primitive 的学习率方案，是免训练路线少有的原则性设计。"},{"h":"局限与风险","body":"① 逐帧更新仍有推理期计算成本，与 LangSplatV2 的 450+ FPS 有差距；② LLM 融合引入外部模型依赖；③ 基准为室内语义场景，开放世界长尾类别未测。"},{"h":"与文献库的关系","body":"与库内免训练目标感知精化（10-17 cross）同属「3DGS 语义检索」方向；DIGS 的免训练+分布保持路线与该篇的「精化」路线互为补充，共同对标 LangSplat 家族。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-14，10-14 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，105708 字符）；加权 3.65 → A 级。"}]},{"file":"../papers/notes/2610.16256__EgoWholeView六相机头戴全身动捕.md","id":"2610.16256","title":"EgoWholeView: Camera-Only Head-Mounted Capture of Body and Bimanual Hand Motion for Embodied Demonstrations","title_zh":"EgoWholeView：六相机头戴装置的全身+双手运动捕捉（角色专业化流水线）","track":"化身与人体","date":"2026-10-14","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.93,"evidence":"FULL","tags":["头戴动捕","第一视角","具身示范","多相机","SMPL-X"],"flags":[],"sections":[{"h":"一句话结论","body":"一台六同步广角 RGB 相机的头戴装置：外向相机恢复装置在世界系的位姿，一对重叠下视相机观测近身与双手；角色专业化（role-specialized）流水线在各自坐标系内预测、仅在参数化兼容时融合，实现相机only的全身+双手运动捕捉，服务自化身、遥操作与具身示范。"},{"h":"要解决的问题","body":"头戴式全身动捕支持自化身/遥操作/具身数据采集，但单目第一视角相机受视场局限、尺度歧义与手-物遮挡三重困扰；加装传感又引入标定与融合难题——不同相机看到的身体部位参数化不同，朴素融合会引入系统性偏差。"},{"h":"方法详解","body":"① 角色专业化六相机装配：每台相机承担明确传感角色（外向定位/下视近身/双手），所有预测保留各自坐标系；② 坐标帧保持的融合策略：仅当预测的参数化兼容时才融合同步预测，从机制上避免跨帧错配；③ 完整同步、装置标定与坐标系定义流程。评估采用 Procrustes 对齐后的 PA-MPJPE/PA-MPVPE（MANO K=21/M=778，UnrealEgo-RW 上 SMPL-X K=15），并量化可见性、扰动离散度、裁剪边界支撑对误差的贡献。"},{"h":"实验与结果","body":"在 UnrealEgo-RW 等基准上给出全身/双手的量化误差分解；消融显示下视重叠对近身与双手覆盖的决定性作用，以及「高可见性+低扰动+高裁剪支撑」条件下误差最低（身体 0.3228/0.0912/0.1109 量级的支撑度对比）。"},{"h":"创新点与贡献","body":"① 用「传感角色分工+坐标帧保持融合」把多相机头戴动捕的误差源结构化，而非黑端到端；② 相机only达到可用全身+双手精度，为无 Marker 具身数据采集提供可复制的硬件-软件参考设计。"},{"h":"局限与风险","body":"① 六相机硬件的体积/功耗/成本对日常佩戴仍是负担；② 与光学 Marker 系统的精度差距未在同基准直接对比；③ 主要在受试者室内数据验证。"},{"h":"与文献库的关系","body":"与库内 FlowAvatar（消费头显稀疏传感化身）构成「传感完备度光谱」：EgoWholeView 重精度、FlowAvatar 重便携；与 Hand-4DGS/ReViV（第一视角重建）共享 egocentric 数据范式。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-14，10-14 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，82215 字符）；加权 3.93 → A 级。"}]},{"file":"../papers/notes/2610.16277__FlowAvatar消费级XR实时全身化身.md","id":"2610.16277","title":"FlowAvatar: Real-Time Full-Body Avatars from Sparse Egocentric Inputs on Consumer XR Devices","title_zh":"FlowAvatar：消费级 XR 设备上稀疏第一视角输入的实时全身化身","track":"化身与人体","date":"2026-10-14","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":4.0,"evidence":"FULL","tags":["XR 化身","全身姿态","Quest Pro","SMPL-X","实时"],"flags":[],"sections":[{"h":"一句话结论","body":"首个在独立头显（Meta Quest Pro）上实时统一全身姿态、手部关节、面部表情与注视追踪并保持个性化外观的开源化身系统；姿态模型在 AMASS 上空间精度持平 SOTA、时序一致性 SOTA（MPJVE 21.72 cm/s、jitter 3.77×10⁻²，较 HMDPoser 分别改善 28%/33%）。"},{"h":"要解决的问题","body":"既有化身研究把「追踪完备度」与「个性化外观」分开研究，各自依赖实验室专用设备；在消费级独立头显上，稀疏传感（头+手）如何同时驱动全身、面部与注视并无系统答案——头显只提供 3-DoF/6-DoF 头姿与双手控制器信号，全身姿态是欠约束问题。"},{"h":"方法详解","body":"① 身体部位编码（body-part encoding）把稀疏头/手信号编码为部位级特征；② 统一运动学解码器（unified kinematic decoding）直接输出 SMPL-X 参数，把「不同参数空间的对齐」内化到网络而非后处理规则；③ 空间+时序联合损失（显式惩罚速度与抖动）。Quest Pro 内置传感器提供手部关节、面部表情与眼动，各自经映射汇入 SMPL-X：手/脸 blendshape 重定向到 mesh，眼球 yaw/pitch 由注视数据驱动以实现自然眼神接触。"},{"h":"实验与结果","body":"AMASS 基准：MPJPE 5.40 cm（与 HMDPoser 5.44 持平）、MPJVE 21.72 cm/s、jitter 3.77×10⁻²（HMDPoser 30.15/5.62，EgoPoser 抖动 18.64×10⁻² 近 5 倍于本方法）；用户研究 6 个维度（风格/保真/沟通/交互就绪/上下肢）逐项显著性检验，追踪与纹理两个处理阶段均呈统计显著提升。"},{"h":"创新点与贡献","body":"① 首次在独立消费头显上闭环「姿态-手-脸-注视-外观」五要素并开源；② 用统一运动学解码替代分模块后处理拼接；③ 时序损失显式建模抖动，把「稳定性」提升为一等指标。"},{"h":"局限与风险","body":"① 依赖 Quest Pro 的眼动/面捕硬件，向无面捕头显的迁移未验证；② 外观个性化仍依赖既有纹理流程，实时性边界待考；③ 仅 AMASS 分布内验证，大幅越分布动作（如倒地）未测。"},{"h":"与文献库的关系","body":"与库内 EgoPoser/HMDPoser 一脉相承（稀疏头手→全身姿态），但把它推进到「消费硬件上的完整社交化身」；与 FlowAvatar 同期库内 FaceGAN（流式说话头）构成「脸-全身」互补，与 EgoWholeView（六相机动捕）构成「传感完备度光谱」的两端。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-14，10-14 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，81203 字符）；加权 4.00 → A 级。"}]},{"file":"../papers/notes/2610.17605__PLEDGE误差有界3DGS渐进压缩.md","id":"2610.17605","title":"PLEDGE: Progressive Lossy Error-Bounded Compression of 3D Gaussian Splatting","title_zh":"PLEDGE：渐进有损误差有界 3DGS 压缩编解码器","track":"神经渲染","date":"2026-10-14","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.72,"evidence":"FULL","tags":["3DGS","压缩","编解码器","误差有界","training-free"],"flags":[],"sections":[{"h":"一句话结论","body":"免训练、渐进、误差有界的 3DGS 编解码器：把用户声明的四类容差（屏幕空间位置、旋转缩放致足印形变、视角相关颜色、不透明度）翻译为每个高斯的量化边界，任何有效前缀都满足误差命题，实现「要多少精度给多少码率」的可控压缩。"},{"h":"要解决的问题","body":"既有 3DGS 编解码器只报告压缩后重建质量，用户对单个高斯的畸变没有控制力；而「场景平均 1 dB 损失」这类指标掩盖了局部 primitive 的严重畸变，无法满足渐进流式与质量敏感场景的需求。"},{"h":"方法详解","body":"① 四类用户可声明容差 → per-primitive 量化边界的直接翻译；② 免训练设计，不做 per-scene 优化；③ 渐进码流：任何有效前缀均满足 Proposition 6 的误差保证，客户端可按带宽截取。"},{"h":"实验与结果","body":"13 个场景上的压缩比与误差曲线：60% 保留率下仅损失 0.082 dB；收紧 τ_px 可把最大 PSNR 损失压到 0.05 dB 以内，而放松 τ_px 则最多再降 1.2 dB 最大 PSNR 损失——证明容差旋钮的有效性；9 个 Mip-NeRF 360 场景 test-split PSNR 复核。"},{"h":"创新点与贡献","body":"① 把「误差有界」从场景级指标推进到 per-primitive 级保证；② 免训练+渐进码流的组合对低延迟流式传输（库内体积视频方向的直接需求）尤为关键。"},{"h":"局限与风险","body":"① 容差到量化边界的翻译对非标准内容的保守性未充分讨论；② 与库内 TETRIS-4DGS/PLEDGE 同类压缩家族的同基准横评待补；③ 主要在标准基准场景验证。"},{"h":"与文献库的关系","body":"与库内 ResStreamGS（移动体积视频流式）、TETRIS-4DGS（训练后压缩）、RDCompGS（率失真优化）共同构成「3DGS 压缩/传输」方法族；PLEDGE 的误差有界保证是该族独有的质量维度。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-14，10-14 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，40291 字符）；加权 3.72 → A 级。"}]},{"file":"../papers/notes/2610.18950__HumanVerse500小时第一视角人形数据.md","id":"2610.18950","title":"$λ_0$: Scaling Open-World Egocentric Human Data for Humanoid Loco-Manipulation","title_zh":"λ0/HumanVerse：500 小时开放世界第一视角人类数据（人形机器人）","track":"世界模型与仿真","date":"2026-10-15","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.65,"evidence":"FULL","tags":["人形机器人","第一视角数据","数据集","loco-manipulation","VLA"],"flags":[],"sections":[{"h":"一句话结论","body":"500 小时开放世界人类 loco-manipulation 数据集 HumanVerse：第一视角视频与同步的身体/手部运动配对；配套 human-to-humanoid 流水线对齐相机视角与手臂外观，离线精化运动参考与控制器输入以压低末端误差同时保留全身协调，并以前所未有规模的基线横评验证。"},{"h":"要解决的问题","body":"人形机器人全身视觉-语言-动作策略需要大规模机器人示范，但采集昂贵；人类示范虽可扩展，既有第一视角监督往往缺失移动与姿态信息，且具身差异与控制器动力学使末端执行精度不足。"},{"h":"方法详解","body":"① 数据采集：500 小时开放世界人类 loco-manipulation，第一视角视频+同步身体/手部运动；② human-to-humanoid 对齐：相机视角与手臂外观对齐，离线精化运动参考与控制器输入；③ 大规模评测协议：18 个任务-难度组合×每组合 10 次试验的仿真评测+真实世界评测。"},{"h":"实验与结果","body":"仿真横评 8 个强基线（H-RDT/InternVLA-M1/EgoVLA/Diffusion Policy/GR00T N1.6/π0.5/DreamZero/ACT）：基线总体成功率 13.9%–65.6% 不等（DreamZero 65.6 最强），本方法在保留全身协调的目标下取得有竞争力表现；真实世界评测与泛化评测协议完整公开。"},{"h":"创新点与贡献","body":"① 把「人类示范→人形策略」的数据规模推进到 500 小时量级；② 系统处理了「视角/外观对齐+控制器兼容」两大迁移断点；③ 横评协议本身对社区有基准价值。"},{"h":"局限与风险","body":"① 仿真到真实的差距仍在，真实世界任务数有限；② 与 DreamZero 等强基线的最优成绩仍有差距；③ 数据采集设备与伦理审批细节决定可复现性边界。"},{"h":"与文献库的关系","body":"与库内 EgoJEPA/P³-WAM（第一视角灵巧操作）、EgoMatrix/EgoReveal（第一视角→机器人）同属「人类数据驱动机器人」大簇；HumanVerse 的差异化在 loco-manipulation 全身维度与数据规模。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-15，10-15 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，90591 字符）；加权 3.65 → A 级。"}]},{"file":"../papers/notes/2610.19290__Kandinsky音频驱动化身视频生成.md","id":"2610.19290","title":"Kandinsky S2V 1.0: Audio-Driven Avatar Video Generation","title_zh":"Kandinsky S2V 1.0：音频驱动化身视频生成（开源模型家族）","track":"化身与人体","date":"2026-10-15","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.72,"evidence":"FULL","tags":["说话头","音频驱动","视频生成","开源模型","长视频"],"flags":[],"sections":[{"h":"一句话结论","body":"开源的音频驱动说话视频生成模型家族：Lite（2B）与 Pro（21B）双规格，从单张参考图+语音波形+文本提示生成 25 FPS 的 SD/HD 长视频，唇动、表情、姿态、手势跟随语音；Pro 在 EMTD/CelebV-HQ/HDTF 上取得最佳平均排名，蒸馏版 16 步采样实现 5.4× 加速。"},{"h":"要解决的问题","body":"音频驱动说话人生成已有大量工作，但长时长（数秒级以上）、多语言、开源可复现的模型仍然稀缺；既有开源方案在长视频的身份/运动一致性上明显退化，闭源商用模型又不开放权重。"},{"h":"方法详解","body":"① 自回归 5 秒块（125 帧@25FPS）生成，由 FramePack 记忆机制粘合，突破单块长度限制同时保持身份与运动连续性；② 文本与音频双条件注入；③ π-Flow 蒸馏：Lite/Pro 均有蒸馏变体，Pro 蒸馏后 16 步采样、无 classifier-free guidance 即达 5.4× 加速；④ 训练数据经 Qwen3-VL-32B-Instruct 自动标注（2 FPS 抽帧、≤512²）。"},{"h":"实验与结果","body":"EMTD、CelebV-HQ、HDTF 三个基准：蒸馏 Pro 在全部五项指标聚合的平均排名与 min-max 分数上为最优；SD/HD 双分辨率、多语言提示、25 FPS 长视频生成均经验证；两个模型权重开放。"},{"h":"创新点与贡献","body":"① 开源社区少有的「双规格+蒸馏」说话视频模型家族，25 FPS 长视频+记忆机制直击实用性；② FramePack 记忆与自回归分块的组合为长时长驱动生成提供了可复用的工程范式。"},{"h":"局限与风险","body":"① 以预标注数据训练，标注噪声未量化；② 与最新闭源商用效果的差距未在同测试协议下对比；③ 手势/姿态的可控粒度仍靠文本提示间接控制。"},{"h":"与文献库的关系","body":"与库内 FaceGAN（流式说话头，10-10 Top）直接同赛道竞争——FaceGAN 胜在流式实时，Kandinsky 胜在开源权重+长时长+多语言；与化身赛道整体（Brain2Face/FlowAvatar）构成「驱动-生成-追踪」方法链的不同环节。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-15，10-15 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，83950 字符）；加权 3.72 → A 级。"}]},{"file":"../papers/notes/2610.19998__ShadAR提示词驱动AR实时视觉增强.md","id":"2610.19998","title":"ShadAR: Real-time Prompting On-demand Visual Augmentation in Augmented Reality","title_zh":"ShadAR：AR 中按需实时视觉增强（提示词驱动 shader）","track":"空间计算与UI","date":"2026-10-15","batch":"backfill-1012-1015","batchLabel":"backfill · 10-12~10-15 漏网补录","grade":"A","value":3.93,"evidence":"FULL","tags":["AR","视觉增强","shader 生成","LLM","passthrough"],"flags":[],"sections":[{"h":"一句话结论","body":"用户用自然语言描述期望的视觉改变（如「把所有人模糊掉」），ShadAR 经 LLM 解译意图、目标检测定位对象、实时生成像素 shader 注入 AR passthrough 视频流，把「专家预编程的静态视觉增强」变为「按需实时可编辑」。"},{"h":"要解决的问题","body":"AR 视觉增强（模拟色盲、模糊、高亮等）能重塑人的视觉感知，但效果历来由专家预编程，用户无法按需即时调整；而普通用户不具备编写 shader 的能力，既有工具也不支持对 passthrough 实时流的图形化操纵。"},{"h":"方法详解","body":"流水线四段：① LLM（GPT5.2）把用户的自然语言提示解译为结构化意图；② 目标检测（YOLOv26）分析当前视图、定位增强对象；③ 代码生成产出像素 shader；④ shader 注入实时作用于 AR passthrough。配套「迭代/重做 shader 的内存管理」机制，让用户可以反复调整而不丢失上下文。"},{"h":"实验与结果","body":"21 名 HCI 研究者的 workshop：归纳出四类应用场景（Design/Health/Productivity/Social Interaction）与两种提示构架范式——程序式提示（说明转换什么、怎么转）与目标式提示（只描述期望的内在状态）；发现目标式提示会导致不确定性结果，形成设计挑战讨论。"},{"h":"创新点与贡献","body":"① 把「视觉增强的创作权」从专家交给终端用户，交互范式上是 passthrough 可编程性的首次系统化；② 程序式 vs 目标式提示的分类与不确定性分析，对后续 AR+LLM 生成式交互有直接设计指导意义。"},{"h":"局限与风险","body":"① 21 人 workshop 为定性研究，无量化实验；② 依赖 LLM 代码生成的正确性与延迟，复杂提示的失败模式未系统量化；③ 仅在受控场景验证，真实日常佩戴的稳定性待考。"},{"h":"与文献库的关系","body":"与库内 LICOA（指令条件光学动作学习）分别代表「AR 视觉增强的软件层」与「光学硬件层」两条按需增强路线；与库内多篇 LLM+XR 智能体工作（XARA/Cobot）同属「生成式 XR 交互」新兴簇。"},{"h":"来源与诚实口径","body":"- 本笔记出自 **backfill-1012-1015（漏网对账补录）** 批次：公告日 2026-10-15，10-15 公告漏网，非 10-17 当日新提交。\n- 评分依据全文（L0/FULL，77370 字符）；加权 3.93 → A 级。"}]},{"file":"../papers/notes/2610.20904__EgoJEPA免重定向第一视角灵巧操作.md","id":"2610.20904","title":"EgoJEPA: Beyond Retargeting for Dexterous Manipulation from Egocentric Videos","title_zh":"EgoJEPA：超越重定向，从第一视角视频学习灵巧操作","track":"世界模型与仿真","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.85,"evidence":"FULL","tags":["第一视角","灵巧操作","JEPA","潜动作","跨本体"],"flags":[],"sections":[{"h":"一句话结论","body":"用三阶段框架从第一视角人类视频学「本体无关」的操作表征——JEPA 式视觉预测学效果感知潜动作、潜动作驱动世界模型、再做本体微调——彻底绕开手工重定向，域外平均成功率 74%（重定向基线 65%），跨本体墙钟成本降 47.2%。"},{"h":"要解决的问题","body":"第一视角人类视频是机器人操作的规模化监督来源，但主流「重定向」路线把手腕/手指位姿经手工几何映射转成特定本体动作命令：每个本体都要精心重标定，且手部跟踪误差会沿流水线传播进机器人控制。如何不依赖规则式重定向、直接把人类操作先验迁到机器人，是开放问题。"},{"h":"方法详解","body":"三阶段框架：\n\n1. **Stage 1 人类动作预训练**：以 JEPA 风格视觉预测学习「效果感知潜动作」（effect-aware latent actions）——以手部运动差分为条件，预测视觉动态，从而把「动作」编码成对效果的潜表征而非关节角。\n2. **Stage 2 潜动作世界建模**：在潜动作空间联合预测未来视觉动态，获得可跨本体共享的世界模型。\n3. **Stage 3 本体专用微调**：冻结/轻改前两阶段，仅用目标本体数据做策略微调（三本体保持相同 Stage 2–3 协议）。\n\n关键点：人类视频从不被转成机器人动作命令；迁移发生在潜空间，因此不受手部跟踪误差直接污染，也不需 per-embodiment 重标定。"},{"h":"实验与结果","body":"- **设置**：5 个真实操作任务 × 3 种本体（Sharpa、Wuji、Gripper）× 每任务 20 trials；区分域内/域外评估；附录含鲁棒性评估协议。\n- **核心数字**：域外平均成功率 **74%** vs 重定向基线 **65%**；跨本体累计墙钟成本 **743.2 → 392.7 小时（-47.2%）**。\n- **消融**：覆盖架构设计与数据效率（附录 A.2 有实现细节）。"},{"h":"创新点与贡献","body":"1. 首个（就库内知识范围）以「潜动作 + JEPA 式预测」完整替代规则重定向的第一视角操作迁移框架。\n2. 同时给出质量（+9 个成功率点）与成本（-47.2%）双重收益，论证了潜空间迁移的规模化理由。\n3. 三本体一致协议验证了「本体无关」主张。"},{"h":"局限与风险","body":"- 域外 74% 距实用部署仍有距离；任务为桌面级操作，未涉及长时序/接触丰富任务。\n- Stage 3 仍需目标本体数据（非零样本）。\n- 摘要与正文未明示代码开源。"},{"h":"与文献库的关系","body":"- **互补/改进**：与库内 Hand-4DGS（2606.19156，第一视角视频前馈 4D 手部重建）构成「感知层 → 策略层」的上下游；与 UniWAM（2610.02054，统一世界-动作模型，B）同族但 UniWAM 不做第一视角人类视频迁移。\n- **取代**：无（门① max Jaccard 0.235 vs Hand-4DGS）。它取代的是「规则重定向」这一传统流水线，而非某篇具体论文。"},{"h":"可复现性","body":"- 5 任务 × 3 本体 × 20 trials 的评估协议写得很清楚；代码开源情况未明示（需查项目页）。"},{"h":"行动建议","body":"- 做第一视角数据驱动的机器人学习时，把「免重定向潜动作迁移」列为候选范式，与重定向基线同协议对比。\n- 后续追踪：潜动作是否扩展到全身/移动操作；与 P3-WAM（2610.22363）的统一世界-动作路线是否收敛。"}]},{"file":"../papers/notes/2610.20958__cuVSLAM线特征扩展低纹理VO.md","id":"2610.20958","title":"Line-Augmented cuVSLAM: Robust Visual Odometry in Low-Texture Environments","title_zh":"Line-Augmented cuVSLAM：低纹理环境下的鲁棒视觉里程计（线特征扩展）","track":"重建与SLAM","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"B","value":3.5,"evidence":"FULL","tags":["视觉里程计","线特征","低纹理","cuVSLAM","Plucker坐标"],"flags":[],"sections":[{"h":"一句话结论","body":"给 CUDA 加速的 cuVSLAM 加上线特征通道：直线用 Plücker 坐标做几何运输、用 Bartoli-Sturm 最小 4-DOF 正交表示参数化，在 TUM RGB-D 全部 22 序列 + Replica 全部 8 序列上，30 个序列中 26 个平移精度提升、Replica 8 个中 7 个旋转精度提升，且所有配置零跟踪失败——线特征的增益正好落在点特征失效的误差模式上。"},{"h":"要解决的问题","body":"仓储与生产设施中的自主移动机器人（AMR）所处的环境恰是点特征视觉里程计的坟场：无纹理通道、均匀墙面、重复货架、高光地板。但这些环境富含直线结构（货架立柱、门框、墙缝、柜体边线），且直线在大视角变化下稳定。如何把这部分信号可靠纳入现有高性能里程计，是核心问题。"},{"h":"方法详解","body":"- **线特征扩展**：作为 cuVSLAM 点特征流水线的**附加通道**（additive path）——关掉线通道即退化为纯点基线，因此每个对比都隔离了线特征的净效应。\n- **参数化**：直线以 Plücker 坐标表示以支持几何运输；采用 Bartoli 与 Sturm 的最小 4-DOF 正交表示（避免过参数化）。\n- **线检测与匹配**：HOME（Hough 空间一维匹配）算法，面向视频帧序列设计。\n- **误差分析**：平移块方程（式 7）中沿直线的运动不可观，平行线共享同一零方向——因此线特征的贡献取决于其方向与幸存点观测角分布的互补程度（这解释了为什么 Replica office 序列增益最大）。"},{"h":"实验与结果","body":"- **数据集**：TUM RGB-D freiburg3 全部 22 序列（从无纹理结构面到无结构纹理面全覆盖）+ Replica 全部 8 个房间/办公室序列（每序列 2000 帧，真值位姿，无传感器噪声与深度伪影）。\n- **精度**：平移精度在 **26/30** 序列上提升，旋转精度在 **7/8** Replica 序列上提升；**所有配置无跟踪失败**。\n- **方法学**：最近时间戳关联（Δt ≤ 0.02 s）+ SE(3) Umeyama 刚体对齐（evo 库），无尺度校正（RGB-D 深度提供尺度）。"},{"h":"创新点与贡献","body":"1. 以「附加通道」方式把线特征接入生产级 cuVSLAM，工程侵入性小、可开关对比。\n2. 清晰的误差模式分析：解释线特征增益的来源（角分布互补）与边界（沿直线不可观）。\n3. 「精度与鲁棒性同时改善、无跟踪失败」的部署友好结论——不以丢跟踪换精度。"},{"h":"局限与风险","body":"- NOV 3：线特征用于 VO/SLAM 是成熟思路，贡献在集成质量与误差分析而非新范式。\n- HOME 面向视频帧设计，扩展到通用关键帧匹配需改进（作者列为 future work）。\n- 线对应不能独立计算基础矩阵（应用面窄于点对应），CLAD 类工作正在补这一环。"},{"h":"与文献库的关系","body":"- **互补并列**：库内低纹理/退化环境 SLAM 已有 FMCW-LIO（多普勒激光里程计，09-24 批次）与 DAVIO（稠密单目-惯性，09-25）等，本作补上「RGB-D + 线特征」一角；与视觉端 SLAM（RawSLAM/AMB3R-SLAM）形成传感器模态互补。\n- **取代**：无（门① max Jaccard 0.211，最相似库内部件实质无关）。"},{"h":"可复现性","body":"- 两大数据集全序列 + 开源工具（evo）评估，协议透明；代码开源情况未明示（cuVSLAM 为 NVIDIA 开源项目，扩展部分可对比复现）。"},{"h":"行动建议","body":"- 仓储/工业 AMR 的视觉里程计选型时，若环境富含直线结构（货架/门框），把线特征通道列为评估项；重点复测 26/30 的提升面与零失败结论。\n- 后续追踪：线特征与语义/深度先验的联合；向关键帧管线的扩展。"}]},{"file":"../papers/notes/2610.21121__ResStreamGS移动体积视频流式传输.md","id":"2610.21121","title":"ResStreamGS: Residual-Sensitive Dual-Stream Gaussian Splatting for Mobile Volumetric Video Streaming","title_zh":"ResStreamGS：残差敏感双流高斯泼溅，移动端体积视频流式传输","track":"神经渲染","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":4.0,"evidence":"FULL","tags":["3DGS","体积视频","流式传输","移动端","视频编码"],"flags":[],"sections":[{"h":"一句话结论","body":"把场景高斯按「时间稳定性」分成静态流与残差流：静态高斯在 GOP 级复用一次编码，仅对残差敏感高斯做帧级视频编码，在 Neu3D/MeetRoom 全场景体积视频上比 V³ 式基线 PSNR 高 7.51–8.35 dB、payload 降低至多 56.5%，并在商品移动硬件上跑到 30.883 FPS。"},{"h":"要解决的问题","body":"移动端自由视点体积视频受带宽与算力双重约束。V³ 一类系统把全部高斯属性按时变信号用商品视频编解码器编码，但全场景内容中大部分高斯时间稳定，「一视同仁」的帧级编码既浪费码率又因帧级自适应损伤复杂全场景的重建质量。已有流水线缺乏对「哪些高斯该保持帧级自适应」的判据。"},{"h":"方法详解","body":"ResStreamGS 是一个残差敏感的双流框架，核心是把高斯的时序行为作为划分依据：\n\n1. **轻量探针自适应（probe adaptation）**：先做一次轻量的帧级自适应探针，获得高斯随时间的变化证据，避免直接对全量高斯做代价高昂的帧级编码。\n2. **多属性残差敏感度画像（multi-attribute residual-sensitivity profiling）**：不仅看位置位移，还综合 rotation / scale / opacity / color 五个属性的变化幅值，对每个高斯计算残差敏感度。\n3. **质量感知比率选择（quality-aware ratio selection）**：按目标码率质量选择进入帧级视频流的动态高斯比例（如 8%）。\n4. **双流编码**：静态高斯在 GOP（图像组）级复用，只编码一次；残差敏感高斯走帧级视频流，由硬件解码器解码。\n\n划分在 GOP 内固定。消融显示：固定 8% 动态比率下，全属性排序比随机选择 PSNR 高 2.798 dB；仅用位置排序达 31.193 dB，逐一叠加 rotation/scale/opacity/color 分别再得 0.380/0.194/0.144/0.129 dB，五属性联合 32.745 dB（比单用位置高 1.552 dB 且 payload 接近），说明这些线索互补而非冗余。"},{"h":"实验与结果","body":"- **数据集**：Neu3D（5 条全场景序列平均）+ MeetRoom，均为全场景（full-scene）内容，正是静态-动态混合最突出的场景。\n- **Neu3D**：ResStreamGS PSNR 33.04 / SSIM 0.9425 / LPIPS 0.107 / DISTS 0.03756，payload 1.627 MB，支持移动端播放；对照 V³ 25.53 dB / payload 3.741 MB；未压缩参考 34.60 dB / 107.81 MB。4DGS 与 GIFStream 不支持移动播放。\n- **MeetRoom**：ResStreamGS 33.04 dB 级、payload 1.627 MB 级（对照 V³ 25.38 dB / 0.304 MB）。\n- **综合结论**：较受控 V³ 式基线 PSNR +7.51–8.35 dB；payload 最多降 56.5%；商品移动硬件 30.883 FPS。\n- **消融**：Table 2 的多属性排序研究（见上）。"},{"h":"创新点与贡献","body":"1. 指出并验证「全高斯帧级编码」在全场景体积视频上的质量损伤，把问题重构为「哪些高斯该帧级自适应」的划分问题。\n2. 多属性残差敏感度画像：位置不是唯一线索，五属性联合有互补增益（实验证据充分）。\n3. GOP 级静态复用 + 帧级残差流的双流架构，兼顾硬件解码与码率。"},{"h":"局限与风险","body":"- GOP 内划分固定，难以捕捉大幅或突兀的时序变化（作者自述）。\n- 残差比率在视频编码前选定，未随内容显式联合优化。\n- 在两个学术序列上验证；更多样的真实 capture 与更长时序的稳定性待考。\n- 未报告与库内同期 3DGS 压缩/流式工作（如 MoQSplat、SAGA）的同基准对比，相对定位需谨慎。"},{"h":"与文献库的关系","body":"- **改进**：相对库内 SAGA（2609.33969，稀疏 4D 锚点体素视频压缩，A 3.85）与 MoQSplat（2609.18624，MoQ 渐进流式，A 3.75），ResStreamGS 的划分维度是「时间稳定性」而非空间稀疏性/码率层级，构成体积视频压缩的另一条正交路线。\n- **取代**：无。门① max Jaccard 0.222（vs SAGA），无同质。"},{"h":"可复现性","body":"- 论文报告了完整实现细节与两数据集协议；代码/数据开源情况摘要未明示，需查项目页。\n- 移动端 FPS 在「commodity mobile hardware」上实测，工程可复制性较高。"},{"h":"行动建议","body":"- 做移动 XR 体积视频产品时，优先评估该双流划分管线；把「动态比率」作为可调质量-码率旋钮。\n- 后续追踪：GOP 级自适应划分与编码联合优化是否被跟进；与 V³ 后续版本的同基准复测。"}]},{"file":"../papers/notes/2610.21199__LIN-SLAM轻量LiDAR惯性神经SLAM.md","id":"2610.21199","title":"LIN-SLAM: Lightweight LiDAR-Inertial Neural SLAM for Real-Time Onboard Navigation","title_zh":"LIN-SLAM：轻量级 LiDAR-惯性神经 SLAM（实时机载）","track":"重建与SLAM","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.73,"evidence":"FULL","tags":["SLAM","LiDAR惯性","神经隐式","机载","Jetson"],"flags":[],"sections":[{"h":"一句话结论","body":"把「高频几何 LiDAR-惯性估计」与「神经隐式跟踪/持续建图/全局精化」异步耦合，并用 C++/CUDA 优化神经执行：12 条序列上取得 SOTA 定位精度（Newer College+Door 平均 ATE 0.638 m，128 线 0.086 m），每帧仅 42–62 ms，可在 Jetson Orin NX 上机载实时运行。"},{"h":"要解决的问题","body":"几何 LiDAR-惯性 SLAM 高效但缺连续地图表示与全局精化；神经隐式 SLAM 有连续表示与精化能力但计算昂贵、难以实时。两者长期「二选一」。如何在保持实时的同时兼得神经隐式地图的收益，是核心问题。"},{"h":"方法详解","body":"- **混合架构**：高速几何 LiDAR-惯性估计负责状态估计主干；神经隐式模块负责跟踪、持续建图（continual mapping）与全局精化，两者异步耦合（asynchronous coupling），避免神经计算拖垮高频估计。\n- **轻量化执行**：神经部分以优化过的 C++/CUDA 实现，把每帧 profiling 时间压到 42–62 ms（对照 PIN-SLAM 约 250 ms、CLID-SLAM 约 180 ms）。\n- **机载部署**：可在 NVIDIA Jetson Orin NX 上在线运行。"},{"h":"实验与结果","body":"- **数据集**：三个数据集 12 条代表性序列，覆盖 32/64/128 线 LiDAR（Newer College 立体相机 64 线、M2DGR 32 线、Newer College 多相机 128 线）。\n- **精度**：Newer College+Door 平均 ATE RMSE **0.638 m**（PIN-SLAM 0.651、CLID-SLAM 0.808、FAST-LIO2 0.808、Point-LIO 0.802）；128 线多相机序列平均 **0.086 m**（PIN-SLAM 0.121 等）。\n- **速度**：42.03–62.28 ms/帧；机载 Jetson Orin NX 实时。\n- 作者称在两个数据集与机载运行上均取得 SOTA LiDAR-IMU 定位精度。"},{"h":"创新点与贡献","body":"1. 几何-神经异步耦合的系统级设计，兼顾实时性与连续地图/全局精化。\n2. 工程上的轻量化（C++/CUDA + Jetson 机载），把神经 SLAM 从工作站拉到嵌入式。\n3. 跨三种 LiDAR 线数配置的一致验证。"},{"h":"局限与风险","body":"- 创新以系统集成与工程优化为主，NOV 3：耦合与执行优化是主要贡献，范式新意有限。\n- 未涉及动态场景/大规模室外长时序（对照库内 AMB3R-SLAM 的公里级场景）。\n- 代码开源情况摘要未明示。"},{"h":"与文献库的关系","body":"- **互补并列**：与库内 RawSLAM（2609.20589，S 4.50，在线 HDR 高斯 SLAM）、RRG-SLAM（2609.34527，A 3.85，实时反射感知高斯室内 SLAM）同属「高斯/神经化 SLAM」家族但传感器模态不同（LiDAR-惯性 vs 视觉）；与 AMB3R-SLAM（2609.19518，S 4.50）在大规模后端上互补（LIN-SLAM 主打轻量实时）。\n- **取代**：无（门① max Jaccard 0.235 vs RRG-SLAM）。"},{"h":"可复现性","body":"- 12 序列、三数据集、每帧耗时报告完整；硬件（Jetson Orin NX）明确；代码开源情况未明示。"},{"h":"行动建议","body":"- 机载/嵌入式 LiDAR SLAM 选型时纳入对比（尤其 32–128 线配置）；重点复测其 ATE 与每帧耗时。\n- 后续追踪：与 PIN-SLAM/CLID-SLAM 系的后续版本对比；动态场景扩展。"}]},{"file":"../papers/notes/2610.21282__LICOA移动SAR指令条件光学动作.md","id":"2610.21282","title":"LICOA: Learning Instruction-Conditioned Optical Actions for Mobile Spatial Augmented Reality","title_zh":"LICOA：面向移动空间增强现实的指令条件光学动作学习","track":"空间计算与UI","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.65,"evidence":"FULL","tags":["空间增强现实","投影","具身智能","VLA","光学动作"],"flags":[],"sections":[{"h":"一句话结论","body":"把「投影光」变成具身动作：差分底盘负责房间级移动、2 自由度可转向反射镜 + 投影缩放负责光束局部控制，通用动作模型（VLA）经共享接口适配到这一新光学本体；12 任务真机评估中最佳适配模型成功率 57.50%（69/120），比同架构从零训练高 49.17 个百分点，150 次真机消融验证了双相机视图与底盘-镜协同的必要性。"},{"h":"要解决的问题","body":"空间增强现实（SAR）用投影改造物理环境，但多数系统假设投影机位姿、目标区域或运动路径是固定或预先指定的。给定语言指令与当前视觉观测，让系统自己决定怎么移动、往哪投、投多大——即「指令条件的光学动作」——此前的移动投影系统缺闭环学习控制，也无配套语料与评测协议。"},{"h":"方法详解","body":"- **硬件平台**：差分驱动底盘（room-scale 接近与重定位）+ 2DoF 可转向反射镜（pan/tilt）+ 投影缩放（光束大小），形成「粗（底盘）+ 细（镜面）」互补的运动尺度。\n- **共享接口**：把同步的外部相机与机载相机观测、机器人控制状态统一映射为动作模型的输入，使预训练通用动作模型（RT-1/RT-2/Open X-Embodiment 谱系，含 π0.5 等）可迁移到光学本体；适配非平凡——模型需协调底盘速度、绝对镜面 pan/tilt、投影缩放与终止信号。\n- **语料与协议**：构建匹配仿真语料用于训练 + 真机评估协议（均匀白色矩形投影，把「物理放置」能力与内容质量解耦）。"},{"h":"实验与结果","body":"- **12 任务真机评估**：最佳适配动作模型（π0.5 适配）**成功率 57.50%（69/120）**、路径长度加权 40.64%；同架构从零训练仅 8.33% / 5.15%。\n- **对比**：较 Fast-WAM、π0-FAST、π0.5-scratch 分别高 **28.33 / 40.00 / 49.17 个百分点**；且是唯一在每个任务上都至少成功过一次的动作模型（对手分别在 7/5/7 个任务上非零成功）。\n- **消融**：150 次真机 rollout 验证双相机视图均必需、底盘与镜面需协同控制。"},{"h":"创新点与贡献","body":"1. 提出并实现「投影光即具身动作」：SAR 从「投影内容展示」走向「光线的闭环控制放置」。\n2. 通用 VLA 向新光学本体适配的共享接口 + 仿真语料 + 真机协议，补上该方向的评测空白。\n3. 从零训练 vs 预训练适配的 49.17 pp 差距，为「预训练动作先验可迁移到非机械臂本体」提供强证据。"},{"h":"局限与风险","body":"- SAR 属小众方向（IMP 3）：应用场景（投影互动装置/情境式 SAR）尚未大规模验证需求。\n- 评估用均匀白色矩形投影， deliberately 隔离了内容维度；真实投影内容的联合优化未覆盖。\n- 12 任务规模有限；真机协议在单一环境构建。"},{"h":"与文献库的关系","body":"- **互补**：与库内 NavSight（2608.12759，A 3.73，低视力户外导航移动 AR 真实部署）同属「AR 系统级真实部署」但机制完全不同（投影机器人 vs 手持 AR 导航）；与库内 SAR/投影类条目构成该子方向首批条目之一。\n- **取代**：无（门① max Jaccard 0.154 vs NavSight）。"},{"h":"可复现性","body":"- 仿真语料 + 真机评估协议 + 150 次消融 rollout 均已披露；硬件为定制平台（底盘 + 镜面），复现需自制硬件。"},{"h":"行动建议","body":"- 做 SAR/投影互动装置时评估该平台与协议；VLA 选型上优先「预训练适配」而非从零训练。\n- 后续追踪：投影内容与放置的联合优化；多投影机组协同。"}]},{"file":"../papers/notes/2610.21619__免训练目标感知精化3D高斯语言地图.md","id":"2610.21619","title":"Training-Free Target-Aware Refinement of 3D Gaussian Language Map","title_zh":"免训练目标感知精化：3D 高斯语言地图的可靠目标检索","track":"感知与认知","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.72,"evidence":"FULL","tags":["3D高斯语言地图","开放词汇","免训练","语言目标导航","SAM"],"flags":[],"sections":[{"h":"一句话结论","body":"对已蒸馏的 3D 高斯语言地图做事后「免训练」精化：用 SAM 在每个训练视图定位用户指定目标、按闭式解算出的注入强度把区域视觉嵌体积向目标文本嵌入凸混合，再用中心化读出把精化地图变成可靠的 3D 语言目标位置——Replica 上开放词汇分割 mIoU 约翻倍，语言目标定位 top-1 从 44.6% 升到 57.1%，且可作为即插模块装入现成语言地图管线，四足机器人在真实楼宇中按自然语言目标导航验证。"},{"h":"要解决的问题","body":"把视觉-语言特征蒸馏进 3DGS 得到的语言地图可被任意文本查询，但部署时真正要用的是一小撮用户指定目标的可靠定位——现有蒸馏地图经常漏检这些目标；同时开放词汇查询能力必须保持。训练期方法（重蒸馏/微调）成本高，且容易为了目标牺牲开放词汇性。"},{"h":"方法详解","body":"1. **目标感知特征注入**：对每个训练视图，用文本提示分割器（SAM）定位每个用户指定目标，把检测区域内的视觉嵌入与目标文本嵌入做凸组合混合，混合系数即注入强度；非目标区域不动。\n2. **闭式解最小注入**：每个检测存在「翻转点」——能赢得 argmax 的最小 α，有闭式解；取所有视图捕获曲线（capture curve）的拐点设定 α*，**无超参数**。\n3. **中心化定位读出**：注入会种下一个查询无关的公共模态（common mode），中心化读出将其去除，把精化地图变成可靠的 3D 目标位置源。\n4. **即插即用**：精化作用于每视图特征、再提升到冻结几何上，可落入现有语言地图流水线（field-based 与 object-level 均验证）。"},{"h":"实验与结果","body":"- **基准**：8 个 Replica 场景 + 10 个 ScanNet 场景 + 4 个 HM3D-Semantics 多房间场景（LagMemo 从 GOAT-Bench 策划）。\n- **开放词汇分割**：同一精化在各基准上同时改善；Replica 上 base mIoU **约翻倍**。\n- **语言目标定位**（实例感知 top-K 成功率，field-based 地图）：Replica top-1 从 Base 44.6% → Base+centering 57.1% → Ours 更高（Table IV）；ScanNet 相应提升。\n- **真机演示**：四足机器人在真实建筑楼宇地板上按自然语言目标导航。\n- 另有两项单协议研究（为何最小注入有效等）。"},{"h":"创新点与贡献","body":"1. 把「目标可靠检索」从训练期问题转为训练后、免训练的精化问题，且闭式解注入强度做到零超参。\n2. 中心化读出去除注入副作用（公共模态），保住开放词汇性——「要可靠也要开放」的兼顾有实验支撑。\n3. 即插模块形态 + 真机导航验证，工程迁移成本低。"},{"h":"局限与风险","body":"- 依赖 SAM 的检测质量；只在训练视图观测到的目标可靠（在线建图与稀疏观测目标是作者列的 next step）。\n- 精化针对「一小撮部署词表」，开放词汇场景的长期行为需持续评估。\n- 由 Samsung Electronics 支持；代码已开源（项目页 lab-of-ai-and-robotics.github.io/target-aware-langmap）。"},{"h":"与文献库的关系","body":"- **改进**：相对库内各类「训练期联合语义」3DGS 语义地图，本作是「训练后/在线解耦」路线的代表（与 10-08 批次 2610.08756 训练后语义提升、2610.07569 在线场景图同一趋势），非取代。\n- **取代**：无（门① max Jaccard 0.188 vs FlyMark，仅标题词面相似，实质无关）。"},{"h":"可复现性","body":"- **代码开源**（项目页明确给出）；三基准 + 真机协议完整；注入强度闭式解无超参，复现门槛低。"},{"h":"行动建议","body":"- 做语言驱动的 AR 场景交互/机器人取物时，可直接把该精化模块装到现有语言地图上；优先复测「mIoU 翻倍」与「top-1 +12.5 pp」。\n- 后续追踪：在线 mapping 扩展；稀疏观测目标的处理。"}]},{"file":"../papers/notes/2610.21634__Anchor3DGS锚基前馈3DGS.md","id":"2610.21634","title":"Anchor3DGS: Feed-Forward 3D Gaussian Splatting with Compact Anchor-Based Representation","title_zh":"Anchor3DGS：紧凑锚基表示的前馈 3D 高斯泼溅（免位姿）","track":"神经渲染","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.85,"evidence":"FULL","tags":["3DGS","前馈重建","稀疏视角","免位姿","锚点"],"flags":[],"sections":[{"h":"一句话结论","body":"把前馈 3DGS 从「逐像素预测一个高斯」改为「信息熵引导放置 3D 锚点 + 遮挡感知多视角聚合 + 锚点解码为局部高斯」：稀疏视角（3/6 视图）在 VR-NeRF/MipNeRF360/DL3DV 上全面最优（MipNeRF360 与 DL3DV PSNR +2 dB 以上），且每场景仅需 0.26M 高斯（比像素对齐少一个数量级），还免输入位姿。"},{"h":"要解决的问题","body":"已有前馈 3DGS 采用像素对齐范式：每个输入像素预测一个高斯，导致（1）高斯数量与输入分辨率/视图数耦合；（2）无纹理区域产生冗余高斯、几何复杂区域覆盖不足；（3）多数方法依赖已知相机位姿。如何让前馈预测的表示规模由场景内容而非输入规模决定，是核心问题。"},{"h":"方法详解","body":"1. **免位姿几何初始化（pose-free geometry initialization）**：不依赖输入位姿，先构建几何感知的场景脚手架（scaffold）。\n2. **熵引导锚点采样（entropy-guided anchor sampling）**：按视觉信息熵在场景中放置一组 3D 锚点——高复杂度区域多放、简单区域少放，同时保持广泛空间覆盖。\n3. **遮挡感知多视角锚点聚合（occlusion-aware multi-view anchor aggregation）**：每个锚点从多视角聚合图像特征（考虑遮挡关系），并通过锚点间自注意力把上下文传播到观测不足的区域，缓解像素对齐方法的「空洞」。\n4. **锚点到高斯的解码与渲染**：每个锚点解码为一组局部高斯，表示规模由锚点预算控制，与输入视图数解耦。"},{"h":"实验与结果","body":"- **稀疏视角（3/6 输入视图）**：VR-NeRF、MipNeRF360、DL3DV 三个基准上 PSNR/SSIM/LPIPS 全面最佳；MipNeRF360 与 DL3DV 上较最佳基线 PSNR 提升 **2 dB 以上**；每场景仅 **0.26M** 高斯。\n- **稠密视角（32 输入视图）**：与 SOTA 像素对齐基线质量相当，但高斯数少一个数量级、存储足迹更小；#GS 不随视图数增长（恒 0.26M），而像素对齐方法产出数百万高斯且无对应质量增益。\n- **效率**：VGGT+3DGS 每场景需数分钟优化，Anchor3DGS 单次前向直接预测（附录含渲染速度分析）。"},{"h":"创新点与贡献","body":"1. 前馈 3DGS 的表示范式转移：从像素对齐到「内容决定的锚点表示」，高斯数量与输入规模解耦。\n2. 熵引导放置 + 遮挡感知聚合 + 锚点间自注意力的组合，直接针对无纹理冗余与观测空洞两个失效模式。\n3. 免位姿 + 紧凑（0.26M）+ 前馈三者兼得。"},{"h":"局限与风险","body":"- 稀疏视角增益大，但 32 视图稠密设定下仅为「质量相当 + 更紧凑」，颠覆性有限。\n- 0.26M 高斯的紧凑性以锚点预算为上界，极复杂场景的保真度上限待考。\n- 与库内 PocketSplat（世界空间潜分配）/ Budgeted-GS（因式分解 LOD）未同基准对比，「紧凑前馈表示」家族内部优劣未定。"},{"h":"与文献库的关系","body":"- **并列（新路线）**：与库内 PocketSplat（2610.03192，S 4.28，世界空间潜分配）和 Budgeted-GS（2610.03162，S 4.65，因式分解 LOD）共同构成「紧凑前馈 3DGS 表示」家族；Anchor3DGS 的区分点是锚点 + 熵引导 + 免位姿。另与 VoxelTTO（2609.21498，体素对齐前馈 3DGS + 测试时优化）在「前馈 + 紧凑」上相邻但机制不同。\n- **取代**：无（门① max Jaccard 0.353 vs VoxelTTO，同族非取代）。"},{"h":"可复现性","body":"- 附录含实现细节、模型架构、测试协议、更多消融（位姿估计、多视角一致性、速度分析），复现要素齐全；代码开源情况未明示。"},{"h":"行动建议","body":"- 需要快速 3D 化的 XR 内容管线（扫描即入场景）可优先评估；把「锚点预算」作为质量-存储旋钮。\n- 后续追踪：与 PocketSplat/Budgeted-GS 的同基准对比是否出现；锚点范式是否会成为前馈 3DGS 主流。"}]},{"file":"../papers/notes/2610.21668__Edit4D可编辑4D场景生成.md","id":"2610.21668","title":"Edit4D: Editable 4D Scene Generation with Textual Control","title_zh":"Edit4D：文本可控的可编辑 4D 场景生成（背景-角色解耦）","track":"内容生成","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.65,"evidence":"FULL","tags":["4D生成","文本到4D","3DGS","可编辑性","场景组合"],"flags":[],"sections":[{"h":"一句话结论","body":"把 4D 场景拆成「背景场景」与「动态角色」两条独立生成线，再用接触感知的组合优化（初始化 + 接触损失 + 穿透损失 + 全局精化）缝成统一的 4D 高斯表示：VBench 上取得 SOTA 生成质量，同时实现对象级编辑——编辑时未动部分保持得更好、编辑时间更短，且大相机视角变化下仍稳健。"},{"h":"要解决的问题","body":"文本驱动的动态场景合成已进步，但「可编辑的 4D 场景生成」仍是难点：现有方法生成整体式场景视频，背景与动态角色耦合在一起，对象级编辑与灵活相机控制都困难；直接编辑又会破坏空间几何与时序动态的一致性。"},{"h":"方法详解","body":"1. **可编辑 4D 场景表示**：基于 3D Gaussian Splatting 的 4D 表示，背景与角色分离存储。\n2. **分阶段生成流水线**：给定用户指令，先将其分解为阶段性子任务；用现成生成先验分别生成背景场景与动态 3D 角色，再组合进统一 4D 表示（附录给出指令分解、背景生成、角色生成、组合、全局精化的实现细节与 runtime）。\n3. **场景-角色组合**：初始化放置 + 接触损失（角色不悬空）+ 穿透损失（不穿模）+ 全局场景精化，保证语义与物理上合理的角色放置。"},{"h":"实验与结果","body":"- **VBench（三指标）**：Text Align（ViClip 视频-文本相似度）、Consistency（DINO/CLIP 时序一致性）、Aesthetic（LAION 美学预测器）——对近期 4D 生成方法取得 **SOTA**。\n- **可编辑性评估**：与整体重生成相比，更好保持未编辑场景内容、编辑时间更短。\n- **定性**：大相机视角变化下仍能保持连贯 4D 场景，支持可靠的新视角合成与动态相机控制。\n- **用户研究**：附录 D 含用户研究细节。\n- **消融**：去掉初始化/接触损失/穿透损失/全局精化分别劣化不同指标（错误放置、悬空、穿模），全模型最佳。"},{"h":"创新点与贡献","body":"1. 「背景-角色解耦 + 分阶段生成」的编辑友好 4D 生成框架，把可编辑性做进生成过程而非事后补丁。\n2. 接触感知组合优化（接触 + 穿透损失）解决角色-场景物理合理性。\n3. 生成质量（VBench SOTA）与可编辑性同时成立，且有用户研究佐证。"},{"h":"局限与风险","body":"- 依赖现成生成先验的质量与覆盖；角色为「动态 3D 角色」粒度，更细粒度对象编辑未覆盖。\n- 评测基于公开示例视频（frontal-view）与 VBench 指标，真机/真景 XR 场景中的适用性待考。\n- 由韩国 IITP/MSIT 资助；代码开源情况未明示。"},{"h":"与文献库的关系","body":"- **并列**：与库内 MATE4D（2610.11181，A 3.70，单图可编辑 4D 生成）同属「可编辑 4D 生成」但输入模态与编辑粒度不同（文本 + 背景/角色解耦 vs 单图 + 矩阵引导）；与 Tetris3D（2610.10539，A 3.85，物体严丝合缝 3D 场景生成）在「组合式生成」上相邻（3D 静态 vs 4D 动态）。\n- **取代**：无（门① max Jaccard 0.250 vs Tetris3D）。其对比的 Free4D 等不在库内。"},{"h":"可复现性","body":"- 附录披露实现细节与 runtime；用户研究 + 可编辑性协议完整；代码开源情况未明示。"},{"h":"行动建议","body":"- 做 XR 内容创作工具（文本 → 可编辑 4D 场景）时评估该框架；重点复测可编辑性协议（保持性 + 编辑时间）。\n- 后续追踪：库内 MATE4D 与 Edit4D 是否出现同基准对比与路线归一。"}]},{"file":"../papers/notes/2610.21965__粘弹性渲染感知对比分数阶vs整数阶.md","id":"2610.21965","title":"Perceptual Comparisons of Viscoelastic Renderings: Fractional- vs Integer-Order Models","title_zh":"粘弹性渲染的感知对比：分数阶 vs 整数阶模型","track":"触觉与多模态","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.65,"evidence":"FULL","tags":["触觉渲染","粘弹性","分数阶模型","感知评估","人在环"],"flags":[],"sections":[{"h":"一句话结论","body":"用 76 人次的感知实验直接回答「分数阶粘弹性模型的高保真度能否转化为感知优势」：能——记忆棉上 FO-SLS 被判「接近实物」的比例 77%（系统辨识参数）/74%（HiL 优化参数），远超整数阶 IO-SLS 的 35%/33% 与 IO-GM 的 39%；两两偏好中 FO-SLS 以约 76–79% 胜出，硬硅胶上趋势相同。"},{"h":"要解决的问题","body":"粘弹性材料的触觉渲染要复现蠕变与应力松弛等时间相关行为，依赖材料的「记忆效应」。分数阶粘弹性模型已被证明能准确且紧凑地刻画这些动力学，但「更高的建模保真度是否真的被人感知为更真实」一直没有直接答案——这决定了触觉渲染社区是否值得为分数阶模型的复杂度买单。"},{"h":"方法详解","body":"- **模型对比**：分数阶标准线性固体 FO-SLS vs 两种整数阶模型——3 参数 SLS（IO-SLS）与 5 参数广义 Maxwell 模型（IO-GM）。\n- **参数确定的两条路径**：（A）系统辨识（客观最优）；（B）人在环优化（HiL，感知最优）。\n- **实验硬件**：BEI Kimco LA28-15-002Z 直线作动器 + U.S. Digital 光学编码器（2000 counts/inch），3D 打印手柄；MATLAB RTE 实时 1 kHz 开环阻抗控制。\n- **材料**：记忆棉 + 硬硅胶两种参考物。"},{"h":"实验与结果","body":"- **被试规模**：HiL 优化实验 24 人（记忆棉）/ 8 人（硬硅胶）；性能对比实验 28 人（记忆棉）/ 16 人（硬硅胶），共 76 人次；每场次前有约 5 分钟熟悉化。\n- **记忆棉**：FO-SLS 判为「接近实物」77%/74%，vs IO-SLS 35%/33%、IO-GM 39%；两两偏好 FO-SLS 超 IO-SLS 79%/76%、超 IO-GM 78%/75%。\n- **硬硅胶**：FO-SLS 判「接近」68%/69%，vs IO-SLS 27%/36%、IO-GM 52%/45%；偏好超 IO-SLS 76%/71%、超 IO-GM 62%/69%。\n- **参数策略**：另比较系统辨识 vs HiL 两种参数选择策略的感知后果（VI-C）。"},{"h":"创新点与贡献","body":"1. 首个系统性的「分数阶 vs 整数阶」粘弹性渲染**感知对比**研究，把建模保真度与感知 realness 之间的链条补上。\n2. 双材料 × 双参数策略 × 分类 + 两两偏好 的多因子设计，证据强度高。\n3. 真机 1 kHz 开环阻抗控制下的高保真渲染实现，可直接复用。"},{"h":"局限与风险","body":"- 开环阻抗控制（非力反馈闭环）；结论向闭环系统的外推待验证。\n- 两种材料、单一作动器配置；结论的材料普适性有限。\n- 被试量（28/16）属中等规模；效应量大（优势 40+ 个百分点）使结论仍稳健。"},{"h":"与文献库的关系","body":"- **填补空白**：库内「触觉与多模态」赛道此前以触觉感知/世界模型（DexTouch-WM 2609.20649）与触觉反馈遥操作（ModPack 2607.19479）为主，**粘弹性渲染的感知验证是空白维度**；本篇 + 待 backfill 的 2512.00667（分数阶参数主动学习，同课题组方向）形成「建模-感知验证」组合。\n- **取代**：无（门① max Jaccard 0.095）。"},{"h":"可复现性","body":"- 硬件（作动器 + 编码器型号）、控制率（1 kHz 开环阻抗）、协议（熟悉化、分类矩阵、两两偏好）均披露；复现门槛中高（需真机）。"},{"h":"行动建议","body":"- 做触觉渲染（尤其是材料编辑/虚拟纹理）时直接采用 FO-SLS 参数化；用 HiL 优化替代纯系统辨识。\n- 后续追踪：闭环版本；更多材料类别（剪切变稀、塑性）的分数阶感知验证；与 2512.00667 的联合复测。"}]},{"file":"../papers/notes/2610.22363__P3-WAM统一世界动作模型.md","id":"2610.22363","title":"Perceive, Predict, and Plan: a Unified World Action Model for Egocentric Dexterous Manipulation","title_zh":"P3-WAM：第一视角灵巧操作的统一世界-动作模型（感知-预测-规划）","track":"世界模型与仿真","date":"2026-10-16","batch":"2026-10-17","batchLabel":"2026-10-17 · 10-16 公告批次（积压补齐）","grade":"A","value":3.85,"evidence":"FULL","tags":["世界动作模型","第一视角","灵巧操作","视频扩散","混合Transformer"],"flags":[],"sections":[{"h":"一句话结论","body":"把「感知-预测-规划」三件事塞进同一个模型：以紧凑结构化 3D 动作表示注入预训练视频扩散 Transformer（mixture-of-transformers 架构），Perceive 从视频重建 articulated 手部运动与相机轨迹、Predict 生成动作条件视觉未来、Plan 联合生成动作轨迹与预期视觉后果；统一训练使三模式互益，三任务均超专用 SOTA，且规划出的人手动作可迁移到真机灵巧手。"},{"h":"要解决的问题","body":"第一视角灵巧操作涉及感知（手/相机 3D 运动）、预测（动作导致什么视觉变化）、规划（为达成目标该做什么）三种能力。已有工作各自为政：世界模型善于时空先验但语义推理弱，VLA 善语义但缺世界动态 grounding。如何用一个模型同时具备三能力且互相增强，是开放问题。"},{"h":"方法详解","body":"- **耦合视频-动作 Transformer**：把紧凑、结构化的 3D 动作表示（MANO 参数、空间关节位置、时序运动）集成进预训练视频扩散 Transformer，采用 mixture-of-transformers（模态特定适配 + 共享权重）架构；附录详述共享权重、注意力与 token 编码、掩码输入构建与时序模式采样、动作目标。\n- **三模式**：\n  - **Perceive**：从视频重建 articulated 手部运动与相机轨迹；\n  - **Predict**：在给定动作下生成视觉未来；\n  - **Plan**：以初始图像 + 语言指令 + 可选视觉目标为条件，联合生成动作轨迹及其预期视觉后果。\n- **统一训练**：三模式共享同一模型，实验表明统一训练同时受益于三者。"},{"h":"实验与结果","body":"- 先验证统一训练对每个模式的收益（Sec 4.1），再在各自任务上与专用基线对比（Sec 4.2–4.4）：**Perceive / Predict / Plan 三任务均超过 SOTA 基线**。\n- 规划生成的人手动作可迁移到真实灵巧机器人执行（机器人部署实验）。\n- 附录含附加方法细节与更多实验。"},{"h":"创新点与贡献","body":"1. 单一模型内统一 perceive-predict-plan 三模式，且证明统一训练互益（而非互相掣肘）。\n2. 结构化 3D 动作表示 + 视频扩散先验的耦合方式（MoT 架构），为「动作条件世界模型」提供了可复用的集成方案。\n3. 人手动作 → 真机灵巧手迁移的端到端演示。"},{"h":"局限与风险","body":"- 单目视频估计全局 3D 手部位置本质歧义（作者自述）；触觉/深度传感可提供更强几何约束。\n- 机器人实验为开环执行；闭环反馈与更长时程鲁棒性待验证。\n- 披露：生成式 AI 参与了稿件撰写/编辑、figure 与研究代码开发调试。"},{"h":"与文献库的关系","body":"- **同族并列**：与库内 UniWAM（2610.02054，统一世界-动作模型，B）直接同族（门① max Jaccard 0.357 即来自它）——P³-WAM 把该路线推到第一视角灵巧操作场景并加入显式 3D 结构。与 Astronex-World（2609.20034，S 4.32，实时世界模型基座）构成「通用世界模型 → 任务专用世界-动作模型」的谱系。\n- **并列竞合**：与 EgoJEPA（2610.20904，本期第 2）同周出现、同攻「第一视角操作先验迁移」，但机制不同（统一世界-动作模型 vs 潜动作免重定向），社区可能收敛，需追踪。"},{"h":"可复现性","body":"- 架构与训练细节在附录中充分披露；代码开源情况摘要未明示。"},{"h":"行动建议","body":"- 做具身智能体时评估「一个模型三模式」是否适合你的任务组合；重点关注统一训练是否真的互益（复测 Sec /* ---------- shared svg ---------- */
function radarSVG(scores,size,color){
  size=size||240;color=color||"#5b8cff";
  const cx=size/2,cy=size/2,R=size/2-36,n=7;let g="",dp=[];
  for(let ring=1;ring<=5;ring++){
    const rr=R*ring/5,p=[];
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}
    g+='<polygon points="'+p.join(" ")+'" fill="none" stroke="#263353" stroke-width="1"/>';
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n;
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#263353"/>';
    const lx=cx+(R+19)*Math.cos(a),ly=cy+(R+19)*Math.sin(a);
    g+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#98a5c0" font-size="11" text-anchor="middle" dominant-baseline="middle">'+DIMS[i].k+'</text>';
    const v=Math.max(0,Math.min(5,scores[DIMS[i].k]||0)),rr=R*Math.max(v,0.12)/5;
    dp.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+g+
    '<polygon points="'+dp.join(" ")+'" fill="'+color+'33" stroke="'+color+'" stroke-width="2"/></svg>';
}
function donutSVG(series,size){
  size=size||210;const r=72,cx=size/2,cy=size/2,C=2*Math.PI*r;
  const total=series.reduce((a,s)=>a+s.value,0)||1;let acc=0,g="";
  series.forEach(s=>{
    const frac=s.value/total;
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="26" '+
       'stroke-dasharray="'+(frac*C-1.5).toFixed(2)+' '+(C-frac*C+1.5).toFixed(2)+'" '+
       'stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    acc+=frac;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+g+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#e8edf7" font-size="22" font-weight="700">'+total+'</text>'+
    '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" fill="#98a5c0" font-size="11">篇</text></svg>';
}
function trendSVG(rows){
  const W=940,H=250,pl=42,pr=44,pt=14,pb=52;
  const iw=W-pl-pr,ih=H-pt-pb;
  const maxC=Math.max.apply(null,rows.map(r=>r.count).concat([1]));
  const bw=Math.max(10,iw/rows.length-14);
  let g="",xs=[],ys=[];
  rows.forEach((r,i)=>{
    const x=pl+iw*(i+0.5)/rows.length;
    const h=ih*r.count/maxC;
    const col=r.xrCount!=null?"#5b8cff":"#3a4a75";
    g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'" opacity="0.9"><title>'+esc(r.label)+'：新增 '+r.count+' 篇</title></rect>';
    if(r.count>0)g+='<text x="'+x.toFixed(1)+'" y="'+(pt+ih-h-5).toFixed(1)+'" text-anchor="middle" fill="#98a5c0" font-size="10.5">'+r.count+'</text>';
    const yv=r.avg==null?null:pt+ih-ih*r.avg/5;
    if(yv!=null){xs.push(x.toFixed(1));ys.push(yv.toFixed(1));}
    const lb=r.label.length>10?r.label.replace("2026-",""):r.label;
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-30)+'" text-anchor="middle" fill="#6b7a99" font-size="10" transform="rotate(-32 '+x.toFixed(1)+' '+(H-30)+')">'+esc(lb)+'</text>';
  });
  if(xs.length>1)g+='<polyline points="'+xs.map((x,i)=>x+","+ys[i]).join(" ")+'" fill="none" stroke="#f5c542" stroke-width="2"/>';
  xs.forEach((x,i)=>{g+='<circle cx="'+x+'" cy="'+ys[i]+'" r="3" fill="#f5c542"/>';});
  for(let v=0;v<=5;v+=1){
    const y=pt+ih-ih*v/5;
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#1c2742"/>'+
       '<text x="'+(pl-7)+'" y="'+(y+3.5)+'" text-anchor="end" fill="#6b7a99" font-size="10">'+v+'</text>'+
       '<text x="'+(W-pr+7)+'" y="'+(y+3.5)+'" fill="#6b7a99" font-size="10">'+v+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>';
}
function scoreCell(v){
  const t=Math.max(1,Math.min(5,v||0));
  return '<span class="dimcell" style="background:'+SCORE_BG[t-1]+';color:#fff">'+v+'</span>';
}
function miniBars(scores){
  return '<span class="minibar">'+DIMS.map(d=>{
    const v=scores[d.k]||0;
    return '<i style="height:'+Math.max(8,v/5*16)+'px;background:'+SCORE_BG[Math.max(1,Math.min(5,v))-1]+'" title="'+d.k+' '+d.zh+'：'+v+'"></i>';
  }).join("")+'</span>';
}
function trackChip(t){
  const c=TRACK_COLORS[t]||"#8a93a8";
  return '<span class="chip track" style="background:'+c+'1f;color:'+c+';border-color:'+c+'55">'+esc(t)+'</span>';

function gradeChip(g){return '<span class="chip '+g+'">'+g+'</span>';}
function evChip(e){
  const cls=e==="FULL"?"ev":(e==="PARTIAL"?"ev PARTIAL":"ev ABSTRACT_ONLY");

  return '<span class="chip '+cls+'" title="证据等级 '+esc(e)+'">'+zh+'</span>';
}

function prow(p,i){
  const ni=DATA.noteIndex[p.id];
  const badges=[];
  if(p.top10)badges.push('<span class="chip top10" style="transform:scale(.82)">TOP10</span>');
  if(p.evidence)badges.push(evChip(p.evidence));
  if(p.outdated||(p.flags&&p.flags.length))badges.push('<span class="chip warn" style="transform:scale(.82)" title="'+esc((p.flags||[]).join("；")||"方法路线落后")+'">⚠️</span>');
  if(ni!=null)badges.push('<button class="btn" data-gonote="'+ni+'">📖 笔记</button>');
  return '<div class="prow"><span class="rk">'+(i+1)+'</span>'+
    '<a class="pname" href="https://arxiv.org/abs/'+p.id+'" target="_blank" title="'+esc(p.title_zh)+'">'+esc(p.title_zh)+'</a>'+
    '<span class="chip '+p.grade+'" style="transform:scale(.82)">'+p.grade+'</span>'+
    '<span class="mono pv">'+fmt(p.value)+'</span>'+
    '<span class="pbadges">'+badges.join("")+'</span></div>';
}
const DAILY_SORTS=[["date-desc","排序：时间 新→旧"],["date-asc","排序：时间 旧→新"],
  ["count-desc","排序：新稿数 多→少"],["count-asc","排序：新稿数 少→多"],
  ["avg-desc","排序：均分 高→低"],["avg-asc","排序：均分 低→高"],["max-desc","排序：最高分 高→低"]];
function dailySorted(){
  const arr=DATA.batches.slice();
  const skAsc=(a,b)=>{const x=a._sort||[a.key,0],y=b._sort||[b.key,0];
    if(x[0]!==y[0])return x[0]<y[0]?-1:1;return x[1]-y[1];};
  const skDesc=(a,b)=>{const x=a._sort||[a.key,0],y=b._sort||[b.key,0];
    if(x[0]!==y[0])return x[0]<y[0]?1:-1;return x[1]-y[1];};
  const num=(av,bv,desc)=>{const a=(av==null?Infinity:av),b=(bv==null?Infinity:bv);if(a===b)return 0;return desc?(b-a):(a-b);};
  switch(state.daily.sort){
    case "date-asc":arr.sort(skAsc);break;
    case "count-desc":arr.sort((a,b)=>(b.papers.length-a.papers.length)||skDesc(a,b));break;
    case "count-asc":arr.sort((a,b)=>(a.papers.length-b.papers.length)||skAsc(a,b));break;
    case "avg-desc":arr.sort((a,b)=>num(a.avg,b.avg,true)||skDesc(a,b));break;
    case "avg-asc":arr.sort((a,b)=>num(a.avg,b.avg,false)||skAsc(a,b));break;
    case "max-desc":arr.sort((a,b)=>num(a.max,b.max,true)||skDesc(a,b));break;
    default:arr.sort(skDesc);
  }
  return arr;
}
