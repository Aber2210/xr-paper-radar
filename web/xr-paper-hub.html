-26","grade":"A","value":4.05,"evidence":"FULL","tags":["\"VR安全\"","\"运动水印\"","\"匿名认证\"","\"隐写\"","\"重识别\""],"flags":[],"sections":[{"h":"一句话结论","body":"MoSign 把\"水印\"从静态标签重新定义为一种**协议**：在匿名 VR 用户的生成式运动风格隐变量中嵌入随时间变化的密钥化消息，使得水印运动与无水印运动统计不可区分，而唯一持有密钥的验证方可用序贯假设检验完成认证；首次给出在骨架运动模态上的\"生成期内水印 + 实体认证\"，并正面解决公共 VR 的\"模拟漏洞（analog hole）\"。"},{"h":"要解决的问题","body":"沉浸式社交 VR 把匿名化身放进共享空间，但两个需求冲突：其一，**运动即身份**——头部/手部遥测在十万级用户上可唯一识别（94.33% 准确率），并泄露四十余项隐私属性，因此实时运动匿名器正在被部署；其二，**匿名瓦解问责**——匿名后用户无法向选定对方/服务/审核系统证明\"我就是之前那位可信 agent\"。现有生成式水印（图像/视频/3D）面向溯源、假设对手编辑载体而非录制重放，静态水印在运动身体上等于\"身体持续广播的密码\"；经典动作捕捉水印是事后、手工、与生成器解耦的。MoSign 要填补\"匿名之内的认证\"这一缺失原语。"},{"h":"方法详解","body":"- **载体选择**：transformer VAE（ℰ,𝒢）把运动分解为内容隐变量 𝐳_m 与逐窗口风格隐变量 𝐳_p（d=256）；解码器经逐层自适应归一化以 𝐳_p 为条件。𝐳_p 调制全局风格、充当水印载体，而 𝐳_m 携带时间内容、水印从不改动——身份中性，不引入隐私泄露。\n- **密钥化嵌入（证明方）**：对 epoch e、会话 nonce r、密钥 k、部署上下文 ctx 构造时变标记 m_e=HMAC_k(e‖r‖ctx)[:κ]；ECC(BCH(63,30,t=6)) 纠错；rep(c)⊕PRF_k(e‖r‖ctx) 平铺到宽度 d 并异或密钥流，使无密钥观察者看到的符号模式为伪随机 i.i.d.；最终 𝐳_p[i]=|ζ_i|(2b_i−1)，ζ∼𝒩(0,I)。\n- **读取与验证（验证方）**：仅持有密钥的一方读取消息并以序贯概率比检验（SPRT）认证。\n- **四项关键设计**：(1) 时变消息＝对当前 epoch+nonce 的密钥化 MAC，使重放天然失效；(2) BCH(63,30,t=6) 在码字域比较、无需解码；(3) 密钥流白化使边际 𝐳_p 保持 𝒩(0,I)，任何隐空间检验都恰好是随机猜测（命题 1）；(4) HMAC 与 PRF 是同一 PRF 在互斥标签前缀下的两次调用，分析归结为单一 PRF。"},{"h":"实验与结果","body":"- 通道级认证：清洁运动与重采样/平滑/噪声/重定向下 TPR=1.0@FPR=10⁻⁴，实证 FPR=0/1400，中位认证时延 2 秒；dropout 0.96、crop 0.78（最弱），temporal-DWT 读出仍保持码字精度 0.87。\n- 不可检测性（C3）：对判别器动物园（同构判别器、RBF-MMD 置换检验、逐维 KS）保持隐变量分布；在部署 𝐳_p 上训练判别器 AUC=0.50，池化 KS=0.0009，RBF-MMD p=0.86——与 𝒩(0,I) 不可分。\n- 抗重放/伪造：对 30000 次（无水印运动 + 错误密钥）零误接受；跨密钥误接受在人群尺度上随查询预算有界。\n- 与匿名器组合（C3）：在 1000 名 BOXRR-23 用户上重放已发表的去识别攻击，未打开去匿名侧信道。"},{"h":"创新点与贡献","body":"首次将\"生成期内水印\"与\"实体认证\"结合到骨架运动模态，并以密码学可证明的不可检测/抗重放/抗有界查询伪造来替代经验声明；把水印建模为协议而非标签，是对水印范式的一次清晰重构。"},{"h":"局限与风险","body":"- 评估依赖公开数据集（HumanML3D/AMASS/BOXRR-23）与 SMPL 许可，未做真实 VR 头显内的人体实时匿名+认证端到端部署；\n- 带宽远低于图像的载体（约 22 关节/短窗口）仍近乎完美认证但退化优雅，极端运动分布/外部冻结生成器/更长载荷的泛化见附录 B，尚未在主文充分量化；\n- \"模拟漏洞\"是物理侧信道问题，MoSign 提供密码学层面的缓解而非彻底消除。"},{"h":"与文献库的关系","body":"库内\"交互与输入/安全\"方向此前空白（仅有手势、可穿戴等交互输入）；MoSign 为该方向新增\"匿名内认证\"这一稀缺且高价值子方向，与具身对话智能体、VR 匿名化研究形成互补。"},{"h":"可复现性","body":"给出 BCH/PRF/HMAC 参数与评估协议，但未见公开代码链接；依赖公开运动数据集与 SMPL 许可，复现中等。"},{"h":"行动建议","body":"做 VR 社交/匿名化平台时，MoSign 的\"运动通道挑战-应答\"应作为身份认证的候选原语；重点验证其在真实头显内与匿名器串接的端到端延迟与去匿名侧信道。"}]},{"file":"../papers/notes/2609.29836__SplatLabel：基于 4D 高斯泼溅的伪标注（动态语义占据）.md","id":"2609.29836","title":"SplatLabel: Pseudo-Labelling through 4D Gaussian Splatting","title_zh":"SplatLabel：基于 4D 高斯泼溅的伪标注（动态语义占据）","track":"感知与认知","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"4DGS\"","\"伪标注\"","\"语义占据\"","\"动态跟踪\"","\"LiDAR\""],"flags":[],"sections":[{"h":"一句话结论","body":"SplatLabel 是一条自动化伪标注流水线：用 4D 高斯表示提取带预测置信度的 LiDAR 分割与任意体素分辨率的语义占据栅格，并通过显式\"时间流形\"建模单个 3D 基元的轨迹与寿命，精确追踪运动主体、严格界定物体出现/消失，从而**彻底免去预标注的 3D 边界框**。"},{"h":"要解决的问题","body":"2D 视觉基础模型可自动化 3D 语义伪标注，但把先验转成稳健 3D 表示通常需复杂启发式或多模型集成；动态环境下物体出现/消失与运动追踪尤其困难。"},{"h":"方法详解","body":"- **4D 高斯表示 + 时间流形**：显式建模每个 3D 基元的轨迹与寿命；\n- **动态追踪**：精确跟踪运动主体，严格定义物体何时出现/消失；\n- **伪标注输出**：LiDAR 分割（带预测置信度）+ 任意体素分辨率的语义占据栅格；\n- **免 3D 框**：完全不需要预标注 3D bounding box。"},{"h":"实验与结果","body":"- 在动态场景语义占据/LiDAR 分割基准上，相对需要 3D 框或朴素时序聚合的方法，在一致性与时序边界上更优（具体指标见论文）；\n- 消融验证时间流形与置信度机制各自贡献。"},{"h":"创新点与贡献","body":"把\"动态时间流形\"作为 4DGS 伪标注的核心组件，是对 3D 语义自动标注流程的清晰简化（去 3D 框）。"},{"h":"局限与风险","body":"- 依赖 4D 高斯对动态场景的拟合质量，高密度/快速运动物体可能拟合不稳定；\n- 置信度校准与真实标注的偏差未充分讨论。"},{"h":"与文献库的关系","body":"库内\"感知与认知\"方向（GaussianDS、PePESeg3D 静态/多尺度语义 3DGS）新增\"4D 动态伪标注/语义占据\"子方向；与 GaussianDS（语义提升对齐）共享 3DGS 语义目标但面向动态与自动标注，互补。"},{"h":"可复现性","body":"流水线描述具体，但无公开代码；依赖 4DGS 与 2D 基础模型，复现中等。"},{"h":"行动建议","body":"做自动驾驶/机器人自动语义标注时，SplatLabel 的\"时间流形去 3D 框\"应作为优于手工标注基线的方案；关注其在高密度动态场景的拟合稳定性。"}]},{"file":"../papers/notes/2609.30187__Ego-Exo4D-HM：面向自我-外部捕获的 4D 人体运动重建数据集.md","id":"2609.30187","title":"Ego-Exo4D Human Meshes Dataset: 4D Human Motion Reconstruction for Ego-Exo Captures","title_zh":"Ego-Exo4D-HM：面向自我-外部捕获的 4D 人体运动重建数据集","track":"化身与人体","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.65,"evidence":"FULL","tags":["\"数据集\"","\"4D人体\"","\"自我中心\"","\"动作重建\"","\"基准\""],"flags":[],"sections":[{"h":"一句话结论","body":"Ego-Exo4D-HM 针对大规模数据集 Ego-Exo4D（同步的自我中心 + 多视角外部视频，广泛用于技能学习/过程活动理解/具身 AI）只提供稀疏 3D 人体姿态标注的缺口，发布配套的 **4D 人体运动重建数据集**与重建流水线，并开源代码、数据与文档。"},{"h":"要解决的问题","body":"Ego-Exo4D 是富资源数据集，但仅带稀疏 3D 人体姿态标注；从其多视角捕获中重建稠密 4D 人体运动并非易事，社区缺乏可直接用的密集 4D 运动资源与流水线。"},{"h":"方法详解","body":"- **数据集**：Ego-Exo4D-HM，对 Ego-Exo4D 的捕获提供大规模 4D 人体运动重建结果；\n- **重建流水线**：配套开源，从多视角/自我中心视频重建稠密人体运动；\n- **资源**：代码、数据集、文档一站公开。"},{"h":"实验与结果","body":"- 作为数据集/基准贡献，重点在规模与可用性；论文给出重建规模与质量评估（具体数字见论文），并开源以供复现。"},{"h":"创新点与贡献","body":"把\"稀疏标注的旗舰多视角数据集\"升级为\"稠密 4D 人体运动\"资源，对具身 AI/技能评估是直接的基础设施增益。"},{"h":"局限与风险","body":"- 重建质量受多视角覆盖与遮挡影响，稠密运动在严重遮挡处可能不准；\n- 作为标注/基准而非方法创新，方法论增量有限。"},{"h":"与文献库的关系","body":"库内\"化身与人体\"方向（PHOSA 手语化身、DEAL-Grasp、VibeAvatar 等）新增\"4D 人体数据集/基准\"基础设施；与 WildHSR（前馈 4D 人-景重建）共享人体重建主题但本篇是数据/工具贡献，互补。"},{"h":"可复现性","body":"代码+数据+文档全开源，可复现性高（TRL 给到 4）。"},{"h":"行动建议","body":"做自我中心/具身 AI 的人体运动研究时，Ego-Exo4D-HM 应作为首选 4D 人体基准；关注其在遮挡处重建的可靠性。"}]},{"file":"../papers/notes/2609.30245__COSA-GS：面向实用部署的 3D 高斯泼溅压缩.md","id":"2609.30245","title":"Towards Practical Compression of 3D Gaussian Splatting","title_zh":"COSA-GS：面向实用部署的 3D 高斯泼溅压缩","track":"系统与平台","date":"2026-09-25","batch":"2026-09-26","batchLabel":"2026-09-26","grade":"A","value":3.85,"evidence":"FULL","tags":["\"3DGS压缩\"","\"锚点\"","\"因果上下文\"","\"跨平台一致性\"","\"熵编码\""],"flags":[],"sections":[{"h":"一句话结论","body":"COSA-GS 解决 3D 高斯泼溅压缩的两大实用痛点——现有方法依赖不规则 3D 表示上的空间上下文建模（训练/编码复杂）以及浮点上下文推理的跨平台数值不一致（导致熵解码失败），提出通过**锚点级因果分解上下文**构造\"无空间聚合\"的简洁上下文模型：由锚点坐标派生几何上下文建模紧凑可学习锚点隐变量，再与几何上下文融合成属性编码用的锚点上下文。"},{"h":"要解决的问题","body":"3DGS 高质量但存贮巨大；现有压缩多在\"不规则 3D 表示\"上做空间上下文建模，训练与编码复杂；且浮点上下文推理在不同平台产生数值不一致，引发熵解码失败，难以\"实用部署\"。"},{"h":"方法详解","body":"- **无空间聚合上下文**：通过锚点级因果分解构造上下文，跳过代价高昂的空间聚合；\n- **几何上下文**：由每个锚点坐标派生，建模紧凑可学习锚点隐变量；\n- **锚点上下文**：几何上下文与锚点隐变量融合，用于属性编码；\n- 整体架构由简单模块组成，规避浮点不一致。"},{"h":"实验与结果","body":"- 在 3DGS 压缩基准上报告压缩率与重建质量，相对依赖空间上下文的基线在编解码一致性与效率上更优（具体指标见论文）；\n- 验证\"无空间聚合\"在跨平台确定性解码上的收益。"},{"h":"创新点与贡献","body":"把\"跨平台数值一致性\"作为 3DGS 压缩的一等约束，并以锚点因果分解给出简洁方案，是面向**实用部署**而非仅论文指标的务实贡献。"},{"h":"局限与风险","body":"- 锚点坐标派生的几何上下文对无锚点/异常几何鲁棒性未充分讨论；\n- 与 Observation-Gram 等\"度量级\"压缩增强的协同未覆盖。"},{"h":"与文献库的关系","body":"库内\"系统与平台\"方向（From Scattered Gaussians/Morton 编码、Observation-Gram 度量、COSA-GS 同日）新增\"锚点因果上下文压缩\"方案；与 Morton（投影视频编码）互补（上下文编码 vs 投影排序）。"},{"h":"可复现性","body":"架构简洁、描述具体，但无公开代码；复现中等。"},{"h":"行动建议","body":"做 3DGS 流式/跨平台部署压缩时，COSA-GS 的\"无空间聚合 + 跨平台一致\"应作为优于浮点上下文基线的首选；关注其与观测 Gram 度量的叠加。"}]},{"file":"../papers/notes/2609.32626__World_SLAM_Model_统一世界建模.md","id":"2609.32626","title":"World SLAM Model: Joint World Modeling for SLAM and Navigation","title_zh":"World SLAM Model：将 SLAM 范式直接引入下游导航的统一世界建模","track":"重建与SLAM","date":"2026-09-26","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":4.05,"evidence":"FULL","tags":["\"SLAM即世界模型\"","\"导航\"","\"持久记忆\"","\"端到端\"","\"联合目标\""],"flags":[],"sections":[{"h":"一句话结论","body":"WSM 把 SLAM 的核心机制（带持久记忆的增量状态更新 + 后端累积误差精修）直接做成可学习的\"世界状态模块\"，与下游导航端到端联合训练：给定观测与导航目标，预测未来视觉状态并联合估计相机运动与稠密几何，使导航直接从 SLAM 式空间状态获益。"},{"h":"要解决的问题","body":"以往把 SLAM 当作只供位姿/地图/令牌的上游模块，与导航割裂；误差在后处理中累积，下游看不到空间一致性。"},{"h":"方法详解","body":"- 世界状态随新观测持续更新，提供动作生成与闭环导航的基础；\n- **预训练目标三路监督**：RGB 生成（流时间采样 + 钟形加权）、度量深度（截到 [0.2,5] m、对数归一、Wan2.2 VAE、潜空间 MSE）、相机位姿（smooth-L1 作用于平移与单位四元数，同时监督绝对与成对相对位姿，因预测度量位姿无需尺度对齐）；\n- 沿用 SLAM-Former 的位姿监督思路。"},{"h":"实验与结果","body":"- 两阶段训练（先相机空间手先验，再扩展到流式世界空间）；\n- 在导航基准上成功率（SR）/SPL 较\"先 SLAM 后导航\"模块化管线提升（两阶段 ablation 验证）；原文端到端导航数值以消融表为准，本期抽取段落以预训练目标为主。"},{"h":"创新点与贡献","body":"把\"SLAM\"从冻结上游重构为与导航共训的可学习世界状态模块；持久记忆 + 后端误差精修实现一致世界状态；联合导航-SLAM 目标。"},{"h":"局限与风险","body":"用 Wan2.2 VAE 等扩散骨干，重（TRL=3）；评估多在仿真；EXP=4（强但在真实机器人泛化待验）。"},{"h":"与文献库的关系","body":"重建与SLAM 赛道；与 Pow3R-SLAM、RRG-SLAM、EgoFound3R、Dyna3、VASC、MVP-SLAM 同批，但唯一走\"SLAM 为导航世界模型\"范式，属理念级差异。"},{"h":"可复现性","body":"REP=3（扩散骨干 + 联合训练，代码待开源）；关注是否放预训练权重。"}]},{"file":"../papers/notes/2609.32983__VocalEyes_说话人感知AR字幕.md","id":"2609.32983","title":"VocalEyes: Speaker-Aware Augmented Reality Captioning through In-Conversation Registration","title_zh":"VocalEyes：基于对话内注册的说话人感知 AR 字幕","track":"空间计算与UI","date":"2026-09-26","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":4.08,"evidence":"FULL","tags":["\"AR字幕\"","\"说话人归属\"","\"无障碍\"","\"对话内注册\"","\"语音画像\""],"flags":[],"sections":[{"h":"一句话结论","body":"说话人感知的 AR 字幕系统：从自然的自我介绍中建立具名语音画像（无需会前注册），把\"说话人归属字幕 + 固定画像卡 + 标记发言者面部的视觉提示\"协调呈现；20 人被试内实验说话人识别 88.0%，说话人追踪准确率由纯字幕 AR 的 47.2% 提升到 87.3%。"},{"h":"要解决的问题","body":"同地 AR 字幕让语音可读，却把\"话语\"与\"说话人\"分离；陌生群体中丢失来源会让即时回应与事后回顾都变难。传统说话人分离只给匿名簇，说话人识别又假设会前注册。"},{"h":"方法详解","body":"- **对话内注册**：从自然自我介绍（\"My name is …\"/\"I work at …\"）提取姓名/机构/角色，规则回退 = spaCy NER + 正则；\n- **具名语音画像**：用语音相似度 φ_vocal 匹配（阈值 θ_temp=0.75、θ_corpus=0.85 由试点分布分离度定）；\n- **界面三件套**：说话人归属字幕、固定画像卡、标记当前发言面的视觉提示。"},{"h":"实验与结果","body":"- 被试内（within-subjects）研究，20 名自报听力正常被试；\n- 说话人识别 88.0% 准确率；说话人追踪 47.2%（纯字幕）→ 87.3%（VocalEyes）。"},{"h":"创新点与贡献","body":"从\"自然自我介绍\"做对话内注册（免会前注册）；把语音画像 + AR 字幕 + 面部提示统一；无障碍导向清晰。"},{"h":"局限与风险","body":"样本小（20 人、听力正常），未在聋/重听（DHH）主受众上验证；阈值靠试点分布，跨场景需重标定；TRL=4（已有原型研究）。"},{"h":"与文献库的关系","body":"属空间计算与UI 赛道；与 HIGS、CityToolVQA、Imagine3D-LLM、VLM 驱动 AR 质量评估同批，但唯一走\"无障碍/说话人归属\"角度；本批该赛道最高分（4.08）。"},{"h":"可复现性","body":"实验型系统，REP=3；关注是否在 DHH 人群复测。"}]},{"file":"../papers/notes/2609.34286__Dexterous_Tactile_World_Model.md","id":"2609.34286","title":"Dexterous Tactile World Model","title_zh":"Dexterous Tactile World Model：融合触觉与视觉的灵巧操作世界模型","track":"触觉与多模态","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":4.05,"evidence":"FULL","tags":["\"触觉世界模型\"","\"双手机觉\"","\"视频扩散\"","\"零初始化残差\"","\"EgoTouch\""],"flags":[],"sections":[{"h":"一句话结论","body":"DTWM 是\"带触觉\"的视频世界模型：在预训练视频扩散 Transformer 上，用每只手触觉信号的零初始化残差注入到视频 token 中对应手部位置，并加因果掩码防止预测帧窥未来；相比架构/参数量/训练完全对齐的纯视觉模型，把对手部运动的低估从 23% 降到 9%，并降低手部区域感知误差。"},{"h":"要解决的问题","body":"操控世界模型通常只从视频训练，但决定操控走向的关键事件（建立/释放接触）视觉难察、触觉易感；纯视觉模型系统性低估手部运动。"},{"h":"方法详解","body":"- 视频扩散 Transformer（30 个 block）；每视频帧从每只手套采一次读数（共 255 压力 taxel + 30 屈展通道）；\n- 触觉信号 e 经 widened patch embedding 编码，以归一化高斯足迹 g 加到手部投影位置视频 token：u ← u + proj(LN(e)) g；\n- 因果掩码保证预测帧 t>K 不访问未来；训练 K∈{4..44}，推理 K=12 一次预测 36 帧；\n- 任务指令由文本编码器编码。"},{"h":"实验与结果","body":"- 数据：EgoTouch 语料（HuggingFace zhouzhoujy/EgoTouch），1933 episode、5 场景、2,183,052 帧（20.21 小时），43,604 个 1.63s 剪辑；\n- 与架构/参数/训练对齐的纯视觉基线比：手部运动低估 23%→9%，手部区域感知误差下降。"},{"h":"创新点与贡献","body":"首个把双手机觉融入视频世界模型；零初始化残差注入（不破坏预训练）+ 因果掩码；统一压力+屈展触觉。"},{"h":"局限与风险","body":"依赖特定触觉手套（EgoTouch），硬件迁移成本；TRL=3；世界模型为预测非控制。"},{"h":"与文献库的关系","body":"触觉与多模态 赛道；与 HACo（2609.36596，触觉柔顺控制策略）、OccluDex、TouchingSpace、PneuTac、TouchTherm 同批——DTWM 是\"预测/世界模型\"，HACo 是\"控制策略\"，二者互补。"},{"h":"可复现性","body":"REP=3（EgoTouch 数据集已上 HF）；关注代码与预训练权重。"}]},{"file":"../papers/notes/2609.34346__E_WAVE_事件连续光流.md","id":"2609.34346","title":"E-WAVE: Event-based Continuous Optical Flow via Warping-Aligned Visual Encoding","title_zh":"E-WAVE：面向沉浸式 VR/AR 动态感知的事件化连续光流","track":"感知与认知","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":3.85,"evidence":"FULL","tags":["\"事件相机\"","\"连续光流\"","\"无相关体\"","\"轨迹扭曲\"","\"全局注意力\""],"flags":[],"sections":[{"h":"一句话结论","body":"E-WAVE 是从事件流做高时间分辨率（HTR）光流的无相关体（correlation-free）框架：用全局注意力建模长程特征依赖、以\"轨迹引导的扭曲\"替代 4D 全对相关体，避免其内存/计算开销；高时空分辨率下随分辨率提升而增益扩大。"},{"h":"要解决的问题","body":"沉浸式 VR/AR 动态感知需时间稠密光流（头/手/物体快速运动连续捕捉）；帧基方法受\"时间分辨率 vs 计算\"权衡限制，事件相机天然高时频但现有事件法依赖相关体、开销大。"},{"h":"方法详解","body":"- 不构造全对相关体，改用全局注意力捕捉长程特征依赖；\n- 轨迹引导扭曲（trajectory-guided warping）：10 次贝塞尔曲线表示像素轨迹，在足够自由度下建模强非线性运动；\n- 轨迹损失 L_traj 做稠密轨迹监督。"},{"h":"实验与结果","body":"- 扭曲策略对比：10 次贝塞尔 > 线性（线性甚至差于无扭曲）> 无扭曲，证明高自由度轨迹表示必要；\n- 轨迹损失消融：无 L_traj 时贝塞尔严重欠定（TEPE/TAE 恶化）；\n- 真实采集：事件体素 + 三法估计结果可视化，高分辨率下优势明显。"},{"h":"创新点与贡献","body":"事件光流去相关体；轨迹引导贝塞尔扭曲 + 全局注意力；HTR 适配 XR 动态感知。"},{"h":"局限与风险","body":"需事件相机硬件；TRL=3；真实场景分布偏差待验。"},{"h":"与文献库的关系","body":"感知与认知 赛道；与 GazeFlow、EgoGears、MemLife、NextMe-800、Long Time No See、EgoTools 同批，但唯一做\"事件光流\"，补齐动态低延迟感知。"},{"h":"可复现性","body":"REP=3；关注代码与事件数据集。"}]},{"file":"../papers/notes/2609.34367__OIC_GS_全向高斯泼溅率失真码.md","id":"2609.34367","title":"Rate-Distortion Adaptive Primitive Selection for Omnidirectional Gaussian Splatting","title_zh":"OIC-GS：面向沉浸式 VR 的全向高斯泼溅率失真自适应图元选择","track":"神经渲染","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"S","value":4.37,"evidence":"FULL","tags":["\"高斯泼溅码\"","\"全向/360\"","\"率失真\"","\"视口解码\"","\"HEALPix\""],"flags":[],"sections":[{"h":"一句话结论","body":"面向沉浸式 VR 360° 全景的高斯泼溅图像码：用分层 HEALPix 球面图元网格把高斯锚定在预定义球面上、消除显式坐标编码，并以球面率失真目标做图元选择；同等码率下 V-PSNR 比最强 GS 码高 +3.2~+6.9 dB，且天然支持由粗到细的分层传输与\"只解相关视口\"的高效视口解码。"},{"h":"要解决的问题","body":"学习型图像码（LIC）重建质量高但解码太慢，撑不住沉浸式 VR；高斯泼溅（GS）码渲染快，但重建质量落后，且图元分配通常不计入每个图元的编码代价。对 360° 全景，还需解决\"球面表示 + 视口自适应传输\"。"},{"h":"方法详解","body":"- **分层 HEALPix 球面图元网格**：高斯锚定在球面上预定义位置，无需编码坐标；细层细化粗层祖先，支持由粗到细重建与分层传输；\n- **视口解码**：预定义网格使视口解码只需挑选\"与当前视口相关\"的图元，省去全图解码；\n- **轻量熵模型 + 球面率失真目标**：对量化后的图元建模，整体在球面率失真（spherical rate-distortion）下联合优化，显式计入每个图元的编码代价。"},{"h":"实验与结果","body":"- 主基准 100 张 Flickr 360° 全景（2048×1024 ERP PNG）；跨数据集用 SUN360 测试集 100 张；\n- 指标：WS-PSNR（JVET 通用测试条件）、V-PSNR / V-SSIM / V-LPIPS（六个 90°×90° 视口）；码率以\"每 ERP 像素 bit\"计；\n- 在四个指标、每个测试码率上全面超过所有重拟合 GS 码：0.6 bpp 时 V-PSNR 较 GaussianImage +3.9、SGI +4.1、LIG +6.9、GaussianImage++ +3.2 dB；95% t 区间 ±0.2~0.3 dB（统计显著）。"},{"h":"创新点与贡献","body":"把\"GS 作为 360° 全景图像表示 + 码\"打通；HEALPix 球面网格首次用于 GS 码；率失真目标直接驱动图元选择；视口自适应解码契合 VR 串流。"},{"h":"局限与风险","body":"属图像/全景级码（非动态 3D 场景重建），对视频/时序 360 流未覆盖；TRL=3（研究原型）；依赖 ERP 视口指标，真实头显感知未测。"},{"h":"与文献库的关系","body":"与库内 3DGS 压缩系列（SAGA、TSGL、FeCoSplat、COSA-GS、PePESeg3D、Observation-Gram、EffGS）互补但层次不同——后者压\"3D 场景\"，OIC-GS 压\"全景图像\"，且独有视口解码视角；本批唯一 S 级（4.37），是全期最高分。"},{"h":"可复现性","body":"指标与对比完整、统计显著，REP=4；关注代码/模型是否开源。"}]},{"file":"../papers/notes/2609.34527__RRG_SLAM_反射感知高斯SLAM.md","id":"2609.34527","title":"RRG-SLAM: Real-time Reflection-aware Gaussian SLAM for Indoor Scenes","title_zh":"RRG-SLAM：首个实时反射感知的高斯室内 SLAM","track":"重建与SLAM","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":3.85,"evidence":"FULL","tags":["\"反射感知\"","\"高斯SLAM\"","\"TSDF-高斯混合\"","\"平面反射\"","\"室内\""],"flags":[],"sections":[{"h":"一句话结论","body":"首个实时反射感知的高斯室内 SLAM：用\"反射感知 TSDF-高斯混合表示\"把漫反射外观与反射分量显式分离——TSDF 体积 + 基础高斯建模几何与漫反射，平面反射用\"关联已检测反射平面的反射高斯组\"表示，三遍渲染保证反射只投到对应平面区域，反射区域更锐利稳定。"},{"h":"要解决的问题","body":"室内常见镜面/玻璃等反射，传统 3DGS SLAM 把反射当成几何或噪声，导致漂移、模糊或缺失反射内容。"},{"h":"方法详解","body":"- 表示：TSDF 体积 + 基础高斯（几何+漫反射）；反射高斯组关联检测到的反射平面；\n- 三遍渲染：① TSDF 光线投射得表面色/深度/平面 ID/反射掩码；② 基础高斯按深度剔除、与 TSDF 合成基础图；③ 在反射掩码指引下，仅把对应反射组的高斯光栅化到其平面区域。"},{"h":"实验与结果","body":"- 多反射室内场景定性对比：基线 GPS-SLAM、GauS-SLAM、GS-ICP SLAM、RTG-SLAM、SplaTAM 在反射区出现模糊/漂移/缺失；SplaTAM 在 Meeting Room 直接 OOM；\n- RRG-SLAM 反射更锐利稳定，反射掩码/加权反射色分解可视化验证了分量分离。"},{"h":"创新点与贡献","body":"首个实时反射感知高斯 SLAM；TSDF-高斯混合 + 显式反射高斯组 + 平面感知光栅化。"},{"h":"局限与风险","body":"依赖平面检测（非平面反射难处理）；室内为主；TRL=3。"},{"h":"与文献库的关系","body":"重建与SLAM 赛道；与 Pow3R-SLAM、World SLAM Model、MVP-SLAM、VASC、Dyna3 同批，但唯一针对\"反射\"，补齐库内高斯 SLAM 的反射短板。"},{"h":"可复现性","body":"REP=3；关注代码与场景数据。"}]},{"file":"../papers/notes/2609.34817__ESTHER_野化自中心立体手估计.md","id":"2609.34817","title":"ESTHER: Egocentric Stereo Hand Estimation and Reconstruction in the Wild","title_zh":"ESTHER：野化自中心立体手估计与重建","track":"化身与人体","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"S","value":4.27,"evidence":"FULL","tags":["\"自中心立体\"","\"手重建\"","\"野化基准\"","\"度量3D\"","\"AR/VR交互\""],"flags":[],"sections":[{"h":"一句话结论","body":"首个面向可穿戴自中心立体（双目）的端到端度量 3D 手估计模型 + 首个带真值度量 GT 的野化基准 ESTHER3D；零样本下取得 SOTA 精度、强外域泛化，并对缺视角/掉帧鲁棒，跨焦距几乎不漂移（而多视图基线大幅摆动）。"},{"h":"要解决的问题","body":"人双手受双眼监视是灵巧操作的自然感知接口，但\"从自中心立体信号做度量 3D 手重建\"既无端到端模型，也无野化基准；此前方法缺 metric 3D 真值、难泛化。"},{"h":"方法详解","body":"- 模型几何 / 时序 / 输出表示均按可穿戴自中心立体设计；\n- 用标定打标流水线生成伪标签训练，并据此汇编 **ESTHER3D**：大量野化训练集（模型生成标签）+ 动作捕捉测试集（真值度量 GT）；\n- 标签质量分析：把 21 个标签关节投影到双目视锥针孔视图，与融合 2D 关键点比较，残差 r 为置信>0.3 关节的像素距离均值。"},{"h":"实验与结果","body":"- ESTHER3D 测试集 = 真值 mocap GT，所有方法零样本；HOT3D 零样本与微调（10%）两档；\n- 误差单位 mm、抖动 m/s²：ESTHER 在 offbb90/offbb120/offbb150 等焦距下误差 32.4/20.8/16.3 等几乎不变；多视图基线 POEM-v2 101.3/656/635、MVGFormer 95.9/429/449、Epipolar Trans. 69.4/414/318、Hiera-FTL 80.9/401/105 大幅摆动。"},{"h":"创新点与贡献","body":"首次端到端自中心立体手模型 + 首个野化度量基准；标定打标流水线产出伪标签 + mocap 真值测试集。"},{"h":"局限与风险","body":"依赖双目/立体采集装置（可穿戴头显双摄）；野化标签本质为伪标签（仅 bounded error）；TRL=3。"},{"h":"与文献库的关系","body":"与 09-28 的 InfiniHand（单目世界坐标，2609.35743）、2610.01210 EgoFound3R（世界坐标端到端手重建）构成\"自中心手\"三件套：ESTHER=双目度量、InfiniHand=单目流式世界坐标、EgoFound3R=世界坐标端到端；互补而非取代。"},{"h":"可复现性","body":"基准 + 模型同步放出，REP=4；关注双目采集可复现性。"}]},{"file":"../papers/notes/2609.35743__InfiniHand_流式世界坐标手估计.md","id":"2609.35743","title":"InfiniHand: Streaming World-Space Hand Motion Estimation from Egocentric Video","title_zh":"InfiniHand：自中心视频的流式世界坐标手势运动估计","track":"化身与人体","date":"2026-09-28","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":3.85,"evidence":"FULL","tags":["\"自中心\"","\"世界坐标手\"","\"流式\"","\"端到端\"","\"持久记忆\""],"flags":[],"sections":[{"h":"一句话结论","body":"InfiniHand 是端到端流式前馈框架：直接从无标定自中心视频联合估计 MANO 参数、相机轨迹与手部位置，用持久时空记忆 + 以手为中心的视觉特征把相机运动与局部手几何耦合；约 5000 小时自中心数据预训练，ARCTIC PA-p 较 ViDiHand 降 21.4%，世界坐标漂移大幅缓解，11.19 FPS（吞吐 >2× HaWoR），野化泛化稳健。"},{"h":"要解决的问题","body":"世界坐标手运动估计需同时恢复 3D 关节手与相机自运动；现有方法级联独立手姿态估计 + SLAM，误差累积、管线复杂、计算开销大。"},{"h":"方法详解","body":"- 统一架构同时输出 MANO 参数、相机轨迹、手部位置；\n- 持久时空记忆（persistent spatiotemporal memory）+ 以手为中心的视觉特征，显式耦合相机运动与局部手几何；\n- 两阶段训练：先学稳健相机空间手先验，再扩到流式世界空间重建。"},{"h":"实验与结果","body":"- 基准 ARCTIC / HOT3D / EgoDex / InterWild；世界坐标 W-MPJPE 达最低（如 ARCTIC 16.43、HOT3D 33.64 等），相机空间 PA-p 亦最低；\n- ARCTIC PA-p 较 ViDiHand 降 21.4%；11.19 FPS，超 HaWoR 两倍以上吞吐。"},{"h":"创新点与贡献","body":"单モデル流式世界坐标手 + 相机自运动联合估计；持久记忆机制；5000h 预训练；前馈无 SLAM 级联。"},{"h":"局限与风险","body":"单目自中心（无立体），极端遮挡/快速运动待验；TRL=3。"},{"h":"与文献库的关系","body":"化身与人体 赛道；与 ESTHER（2609.34817 双目度量）、EgoFound3R（2610.01210 世界坐标端到端）构成\"自中心手\"三件套，InfiniHand 主打单目流式实时。"},{"h":"可复现性","body":"REP=3（有项目页 infinihand.github.io）；关注权重开源。"}]},{"file":"../papers/notes/2609.36596__HACo_触觉主动柔顺.md","id":"2609.36596","title":"HACo: Learning Haptic Active Compliance for Force-Aware Dexterous Manipulation","title_zh":"HACo：面向力感知灵巧操作的触觉主动柔顺学习","track":"触觉与多模态","date":"2026-09-29","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":3.85,"evidence":"FULL","tags":["\"触觉主动柔顺\"","\"指尖触觉\"","\"关节力矩\"","\"力感知\"","\"双臂灵巧\""],"flags":[],"sections":[{"h":"一句话结论","body":"HACo 是\"触觉主动柔顺\"策略：直接从触觉反馈学\"调节力的动作\"——用合规调节遥操作把人指令转成可执行柔顺动作（保运动意图同时调负载），并以\"指令-状态差异\"作辅助柔顺意图监督；在双臂 UR5+Sharpa 手上真实实验成功率 83%，远超 T-Rex 35%、GR00T 15%。"},{"h":"要解决的问题","body":"接触密集灵巧操作需策略把物理反馈转成运动指令并跨多接触调节交互负载；现有策略忽视互补的指尖触觉 + 关节力矩，动作目标要么过载要么忽略物体约束的运动。"},{"h":"方法详解","body":"- 输入：多视 RGB、语言指令、机器人状态、指尖触觉 T_t 与关节力矩 τ_t 的短历史；输出 H 步可执行的柔顺动作（臂 EE + 灵巧手参考），直送底层控制器；\n- 合规调节遥操作：外层调节器把人输入改成柔顺动作，保运动意图并调负载；\n- 合规落地模块（Compliance Grounding Module）：以交互负载的触觉观测为条件作用到基于流的动作专家，预测\"柔顺动作\"而非规定力目标；\n- 用 command-state 差异作辅助柔顺意图监督（训练时预测合规意图 Δq^ci，但不加入执行动作）。"},{"h":"实验与结果","body":"- 平台：双臂双 UR5 + Sharpa 灵巧手（集成指尖触觉 + 关节力矩）；ZED Mini 自中心 + 双腕 RealSense D405；\n- 每任务 100 演示，4× H100 训 30k 步、全局 batch 48、seed 42；HACo/GR00T/GR00T+Tactile 均从 GR00T N1.7 初始化、AdamW lr 2e-5；\n- 真实灵巧力基准：HACo 成功率 83%，显著优于 T-Rex 35%、GR00T 15%。"},{"h":"创新点与贡献","body":"从触觉+力矩直接学主动柔顺（非规定力）；合规落地模块；指令-状态差异作辅助监督；合规调节遥操作桥接人。"},{"h":"局限与风险","body":"绑定特定硬件（Sharpa 手、UR5）；真实但任务受限；TRL=3。"},{"h":"与文献库的关系","body":"触觉与多模态 赛道；与 DTWM（2609.34286 触觉世界模型）、OccluDex、TouchingSpace、PneuTac、TouchTherm 同批——HACo 是\"控制策略\"，DTWM 是\"预测模型\"，本批该赛道两篇均进 Top10。"},{"h":"可复现性","body":"REP=3（真实机器人评估，硬件特定）；关注是否开源策略与演示。"}]},{"file":"../papers/notes/2609.09158__TANGO基于全身视觉-语言-动作模型的人形机器.md","id":"2609.09158","title":"TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model","title_zh":"TANGO：基于全身视觉-语言-动作模型的人形机器人杂乱环境导航","track":"重建与SLAM","date":"2026-10-01","batch":"2026-10-03","batchLabel":"2026-10-03","grade":"B","value":3.3,"evidence":"FULL","tags":["具身导航","VLA","人形机器人","视觉-语言-动作"],"flags":["⚠️ 偏具身机器人导航，XR 相关度中等"],"sections":[{"h":"一句话结论","body":"全身视觉-语言-动作（VLA）模型用于人形机器人在杂乱/狭窄环境中的导航，结合仿真数据生成、真实部署与多指标评估。"},{"h":"要解决的问题","body":"人形机器人在杂乱/狭窄环境导航需全身协调与避障；现有 VLN 多为离散动作或轮式平台，缺乏全身 VLA 在真实杂乱场景的遍历验证。"},{"h":"方法详解","body":"问题公式化；Simulation Data Generation（仿真数据生成，构造杂乱训练环境）；TANGO Architecture & Training（视觉-语言-动作端到端）；Deployment（部署到真实人形机器人）。"},{"h":"实验与结果","body":"VLN 性能、杂乱环境遍历性能、真实世界实验、消融研究；指标含 Navigation Error (NE)、Success Rate (SR)、Oracle SR (OSR)、SPL、Collision Rate (CR) 及真实碰撞数。"},{"h":"创新点与贡献","body":"把 VLA 扩展到人形全身导航并做真实部署，强调'杂乱/狭窄'这一真实难点。"},{"h":"局限与风险","body":"XR 相关度中等（偏机器人具身）；仿真到真实差距；未见与 XR / teleoperation 直接结合。"},{"h":"与文献库的关系","body":"新增——导航/具身方向补充，对 XR 直接价值有限但提供空间智能参考。"},{"h":"可复现性（代码/数据/硬件）","body":"有项目主页（tango-vla.github.io），预期释出代码。"},{"h":"行动建议","body":"作为空间导航/具身方向参考；若后续出现与 XR 头显/遥操作结合版本再重点跟进。"}]},{"file":"../papers/notes/2609.11434__CVQPG基于二次相位高斯泼溅的全息图表示.md","id":"2609.11434","title":"Hologram Representation via Quadratic Phase Gaussian Splatting","title_zh":"CVQPG：基于二次相位高斯泼溅的全息图表示","track":"渲染与显示","date":"2026-10-01","batch":"2026-10-03","batchLabel":"2026-10-03","grade":"A","value":3.85,"evidence":"FULL","tags":["全息显示","3D Gaussian Splatting","近眼显示","光场"],"flags":["⚠️ 填补硬件类渲染（全息显示）缺口；v2 于 10-01 公告，本次新入馆"],"sections":[{"h":"一句话结论","body":"提出复值二次相位高斯（CVQPG），为每个 2D 高斯基元叠加可学习的二次相位（曲率）轮廓，首次把 3D Gaussian Splatting 拓展到全息图/近眼显示域，在同等或更少参数预算下提升全息图保真度（PSNR / CVVDP）。"},{"h":"要解决的问题","body":"全息显示（CGH/SLM）需要既能被高效优化、又满足衍射物理的可渲染图元。传统 3DGS 的实数颜色/不透明度不足以表达光场相位与焦深；既有全息表示多依赖体素或 NeRF，缺少可学习的'焦距/曲率'自由度。"},{"h":"方法详解","body":"1) Complex-Valued Planar Gaussian：把基元表示为复值；2) Complex-Valued Quadratic Phase Gaussian（CVQPG）：在 2D 高斯包络上叠加二次相位项，其曲率 c 为可学习参数，使每个基元天然表达一个局部焦面/波前；3) Scale-Adaptive Curvature Control：按基元尺度自适应约束曲率范围；4) Hologram Rendering & Optimization：将 GS 场景投影到 SLM 平面并优化相位；5) Curvature Warm-Up：训练初期先稳定几何、再放开曲率，避免优化陷入坏局部。"},{"h":"实验与结果","body":"在 RGB 20%/10% 与灰度 20%/10% 多档比特率下，与 Baseline / Baseline+ 比较 PSNR/SSIM/LPIPS/FLIP/CVVDP（全息感知质量指标）。例：RGB 20% 时 CVQPG PSNR 29.450 vs 29.265（+0.185），SSIM 0.8364 vs 0.8307，CVVDP 9.203 vs 9.168，且参数更少（30,720 vs Baseline+ 33,280）；灰度 10% 时 PSNR 28.398 vs 28.076（+0.322），CVVDP 8.658 vs 8.548（+0.109）。附录含全息显示原型、运行时/显存、逐场景结果与可视对比。"},{"h":"创新点与贡献","body":"① 把相位/焦深显式建模进高斯基元，而非事后用相位检索；② 尺度自适应曲率，让近/远基元自然落在不同焦面；③ 与现有 3DGS 优化/渲染管线兼容，可复用其基础设施。"},{"h":"局限与风险","body":"仍依赖 SLM/衍射物理近似；计算随基元数上升；仅在受控场景验证，未见大规模复杂场景或视频时序（4D 全息）评估。"},{"h":"与文献库的关系","body":"新增——库内 304 篇此前 0 篇真正全息/波导/近眼显示硬件表示，直接填补'硬件类渲染'长期缺口。"},{"h":"可复现性（代码/数据/硬件）","body":"作者来自 UCL/Swansea（Kaan Akşit 团队，全息方向权威），方法描述完整，预期释出代码；需全息显示原型才能复现 CVVDP 类指标。"},{"h":"行动建议","body":"列为'硬件类渲染'方向种子论文，后续追踪其与 waveguided / varifocal / Maxwellian 显示的整合，以及动态全息扩展。"}]},{"file":"../papers/notes/2610.02207__GALA_高斯混合形变蒸馏.md","id":"2610.02207","title":"One Basis to Animate Them All: Gaussian Blendshape Distillation for Real-Time Avatars","title_zh":"GALA：基于线性混合形变的实时 3D 高斯化身动画蒸馏","track":"化身与人体","date":"2026-10-01","batch":"2026-10-02","batchLabel":"2026-10-02","grade":"A","value":3.93,"evidence":"FULL","tags":["\"3D高斯化身\"","\"实时动画\"","\"混合形变蒸馏\"","\"块局部PCA\"","\"推理加速\""],"flags":[],"sections":[{"h":"一句话结论","body":"GALA 证明\"预训练高斯化身的逐帧动画\"可由与身份无关的线性混合形变（blendshape）紧密近似：用浅层系数预测器 + 线性混合取代沉重的逐帧神经解码，并在渲染感知度量 + 显存预算下做块局部 PCA 基；无需重训原模型即可加速三个不同宿主化身（AGORA/FlexAvatar/DynaAvatar）的推理。"},{"h":"要解决的问题","body":"3D 高斯化身渲染快，但实时动画受逐帧重型神经推理瓶颈；每个宿主模型各自训练动画网络成本高。"},{"h":"方法详解","body":"- 高斯划分为 B=32 空间块，每个属性组 + 每块建独立基；\n- 渲染感知度量 M_a（α=1, β=16；DynaAvatar β=64），每帧 16 个随机探针；FlexAvatar 位置用 landmark 项（γ=24）；\n- 基存半精度（b=2，两个头部模型）/单精度（b=4，DynaAvatar）；浅层 MLP 预测 blendshape 系数。"},{"h":"实验与结果","body":"- 在三宿主（AGORA/FlexAvatar/DynaAvatar）上验证：以浅系数网络 + 线性混合替代原重型解码，提速且保真；\n- 文末给更难样例（含系数网络失败的例），提示近似上限。"},{"h":"创新点与贡献","body":"把高斯化身动画蒸馏成\"线性 blendshape\"（身份无关基）；块局部 PCA + 渲染感知度量 + 显存预算联合构造基；即插即用加速、免重训。"},{"h":"局限与风险","body":"本质是近似，复杂动态/极端表情有保真损失（TRL=4，偏工程落地）；仅头部模型为主。"},{"h":"与文献库的关系","body":"化身与人体 赛道；与 ESTHER、InfiniHand、EvolvingAvatar、SInGA、MegaAvatar、GAE、Speech BCI 同批，但唯一聚焦\"动画推理加速\"，工程价值高。"},{"h":"可复现性","body":"REP=3（方法清晰、基构造可复现）；关注是否开源系数网络。"}]},{"file":"../papers/notes/2610.01863__LiteReality-Agent面向可交互_3.md","id":"2610.01863","title":"LiteReality-Agent: An Agentic System for Interactable 3D Indoor Scene Reconstruction","title_zh":"LiteReality-Agent：面向可交互 3D 室内场景重建的智能体系统","track":"重建与SLAM","date":"2026-10-02","batch":"2026-10-03","batchLabel":"2026-10-03","grade":"A","value":3.85,"evidence":"FULL","tags":["real-to-sim","智能体","室内重建","可交互场景","逆向图形"],"flags":[],"sections":[{"h":"一句话结论","body":"从 RGB-D 扫描 + 检测结果出发，经布局智能体、物体重建与场景程序生成'可仿真（simulation-ready）'的可交互室内场景，并用证据工具 + 质量门控保证几何与支撑合理性。"},{"h":"要解决的问题","body":"真实到仿真（real-to-sim）需要既视觉逼真、又具物体级可交互性与物理合理性的室内场景；现有重建多产出静态网格，缺物体级可交互性与物理元数据，难以直接用于仿真/VR 内容。"},{"h":"方法详解","body":"输入 RGB-D 扫描 + 检测；场景初始化（Layout Agent 推断房间布局关系、Object reconstruction 生成带物理属性的网格、scene program 组装层级场景图）；Agentic Authoring：证据工具（三级图像选择、渲染对比、墙体缝合与测量、创作 harness）、预算控制（budgeted control，限制大模型调用成本）、几何与支撑门控（geometric & support gates，校验悬浮/穿插）；Simulation-Ready Export 导出可直接导入仿真器的场景。"},{"h":"实验与结果","body":"10 个场景 vs Fable 5.1（RGB-only / +Scan）、GPT-6（RGB-only / +Scan）。几何一致性与合理性（表3，611 帧深度 MAE + 近接触支撑率）：LiteReality-Agent ours SSIM 0.6105 / PSNR 14.129 / RMSE 0.2033 / LPIPS 0.5392，优于 Fable 5.1 RGB-only（0.5307/10.681/0.3008/0.7197）与 GPT-6 +Scan（0.6004/12.967/0.2323/0.6250）；含人类与智能体感知评估、扫描数据对通用智能体影响的消融。"},{"h":"创新点与贡献","body":"① 把'逆向图形（inverse graphics）'做成带证据工具与质量门的智能体循环，而非一次性前馈；② 物体级物理属性与碰撞几何，直接对接仿真；③ 预算/门控使大模型智能体可控、可审计。"},{"h":"局限与风险","body":"依赖检测与扫描质量；物体重建仍需重试/拒绝；未见大规模多房间或动态场景；仿真导出格式有限。"},{"h":"与文献库的关系","body":"新增——库内已有 3DGS/重建工作，但缺'可交互、仿真就绪'的智能体闭环。"},{"h":"可复现性（代码/数据/硬件）","body":"系统描述详尽（附录 B 实现细节，含捕获数据、布局修复、物体重建与物理元数据），预期释出代码。"},{"h":"行动建议","body":"XR 内容生成 / 数字孪生方向重点跟踪；可作为 VR 场景自动重建流水线的参照架构。"}]},{"file":"../papers/notes/2610.04076__VCURF虚拟相机辐射场不确定性.md","id":"2610.04076","title":"VCURF: Virtual Camera-based Uncertainty of Radiance Fields","title_zh":"VCURF：基于虚拟相机的辐射场像素级不确定性估计","track":"神经渲染","date":"2026-10-02","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.81,"evidence":"FULL","tags":["\"不确定性估计\"","\"辐射场\"","\"黑盒\"","\"免训练\"","\"主动重建\""],"flags":[],"sections":[{"h":"一句话结论","body":"把辐射场（NeRF/3DGS 通吃）当作黑盒，仅在目标视点附近采样一组\"虚拟相机\"，度量该模型在这些虚拟相机与参考相机渲染之间的一致性，从而得到无需真值、免训练、省显存、不改动模型内部参数的像素级不确定性图。实验证明有效性，并得出一个反直觉结论：渲染误差 ≠ 视点效用——高不确定视点未必是最能提升重训后模型质量的下一最佳视点（NBV）。"},{"h":"要解决的问题","body":"辐射场重建在有限视角/外观变化/动态/位姿误差下会出现局部几何与外观失败。像素级不确定性估计（预测\"哪里可能错\"）可用于定位不可靠区域、过滤伪影、评估局部质量，并被广泛当作 NBV 选择与主动重建的\"信息增益\"代理。但作者指出两件事应区分：不确定性刻画\"当前模型哪里可能错\"；而候选视点的效用还取决于它是否提供相对于已有训练集的新颖、非冗余观测。高度不确定的视点未必是重训后最能改进模型的视点。"},{"h":"方法详解","body":"黑盒方案（training-free、memory-friendly、不修改/不访问 RF 内部参数）。把辐射场模型当黑盒，只假设它能按需渲染颜色与深度。在目标视点附近采样若干虚拟相机，度量 RF 模型在这些虚拟相机渲染之间的一致性，从而估计像素级不确定性。对 NeRF 与 GS 均适用，无需改动。"},{"h":"实验与结果","body":"在多种数据集、辐射场模型与基线的组合上验证像素级不确定性估计有效性。附消融（采样半径、虚拟相机数、不确定性估计各分量）、存储与时间复杂度分析、定性结果。并以实验重新审视\"视点选择\"的范式——证实\"高不确定 ≠ 高信息增益\"。"},{"h":"创新点与贡献","body":"1. 提出一种即插即用、黑盒、免训练、省显存的像素级不确定性估计器，统一适用于 NeRF 与 3DGS。\n2. 用\"虚拟相机一致性\"这一简洁原理替代需要改模型/加训练目标的白盒方案。\n3. empirically 揭示\"渲染误差 ≠ 视点效用\"的鸿沟，挑战了主动重建领域把不确定性直接当 NBV 信息增益的主流做法。"},{"h":"局限与风险","body":"仅度量\"模型自身渲染一致性\"，不直接提供\"该视点能否带来新信息\"的效用估计（作者明确区分但未给出效用量化）；虚拟相机采样策略（半径、数量）需调参，极端无纹理/对称场景可能失效；未给出端到端的 NBV 选择改进实验（仅揭示问题）。"},{"h":"与文献库的关系","body":"库内主动重建/SLAM 方向有 SURE_Map（2609.15795，自校正流式几何基础模型 SLAM 替代）、RawSLAM（2609.20589）等；VCURF 补上\"不确定性估计\"这一通用中间件，可与任意 RF 后端 + NBV 策略组合。与 F² SLAM（本日 Top7，把前馈几何当持久因子）互补：F² SLAM 用前馈几何做测量，VCURF 提供\"这些测量/区域是否可信\"的可信度信号，二者可叠加做状态一致性准入。"},{"h":"可复现性","body":"CC BY 4.0；黑盒、免训练、不依赖内部参数，是对任意 RF 后端的\"最小侵入\"插件，复现门槛低；建议关注作者开源（通常会放出采样与一致性度量子模块）。"},{"h":"行动建议","body":"1. 把 VCURF 当作\"RF 质量审计\"的标配工具，先接进现有 NeRF/3DGS 管线做伪影定位。\n2. 做主动重建/NBV 时，别只用不确定性当信息增益——叠加\"新颖非冗余观测\"判定，呼应作者结论。\n3. 与 F² SLAM 的状态一致性准入机制结合，作为测量可信度门控。"}]},{"file":"../papers/notes/2610.04139__SpatialMind预测式空间推理VLM.md","id":"2610.04139","title":"From Sight to Foresight: Predictive Spatial Reasoning in Vision-Language Models","title_zh":"SpatialMind：从观察到预见——视觉语言模型的预测式空间推理","track":"空间计算与UI","date":"2026-10-02","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.81,"evidence":"FULL","tags":["\"VLM\"","\"预测式推理\"","\"度量尺度\"","\"空间关系\"","\"数据集\""],"flags":[],"sections":[{"h":"一句话结论","body":"博世提出 SpatialMind，一个度量尺度 VLM，把空间推理从\"描述已观察到的场景\"推进到\"预测未观测到的未来空间状态\"。其度量深度适配器把推理锚定到真实世界尺度，渐进式状态链以当前空间状态与已观测动态为底座支撑未来预测；给定视频前缀，预测已观测与未见未来帧中的距离、运动方向、空间关系。配套可扩展数据引擎生成 SpatialMind-30K 数据集与 SpatialMind-2K 基准（驾驶 + 日常第一视角，8 任务 3 层级），在基准上大幅超越通用与空间专用模型，并在 VSI-Bench/OSI-Bench/VLM4D 上零样本具竞争力。"},{"h":"要解决的问题","body":"预测未来空间状态支撑动态环境中的碰撞规避与及时决策。但现有 VLM 与空间推理基准主要聚焦\"已观测场景\"，对\"超出观测区间的预测式空间推理\"探索不足——即给定视频前缀，推断物体未来的距离、运动方向、空间关系变化。"},{"h":"方法详解","body":"(1) Metric depth adapter：把空间推理锚定到真实世界尺度（而非相对/像素尺度）。(2) Progressive state chain（渐进式状态链）：先建立当前空间状态与已观测动态，作为未来预测的基础。(3) 给定视频前缀，预测已观测帧与未见未来帧中的距离、运动方向、空间关系。数据引擎：可扩展引擎把实体描述 grounding 到度量几何，生成 QA 对与状态监督，构建 SpatialMind-30K（训练）与 SpatialMind-2K（基准，8 任务 × 3 层级：当前状态理解 / 已观测动态理解 / 未来预测）。"},{"h":"实验与结果","body":"在自有 8 任务 3 层级基准上，SpatialMind 大幅超越通用 VLM 与空间专用模型；并在 VSI-Bench、OSI-Bench、VLM4D 上取得有竞争力的零样本表现。项目页与代码已公开。"},{"h":"创新点与贡献","body":"1. 把\"预测式空间推理\"正式立项，区分于纯观测描述，给出度量尺度的可预测框架。\n2. Metric depth adapter + progressive state chain 的组合，让预测\"grounded in 当前几何与已观测动态\"，比专有 VLM 估计更准。\n3. 可扩展数据引擎 + 30K/2K 数据集/基准，覆盖驾驶与日常第一视角，填补未来预测评测空白。"},{"h":"局限与风险","body":"基准偏驾驶与第一视角日常场景，未见复杂多智能体/室内长程交互；\"未来预测\"仅在短时程内验证，长程外推误差未量化；依赖度量深度估计质量；零样本仅与少数基准对比，广度有限。"},{"h":"与文献库的关系","body":"库内空间计算与UI赛道有 GeoScaffold（2610.02697，重建学习几何潜做 VLN）、Ego2World（2610.02715，第一视角视频编译为可执行世界）、工具增强度量空间推理（2609.29073）等。SpatialMind 补上\"预测式/前瞻式\"空间推理一环，与 GeoScaffold（几何潜）、Ego2World（可执行世界）可构成\"感知几何 → 预测未来 → 规划动作\"的链。与 EMBER-Bench（当日 #16，长程具身因果记忆）互补：一个管\"未来空间状态预测\"，一个管\"历史事件如何约束未来动作\"。"},{"h":"可复现性","body":"CC BY 4.0；项目页 + 代码已公开，数据集 30K/2K 随发布，复现门槛低——是评估\"VLM 预测式空间推理\"的最佳现成基线。"},{"h":"行动建议","body":"1. 做自动驾驶/机器人前瞻避障，优先拉 SpatialMind 当空间预测基线。\n2. 用其数据引擎范式扩展你自己的场景（如车间/仓储）做领域微调。\n3. 与 GeoScaffold/Ego2World 串成\"几何→预测→规划\"链路验证。"}]},{"file":"../papers/notes/2610.04689__Neuroll仿真器在环发丝仿真.md","id":"2610.04689","title":"Neuroll: Real-Time Neural Strand-Based Hair Simulation via Simulator-in-the-Loop Unrolling","title_zh":"Neuroll：基于仿真器在环展开的实时神经发丝仿真","track":"化身与人体","date":"2026-10-02","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.6,"evidence":"FULL","tags":["\"发丝仿真\"","\"神经物理\"","\"仿真器在环\"","\"实时\"","\"Cosserat杆\""],"flags":[],"sections":[{"h":"一句话结论","body":"发丝动画靠时间积分（每步解 PDE）驱动，质量受算力上限约束；既有神经方法（GroomGen 监督式、Quaffure 准静态、Neuralocks 惯性损失敏感且长程漂移）都有短板。Neuroll 用\"仿真器在环展开（Simulator-in-the-Loop Unrolling）\"训练神经发丝积分器——借服装仿真中\"直接在线最小化物理能量势\"的思路，但攻克了把 Cosserat 杆模型（发丝离线仿真所用，弹性能条件数差）用于训练神经积分器时收敛崩坏的难题，实现实时、动态、长程稳定的神经发丝仿真。"},{"h":"要解决的问题","body":"基于发丝（strand）的头发表示在影视/游戏/VR 中重要，但真实发丝动画更难。时间积分每步解 PDE，质量受算力约束，从业者靠降自由度/简化几何 + 子步维持质量，成本仍高。神经方法：GroomGen 在有限合成仿真数据上监督训练，人工成本高、跨发型/动作泛化差；Quaffure 在全空间学\"身体姿态→发丝形变\"但仅准静态；Neuralocks 用发丝网络 + 惯性损失实现动态且低显存/高效率，但惯性损失权重极敏感（过冲 vs 过刚无中间地带），且都不把先前发丝态喂给网络——动态只由训练目标诱导，长程 rollout 会衰减。服装仿真中 HOOD 等通过图表示 + GNN 直接在线最小化物理能量势、长程自回归动态且泛化好；但把该思路搬到发丝非平凡——Cosserat 杆模型（发丝离线仿真所用，含 Neuralocks）的弹性能条件数差，显著拖累网络训练收敛，使杆基公式不适合训练神经发丝积分器。监督式（GroomGen）靠回归到预计算仿真避免难条件，但需对每个发型/动作/体型/材质重复昂贵物理仿真，且相似动作间轨迹差异大、回归目标带噪。"},{"h":"方法详解","body":"\"仿真器在环展开\"（Simulator-in-the-Loop Unrolling）——核心是把物理仿真器展开进训练回路，直接以物理能量势等作为训练信号（类比服装仿真里在线最小化物理能量的做法），而非回归到预计算轨迹。重点攻克 Cosserat 杆模型条件数差导致神经积分器训练收敛崩坏的问题，从而让杆基物理可直接用于训练实时神经发丝积分器，获得动态 + 长程稳定 + 低显存。"},{"h":"实验与结果","body":"（摘要段未给具体定量指标；正文应含与 GroomGen/Quaffure/Neuralocks 的动态衰减对比、长程 rollout 稳定性、实时性/显存对比。具体数字需读正文确认。）"},{"h":"创新点与贡献","body":"1. 把\"仿真器在环展开\"引入神经发丝仿真，绕开\"回归到带噪预计算轨迹\"与\"杆模型条件数差拖累收敛\"两难。\n2. 实现实时、动态、长程稳定的神经发丝仿真，补齐 Neuralocks 类方法的长程漂移短板。\n3. 为 VR/游戏多用户交互中的实时发丝质量提供新基线。"},{"h":"局限与风险","body":"摘要未披露定量指标与开源情况；Cosserat 杆模型假设可能限制极细/极硬发质；实时性需在端侧 GPU 验证；与最新\"神经物理/可微仿真\"路线的对照待补；训练仍可能依赖物理仿真器（只是不再每发型重复）。"},{"h":"与文献库的关系","body":"库内化身与人体赛道有 VibeAvatar（2609.18632，语音运动学解耦化身）、ARS-Avatar（2609.27600，可动画可重光照 Surfel 化身）、PHOSA（2609.29292，手语化身）、ESTHER（2609.34817，野化自中心立体手）、InfiniHand（2609.35743，流式世界坐标手）、PixReenact（本日 Top10，流式头部化身）。Neuroll 补上\"动态发丝仿真\"这一高价值细节（头发是化身真实感的关键），与 PixReenact/ARS-Avatar 等可组合成\"高真实感实时数字人\"。与库内 3DGS-SPH 固体力学（当日 #14）同为\"可微物理 + 视觉\"方向，但一个管头发、一个管可变形固体。"},{"h":"可复现性","body":"arXiv 预印（许可待确认）；方法核心是\"仿真器在环展开\"，需物理仿真器参与训练，复现门槛中高；建议关注开源与具体定量指标（摘要缺失，需读正文/联系作者）。"},{"h":"行动建议","body":"1. 做高真实感实时数字人/VR 化身，发丝动态是痛点，Neuroll 是值得跟踪的新方向，等开源后评估。\n2. 借鉴其\"仿真器在环展开\"思路改造你已有的神经物理仿真（绕开预计算轨迹回归）。\n3. 与 PixReenact/ARS-Avatar 组合验证\"动态发丝 + 流式头部化身\"的端到端实时性。"}]},{"file":"../papers/notes/2610.04883__ReflectionRobust6DoF光场反射跟踪.md","id":"2610.04883","title":"Reflection-Robust 6DoF Object Tracking with Light Fields","title_zh":"面向反射表面的 6DoF 目标跟踪与光场","track":"重建与SLAM","date":"2026-10-02","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.77,"evidence":"FULL","tags":["\"6DoF跟踪\"","\"反射表面\"","\"光场\"","\"在线重打光\"","\"数据集\""],"flags":[],"sections":[{"h":"一句话结论","body":"把\"反射\"从干扰变成在线位姿线索：每帧用单次光场捕获在线重建并重新打光被跟踪物体，把跟踪问题约化为\"对齐一个被正确打光的模型\"。在反射表面上，SOTA RGB-D 跟踪器的质量会塌，而本方法保持精确——并给出随附的\"光场跟踪数据集\"（同几何/光照/位姿下多反射率重渲染 + 模拟消费级 RGB-D 在反射面退化深度）与一对真实光场运动序列（同物漫反射/反射版芥末瓶）。"},{"h":"要解决的问题","body":"估计运动刚体的 6DoF 位姿是自动驾驶、动态 SLAM、空中机器人的基础。但在反射表面上，每个像素的外观把位姿与物体几何、材质、周围光照耦合在一起——多种未知组合能解释同一观测，若不建模光照，无法仅凭外观恢复位姿。模型化/无模型 6DoF 跟踪器都假设物体外观稳定、深度可信，二者在镜面表面都失效；可重光照重建能恢复新光照下的外观，但只能离线、用很多视图。反射一直被当干扰压制，尽管它编码了几何/运动/环境——此前没有任何跟踪器把它变成在线位姿线索。"},{"h":"方法详解","body":"关键洞察=视相关反射可作为位姿线索。方法从每帧单次光场捕获在线重建并重新打光被跟踪物体，把跟踪约化为对齐一个被正确照明的模型。具体贡献：(1) 一个 6DoF 跟踪方法，在恢复位姿的同时重建周围光照并重打光物体，在反射面保持精确（SOTA RGB-D 在此质量下降）。(2) 一个可重光照物体模型（几何 + 表面朝向 + 材质外观），从单次光场捕获恢复，物体移动时外观正确变化。(3) 在线把外观分解为物体漫反射颜色与其反射的环境，随物体移动更新。(4) 一个光场跟踪数据集：把机器人操作基准在多反射率下重渲染（几何/光照/位姿跨层级一致），每帧配模拟深度以复现消费级 RGB-D 在反射面的退化；另提供同物漫反射/反射版（芥末瓶）的两条真实光场运动序列。"},{"h":"实验与结果","body":"文中图示对比：单目颜色（经典线索）只给出浅谷；EPI 捕获视相关但忽略重打光；只有\"被重打光的 EPI（relit EPIs）\"把损失驱动到真实坐标处归零——量化证明了反射重打光作为位姿线索的有效性。在反射表面上相对 SOTA RGB-D 跟踪器质量优势明显。"},{"h":"创新点与贡献","body":"1. 首次把反射从\"干扰\"转为在线 6DoF 位姿线索（relit EPI 驱动损失归零）。\n2. 单帧光场在线可重光照物体模型，物体移动时外观正确演化。\n3. 在线漫反射/反射环境分解，随运动更新。\n4. 配套光场跟踪数据集（多反射率重渲染 + 模拟 RGB-D 退化 + 真实双版序列），填补反射面跟踪评测空白。"},{"h":"局限与风险","body":"依赖每帧单次光场捕获（需光场/多视角相机硬件，非标准 RGB-D）；在线可重光照在强镜面/复杂环境光下建模假设可能不成立；未与最新无模型在线跟踪（BundleSDF 等）做大规模实时对比；数据集由机器人操作基准重渲染生成，真实多样性有限。"},{"h":"与文献库的关系","body":"库内重建与SLAM赛道有 RRG_SLAM（2609.34527，反射感知高斯SLAM）、RawSLAM（2609.20589）、双协方差高斯SLAM（2609.25746）、HexVIO-DSP（2610.03283）等。RRG_SLAM 同样针对反射面但走\"反射感知高斯 SLAM\"离线-在线混合；本工作是\"光场 + 在线重打光\"的互补路线，二者共同把\"反射\"从 SLAM 的敌人变成可用信号。与 F² SLAM（本日 Top7）可组合：在线重打光提供可信几何，喂给持久 BA。"},{"h":"可复现性","body":"arXiv 预印（许可待确认，似 CC BY 4.0）；方法依赖光场捕获硬件与可重光照建模，复现门槛中高（需光场/多相机装置 + 重打光求解）；数据集随论文提供（含模拟深度），是反射面跟踪的稀缺基准，价值高。"},{"h":"行动建议","body":"1. 做\"反光物体抓取/操作\"（工业、仓储）时，本方法是少数能在镜面上稳定跟踪的方案，优先评估。\n2. 用其光场数据集做反射面跟踪的新基线对照。\n3. 关注与 RRG_SLAM 的路线融合——一个管在线重打光，一个管高斯建图，结合可覆盖\"建图 + 跟踪\"全链。"}]},{"file":"../papers/notes/2610.04351__LoCoSplat最小3D推理实时前馈3DGS.md","id":"2610.04351","title":"LoCoSplat: Real-Time Feed-Forward 3D Gaussian Splatting with Minimal 3D Reasoning","title_zh":"LoCoSplat：以最小 3D 推理实现实时前馈 3D 高斯泼溅","track":"神经渲染","date":"2026-10-03","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.85,"evidence":"FULL","tags":["\"前馈3DGS\"","\"实时重建\"","\"局部上下文\"","\"CUDA graph\"","\"无3D网络\""],"flags":[],"sections":[{"h":"一句话结论","body":"佐治亚理工提出 LoCoSplat——打破\"前馈 3DGS 必须靠重型 3D 网络聚合多视角证据\"的隐含假设：高斯是局部图元，一旦深度预测完成，3D 阶段只需对每个锚点邻域做固定的局部平均即可给出尺度/旋转/不透明度，无需任何可学习 3D 网络。整个编码器以 0.14M 参数的逐点 MLP + 单次 fp16 CUDA graph 运行，6 视图重建 33ms（7 个前馈方法中最快，比前 SOTA 快 4.2×），24 视图 PSNR 比 VolSplat 高 +3.3。"},{"h":"要解决的问题","body":"前馈 3DGS 用少数 posed 图一次性预测高斯图元，取代 NeRF/3DGS 的逐场景优化。主流\"像素对齐预测\"受多视角错位与分辨率受限的高斯预算约束，业界解法是一路加重可学习 3D 模块——稀疏 3D U-Net/CNN、3D cost-volume、长序列 Mamba/Transformer。VolSplat（深度引导体素对齐 SOTA）先预测深度、把反投影像素体素化为锚点，再用 17M 参数的稀疏 3D U-Net 精炼体素体后才解码高斯；该 U-Net 是最大推理开销（约 7 场景/秒），动态形状稀疏计算无法装入 CUDA graph、几乎吃不到混合精度，且随视图增长成为训练内存主导（24 视图训练需 159 小时）。背后隐含假设：在 3D 聚合多视角证据需要大量可学习 3D 容量。"},{"h":"方法详解","body":"核心观察=高斯是局部图元：一旦深度预测好，3D 阶段要补充的（尺度、旋转、不透明度）只依赖每个锚点周围的点云，对该邻域做固定局部平均就足够，无需重型网络。实现：把点特征的 16 维线性投影泼射（splat）进一个\"细网格 + 粗网格\"两层网格，在每个锚点处把两层都读回，再用一个 0.14M 参数的逐点 MLP 解码；没有可学习 3D 网络、没有动态稀疏计算，整个编码器作为单个 fp16 CUDA graph 运行（粗尺度而非层数驱动增益；普通均值作默认聚合器）。"},{"h":"实验与结果","body":"RealEstate10K 上，6/12/24 视图的 PSNR/SSIM/LPIPS 全面超越此前所有前馈方法，且优势随视图变密而扩大（24 视图时比 VolSplat 高 +3.3 PSNR）；零样本迁移到 ACID、在 ScanNet 上微调亦提升。速度：单张 NVIDIA RTX PRO 6000 上 6 视图场景重建 33ms，7 个前馈方法中最快、比前 SOTA 快 4.2×；训练快 2.7×（24 视图 5.9×）；推理显存少用 6.7×。附录含两网格模型演化、24 视图细节下降归因（问题在深度分支而非 3D 阶段）、差异分辨率解释、深度头坍塌分析、ScanNet/RealEstate10K 更多定性结果。"},{"h":"创新点与贡献","body":"1. 首次用\"固定局部平均\"替代重型 3D 网络完成前馈 3DGS 的 3D 阶段，推翻\"3D 聚合需大量可学习容量\"的隐含假设。\n2. 极简架构（0.14M MLP + 双网格 + 无动态稀疏）跑成单 CUDA graph，带来 4.2× 加速、6.7× 省显存、2.7× 训练加速的系统性工程收益。\n3. 在 RealEstate10K/ACID/ScanNet 上建立新的前馈 3DGS SOTA，且优势随视图密度放大。"},{"h":"局限与风险","body":"仅验证室内/室外大规模场景（RealEstate10K、ACID、ScanNet），未覆盖动态、遮挡极端或无纹理退化场景；依赖预训练深度估计作为前端，深度分支的误差（24 视图细节下降的主因）仍会传导；无显式不确定性输出；未与最新\"生成式/世界模型\"路线做对照。"},{"h":"与文献库的关系","body":"库内神经渲染赛道天花板由 OIC_GS（2609.34367，S 4.37，率失真码）、SCION（2610.02322，A 3.85，组合基元）等占据。LoCoSplat 与 VolSplat/像素对齐家族同属\"前馈 3DGS\"，但用\"无 3D 网络\"路线正面 PK VolSplat，是效率维度的强替代候选。与 SCION（结构化组合表示）互补：LoCoSplat 解决\"快而准的单向前馈\"，SCION 解决\"可编辑的组合场景\"。与库内 PocketSplat（2610.03192，S，移动端世界空间潜分配）相比，LoCoSplat 走服务器级实时（33ms/6 视图）而非移动端，二者分别覆盖\"训练/推理效率\"与\"部署端资源约束\"两端。"},{"h":"可复现性","body":"论文标注 CC BY 4.0；摘要未给代码链接，需关注项目页/开源仓库是否随发布放出（前馈 3DGS 系列多有开源，建议优先核验）。复现门槛中等：依赖深度估计前端 + 双网格泼射 + MLP，工程关键在于把稀疏锚点聚合写成可 CUDA-graph 化的定点 shape。"},{"h":"行动建议","body":"1. 若做实时前馈重建/AR 场景理解，优先把 LoCoSplat 当作\"速度-精度\"新基线，替换 VolSplat 类管线。\n2. 关注其\"深度分支是瓶颈\"的归因——后续改进应压深度估计误差而非堆 3D 网络。\n3. 等开源后做与 SCION/PocketSplat 的同口径吞吐/显存对照。"}]},{"file":"../papers/notes/2610.05207__F2SLAM前馈几何持久因子.md","id":"2610.05207","title":"F$^2$ SLAM: Turning Feed-Forward Geometry into Persistent Factors for SLAM","title_zh":"F² SLAM：将前馈几何转化为 SLAM 的持久因子","track":"重建与SLAM","date":"2026-10-04","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.7,"evidence":"FULL","tags":["\"SLAM\"","\"前馈几何\"","\"因子图\"","\"持久BA\"","\"多视角\""],"flags":[],"sections":[{"h":"一句话结论","body":"在线稠密 SLAM 靠持久 BA 状态反复精修，但对弱重叠/遮挡/长序列累积误差敏感；前馈 3D 基础模型（MASt3R/VGGT 类）能给出更广上下文的几何，但现有 FM-SLAM 只在局部窗口算前馈预测、事后对齐/融合，前馈几何始终是\"外部状态\"而非优化器能直接食用的证据。F² SLAM 的原则：前馈几何应以\"优化原生的测量\"身份进入 SLAM——把多视角前馈证据转成挂到现有因子图上的稠密 target-weight 测量，让前馈推理与循环跟踪通过同一个稠密 BA 后端约束同一批关键帧位姿/逆深度/内参。在线用双时间尺度刷新（高频保局部约束+图连通，低频用更广上下文选择性刷新）；状态一致性准入只在候选测量与当前几何态一致时才采纳。TUM RGB-D 上 ATE RMSE 改善。"},{"h":"要解决的问题","body":"在线视觉 SLAM 维护一个可优化几何态，稠密 BA 持续重访/重加权/联合精修；但测量多来自短时序窗口，对弱重叠、遮挡、视角变化、长序列累积误差敏感。前馈 3D 基础模型（FM）能联合处理多图、推断更广上下文的深度/点图/位姿/多视角结构，催生 MASt3R-SLAM、VGGT-SLAM、VGGT-SLAM++ 等 FM-SLAM。但这些系统多在局部窗口/子图算前馈预测，事后才通过对齐/融合/状态级校正与 SLAM 态调和——前馈几何是\"外部状态\"，在线优化器不能直接作用于它。代价有二：更广多视角证据进不了稠密 BA 实际优化的测量集；子图一旦对齐，无法再与后续局部证据联合重加权（校正只做一次）。缺的环节=让前馈几何证据直接、反复参与持久 SLAM 优化。"},{"h":"方法详解","body":"指导原则=前馈几何应以优化原生测量（而非独立几何态）进入 SLAM。把多视角前馈证据转成挂到现有因子图上的稠密 target-weight 测量，使前馈推理与循环跟踪通过同一个稠密 BA 后端约束同一批关键帧位姿、稠密逆深度、可选内参。在线需双时间尺度更新：高频流维护局部约束与图连通；低频流用更广多视角上下文选择性刷新已有测量。因前馈预测在遮挡/弱重叠下可能不可靠，核心难点是\"何时信任刷新\"——用状态一致性检查，仅当候选测量与当前几何态一致才采纳，否则保留原测量。前馈位姿/深度预测可作 gauge-aligned 初始化，但后续几何精修完全留在持久 BA 态内。"},{"h":"实验与结果","body":"文中给出 TUM RGB-D 数据集上 ATE RMSE 的对照（inset），表明将其作为持久因子后跟踪精度提升；机制层面消融双时间尺度与状态一致性准入的作用。"},{"h":"创新点与贡献","body":"1. 把前馈多视角几何形式化为\"优化原生的 target-weight 测量\"，使其直接、反复参与持久稠密 BA。\n2. 双时间尺度测量刷新 + 状态一致性准入，让局部跟踪与更广多视角推理更新同一个因子表示。\n3. 相对\"对齐子图即完事\"的 FM-SLAM，闭合了\"前馈证据→持久优化\"的回路。"},{"h":"局限与风险","body":"前馈几何预测本身在遮挡/弱重叠下仍会失效（靠一致性准入兜底，但不一致时等于没用）；依赖前馈 FM 的质量与可用性；双时间尺度调度与一致性阈值为新超参；未与最新 FM-SLAM 做大规模长序列头对头；TUM RGB-D 仅中等规模场景。"},{"h":"与文献库的关系","body":"库内重建与SLAM赛道密集：MASt3R/VGGT 类属外部 FM，库内有 HexVIO-DSP（2610.03283，S，DSP 立体惯性）、SURE_Map（2609.15795）、RawSLAM（2609.20589）、RRG_SLAM（2609.34527）、AMB3R-SLAM（2609.19518，公里级分层后端）。F² SLAM 是\"把前馈 FM 几何喂进持久 BA\"的范式，可与 VCURF（本日 Top3，不确定性估计）组合——VCURF 给每个前馈测量一个可信度门控，正好补 F² SLAM 的\"何时信任刷新\"。与 Reflection-Robust 6DoF（本日 Top5）互补：一个管\"广上下文几何做持久因子\"，一个管\"反射面在线重打光给可信几何\"。"},{"h":"可复现性","body":"arXiv 预印（许可似 CC BY 4.0）；方法依赖前馈 FM（如 MASt3R/VGGT）作为上游 + 稠密 BA 后端，复现需集成 FM 推理，门槛中高；建议关注是否开源（FM-SLAM 类多有代码）。"},{"h":"行动建议","body":"1. 做长序列/弱纹理 SLAM，把 F² SLAM 当作\"前馈 FM + 持久 BA\"的新范式基线，优先验证其相对 MASt3R-SLAM 的鲁棒性。\n2. 叠加 VCURF 的不确定性门控做状态一致性准入的更强版。\n3. 关注双时间尺度调度在你场景下的超参敏感性。"}]},{"file":"../papers/notes/2610.05233__PixReenact像素条件流式头部化身.md","id":"2610.05233","title":"PixReenact: Pixel-Conditioned Causal Video Diffusion for Streaming Head-Avatar Reenactment","title_zh":"PixReenact：像素条件因果视频扩散的流式头部化身重演","track":"化身与人体","date":"2026-10-04","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.6,"evidence":"FULL","tags":["\"头部化身\"","\"流式重演\"","\"因果视频扩散\"","\"像素条件\"","\"低延迟\""],"flags":[],"sections":[{"h":"一句话结论","body":"流式头部化身重演要稳健的运动迁移、长程身份稳定、低延迟。既有方法依赖专用身份/运动表示（丢弃细粒度视觉信息、继承外部提取器失败模式），且许多扩散式重演用离线 clip 式生成（整段联合去噪后才出结果），难以连续低延迟流式。PixReenact 用因果视频扩散，直接以 VAE 编码的参考帧+驱动帧为条件（无专用表示）；用跨身份伪监督 + 锚定原始参考/驱动输入的纠正式目标分离身份与运动；长自回归 rollout 减漂移；状态感知双教师蒸馏分别处理冷启动与稳态。三套跨身份基准 + 长程流式基准上稳健，极端视角/遮挡/大表情下尤佳，4-NFE 滚动学生每更新发 4 帧、平均发射延迟 239ms。"},{"h":"要解决的问题","body":"流式头部化身重演用参考图按实时驱动视频动起来，要稳健运动迁移 + 长程身份稳定 + 低延迟。既有方法条件于专用身份/运动表示（隐式关键点、3DMM、学习到的身份/运动表示），有效可控但丢弃细粒度视觉信息，且依赖外部关键点/运动提取器——在严重遮挡/大表情/大头部姿态变化下提取器失准会拖累重演。第二个挑战是低延迟连续生成：许多扩散式重演用离线 clip 式（整段联合去噪后才输出），连续流式困难。"},{"h":"方法详解","body":"PixReenact 基于因果视频扩散的像素条件流式重演框架。(1) 直接以 VAE 编码的参考帧 + 驱动帧为条件，不用专用身份/运动表示。(2) 为分离参考身份与驱动运动，用跨身份伪监督 + 锚定原始参考/驱动输入的纠正式目标训练。(3) 长自回归 rollout 减少自回归漂移。(4) 状态感知双教师蒸馏分别处理冷启动（首帧）与稳态生成。"},{"h":"实验与结果","body":"三套跨身份基准 + 长程流式基准上：稳健跨身份重演，尤其极端视角/遮挡/明显面部表情下佳，且长流中保持参考身份。一个 4-NFE 滚动学生每更新发 4 帧，平均发射延迟 239ms。基准构建含公开跨重演 75 对、NeRSemble 75 对、极端条件 68 对、长程流式 28 对。"},{"h":"创新点与贡献","body":"1. 像素条件（无专用表示）的流式头部重演，规避外部提取器失败模式、保留细粒度视觉信息。\n2. 跨身份伪监督 + 纠正式目标，干净分离身份与运动。\n3. 长 rollout + 状态感知双教师蒸馏，兼顾冷启动与稳态的低延迟稳定生成（239ms 平均延迟）。"},{"h":"局限与风险","body":"许可为 CC BY-NC-ND 4.0（⚠️ 非商业 + 禁止演绎，工业落地与二次开发受限，需向作者/机构申请商用授权）。仍受扩散式生成的固有限制（长程偶发身份漂移未完全消除）；4-NFE 学生质量与教师差距待量化；依赖 VAE 编码，极端光照/分辨率下可能退化；未与最新神经渲染式头部化身（如 3DGS 头部）做对照。"},{"h":"与文献库的关系","body":"库内化身与人体赛道密集：ARS-Avatar（2609.27600，可动画可重光照 Surfel 化身）、VibeAvatar（2609.18632）、PHOSA（2609.29292）、ChromaGS-4D（2610.03441，文本驱动语义编辑 4D 高斯化身）、ManifoldSplat-3D（2610.03599，语义形状编辑 3D 高斯头部化身）、PixReenact 与 Neuroll（本日 Top9）同属\"实时化身\"方向——一个管头部重演、一个管发丝动态，可组合成完整实时数字人。与库内渲染与显示赛道（LoCoSplat/SteadySplats）互补：化身生成 + 实时渲染。"},{"h":"可复现性","body":"⚠️ CC BY-NC-ND 4.0（非商业、禁止演绎）——代码/权重即便开源也不可商用或改作衍生，XR 产品化需谨慎评估授权；项目页已公开。复现门槛中等。建议：研究用途可直接拉项目页，商用需联系 OriginAI/NVIDIA 授权。"},{"h":"行动建议","body":"1. 做视频会议/数字人/telepresence 的流式头部重演，PixReenact 质量与延迟俱佳，研究侧优先采用。\n2. ⚠️ 商用前务必确认 NC-ND 许可边界，避免侵权。\n3. 与 Neuroll（发丝）组合探索端到端实时数字人；与 ChromaGS-4D/ManifoldSplat（高斯化身）做\"扩散 vs 高斯\"路线对照。"}]},{"file":"../papers/notes/2610.05576__SteadySplats低方差高斯重采样随机渲染.md","id":"2610.05576","title":"SteadySplats: Resampling of Low-Variance Gaussians for High-Fidelity Stochastic Rendering","title_zh":"SteadySplats：低方差高斯重采样实现高保真随机渲染","track":"神经渲染","date":"2026-10-04","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.85,"evidence":"FULL","tags":["\"随机渲染\"","\"次序无关透明\"","\"方差正则\"","\"时空重采样\"","\"Vulkan\""],"flags":[],"sections":[{"h":"一句话结论","body":"由 3DGS 一作 Kerbl 团队领衔，针对\"随机次序无关透明（OIT）渲染 3DGS 噪声大、不实用\"的痛点，从表示与合成两端系统性降噪：训练时加色彩方差正则隐式压低沿视线方向的 3DGS 方差；推理时用\"基于历史的空间重采样\"加速收敛、\"时序重要性重采样\"保证相机运动下的相干性。Vulkan 渲染器在 1 spp 下比此前随机方法高 13 dB PSNR，并能快速收敛到排序 3DGS（平均 L1 误差 <10⁻⁴），让单样本渲染成为高帧率应用的可行候选。"},{"h":"要解决的问题","body":"随机次序无关透明（stochastic OIT）能优雅高效地渲染 3DGS 这类图元辐射场，但因输出固有可见噪声而不实用。排序 alpha 混合（tile 光栅化）是传统实时方案，但其\"必须排序\"在动态/透明场景下代价高。此前随机方案的瓶颈在表示层（方差大）与图像合成层（收敛慢、运动下闪烁）。"},{"h":"方法详解","body":"在表示与合成两个层面治本。(1) 训练期 Color Variance Regularization：一个色彩正则项隐式降低 3DGS 模型沿视线射线方向的方差。(2) 推理期 Spatial Resampling（Neighbor Reuse + 近似 w_n→x,y）：基于历史的空间重采样在随机渲染时大幅加速图像收敛。(3) 推理期 Spatio-Temporal Resampling：时序重要性重采样（TIR）+ 运动相机处理 + Soft History Rejection + 每图元时空蓝噪声，保证相机运动下的相干性。其余工程：tile-based splatting、early exit、有限历史缓冲、自归一化重要性采样、偏置处理。"},{"h":"实验与结果","body":"优化后的 Vulkan 渲染器在低/高样本数下都有效抑制噪声——在 1 sample per pixel 时比此前随机方法提升 13 dB PSNR，并快速收敛到排序 3DGS（平均 L1 误差 <10⁻⁴）。评估覆盖方差-质量权衡、空间复用、性能、STBN、相机运动分量消融、Pareto 分析、8-邻域重采样、蓝噪声等。"},{"h":"创新点与贡献","body":"1. 首个系统性\"从表示（方差正则）+ 合成（时空重采样）两端同时降噪\"的随机 3DGS 渲染框架。\n2. 把单样本随机渲染做到接近排序 3DGS 质量（L1<10⁻⁴），打开\"极高帧率 + 免排序\"的渲染新空间。\n3. 工程落地到 Vulkan，给出可复现的实现（含伪代码、梯度推导、蓝噪声附录）。"},{"h":"局限与风险","body":"仍依赖 3DGS 表示本身（无法处理表示层未覆盖的几何错误）；单样本质量提升以额外训练正则 + 历史缓冲内存为代价；未与最新\"神经/物理渲染\"做端到端应用对照；重采样在历史复用下对快速剧烈运动仍可能失效（soft rejection 缓解但未根治）。"},{"h":"与文献库的关系","body":"库内 2609.25604（随机高斯泼溅去噪的超快神经推理 Stochastic 2DGS 时序去噪）是同类随机渲染去噪方向，SteadySplats 由 3DGS 原班团队给出更系统、可收敛到排序质量的方案，是更强基线。与 LoCoSplat（本日 Top1，前馈重建）分属\"渲染合成\"与\"前馈重建\"两条互补链。与库内渲染与显示赛道（如 2610.03162 Budgeted-GS LOD）互补：一个管\"怎么快渲已建好的场\"，一个管\"怎么快建场\"。"},{"h":"可复现性","body":"CC BY 4.0；作者阵容含 3DGS 核心作者与生产级 Vulkan 渲染经验，论文附大量实现附录（伪代码、梯度、蓝噪声、bias 处理），复现预期良好；建议关注作者/项目页开源。"},{"h":"行动建议","body":"1. 做头显/AR 实时渲染、需要免排序高帧率时，把 SteadySplats 当随机 OIT 的新基线，尤其关注 1 spp 高质量带来的带宽节省。\n2. 与排序 3DGS 做\"同等质量下的帧率/功耗\"对照，验证能否真正替代 tile 光栅化。\n3. 跟踪其与神经重建（LoCoSplat）结合的可能（快建 + 快渲）。"}]},{"file":"../papers/notes/2610.05610__SEA-LM可穿戴阵列空间音频.md","id":"2610.05610","title":"SEA-LM: Egocentric Spatial Audio Understanding for Wearable Microphone Arrays","title_zh":"SEA-LM：面向可穿戴麦克风阵列的自我中心空间音频理解","track":"触觉与多模态","date":"2026-10-04","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.68,"evidence":"FULL","tags":["\"空间音频\"","\"可穿戴\"","\"智能眼镜\"","\"MLLM\"","\"声源定位\""],"flags":[],"sections":[{"h":"一句话结论","body":"embodied 自我中心智能需要理解复杂环境中的空间音频。现有大型音频语言模型擅长单通道推理但缺乏空间感知，丢弃了声源定位与分离重叠声源的关键线索。SEA-LM 先提出 FOACoder——一个布局灵活的空间音频编码器，在源定位 + 自我中心语音活动检测目标上训练，把可变数量/位置的智能眼镜阵列经波束成形得到的 FOA（一阶环境声）编码；再训练一个 MLLM 通过两阶段课程（6 任务，含多说话人/重叠声下的声源定位与空间选择性转写）理解这些空间音频嵌入。为防转写输出主导下一 token 损失、淹没方向预测，引入时空加权交叉熵。评测集上方位角/仰角 MAE 更低、时间 IoU 更高、外部源幻觉与漏检率更低、多数转写任务 WER 更低，且在 1,211 种 4–9 麦克风智能眼镜阵列配置下鲁棒。"},{"h":"要解决的问题","body":"机器听觉中，空间音频蕴含的空间线索（如声道间…）对声源定位与重叠声源解耦至关重要，但大型音频语言模型建立在单通道音频理解上，丢弃了空间信息。可穿戴智能眼镜阵列（多麦克风）能提供空间音频，但阵列数量/位置可变，需要布局灵活的编码器；且多说话人 + 重叠声下既要定位又要选择性转写，转写损失易淹没方向预测。"},{"h":"方法详解","body":"(1) FOACoder：布局灵活的空间音频编码器，在源定位 + ego-centric VAD 目标上训练，把由可变数量/位置智能眼镜阵列经波束成形得到的一阶环境声（FOA）编码。(2) SEA-LM MLLM：双音频通路 + 可学习空间投影器 + LLM 注入，通过两阶段课程（6 任务：声源定位、多说话人/重叠声下的空间选择性转写等）理解空间音频嵌入。(3) Spatio-Temporal Weighted Cross-Entropy：防止转写输出主导下一 token 预测损失、淹没方向预测。(4) Spatial Audio Supervised Fine-Tuning + 时空加权交叉熵。"},{"h":"实验与结果","body":"自有评测集上：方位角/仰角 MAE 更低、时间 IoU 更高、外部源幻觉与漏检率更低、多数转写任务 WER 更低；在 1,211 种 4–9 麦克风智能眼镜阵列配置下保持鲁棒。附课程消融、FOACoder 训练/评估、波束成形伪影与阵列选择、RIR 仿真等大量附录。"},{"h":"创新点与贡献","body":"1. FOACoder：首个布局灵活、由可变阵列经波束成形得到 FOA 的空间音频编码器，适配真实眼镜硬件。\n2. 把空间音频嵌入送进 MLLM 做 6 任务理解（含重叠声下空间选择性转写）的两阶段课程范式。\n3. 时空加权交叉熵解决\"转写淹没方向\"的训练失衡。\n4. 在 1,211 种阵列配置下验证鲁棒性，贴近可穿戴部署现实。"},{"h":"局限与风险","body":"依赖仿真生成的 RIR/阵列传输函数与混合参数（真实噪声分布可能偏移）；FOA 仅一阶，空间分辨率有限；评测集为自建，与真实复杂声学环境差距待验证；多说话人极度重叠下性能上限未充分探索；未给端到端眼镜端侧延迟/功耗。"},{"h":"与文献库的关系","body":"库内触觉与多模态赛道有 指尖上的远程表面（2609.27938，电振动触觉遥操作）、HACo（2609.36596，触觉主动柔顺）、Dexterous Tactile World Model（2609.34286）、E_WAVE（2609.34346，事件连续光流）、数字孪生遥操作（2610.05081）等。SEA-LM 补上\"自我中心空间音频\"这一多模态感知维度，与 XR 眼镜（音频是头显天然模态）强相关。与库内晕动症/VR 研究（2609.25422、2609.26203 VERA）可组合做\"音频-视觉\"多模态 XR 体验。"},{"h":"可复现性","body":"CC BY 4.0；含可复现性声明与大量仿真/训练细节附录，复现门槛中等（需 FOA 仿真 + MLLM 训练）；建议关注作者开源（音频空间编码在 XR 眼镜场景需求强）。"},{"h":"行动建议","body":"1. 做 XR 眼镜的\"听见周围/空间音频助手\"，SEA-LM + FOACoder 是当前最贴合可穿戴阵列的方案，优先评估。\n2. 用其时空加权交叉熵思路解决你多任务音频模型里的\"主导任务淹没\"问题。\n3. 关注在真实眼镜硬件（非仿真）上的泛化，做 sim-to-real 验证。"}]},{"file":"../papers/notes/2610.06688__GS-Pool物体级变化检测3DGS.md","id":"2610.06688","title":"GS-Pool: Object-Level Change Detection in 3D Gaussian Splatting","title_zh":"GS-Pool：3D 高斯泼溅中的物体级变化检测","track":"神经渲染","date":"2026-10-05","batch":"2026-10-07","batchLabel":"2026-10-07","grade":"A","value":3.75,"evidence":"FULL","tags":["\"变化检测\"","\"3DGS\"","\"物体池\"","\"SAM2\"","\"巡检\""],"flags":[],"sections":[{"h":"一句话结论","body":"工厂/博物馆/测绘常隔数月拍同一空间，想知道\"哪些物体变了\"。两次访问各自独立重建为 3DGS 后直接对比并不行（训练随机 + 二次扫描照片少）。GS-Pool 把两次重建的 SAM2 掩码\"提升\"到渲染它们的高斯上、跨视角合并成\"物体池\"，每个决策在 3D 中每个物体只做一次；并用\"照片载体\"（一次重建对另一次照片的 3DGS 训练损失，反传到渲染该像素的高斯）+ GS-Diff 几何/色彩项 + 蒸馏 DINOv3 特征，与两访问都出现的物体做对照设定每场景变化阈值。PASLCD 上 mIoU/F1 达 0.751/0.846（GS-Diff 0.644/0.758，+17%/+12%），CL-Splats 上 0.855 mIoU（+33%）。"},{"h":"要解决的问题","body":"3DGS 变化检测通常被做成稠密逐像素问题（MV-3DCD/O-SCD 融每视图线索成变化场；GS-Diff 直接比较两套图元、逐图元渲染变化分、每像素固定 0.5 阈值）。但同一不变空间两次重建永不相同（3DGS 训练随机、相机路径不同），作者称此差异为 drift；两次重建间算的差异把\"变化\"与\"drift\"混在一起。而物体在 3D 中常跨越数千图元，逐像素决策 + 固定阈值并不合理。"},{"h":"方法详解","body":"让重建从\"图元空间\"直接提议候选物体变化，用另一次访问的照片来确认或否决。(1) 物体池（object pool）：每次访问照片的 SAM2 掩码提升（lift）到渲染它们的图元上，跨视图合并成物体，证据在物体级聚合、每个物体只决策一次而非每图元。(2) 照片载体（photographic carrier）：每个输入重建对另一次访问照片的 3DGS 训练损失，反传到渲染每个像素的高斯——照片不带重建 drift，用作跨访问确认。(3) 结合 GS-Diff 的几何/色彩项 + 蒸馏的 DINOv3 语义特征（纯几何/色彩会漏掉\"同位置不同物体\"）。与两访问都出现的物体对照，为每个场景设定变化阈值。每个变化物体以\"带决策证据的高斯集合\"返回，检查员可在 3D 中审阅。保留 GS-Diff 的 drift 模型/几何/色彩核/可见性权重不变。"},{"h":"实验与结果","body":"PASLCD 上 mIoU/F1 = 0.751/0.846，强于最强前法 GS-Diff 的 0.644/0.758（+17%/+12%）；mIoU 也高于 O-SCD、PlenoCI（2609.28997，本库）、MV-3DCD 达 36%/40%/57%；CL-Splats 上 mIoU 0.855，比 MV-3DCD 高 33%。"},{"h":"创新点与贡献","body":"1. 物体池：把变化决策从逐图元/逐像素提升到\"每物体一次\"，从根本上规避 drift 与固定阈值的错配。\n2. 照片载体：用跨访问照片的训练损失做无 drift 确认，与图元空间提议互补。\n3. 引入蒸馏 DINOv3 语义特征补全\"同位置换物\"的漏检。\n4. 返回带证据的高斯集合，支持 3D 可审阅——贴合工厂/博物馆巡检的实际工作流。"},{"h":"局限与风险","body":"依赖 SAM2 掩码质量（掩码错则物体池错）；两次重建都需存在且可用（无法处理只一次有重建的情况）；DINOv3 蒸馏增加流程复杂度；阈值仍按场景设定，跨场景泛化需进一步验证；未评测极端光照/季节变化。"},{"h":"与文献库的关系","body":"库内 PlenoCI（2609.28997，基于光场特性的视角依赖感知变化分类）是同类\"3DGS 变化检测\"方向，GS-Pool 在 PASLCD 上 mIoU 比其高 40%，是更强基线。与 MaRO-GS（当日 #15，鲁棒物体中心 3DGS）互补：MaRO-GS 管\"单次建图时物体聚焦\"，GS-Pool 管\"两次建图间物体级变化\"。与库内数字孪生方向（如 RIE 2609.26795，照片级重建到可交互环境）共同支撑\"巡检/数字孪生差异比对\"场景。"},{"h":"可复现性","body":"arXiv 永续非独占许可；方法组合清晰（SAM2 lift + 训练损失反传 + DINOv3 蒸馏 + GS-Diff 复用），复现门槛中等；建议关注作者开源（变化检测在巡检场景需求强）。"},{"h":"行动建议","body":"1. 做工厂/场馆/工程巡检的\"前后差异比对\"，GS-Pool 是当前 3DGS 变化检测最强方案，优先采用。\n2. 用其\"物体池 + 照片载体\"思路改造你已有的逐图元变化检测管线。\n3. 与 PlenoCI 做同数据集对照，验证语义特征带来的增益。"}]},{"file":"../papers/notes/2610.02322__SCION.md","id":"2610.02322","title":"SCION: Scene Composition with Instanced Neural Primitives","title_zh":"SCION：基于实例化神经基元的场景组合表示","track":"神经渲染","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"A","value":3.85,"evidence":"FULL","tags":["神经渲染"],"flags":[],"sections":[{"h":"一句话结论","body":"SCION 用“可复用基元词汇 + 轻量世界空间实例”的层次化组合场景表示替代独立高斯，联合离散/连续优化，1.2MB 维持高质并支持实例级编辑/动画，率失真优于现有高斯压缩。"},{"h":"要解决的问题","body":"现有神经场景表示把每个元素当作独立高斯，存冗余参数、缺乏操作句柄；Splat&Replace 类需人工选重复元素。"},{"h":"方法详解","body":"层次化组合表示——紧凑可复用基元词汇 + 变换副本的世界空间实例；多视角联合优化离散（基元分配）+ 连续（变换）参数；两级 densification（高斯 + 实例）+ 对抗损失保共享基元细节。"},{"h":"实验与结果","body":"率失真优于现有高斯压缩；1.2MB；实例级编辑/动画无需重训；含消融。"},{"h":"创新点与贡献","body":"组合基元发现（vs 压缩）；实例级编辑/动画；对抗损失保共享细节。"},{"h":"局限与风险","body":"基元词汇容量需预设；复杂非重复结构收益下降；仅场景表示（未涉渲染管线优化）。"},{"h":"与文献库的关系","body":"库内高斯压缩/抽象密集（COSA-GS/MoQSplat/TopoGS/SplatLabel/PePESeg3D/Observation-Gram/GS-PQM）。SCION 是“组合基元”新范式，区别于逐高斯压缩——路线级观察：库正从纯压缩走向结构化组合表示。"},{"h":"可复现性","body":"项目页（Princeton）；倾向代码（以正文为准）。"},{"h":"行动建议","body":"大规模场景资产生产关注；注意与 Budgeted-GS/PocketSplat 的互补（组合表示 + 预算部署）。"}]},{"file":"../papers/notes/2610.02697__GeoScaffold.md","id":"2610.02697","title":"GeoScaffold: Learning Compact Geometric Latents via Reconstruction for Efficient Vision-Language Navigation","title_zh":"GeoScaffold：通过重建学习紧凑几何潜变量以实现高效视觉-语言导航","track":"空间计算与UI","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"A","value":3.85,"evidence":"FULL","tags":["空间计算与UI"],"flags":[],"sections":[{"h":"一句话结论","body":"GeoScaffold 在训练时一次性把几何监督“内化”进 VLA 策略（深度 tokenizer + 几何 query tokens 重建深度/连通性/可达性），推理时丢弃脚手架，在连续 VLN 基准上一致优于纯视觉导航器，适合轻量边缘部署。"},{"h":"要解决的问题","body":"流式 Video-LLM 导航策略继承 2D 预训练的弱 3D 几何先验；现有几何增强在推理时持续付费（深度传感器/3D 编码器/每步感知调用）。"},{"h":"方法详解","body":"训练时学紧凑深度 tokenizer（冻结）；用少量可学习几何 query tokens 微调策略，让其隐状态重建导航关键几何；脚手架（tokenizer/生成器/重建头）训练后丢弃，主干与动作接口不变。"},{"h":"实验与结果","body":"VLN-CE 基准一致优于领先纯视觉导航器；推理效率对比几何增强方法；主干通用性；实现细节完整。"},{"h":"创新点与贡献","body":"训练时付费、推理时免费的几何内化；脚手架隐喻；边缘部署友好。"},{"h":"局限与风险","body":"仍属 VLN（具身导航）而非 XR 直接应用；几何仅重建深度/连通性/可达性；未在真实机器人长时验证。"},{"h":"与文献库的关系","body":"库内有 TANGO（人形导航）；GeoScaffold 补“几何先验内化”思路，属空间计算/具身交叉。"},{"h":"可复现性","body":"基准实验 + 方法清晰；倾向代码（以正文为准）。"},{"h":"行动建议","body":"具身/空间智能方向关注；思考向 AR 导航迁移。"}]},{"file":"../papers/notes/2610.02715__Ego2World.md","id":"2610.02715","title":"Ego2World: Compiling Egocentric Cooking Videos into Executable Worlds for Belief-State Planning","title_zh":"Ego2World：将第一视角烹饪视频编译为可执行世界以支持信念态规划","track":"感知与认知","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"B","value":3.45,"evidence":"FULL","tags":["感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"Ego2World 把标注过的烹饪第一视角视频编译为部分可观测下的可执行规划环境，分离世界状态与智能体信念，支持对规划/记忆选择的受控研究；6 规划器 105 任务显示接受操作常未达成目标，Qwen-Plus 配对研究信念持久化提升动作有效性 4.15pp、降视觉查询 90.27%。"},{"h":"要解决的问题","body":"评测智能体需评估其自选动作后果；第一视角视频丰富但缺可执行环境。"},{"h":"方法详解","body":"编译器把源步骤/物体链接到符号动作规则、持久世界状态、显式任务条件；世界状态与信念分离；执行轨迹 + 条件检查区分中断/部分/完成。"},{"h":"实验与结果","body":"105 任务评 6 规划器；Qwen-Plus 配对研究（信念持久化 +4.15pp 动作有效性、-90.27% 视觉查询，令牌更多但无完成增益）。"},{"h":"创新点与贡献","body":"把人类活动编译为可执行世界；信念-世界分离的可控研究；可复用测试床。"},{"h":"局限与风险","body":"仅烹饪域；编译依赖标注质量；结论偏诊断性（无完成增益）。"},{"h":"与文献库的关系","body":"库内第一视角可执行世界基准少；补“可执行世界模型评测”缺口。"},{"h":"可复现性","body":"基准/数据集/编译器；倾向公开（以正文为准）。"},{"h":"行动建议","body":"具身智能评测方向关注；跨域（非烹饪）扩展价值高。"}]},{"file":"../papers/notes/2610.03162__Budgeted-GS-LOD.md","id":"2610.03162","title":"Budgeted-GS: Real-Time Large-Scale Gaussian Splatting via Factoring LOD","title_zh":"Budgeted-GS：基于因式分解 LOD 的实时大规模高斯泼溅","track":"渲染与显示","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"S","value":4.65,"evidence":"FULL","tags":["渲染与显示"],"flags":[],"sections":[{"h":"一句话结论","body":"提出 Budgeted-GS，将任意训练好的 3DGS 模型转化为“因式树”多分辨率层级，并按目标设备显存自动选 LOD；首次给出可理论量化的“容量下限/预算-误差定律”，在消费级 GPU 上以原生 1080p 全 SH 实时渲染城市级场景。"},{"h":"要解决的问题","body":"3D Gaussian Splatting 在城市场景下携带数百万高斯、数 GB 显存，消费级 GPU 无法实时高质渲染；且训练时盲目堆高斯再压缩浪费算力。"},{"h":"方法详解","body":"后处理法——构造“因式树”（moment-matched aggregates 的多分辨率层级），数秒构建后单一质量参数按视角选择 LOD 以适配显存；训练侧法——先测场景所需基元数再直接按预算训练。理论支撑：基于相空间最优传输的预算-误差定律 + covering theorem 认证冗余基元选择；实时 CUDA 光栅路径去除每帧选择开销。"},{"h":"实验与结果","body":"13 个公开场景在 preregistered 协议下验证容量下限；从物体场景到官方城市场景捕获，单消费级 GPU 以原生 1920x1080、全 SH 实时渲染（实测约 71 fps 全集合 1080p）。"},{"h":"创新点与贡献","body":"可理论量化的容量下限回答“场景到底需要多少高斯、可安全舍弃多少”；训练-推理统一的预算理论；LOD 因式树适配异构设备显存。"},{"h":"局限与风险","body":"依赖已训练 3DGS（后处理路线）；极端动态/无结构场景未验证；容量下限假设需满足覆盖定理条件，普适性待考。"},{"h":"与文献库的关系","body":"库内已有大量 3DGS 压缩/抽象（COSA-GS、MoQSplat、TopoGS、SplatLabel、PePESeg3D、Observation-Gram、GS-PQM 等）。Budgeted-GS 是首篇给出理论容量下限 + 训练侧预算控制的，区别于“逐高斯压缩”，属互补而非取代。"},{"h":"可复现性","body":"preregistered 协议、官方城市场景、CUDA 光栅器；论文提及代码/项目页（以正文 URL 为准）。"},{"h":"行动建议","body":"城市场景/设备端 3DGS 部署优先采用；关注容量下限的普适性与跨数据集验证。"}]},{"file":"../papers/notes/2610.03192__PocketSplat.md","id":"2610.03192","title":"PocketSplat: Mobile Gaussian Reconstruction via World-Space Latent Allocation","title_zh":"PocketSplat：基于世界空间潜分配的移动端高斯重建","track":"神经渲染","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"S","value":4.28,"evidence":"FULL","tags":["神经渲染"],"flags":[],"sections":[{"h":"一句话结论","body":"前馈式“预算可控”移动端高斯重建框架：给定输出预算在世界空间分配整型容量，在 iPhone 上直接构建比可部署 MVSplat 更紧凑、更高质量的资产且显著更快，原生 MVSplat/DepthSplat 超出设备显存。"},{"h":"要解决的问题","body":"移动端高斯重建需同时满足“模型在设备算力包络内运行”与“资产大小适配下游移动使用”；现有前馈重建解码稠密图像对齐候选，基数由输入分辨率/视角隐式决定。"},{"h":"方法详解","body":"图像条件世界空间 latent 场 + 预算条件高斯解码器；在预测世界空间组织几何感知 latent 候选，按局部 cell 分配精确整型容量，仅对保留候选解码完整高斯属性；cell-conditioned latent 融合聚合多视角证据；spatial responsibility decoding 局部稀疏化后适配高斯支撑。"},{"h":"实验与结果","body":"DL3DV 与 OOD 基准建立质量-预算权衡；Mip-NeRF 360 上在目标 iPhone 直接运行，构建比可部署 streamed MVSplat 变体更快的紧凑高质量资产；原生 MVSplat/DepthSplat 超出设备显存。"},{"h":"创新点与贡献","body":"显式预算控制（整型容量分配）而非隐式决定基数；世界空间 latent 聚合多视角证据；面向真机部署验证。"},{"h":"局限与风险","body":"预算固定后灵活性受限；依赖前馈假设；主要在 DL3DV/Mip-NeRF 360 评测，跨域泛化待考。"},{"h":"与文献库的关系","body":"库内 3DGS 重建多侧重离线质量；PocketSplat 补“移动端实时预算重建”缺口，与 Budgeted-GS（后处理压缩）形成“训练侧预算 vs 后处理预算”双路线。"},{"h":"可复现性","body":"真机 iPhone 实验 + 对比基线；倾向有代码（以正文为准）。"},{"h":"行动建议","body":"移动 XR 内容生成/扫描首选关注；与 Budgeted-GS 组合（重建 + 部署压缩）。"}]},{"file":"../papers/notes/2610.03232__AI.md","id":"2610.03232","title":"Seeing through the Eyes of AI: Situated Explainability in Augmented Reality","title_zh":"透过 AI 之眼：增强现实中的情境化可解释性","track":"空间计算与UI","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"B","value":3.35,"evidence":"FULL","tags":["空间计算与UI"],"flags":[],"sections":[{"h":"一句话结论","body":"提出用 AR 把可解释 AI（XAI）信息以“情境化/空间化”方式实时呈现在用户工作空间中，解决 2D 屏上解释需用户自行映射到物理对象的问题，并通过两项用户研究给出体验洞察。"},{"h":"要解决的问题","body":"现有 XAI 多在 2D 屏用预录数据呈现，用户需把显示信息映射回物理对象与真实位置，解释难在情境中理解。"},{"h":"方法详解","body":"在 AR 中实时呈现空间可解释性信息；展示已知 XAI 方法如何应用于 AR；两项用户研究（探索性 + 对比性）收集体验。"},{"h":"实验与结果","body":"用户研究 1（探索性评估）+ 用户研究 2（对比）；主题涵盖情境化解释、信任/可靠、ML/AI 经验、LLM 集成等。"},{"h":"创新点与贡献","body":"把 XAI 从 2D 屏搬到物理情境（情境化解释）；方法论应用而非新算法。"},{"h":"局限与风险","body":"方法新颖性偏低（应用已知 XAI 于 AR）；偏定性用户研究、缺量化 SOTA；样本/规模未明。"},{"h":"与文献库的关系","body":"库内 AR/空间计算有情境化解释缺口；补“AR + XAI”交叉。"},{"h":"可复现性","body":"用户研究设计清晰；无代码（HCI 论文）。"},{"h":"行动建议","body":"AR 智能助手/工业巡检解释界面参考；关注量化对比后续。"}]},{"file":"../papers/notes/2610.03283__HexVIO-DSP.md","id":"2610.03283","title":"HexVIO: Towards All-Day Stereo-Inertial Tracking Through Commodity DSPs","title_zh":"HexVIO：借助商用 DSP 实现全天候立体-惯性追踪","track":"重建与SLAM","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"S","value":4.58,"evidence":"FULL","tags":["重建与SLAM"],"flags":[],"sections":[{"h":"一句话结论","body":"将立体-惯性 VIO 的视觉前端卸载到骁龙 Hexagon DSP、后端留主 CPU，在商用手机上实现 67% 功耗下降或 86% 吞吐提升，0.83W 维持 30fps 实时追踪约 18 小时——为 XR/可穿戴“全天追踪”提供系统级解法。"},{"h":"要解决的问题","body":"XR/可穿戴设备需要全天、低温、长续航的 VIO；纯 CPU 实现高功耗、低吞吐。"},{"h":"方法详解","body":"利用 commodity Hexagon DSP（HVX 宽 SIMD + HMX 矩阵单元 + VTCM 紧耦合内存）；前端（金字塔/检测/追踪）DSP 化、后端 CPU；FastRPC 共享内存跨边界零拷贝；稀疏特征采样需驻留 VTCM。"},{"h":"实验与结果","body":"7 个 EuRoC 类序列（EV102/EMH03/TR2/TR6/MOO02/MOO08/XWALK）做 CPU vs DSP 对比，指标含 ATE/RTE/FPS/前后端时延；DSP 前端时延由 ~7–9ms 降到 ~2ms，端到端 p99 约 14.7ms；30fps、0.83W 长时追踪。"},{"h":"创新点与贡献","body":"把 VIO 前端搬上 commodity DSP 的系统工程创新；量化“全天追踪”续航（约 18 小时）；真实手机实现的参考价值极高。"},{"h":"局限与风险","body":"绑定特定 DSP 架构（骁龙 V73）；后端尚未 DSP 化；主要评 EuRoC 类室内序列，室外/大场景未覆盖。"},{"h":"与文献库的关系","body":"库内已有大量 SLAM/VIO（RRG-SLAM、KYS-SLAM、DAVIO、World SLAM Model、FMCW-LIO 等），HexVIO 的增量在“低功耗硬件落地”维度，与算法型 VIO 互补。"},{"h":"可复现性","body":"真实手机实现 + 详细 DSP 架构描述；倾向有代码（以正文为准）。"},{"h":"行动建议","body":"XR 一体机/眼镜续航优化的重要参考；关注后端 DSP 化与跨芯片移植。"}]},{"file":"../papers/notes/2610.03441__ChromaGS-4D.md","id":"2610.03441","title":"ChromaGS: Text-Driven Semantic Editing of 4D Gaussian Avatars","title_zh":"ChromaGS：面向 4D 高斯化身的文本驱动语义编辑","track":"化身与人体","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"A","value":3.92,"evidence":"FULL","tags":["化身与人体"],"flags":[],"sections":[{"h":"一句话结论","body":"ChromaGS 对可动 3D 高斯头部化身做实时语言引导的颜色编辑，给每个高斯学语义区域软分配并把颜色分解为区域基色 + 高斯残差，首次实现确定性、局部精确、渲染时即时（约 50ms）改色且无需重训。"},{"h":"要解决的问题","body":"现有文本驱动头像编辑要么纠缠特征/缺乏几何一致性，要么需慢速逐提示优化或牺牲身份/绑定；生成式编辑会引入非预期改动。"},{"h":"方法详解","body":"语义掩码（SAM3 + 文本）→ K=6 语义类（发/眉/眼/唇/肤/背景）；颜色分解为区域基色 + 高斯残差；两阶段语言管线（Flan-T5-Small 解析为结构化指令 + 确定性颜色解析器处理绝对/相对指令）；编辑在渲染时应用。"},{"h":"实验与结果","body":"基于 animatable GS 框架，RTX 5090 训练约 15min；FaceScape/INSTA，每场景 14 种编辑 × 多主体约 10k 编辑帧 @512²；指标 Identity Preservation(ArcFace)、CLIP Score、Context Preservation(1-LPIPS)；对比 GaussianAvatar-Editor（每编辑约 800s）与 InstructPix2Pix（约 400ms/帧，有颜色溢出/过饱和）。"},{"h":"创新点与贡献","body":"确定性局部颜色控制（vs 生成式）；残差保留细节；渲染时即时编辑。"},{"h":"局限与风险","body":"仅颜色（非几何）；依赖 SAM3 掩码质量；K=6 语义类有限。"},{"h":"与文献库的关系","body":"库内化身方向有 PHOSA（手语化身）、ARS-Avatar（可重光照）、化身畸变意图识别等；ChromaGS 补“高斯化身实时颜色编辑”，且与同作者 ManifoldSplat（形状编辑）互补。"},{"h":"可复现性","body":"项目页 + 代码 + 明确指标。"},{"h":"行动建议","body":"虚拟人/VR 化身实时换装换色方向重点；关注与 ManifoldSplat 合并为统一编辑框架。"}]},{"file":"../papers/notes/2610.03599__ManifoldSplat-3D.md","id":"2610.03599","title":"ManifoldSplat: Language-Guided Semantic Shape Editing of 3D Gaussian Head Avatars","title_zh":"ManifoldSplat：面向 3D 高斯头部化身的语义形状编辑","track":"化身与人体","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"A","value":3.92,"evidence":"FULL","tags":["化身与人体"],"flags":[],"sections":[{"h":"一句话结论","body":"ManifoldSplat 是首个端到端、语言引导的 3D 高斯头部化身“形状”语义编辑框架，在 FLAME 流形内编辑（而非直接优化非结构高斯云），严格保持身份与动画，约 90s 重建+编辑、约 800fps 渲染，在局部提示对齐/几何一致性/身份保持上达 SOTA。"},{"h":"要解决的问题","body":"文本驱动头像编辑难提供细粒度局部控制（特征纠缠/缺几何一致性）；自然语言改几何需慢速逐提示优化或牺牲身份/绑定。"},{"h":"方法详解","body":"在结构化 FLAME 流形内编辑而非非结构高斯云；DeltaRegion——按区域解耦的 CVAE 前馈输出形状增量；加 refining 阶段恢复视角一致细节；单目视频重建。"},{"h":"实验与结果","body":"合成数据集可扩展生成；FaceScape 等基准；SOTA 于局部提示对齐/几何一致性/身份保持；约 90s + 约 800fps。"},{"h":"创新点与贡献","body":"流形约束保身份/绑定；前馈形状增量（vs 逐提示优化）；与 ChromaGS 形成“形状 + 颜色”双编辑。"},{"h":"局限与风险","body":"仍限头部化身；依赖 FLAME 参数化；单目重建假设。"},{"h":"与文献库的关系","body":"与 ChromaGS 同作者互补；库内化身编辑方向补强（PHOSA/ARS-Avatar 等）。"},{"h":"可复现性","body":"项目页 + 代码。"},{"h":"行动建议","body":"高斯化身编辑方向核心参考；关注形状 + 颜色统一。"}]},{"file":"../papers/notes/2610.03607__WING.md","id":"2610.03607","title":"World Action Learning via Interaction-Centric Spectral Latent Guidance (WING)","title_zh":"WING：基于交互中心谱域潜引导的世界动作学习","track":"感知与认知","date":"2026-10-06","batch":"2026-10-06","batchLabel":"2026-10-06","grade":"A","value":4.15,"evidence":"FULL","tags":["感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"WING 从第一视角（egocentric）视频把“交互中心”的运动知识迁移到机器人策略，用谱域低频对齐跨具身共享语义，在 LIBERO 99.2%、RoboTwin 2.0 93.8%、RoboCasa-GR1 57.7% 及 4 项真实操作任务上显著优于基线。"},{"h":"要解决的问题","body":"机器人策略需海量真实交互数据、成本高；egocentric 视频丰富但帧重建潜动作易被相机自身运动等干扰主导，且人-机器人时序动态不同。"},{"h":"方法详解","body":"先分离观察者诱导运动与手-物交互，把交互中心成分蒸馏为潜动作；利用跨具身任务语义集中于慢变时序结构的观察，在谱域识别 egocentric 潜动作与机器人行为的共享低频成分（DCT 低频分量），引导动作生成。"},{"h":"实验与结果","body":"LIBERO 99.20%、RoboTwin 2.0 93.80%、RoboCasa-GR1 57.7%；4 项真实操作任务多泛化设置；4 个研究问题 + 消融（observer debiasing、spectral guidance、DCT 分量数、ego 预训练策略）。"},{"h":"创新点与贡献","body":"交互中心谱域引导；跨具身低频对齐；不依赖大规模机器人演示即可迁移人类交互知识。"},{"h":"局限与风险","body":"依赖第一视角数据质量；真实任务 57.7% 仍有落差；与最新 VLA 大模型的正面对比需核实。"},{"h":"与文献库的关系","body":"库内有人形导航 TANGO、具身相关方向；WING 属“egocentric→robot policy”迁移，补感知-动作迁移缺口。"},{"h":"可复现性","body":"项目页 + 多基准 + 真实实验；倾向代码（以正文为准）。"},{"h":"行动建议","body":"数据高效机器人学习方向重点追踪；关注与 VLA 结合的下一步。"}]},{"file":"../papers/notes/2610.06970__EVFormer.md","id":"2610.06970","title":"EVFormer: An Egocentric Vision-EMG Bidirectional Attention Model for Bimanual Hand Pose Estimation","title_zh":"EVFormer：面向双手手姿估计的自我中心视觉-肌电双向注意力模型","track":"交互与输入","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"B","value":3.4,"evidence":"PARTIAL","tags":["交互与输入"],"flags":[],"sections":[{"h":"一句话结论","body":"EVFormer 用第一视角视觉 + 表面肌电（EMG）的双向注意力估计双手手姿，面向虚拟现实交互、可穿戴控制与康复。其融合视觉（易受自遮挡退化）与 EMG（不受遮挡但噪声大）互补，试图提升手姿估计的鲁棒性。【全文抓取不完整（ar5iv 仅返回参考文献，约 5,120 字），以下基于摘要与标题评估，方法/实验细节未在正文核实。】"},{"h":"要解决的问题","body":"第一视角双手手姿估计对 VR 交互/可穿戴控制很关键，但视觉观测常因自遮挡、手-物交互而退化。"},{"h":"方法详解","body":"（摘要级）双向注意力融合第一视角视觉特征与 EMG 信号，互补遮挡与噪声；具体架构细节未在可获取正文中核实。"},{"h":"实验与结果","body":"（摘要级）面向虚拟交互、可穿戴控制、康复；具体数据集/指标未在可获取正文中核实，须以原文为准。"},{"h":"创新点与贡献","body":"视觉 + EMG 双向注意力用于双手手姿，EMG 作为不受视觉遮挡影响的补充模态，对 XR 输入有启发。"},{"h":"局限与风险","body":"全文经 ar5iv 降级仅含参考文献（约 5,120 字符），正文方法/实验无法核实；评分偏向摘要，待原文/代码放出后复核。证据等级 PARTIAL。"},{"h":"与文献库的关系","body":"库内“交互与输入”赛道有 EVFormer 类第一视角手姿/手势（ViMoWear 2610 期 sEMG-IMU 手势、EVFormer 视觉-EMG）；与库内手势/手姿线互补（多模态融合输入方向）。"},{"h":"可复现性","body":"以原文/代码为准（当前不可核实）。"},{"h":"行动建议","body":"XR 手姿/手势输入方向关注；待全文放出后复核 EMG 融合的具体增益与数据集。"}]},{"file":"../papers/notes/2610.07477__MRPilot-LLM.md","id":"2610.07477","title":"MRPilot: Supervising and Intervening LLM-Based Multi-Robot Teams through Mixed Reality","title_zh":"MRPilot：通过混合现实监督与介入 LLM 驱动的多机器人团队","track":"空间计算与UI","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":3.68,"evidence":"FULL","tags":["空间计算与UI"],"flags":[],"sections":[{"h":"一句话结论","body":"MRPilot 是一套通过混合现实（MR）界面监督与介入 LLM 驱动的多机器人团队的框架，归纳出 8 类干预类型（信息澄清/计划优化/授权访问/失败恢复/能力缺口协助等）。用户研究（含配对统计）显示，MRPilot 在 7 类干预事件的完成时间上短于基线，系统支持的交互型任务完成最快。"},{"h":"要解决的问题","body":"用 LLM 以自然语言指挥异构多机器人系统（MRS）时，任务解释、机器人分配、协同困难；人类需要可干预的监督手段。"},{"h":"方法详解","body":"MRPilot 把 LLM 规划/执行与 MR 可视化结合，把干预事件形式化为 8 类（T1–T8），支持人类在任务执行中澄清、重规划、授权、失败恢复、能力缺口协助等；MR 界面提供情境化的任务/机器人状态与干预入口。"},{"h":"实验与结果","body":"用户研究，9 类干预事件；用 Shapiro–Wilk 检验正态性后，正态数据报均值±SD + 配对 t 检验，非正态报中位数±IQR + Wilcoxon；MRPilot 在 7 类干预完成时间上显著短于基线（如信息澄清 Mdn 102.24→67.49，W=23, p<.01, r=-0.78）。"},{"h":"创新点与贡献","body":"把 MR 作为 LLM-MRS 的“可变自主性（variable autonomy）”干预层，并系统化干预类型学；实用 HCI 贡献。"},{"h":"局限与风险","body":"以用户研究为主，缺乏大规模/真实部署；MR 界面的认知负荷与长时可用性的量化有限；依赖具体 LLM-MRS 栈。"},{"h":"与文献库的关系","body":"库内“空间计算与UI”赛道有 MR/AR 工具（reVISit-XR、MR game analytics、VR relax），但无“MR + 多机器人监督”交叉；本篇补“MR 用于人机团队指挥”缺口。"},{"h":"可复现性","body":"用户研究设计清晰、统计完整；无代码（HCI 系统论文）。"},{"h":"行动建议","body":"XR 用于人机协作/指挥控制方向参考；关注与 AR 远程协作结合。"}]},{"file":"../papers/notes/2610.07569__OpenSplatGraph.md","id":"2610.07569","title":"OpenSplatGraph: From Dense Semantic Maps to Structured Scene Graphs for Open-Vocabulary Robot Perception","title_zh":"OpenSplatGraph：从稠密语义地图到结构化场景图的开词汇机器人感知","track":"感知与认知","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":3.65,"evidence":"FULL","tags":["感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"OpenSplatGraph 在在线（online）开放词汇 3D 语义建图过程中，同时维护“稠密语义场”与“持久 3D 场景图”：稠密场提供几何/语义基础，场景图增量累积物体级知识。在 ScanNet/Replica 上 mIoU 显著超过 ConceptFusion/OpenGS-Fusion（36.75 vs 27.09），并含真实机器人演示视频。"},{"h":"要解决的问题","body":"开放词汇 3D 感知多在 2D 用 VLM 推断物体关系，场景图弱接地于稠密 3D 几何；现有方法把稠密地图与场景图当作互斥的世界模型。"},{"h":"方法详解","body":"统一框架在线联合维护稠密开放词汇语义场 + 持久 3D 场景图；语义场用“可靠性感知建模”（按投影协方差 + 像素贡献加权）做实例提取；场景图按需从查询分组空间/语义一致区域，关联持久节点并累积语义与关系；逐步加持久身份、场景图推理。"},{"h":"实验与结果","body":"ScanNet/Replica（映射到 ScanNet20/NYUv2-40）；对比 LangSplat/OpenGaussian/InstanceGaussian（离线）与 ConceptFusion/OpenGS-Fusion（在线），mIoU/mAcc 领先在线方法；渐进消融（基线 30.97 → +可靠性 36.06 → +持久关联 R@1 0.36 → +场景图 R@1 0.50）；真实世界演示。"},{"h":"创新点与贡献","body":"把稠密语义场与场景图在在线操作中显式双维护，而非二选一；可靠性感知语义场提升实例一致性。"},{"h":"局限与风险","body":"物体提取为查询条件式、不维护查询无关的完整物体清单；关联依赖轻量语义/几何线索，密集/大视角变化场景可靠性下降；开放关系靠外部 VLM，有计算开销。"},{"h":"与文献库的关系","body":"库内语义 3DGS/场景理解有 Post-Training Semantic Lifting（2610.08756，本批）、GS-Pool（2610.06688，物体级变化检测）、OpenGaussian 类；OpenSplatGraph 补“在线 + 场景图”方向，与离线语义提升互补。"},{"h":"可复现性","body":"ScanNet/Replica 基准 + 真实演示；倾向代码（以正文为准）。"},{"h":"行动建议","body":"AR/机器人语义感知与“物体级推理”方向重点；关注与导航/操作闭环结合。"}]},{"file":"../papers/notes/2610.07729__Token-VLM.md","id":"2610.07729","title":"Foveated Compression: Selective High-Resolution Preservation for Token-Efficient VLMs","title_zh":"中央凹压缩：面向 Token 高效 VLM 的选择性高分辨率保留","track":"渲染与显示","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":4.0,"evidence":"FULL","tags":["渲染与显示"],"flags":[],"sections":[{"h":"一句话结论","body":"把人类视觉系统的“中央凹（fovea）”机制引入 VLM 视觉 token 压缩：把每 9 个原生 token 对应的图像区域划分为 9 个粗粒度单元，学一个“中央凹选择器”预测哪个单元值得保留原生分辨率。基于 Qwen2.5-VL-7B，仅用 11.11% 的原生视觉 token 即可保留 86.1% 在原生分辨率下正确的预测；并给出跨 37,610 个样本的分辨率敏感性分析，证明任务对压缩的敏感度差异巨大（ChartQA 38.8% vs POPE 94.3%）。"},{"h":"要解决的问题","body":"VLM 的视觉 token 是推理成本主要来源，简单下采样仍是很强的基线；但不同任务/区域对高分辨率的敏感度差异显著，均匀下采样会丢失关键信息。"},{"h":"方法详解","body":"把图像按原生 token 块划分为 9 个粗单元；Foveated Selector 用原生 token 均值、压缩 token、二者差值、空间位置四类描述子（512 维）经轻量注意力 + 卷积 + MLP 预测每个单元是否需要原生分辨率；推理时仅对选中单元保留高分辨率，其余用压缩 token，做单次 prefill-free 的选择。"},{"h":"实验与结果","body":"在 Qwen2.5-VL-7B 上冻结主干训练 merger，在 GQA/TextVQA/DocVQA 等训练后用固定 K=1 选择器标签；评测 GQA/MMBench/MME/POPE/MMStar/OCRBench/ChartQA，几何匹配预处理；统一中央凹压缩用 11.11% token、K=1 用 20.99%；2,000 次配对 bootstrap 量化显著性（如 Foveated Selector − Matched-Budget Downsample −1.378，CI [−2.062,−0.707]）。"},{"h":"创新点与贡献","body":"把“中央凹/注视点”这一 XR 渲染核心概念系统引入 VLM token 效率；给出可学习的单遍选择器与大规模分辨率敏感性诊断（任务级差异）。"},{"h":"局限与风险","body":"仅做 3×3 九宫格单元的空间选择，粒度有限；选择器基于冻结主干、未端到端联合优化；结论聚焦 VLM 而非 XR 渲染，但机制可直接迁移到注视点渲染（foveated rendering）省 GPU。"},{"h":"与文献库的关系","body":"库内“渲染与显示”赛道此前全为算法侧渲染（无真正中央凹/注视点渲染论文）；本篇虽是 VLM 应用，但其 foveation 机制与 XR 注视点渲染同源，是库内首次引入“中央凹”概念的工作，对 VR/AR 省算力渲染有直接启发。"},{"h":"可复现性","body":"冻结 Qwen2.5-VL-7B；方法清晰、消融完整；倾向代码（以正文为准）。"},{"h":"行动建议","body":"XR 注视点渲染（foveated rendering）方向重点参考；关注“任务自适应分辨率分配”在 AR 实时渲染中的迁移。"}]},{"file":"../papers/notes/2610.07795__GSCV.md","id":"2610.07795","title":"Efficient Gaussian Splatting Sequence Compression with Standard Video Codecs","title_zh":"基于标准视频编解码的高效高斯泼溅序列压缩（GSCV）","track":"神经渲染","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":3.73,"evidence":"FULL","tags":["神经渲染"],"flags":[],"sections":[{"h":"一句话结论","body":"提出 GSCV——用标准视频编解码器（HEVC）压缩动态/多帧 3DGS 序列。核心 Inter-PLAS：通过“原语排列（permutation）”建立帧间原语一一对应，使同一组高斯基元可当作视频帧送入现成视频编码器。在 MPEG GS 压缩工作组权威数据集（bartender/cinema/breakfast）上，RD 曲线明显优于工作组锚点 GSCodec Studio 与 GPCC v1。"},{"h":"要解决的问题","body":"3DGS 序列（动态场景/体积视频）体量巨大，XR 流式传输需要高效压缩；现有方法多依赖专用 3DGS 压缩网络，未充分利用成熟、硬件加速的标准视频编解码器。"},{"h":"方法详解","body":"Inter-PLAS（帧间 PLAS）对每帧 GS 做块内像素排列以匹配参考帧的平滑图像，从而把逐帧 GS 的“属性图”对齐成可视频编码的帧序列；用 LightGaussian 剪枝保证同 GoP 内帧原语数一致；标准 HEVC 编码。"},{"h":"实验与结果","body":"MPEG 工作组三个 GS 序列（32 帧、取首 8 帧为 1 GoP），含 tracked 与 semi-tracked 两种；对比 GSCodec Studio 与 GPCC v1（MPEG 锚点）；给出 R5/R3/R1 多码率快照（如 bartender R5 17.6MB/44.9PSNR、R1 4.0MB/28.7PSNR）与 RD 曲线；额外 dance/basketball 序列验证。"},{"h":"创新点与贡献","body":"用“原语排列”桥接 3DGS 与标准视频编解码，工程上可借力硬件加速的 HEVC，无需训练专用压缩网络；对接 MPEG 标准化语境。"},{"h":"局限与风险","body":"需帧间原语对应（依赖 tracked/semi-tracked 设定与剪枝对齐）；排列搜索为分组 4! 枚举，尺度受限；主投 MPEG 会议，公开代码/泛化性待确认。"},{"h":"与文献库的关系","body":"库内 3DGS 压缩密集（COSA-GS/MoQSplat/TopoGS/Budgeted-GS/PocketSplat 等），但均为“静态场景单模型压缩/抽象”；本篇是首个对接标准视频编解码做“动态序列”压缩、且进 MPEG 工作组的，补“流式动态 3DGS”缺口，与静态压缩互补。"},{"h":"可复现性","body":"MPEG 数据集公开；方法基于 PLAS/HEVC，工程可复现；代码以正文为准。"},{"h":"行动建议","body":"XR 体积视频/动态场景流式传输重点；关注与静态 3DGS 压缩组合（先压缩单帧再序列编码）。"}]},{"file":"../papers/notes/2610.07958__DensiTok-3D.md","id":"2610.07958","title":"DensiTok: Making Feed-Forward 3D Gaussian Splatting See More Views Than It Is Given","title_zh":"DensiTok：让前馈式 3D 高斯泼溅“看见”比输入更多的视角","track":"神经渲染","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":4.15,"evidence":"FULL","tags":["神经渲染"],"flags":[],"sections":[{"h":"一句话结论","body":"DensiTok 指出前馈式 3DGS（单前向重建）质量受输入视角数限制，但瓶颈不是像素而是“几何 token”——于是用流匹配（flow-matching）在潜空间直接合成缺失视角的几何 token，而非用扩散模型生成更多像素再重拟合。在 AnySplat 骨架上把被遮挡/未观测视角“补”出来，ETH3D/ScanNet/Mip-NeRF360 上 PSNR 普遍提升约 1–3 dB（ScanNet 双视图 19.60→22.51），且可在单步微调下保持质量、降低推理成本。"},{"h":"要解决的问题","body":"前馈 3DGS 用网络跨场景训练、单次前向预测高斯；其质量随输入视图数增加而提升，但获取更多视角成本高。现有补救（多视图/视频扩散生成额外输入视图、或修复渲染后再重拟合）要跑大模型 + 二次编码，且像素不是共享 3D 表示、跨视图一致性只能“鼓励”无法“强制”。"},{"h":"方法详解","body":"核心洞察——重建只需要缺失视角的几何 token，而非像素。DensiTok 把“几何 token 增强”限制在视角插值（在首末观测相机间插值虚拟相机），用流匹配 DiT 在潜空间预测未观测视图的 token；观测视图走干净分支、未观测走加噪分支，AdaLN 注入噪声水平与相机信息；Gaussian head 再用这些 token 解码高斯。训练用 flow-matching 预训练 + 单步微调，推理时 NFE=1 即可。"},{"h":"实验与结果","body":"在 ETH3D、ScanNet、Mip-NeRF360 评测，输入视角 2/3/5/7；+DensiTok 在三数据集 PSNR 普遍 +1~3 dB，ScanNet 增益最大（双视图 19.60→22.51，七视图 23.25→25.20），相机/深度精度同步改善；表 9/10 给出多数据集一致改进与单步微调效果（N=16、NFE=1 即 22.56 PSNR），并在训练集外数据集也受益。"},{"h":"创新点与贡献","body":"把“补视图”从像素空间（扩散生成图像）转到几何 token 潜空间，避免运行大模型与二次几何编码，且 token 是共享 3D 表示、一致性可被强制；与 LoCoSplat 等前馈 3DGS 路线互补（后者加速推理，DensiTok 提升少视图质量）。"},{"h":"局限与风险","body":"当前仅做视角插值，不支持超出观测相机区间的外推（extrapolation）；虚拟相机仅在首末观测之间插值；训练依赖 AnySplat 类骨架（LAM-VAE + 相机条件 DiT）。"},{"h":"与文献库的关系","body":"库内前馈 3DGS 线有 LoCoSplat（2610.04351，无 3D 网络极速前向）、PocketSplat（移动端预算重建）、SCION（组合基元）；DensiTok 解决“少视图质量塌陷”这一互补痛点，与 LoCoSplat 的“快”形成“质量 vs 速度”双维度增益，非取代。"},{"h":"可复现性","body":"AnySplat 骨架 + flow-matching；论文含完备实验与消融；倾向代码（以正文/项目页为准）。"},{"h":"行动建议","body":"少视图/单目实时重建场景（AR 扫描、移动端）优先关注；与 LoCoSplat/PocketSplat 组合（质量补全 + 部署加速）。"}]},{"file":"../papers/notes/2610.08179__Matters-3D.md","id":"2610.08179","title":"View Matters: Keyframe-Guided Text-Driven 3D Gaussian Editing","title_zh":"视角 Matters：关键帧引导的文本驱动 3D 高斯编辑","track":"内容生成","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":3.77,"evidence":"FULL","tags":["内容生成"],"flags":[],"sections":[{"h":"一句话结论","body":"文本驱动 3DGS 编辑常被忽视“哪些视图更可靠”——不同视角提供的几何/语义/编辑证据差异巨大。View Matters 用 KIE（关键帧重要性估计）选出可靠视图，KGE（关键帧引导编辑）把编辑信号从关键帧传到非关键帧（避免噪声反向影响），IAO（重要性感知优化）在 3DGS 优化中保持同一可靠性偏好。默认 4 关键帧在 T-I/Dir 指标上最佳且几乎不增加开销。"},{"h":"要解决的问题","body":"现有文本驱动 3D 编辑要么对称交互、要么均匀监督，导致不可靠视图拖累可靠视图，最终编辑虽跨视图一致但弱于/偏离指令。"},{"h":"方法详解","body":"KIE 判定哪些视图对请求编辑提供可靠证据；KGE 把可靠关键帧的编辑信号传播到非关键帧而不引入噪声反向影响；IAO 在 3DGS 优化阶段保持可靠性偏好，防止可靠监督被稀释。共享关键帧引导 + 局部传播维持跨视图一致性。"},{"h":"实验与结果","body":"8 场景、23 个场景-提示对（身份/材质/外观/风格/颜色变换）；关键帧数消融（2/4/5/10），4 关键帧在 T-I/Dir 最佳且训练时间/显存几乎不变（如 4 关键帧 Training Time 266.04s vs 2 关键帧 263.46s）；与无公开实现的近期方法做定性对比；覆盖人物/物体/完整场景的泛化示例。"},{"h":"创新点与贡献","body":"显式“关键帧可靠性引导”的 3DGS 编辑范式，把“选哪些视图编辑”从启发式变成可学习的可靠性估计，并贯穿编辑与优化两阶段。"},{"h":"局限与风险","body":"指标以 CLIP T-I/Dir 为主（语义一致性），缺少更细的几何/量化基线；依赖 20 个编辑视图；与无公开实现的 SOTA 仅做定性对比。"},{"h":"与文献库的关系","body":"库内 3DGS 编辑方向稀缺（10-07 报告含 ChromaGS/ManifoldSplat 为化身编辑，本批另含通用场景编辑）；与库内“高斯编辑”线互补（颜色/形状/通用语义三类）。"},{"h":"可复现性","body":"项目页/代码（以正文为准）；20 视图编辑设置清晰。"},{"h":"行动建议","body":"XR 内容创作（3D 资产编辑）方向重点；关注与高斯化身编辑合并为统一编辑框架。"}]},{"file":"../papers/notes/2610.08305__Hugging-Suit.md","id":"2610.08305","title":"Hugging Suit: Pneumatically-Actuated System Design for Remote Haptic Experiences","title_zh":"Hugging Suit：面向远程触觉体验的气动驱动系统设计","track":"触觉与多模态","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"B","value":3.2,"evidence":"FULL","tags":["触觉与多模态"],"flags":[],"sections":[{"h":"一句话结论","body":"Hugging Suit 是一套气动驱动的可穿戴系统，通过模块化、贴合身体的触觉作动模拟“远程拥抱”，用 Research-through-Design（RtD）方法开发。两项探索性用户研究中，>90% 参与者明确感受到触觉反馈，但仅 44.1% 认为像真实拥抱；局限来自覆盖不足、缺温度、不够柔软。"},{"h":"要解决的问题","body":"远程情感沟通缺乏触觉通道；视频通话维持视觉/听觉但无法传递身体接触。"},{"h":"方法详解","body":"气动驱动可穿戴（Air Actuator Matrix 气动作动矩阵 + 纺织压力传感垫），模块化服装式设计；通过 RtD 迭代设计，分阶段评估触觉表现力与情境响应。"},{"h":"实验与结果","body":"两项探索性研究，功能原型在布置环境中交互；收集舒适度、感知真实感、情感影响的主观反馈；参与者偏好低光私密环境、可见视频通话对方时情感共鸣更强；部分报告摘下后残留触觉感。"},{"h":"创新点与贡献","body":"把“远程拥抱”作为气动可穿戴系统设计问题，模块化服装式支持后续改进；情境因素（私密/可见对方）对情感共鸣的影响。"},{"h":"局限与风险","body":"仍为早期探索，真实感有限（44% 像真拥抱）；覆盖/温度/柔软度不足；无量化绩效基线，n 小、主观为主。"},{"h":"与文献库的关系","body":"库内“触觉与多模态”赛道有 SEA-LM（空间音频）、Teleoperation 触觉遥操作类；Hugging Suit 补“情感触觉/远程存在”方向，与远程触觉遥操作互补。"},{"h":"可复现性","body":"RtD 原型 + 探索性研究；无代码（HCI 设计论文）。"},{"h":"行动建议","body":"VR/远程存在/情感触觉方向参考；关注真实感提升（温度/柔软度）与量化评估。"}]},{"file":"../papers/notes/2610.08726__EgoLAP.md","id":"2610.08726","title":"EgoLAP: Learning from Egocentric Human Data through Language-Action Reasoning","title_zh":"EgoLAP：通过语言-动作推理从第一视角人类数据学习","track":"感知与认知","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"B","value":3.5,"evidence":"FULL","tags":["感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"EgoLAP 是一个 VLA 预训练框架，把大规模第一视角人类运动知识迁移到机器人操作：把人手套/机器人末端轨迹映射到同一“语言化动作”接口，用 Mixture-of-Transformers（PaliGemma-2B + 300M 动作专家）做动作专家与 VLM 主干的知识绝缘。关键实验：若在人类样本上遮蔽动作专家损失，整体成功率掉 4.4 分（语言条件任务从 26% 跌到 10%），证明人类运动数据对动作专家同样有用。"},{"h":"要解决的问题","body":"第一视角人类数据丰富但具身鸿沟使原始轨迹对机器人监督差；需要可跨具身迁移的中间表示。"},{"h":"方法详解","body":"把人类/机器人样本统一到语言化动作接口（离散动作 token 目标）；MoT 架构（VLM 主干 + 从零初始化的动作专家），结构化注意力使动作专家不依赖文本生成、推理无需生成语言；训练目标用流匹配损失同时监督人类与机器人动作块；“知识绝缘”阻断动作专家梯度进入 VLM。"},{"h":"实验与结果","body":"双手机仿真基准（14 任务，每 checkpoint 1400 episode）+ 真实 YAM 双手机平台（5 任务，Realsense 基/腕相机）；消融“是否遮蔽人类动作损失”（遮蔽掉 4.4 分，语言条件任务 26%→10%）；数据混合、FAST/OAT 动作表示对比。"},{"h":"创新点与贡献","body":"语言-动作推理接口实现跨具身迁移；动作专家与 VLM 知识绝缘的设计；并实证“人类运动数据对动作专家亦有增益”而非仅语言监督。"},{"h":"局限与风险","body":"仍依赖第一视角数据质量；仿真→真实 Gap 未充分量化；主要针对操作，未覆盖导航等更广泛具身任务。"},{"h":"与文献库的关系","body":"库内第一视角/具身方向有 WING（2610.03607，egocentric→机器人策略）、Ego2World（2610.02715，可执行世界）、MacJEPA（2610.08192，本批 egocentric AV）；EgoLAP 补“人类第一视角 → VLA 跨具身预训练”缺口，与 WING 的“跨具身低频对齐”互补。"},{"h":"可复现性","body":"仿真 14 任务 + 真实 5 任务；倾向代码（以正文为准）。"},{"h":"行动建议","body":"数据高效机器人学习/遥操作方向重点；关注与 XR 第一视角采集（眼镜）结合做人类示范。"}]},{"file":"../papers/notes/2610.08756__3D.md","id":"2610.08756","title":"Post-Training Semantic Lifting for 3D Gaussian Splatting: Separating Detector, Lifting and Representation","title_zh":"3D 高斯泼溅的训练后语义提升：解耦检测器、提升与表示","track":"感知与认知","date":"2026-10-07","batch":"2026-10-08","batchLabel":"2026-10-08","grade":"A","value":3.65,"evidence":"FULL","tags":["感知与认知"],"flags":[],"sections":[{"h":"一句话结论","body":"训练后语义提升（post-training semantic lifting）把“2D 检测器预测 → 3D 表示”解耦为三部分：检测器（2D）、提升（跨视图聚合）、表示（3DGS 内语义分配），并证明三者应分离。用投影高斯协方差 + 像素贡献作为聚合权重，在 Replica/ScanNet++ 上把椅/桌/电视等类别 IoU 从 YOLO 参考的 0.44–0.76 提升到 0.91–0.98（Replica office_1 0.95 vs 0.44）。"},{"h":"要解决的问题","body":"同一 3DGS 高斯的多个视图对其语义类别常不一致（遮挡/分歧），传统“训练时联合学语义”或“2D 预测直接投影”都难处理视图矛盾。"},{"h":"方法详解","body":"把语义提升拆为独立三阶段——检测器（任意 2D 模型，如 YOLO）、提升（用投影协方差与像素贡献加权的跨视图聚合，而非贝叶斯更新）、表示（在 3DGS 优化后给高斯分配语义）；引入“证据分数”与阈值、混合连通性、投票回退等后处理。"},{"h":"实验与结果","body":"Replica 与 ScanNet++（YOLO 检测器）；逐类 IoU 与逐场景 mIoU（Nearest Gaussian / Radius vote 两种算子）；office_1..4、room_0..2、ScanNet++ 多场景；验证集调 β（hysteresis）等超参；在 Picasso 超算上运行。"},{"h":"创新点与贡献","body":"形式化“检测器/提升/表示”解耦，证明训练期联合语义并非必须；用高斯投影权重（而非均匀/贝叶斯）做聚合，减少视图分歧误差。"},{"h":"局限与风险","body":"依赖外部 2D 检测器质量；未与已发表基线在同一设定下直接数值对比（作者自述第 7 节数字不含公开基线对比）；参数（阈值/β）需验证集调。"},{"h":"与文献库的关系","body":"库内 3DGS 语义方向有 OpenSplatGraph（2610.07569，在线场景图）、GS-Pool（物体级变化检测）、SAM3+语义高斯；本篇提供“训练后、解耦式”语义提升的通用框架，与训练期联合语义（Semantic-NeRF/语言特征高斯）互补。"},{"h":"可复现性","body":"Replica/ScanNet++ 公开；方法清晰；代码以正文为准。"},{"h":"行动建议","body":"已建 3DGS 资产的语义标注/检索方向重点；关注与 OpenSplatGraph 的“后处理语义”组合。"}]},{"file":"../papers/notes/2603.20714__3DGS-init-densify.md","id":"2603.20714","title":"The Role of Initialization in 3D Gaussian Splatting","title_zh":"3DGS 初始化与稠密化作用的系统性研究（稠密初始化提升几何/泛化）","track":"神经渲染","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"B","value":3.35,"evidence":"FULL","tags":["'3DGS'","'initialization'","'densification'","'NVS'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"系统研究 3D 高斯溅射中初始化与稠密化的作用，给出「稠密初始化提升几何/离轨迹泛化但不一致提升视觉」的可操作结论。"},{"h":"问题背景","body":"3DGS 从 SfM 稀疏点初始化并靠稠密化获得完整场景表示；但初始化如何影响新视角合成(NVS)性能与几何质量长期缺乏系统研究。"},{"h":"方法","body":"系统比较多种初始化策略（含激光扫描初始化、Depth Anything 3 初始化）与多种稠密化策略的组合，量化视觉质量与几何精度。"},{"h":"实验","body":"结论：稠密初始化配强稠密化并不一致提升视觉质量，但有助于离轨迹(off-trajectory)视角泛化、显著提升场景几何精度；代码开源（ivd_splat）。"},{"h":"贡献与局限","body":"给出「初始化 vs 稠密化」权衡的可操作结论，是 3DGS 渲染基础认知补强；非新方法（分析论文），视觉质量提升有限。"},{"h":"与文献库关系","body":"与库内大量 3DGS 渲染/压缩（神经渲染赛道）互补，补「初始化机理」基础认知。"},{"h":"适用 XR 场景","body":"3DGS 实时渲染初始化、SLAM-3DGS 几何精度提升。"}]},{"file":"../papers/notes/2605.07943__TAVIS-benchmark.md","id":"2605.07943","title":"TAVIS: A Benchmark for Egocentric Active Vision and Anticipatory Gaze in Imitation Learning","title_zh":"TAVIS：第一视角主动视觉与预期注视模仿学习基准（含 GALT 指标）","track":"感知与认知","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"B","value":3.3,"evidence":"FULL","tags":["'benchmark'","'active-vision'","'gaze'","'imitation-learning'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"第一视角主动视觉与预期注视模仿学习基准，含 GALT（注视-动作先导时）认知科学指标，量化主动视觉贡献。"},{"h":"问题背景","body":"主动视觉（策略自控制注视）已成为模仿学习关键能力，但缺共享基准来比较方法或量化其贡献、适用任务类型与条件。"},{"h":"方法","body":"TAVIS：主动视觉模仿学习评测基础设施；TAVIS-Head（5 任务，全景/俯仰颈）、TAVIS-Hands（3 任务，腕摄局部遮挡），基于 IsaacLab；三评测原语：配对头摄 vs 固定摄协议、GALT（注视-动作先导时，认知科学/HRI 指标）、程序化 ID/OOD 划分；基线 Diffusion Policy、π0。"},{"h":"实验","body":"发现：主动视觉普遍有帮助（跨训练一致）但收益任务条件性非均匀；多任务策略在受控分布偏移下急剧退化；纯模仿可得预期注视（先导时接近人类演示，但头部运动不如演示平滑，动作分块所致）；代码与评测开源。"},{"h":"贡献与局限","body":"首个主动视觉模仿学习基准 + GALT 指标；更偏机器人，与 XR 关联在「第一视角主动视觉/注视」。局限：任务集有限、依赖 IsaacLab 仿真。"},{"h":"与文献库关系","body":"与库内感知与认知（ReViV 注视、Never Look Back 物体记忆）互补，补「主动视觉基准+预期注视量化」。"},{"h":"适用 XR 场景","body":"AI 眼镜主动视觉、注视预测、具身智能体评测。"}]},{"file":"../papers/notes/2606.19156__Hand-4DGS.md","id":"2606.19156","title":"Hand-4DGS: Feed-Forward 3D Gaussian Splatting for 4D Hand Reconstruction from Egocentric Videos","title_zh":"Hand-4DGS：从第一视角视频前馈式 4D 手部重建（网格引导+时序卷积）","track":"化身与人体","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"A","value":3.85,"evidence":"FULL","tags":["'hand'","'4DGS'","'egocentric'","'avatar'","'feed-forward'"],"flags":["BACKFILL"],"sections":[{"h":"一句话总结","body":"前馈式 3D 高斯溅射框架，从第一视角视频做动态 4D 手部重建，网格引导表示+时序卷积，免 GT 3D 手姿标注。"},{"h":"问题背景","body":"动态 3D 手部重建是 AR/VR/AI 眼镜的核心能力；但第一视角 4D 手重建因手/相机快速运动、手-物与手-手交互、单目歧义而困难，既往工作多聚焦多视 3D 手或 4D 身体。"},{"h":"方法","body":"前馈框架 Hand-4DGS：mesh-guided 表示提供结构先验（mesh-aligned vertex embeddings + mesh-relative Gaussian adjustment）；时序卷积层建模动态运动；可微高斯光栅化的图像监督提供外观优化与姿态调整信号，训练与测试时优化均无需 GT 3D 手姿标注（用 WiLoR 伪标签离线训练，SAM3 遮罩处理遮挡）。"},{"h":"实验","body":"在 H2O、ARCTIC 两个第一视角手-物交互数据集上评测，优于 HandNeRF++（辐射场基线）、GaussianHand（泛化手化身）、EVA（优化式单目高斯化身）；测试时优化可高效适配训练未覆盖的视频。"},{"h":"贡献与局限","body":"前馈+网格引导+时序卷积，免 GT 姿态标注即可做第一视角 4D 手重建；局限：依赖 WiLoR 伪标签训练、SAM3 遮罩处理遮挡，极端手-物交互精度待提升。"},{"h":"与文献库关系","body":"与库内高斯化身（VGGT-BC、边缘头部化身 2610.09821）、3DGS 生成方向互补，补「第一视角 4D 手」专项目。"},{"h":"适用 XR 场景","body":"手势交互、手-物交互、虚拟手化身、AI 眼镜手部追踪。"}]},{"file":"../papers/notes/2607.17790__ReViV-4D-egocentric.md","id":"2607.17790","title":"ReViV: Reconstructing the Viewer and the View in 4D from Monocular Egocentric Video","title_zh":"ReViV：从单目第一视角视频统一重建「观察者+视角」的 4D 表征","track":"感知与认知","date":"2026-10-08","batch":"backfill-2603-2609","batchLabel":"backfill · 2603–2609 旧稿补录","grade":"A","value":3.85,"evidence":"FULL","tags":["'egocentric
