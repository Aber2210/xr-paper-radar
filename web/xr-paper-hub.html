<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR 论文雷达 · 每日解读知识库</title>
<style>
:root{
  --bg:#0d1220; --panel:#141b2e; --panel2:#1a2338; --border:#263353; --border2:#2e3d63;
  --text:#e8edf7; --text2:#98a5c0; --text3:#6b7a99;
  --accent:#5b8cff; --accent2:#7c6cff;
  --s:#f5c542; --a:#5b8cff; --b:#3fbf9f; --c:#8a93a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:#0a0f1c;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px;
  font-family:Consolas,"Courier New",monospace;color:#a8c6ff}
header{position:sticky;top:0;z-index:50;background:rgba(13,18,32,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.hd{max-width:1440px;margin:0 auto;padding:14px 24px 0}
.hd-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.hd-top h1{font-size:19px;font-weight:650;letter-spacing:.5px}
.hd-top h1 .em{color:var(--accent)}
.hd-sub{color:var(--text2);font-size:12.5px}
nav.tabs{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap}
nav.tabs button{background:none;border:none;color:var(--text2);font-size:14px;padding:9px 16px;cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button .cnt{font-size:11px;color:var(--text3);margin-left:4px}
main{max-width:1440px;margin:0 auto;padding:22px 24px 60px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
  border-radius:10px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;color:var(--accent)}
.kpi .v small{font-size:12px;color:var(--text2);font-weight:400;margin-left:4px}
.kpi .k{font-size:12px;color:var(--text2);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:16px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.panel h3{font-size:14.5px;font-weight:650;margin-bottom:12px;color:var(--text)}
.panel h3 .hint{font-size:11.5px;color:var(--text2);font-weight:400;margin-left:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--text2)}
.legend .it{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.bar-row .lb{width:118px;text-align:right;color:var(--text2);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:#0a0f1c;border-radius:4px;height:14px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-row .val{width:74px;flex:none;color:var(--text2);font-size:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12.8px}
table.tb th{background:var(--panel2);color:var(--text2);font-weight:600;text-align:left;padding:8px 9px;
  border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:5}
table.tb td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
table.tb tr.row{cursor:pointer}
table.tb tr.row:hover{background:#1a2440}
table.tb tr.detail>td{background:#101728;padding:14px 18px}
.chip{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:650;line-height:1.5;
  border:1px solid transparent;white-space:nowrap}
.chip.S{background:rgba(245,197,66,.14);color:var(--s);border-color:rgba(245,197,66,.4)}
.chip.A{background:rgba(91,140,255,.14);color:var(--a);border-color:rgba(91,140,255,.4)}
.chip.B{background:rgba(63,191,159,.13);color:var(--b);border-color:rgba(63,191,159,.4)}
.chip.C{background:rgba(138,147,168,.13);color:var(--c);border-color:rgba(138,147,168,.4)}
.chip.track{background:rgba(124,108,255,.12);color:#b7adff;border-color:rgba(124,108,255,.35)}
.chip.ev{background:rgba(63,191,159,.1);color:#7fd8c2;border-color:rgba(63,191,159,.3)}
.chip.ev.ABSTRACT_ONLY{background:rgba(245,197,66,.08);color:#d8bc63;border-color:rgba(245,197,66,.25)}
.chip.ev.PARTIAL{background:rgba(249,115,98,.1);color:#f5a495;border-color:rgba(249,115,98,.3)}
.chip.top10{background:rgba(245,197,66,.12);color:var(--s);border-color:rgba(245,197,66,.45)}
.chip.warn{background:rgba(249,115,98,.12);color:#f5a495;border-color:rgba(249,115,98,.4)}
.mono{font-family:Consolas,monospace;font-size:12px;color:#a8c6ff}
.tt{color:var(--text)}
.tt2{color:var(--text2);font-size:11.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input[type=text],.filters select{background:#0a0f1c;border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:7px 10px;font-size:12.8px;font-family:inherit;outline:none}
.filters input[type=text]{min-width:220px}
.filters input[type=text]:focus,.filters select:focus{border-color:var(--accent)}
.filters label{font-size:12.3px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.filters .count{margin-left:auto;color:var(--text2);font-size:12.3px}
.info-wrap{position:relative;display:inline-flex;align-items:center;margin-left:7px;vertical-align:middle}
.info-btn{width:15px;height:15px;border-radius:50%;border:1px solid var(--border2);background:#0d1424;color:var(--text2);
  font-size:9.5px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.info-btn:hover{border-color:var(--accent);color:var(--accent)}
.info-pop{display:none;position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);width:310px;
  background:#141c33;border:1px solid var(--border2);border-radius:9px;padding:11px 13px;font-size:12px;color:#cfd8ec;
  line-height:1.8;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:60;text-align:left;white-space:normal;font-weight:400}
.info-pop::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#2a3a63}
.info-wrap:hover .info-pop,.info-pop.show{display:block}
.btn{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:7px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:rgba(91,140,255,.15);border-color:rgba(91,140,255,.5);color:var(--accent)}
.tw{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:76vh}
.minibar{display:flex;gap:2px;align-items:flex-end;height:16px}
.minibar i{width:5px;border-radius:1px;display:block}
.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.bcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px 17px;
  display:flex;flex-direction:column;gap:9px;transition:border-color .15s}
.bcard:hover{border-color:var(--border2)}
.bcard .bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bcard .bd{font-size:15.5px;font-weight:700}
.bcard .bn{font-size:11.5px;color:var(--text2)}
.bcard .stats{display:flex;flex-wrap:wrap;gap:6px}
.bcard .top{font-size:12.3px;color:var(--text2);display:flex;flex-direction:column;gap:3px}
.bcard .top .t{display:flex;gap:7px;align-items:baseline}
.bcard .top .t .rk{color:var(--text3);font-size:11px;width:14px;flex:none;text-align:right}
.bcard .top .t .nm{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .top .t .vl{font-family:Consolas,monospace;color:var(--accent);font-size:11.5px;flex:none}
.bcard .note{font-size:12px;color:var(--text2);background:#0d1424;border:1px solid var(--border);
  border-radius:7px;padding:8px 10px;max-height:96px;overflow:auto}
.bcard .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.bcard .links a{font-size:11.5px;background:#0d1424;border:1px solid var(--border);border-radius:6px;
  padding:3px 9px;color:var(--text2)}
.bcard .links a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.bcard.empty{opacity:.62}
.bcard.hidden{opacity:.78;background:#0c1220}
.bcard.hidden:hover{border-color:var(--border)}
.bcard .bh-r{display:flex;align-items:center;gap:9px}
.bcard .eye{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:3px 5px;border-radius:5px;line-height:1;font-family:inherit}
.bcard .eye:hover{color:var(--accent);background:#0d1424}
.bcard .vhint{font-size:11.8px;color:var(--text3);padding:1px 0 2px}
.prow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #1c2742;font-size:12.3px}
.prow:last-child{border-bottom:none}
.prow .rk{color:var(--text3);font-size:11px;width:15px;flex:none;text-align:right;font-family:Consolas,monospace}
.prow .pname{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pname:hover{color:var(--accent)}
.prow .pv{color:var(--accent);font-size:11.5px;flex:none;width:38px;text-align:right}
.prow .pbadges{display:flex;gap:4px;flex:none;align-items:center}
.prow .pbadges .btn{padding:1px 7px;font-size:11px;border-radius:6px}
.pfull{margin-top:6px;border-top:1px solid var(--border);padding-top:6px;max-height:300px;overflow:auto}
.notes-wrap{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:1024px){.notes-wrap{grid-template-columns:1fr}}
.nlist{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;max-height:82vh}
.nlist .nhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.nlist .nitems{overflow:auto;flex:1}
.nitem{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;
  flex-direction:column;gap:3px}
.nitem:hover{background:#1a2440}
.nitem.sel{background:#1d2a4d;border-left:3px solid var(--accent);padding-left:11px}
.nitem .nt{font-size:12.8px;color:var(--text);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem .nm{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text2)}
.ndetail{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px 26px;
  max-height:82vh;overflow:auto}
.ndetail h2{font-size:18px;line-height:1.5;margin-bottom:6px}
.ndetail .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.ndetail .sec{margin:16px 0}
.ndetail .sec h4{font-size:13.8px;color:var(--accent);border-left:3px solid var(--accent);
  padding-left:9px;margin-bottom:7px}
.ndetail .sec .bd{font-size:13.2px;color:#cfd8ec}
.ndetail .sec .bd p{margin:5px 0}
.ndetail .sec .bd ul{margin:5px 0 5px 18px}
.ndetail .sec .bd li{margin:3px 0}
.ndetail .sec .bd table{border-collapse:collapse;margin:8px 0;font-size:12px}
.ndetail .sec .bd th,.ndetail .sec .bd td{border:1px solid var(--border2);padding:4px 8px}
.ndetail .sec .bd th{background:var(--panel2)}
.subh{font-weight:650;color:#a8c6ff;margin:9px 0 3px;font-size:13px}
.banner{border-radius:8px;padding:9px 13px;font-size:12.5px;margin:10px 0}
.banner.warn{background:rgba(249,115,98,.1);border:1px solid rgba(249,115,98,.35);color:#f5bdb2}
.banner.info{background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.3);color:#b9cdff}
.dimcell{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:2px 4px;
  font-family:Consolas,monospace;font-size:11.8px;font-weight:650}
.axis-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.8px;color:var(--text2);margin-bottom:10px}
.axis-legend b{color:var(--text);font-family:Consolas,monospace}
.foot{color:var(--text3);font-size:11.5px;margin-top:26px;border-top:1px solid var(--border);padding-top:12px}
.placeholder{color:var(--text3);text-align:center;padding:60px 0;font-size:13px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#263353;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

4__GazeDiT注视精确扩散合成眼动数据.md","id":"2609.17814","title":"GazeDiT: Gaze-Accurate Diffusion Image Generation for Eye Tracking via Spatial Conditioning","title_zh":"GazeDiT：通过空间条件化实现注视精确的扩散图像生成，用于眼动追踪","track":"渲染与显示","date":"2026-09-15","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":4.05,"evidence":"FULL","tags":["眼动追踪","扩散模型","合成训练数据","空间条件化","近眼显示","标签保真度","AR/VR头显"],"flags":[],"sections":[{"h":"一句话结论","body":"针对眼动追踪合成数据\"图像看着真实、但瞳孔/虹膜几何与给定注视标签对不上\"这一致命缺陷，GazeDiT 构造一个**内部空间条件**——把全局的 4D 双眼注视标签\"落地\"到局部的瞳孔/虹膜几何上，再让扩散模型在该几何条件下生成外观。在 **3 档训练队列（500 / 1,000 / 2,000 受试者）× 465 名独立留出用户**的严格评测下，下游眼动仪最难样本的 gaze 误差从 **3.05° 降到 2.80°**，且 E50U50 与 mean E95 的增益在每一档都统计显著（**p < 2×10⁻³**）。"},{"h":"要解决的问题","body":"扩散模型做合成训练数据的通用难题：**低维连续标签 → 局部精细几何**的控制精度不够。\n\n- 文本条件生成只判\"宽泛的提示一致性\"；\n- 但监督训练要求\"每张图 ↔ 其数值标签\"精确对应。\n\n在眼动追踪上这件事尤其难：4D 双眼注视是通过**极微弱、空间局部化的瞳孔与虹膜几何**表达的。\"生成的图看着完全真实，但描绘的是另一个注视方向\"——这样的样本对追踪器训练毫无价值。\n\n**现实驱动力**：AR/VR 头显的近眼数据采集跨用户成本极高（Cheng et al., 2024; Jiang et al., 2026），而 gaze 是头显最核心的输入模态之一。"},{"h":"方法详解","body":"### 核心思路：把全局标签\"落地\"成局部几何\n\n不是让模型直接从 4D 数字去猜眼睛长什么样，而是**显式构造一个中间的空间条件**（pupil/iris mask），让几何与标签严格绑定。\n\n**训练阶段**\n- 用**冻结的 SegFormer** 从多样化的真实近眼图像中提取瞳孔/虹膜几何\n- 扩散模型学习\"在该几何条件下生成真实外观\"\n- 基础模型：SD3.5（gaze-conditioned）\n\n**推理阶段**\n- 用**物理眼睛渲染器（physical eye renderer）**采样与注视一致的几何——通过变化解剖参数与相机状态实现\n- 因此**不需要源图像**即可合成，多样性由解剖/相机采样保证\n\n### 条件注入方式的选择（8 种变体消融后确定）\n\n在同一种 gaze-conditioned SD3.5 内，对比了：\n\n| 方式 | 结果 |\n|---|---|\n| Channel concatenation（**GazeDiT 采用**） | 精度与算力权衡最优；Δp90 一致最低；**不引入任何控制网络或 mask token** |\n| ControlNet（Zhang et al., 2023） | 训练成本 **1.5×** |\n| OminiControl（Tan et al., 2025b） | 训练成本 **3.7×** |\n| ControlNet++（Li et al., 2024） | 同上族 |\n| Gaze-only（无空间条件，仅 4D 标签） | **Δp50 / Δp90 远差于任何 gaze+mask 方法**，且下游无可靠增益 |\n\n> 注：ControlNet / OminiControl / ControlNet++ 在本文中是作为**掩码注入机制的替代消融**，不是下游基线方法。\n\nmask 保真度：GazeDiT **84.92%** mask mIoU > OminiControl 84.53% > ControlNet 83.05%。"},{"h":"实验与结果","body":"**评测设计的严谨程度是本文最大亮点：**\n\n| 设计 | 做法 |\n|---|---|\n| 三档训练队列 | (i) 500 受试者 / 5M 帧；(ii) 1,000 受试者 / 7M 帧；(iii) 2,000 受试者 / 5M 帧 |\n| 合成臂 | 每臂先在 **2M 生成图像-注视对**上预训练，再在对应真实队列上微调 |\n| 留出测试 | **465 名留出用户**，与所有训练队列**互斥** |\n| 冻结评测器 | 在**独立受试者池**上训练，与生成器训练/追踪器训练/测试受试者全部互斥 |\n| 统计检验 | 配对 bootstrap，联合重采样用户后重算 Δ，双侧检验（hierarchical bootstrap 95% 半宽） |\n\n**核心结果**\n\n| 指标 | 数值 |\n|---|---|\n| 下游 gaze 误差（0.5K 队列，最难样本 E95U95） | **3.05° → 2.80°** |\n| 显著性 | E50U50 与 mean E95 增益在**全部三档队列**均显著（**p < 2×10⁻³**） |\n| 尾部标签误差 | 显著低于其他扩散基线，**逼近同一冻结评测器在真实图像上的误差** |\n\n**关键消融发现**\n\n- **Gaze-only 的问题**：尽管拿到了完整的 4 维注视标签，其 Δp50 / Δp90 在每一档都远大于任何 gaze+mask 方法，且下游相对 real-only **无可靠增益**。→ **光有标签不够，必须落到空间几何上。**\n- **FID 会骗人**：Gaze-only 在 0.5K 队列上 FID 与 GazeDiT 相差不到 0.6，但**标签误差更差，整条管线没有可靠增益**。这说明在合成数据场景，外观指标（FID）无法替代标签保真度指标。\n- OminiControl 的 E95U95 为 3.04° vs. real-only，**基本无增益**——进一步佐证\"注入机制选择\"是关键变量。"},{"h":"创新点与贡献","body":"1. **问题定义精准**：把\"扩散合成数据的标签保真度\"从模糊诉求变成可测量的 Δp50 / Δp90（生成 vs. 真实的注视误差差）。\n2. **label + geometry 双条件范式**：用物理渲染器在推理期采样几何，天然解耦\"外观多样性\"与\"标签精确性\"。\n3. **实证的贡献分离**：用 8 种条件化变体 + 三档队列 + 配对 bootstrap，把\"扩散是否有用\"与\"是否需要空间条件\"两个问题干净地分开回答。\n4. **对 XR 的直接价值**：眼动是头显核心输入模态，合成数据可显著降低跨用户标定成本。"},{"h":"局限与风险","body":"- 增益幅度温和（3.05° → 2.80°，约 8%），主要来自**最难样本**；整体指标提升不以数量级计。\n- 依赖物理眼睛渲染器与冻结 SegFormer 的质量，两者误差会传导。\n- 仅在近眼双眼图像上验证，未展示跨设备泛化（不同头显的光学/相机布局差异大）。\n- 无代码发布声明。"},{"h":"与文献库的关系","body":"- **抬升赛道天花板**：库内 `渲染与显示` 原最高为 GS-PI（arXiv:2609.19907，3.70），本文 **4.05** 成为新天花板。\n- **与 BinoGen 互补**：库内 BinoGen（arXiv:2609.19881，A 3.65）的路线是**规模化真实双眼数据**；本文是**合成数据**。两条路线在\"数据从哪来\"上正交，可叠加（合成预训练 + 真实微调正是本文已验证的范式）。\n- **可服务下游**：库内 RoboFind（2609.20330，视障人士寻物）、PROVIA（2609.20638，程序状态追踪）等以第一人称感知为核心的系统，均可受益于更准的 gaze 估计。"},{"h":"可复现性","body":"- 代码：未声明\n- 数据：三个真实训练队列为内部数据（2,000 受试者规模），外部难以复现同等实验\n- 硬件：SD3.5 微调 + 2M 合成对预训练，需多卡\n- **复现门槛主要在数据量级**，方法本身清晰"},{"h":"行动建议","body":"1. **头显 / 眼动团队**：把\"合成预训练 + 真实微调\"纳入数据管线，并**务必用 Δp50/Δp90 而非 FID 选生成器**——本文证明 FID 相近时下游表现可天差地别。\n2. **评测方法学迁移**：本文的\"465 名独立留出用户 + 冻结评测器与全部训练池互斥 + 配对 bootstrap\"这套协议，应作为 XR 感知算法评测的模板。\n3. **跟进点**：跨头显泛化未验证，是接手该方向最明显的空白。"}]},{"file":"../papers/notes/2609.17909__Zing-05可玩世界模型.md","id":"2609.17909","title":"Zing-0.5: Toward Playable Worlds with Real-Time Joint Action and Text Control","title_zh":"Zing-0.5：面向可玩世界的实时动作与文本联合控制","track":"世界模型与仿真","date":"2026-09-15","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.85,"evidence":"FULL","tags":["世界模型","自回归生成","实时交互","键盘控制","文本控制","分布匹配蒸馏","可玩世界"],"flags":["⚠️ 与库内 Astronex-World（2609.20034）同期同规模竞争，WBench 口径需复测"],"sections":[{"h":"一句话结论","body":"5B 自回归世界模型，把**键盘动作**与**在线文本指令**统一到同一序列里做联合控制，配合\"段级教师 → 块级因果学生\"的分布匹配蒸馏与四步生成 + 上下文保持流式，实现 **832×480 @ 24 FPS、约 $0.009 / 流分钟**的实时可玩生成世界；WBench Navigation 158 例上**总分 81.0、一致性 88.5**；模型权重、推理代码与 Zing-SGLang 服务实现全部开源。"},{"h":"要解决的问题","body":"交互式世界模型有两条分离的演进线：\n\n- **键盘/相机控制线**（可探索、可移动）\n- **语言条件线**（可改变内容与行为）\n\n二者**目的互补但长期割裂**：键盘提供直接、连续的移动与视角控制；文本表达对角色、事件、环境变化的意图。割裂的后果是——用户能\"看\"能\"走\"，但**无法在探索过程中对正在发生的事施加影响**。\n\n本文的出发点：**把探索、干预、反馈三者连接在同一个持续的会话里**。"},{"h":"方法详解","body":"### 贡献一：统一的动作与文本条件（Unified action and text conditioning）\n\n- **幅度感知的键盘输入**（magnitude-aware）：不是简单的离散方向，保留输入强度\n- **时间对齐的文本指令**（temporally aligned）：文本与视频帧在时间轴上对齐\n- **联合标注的视频**：导航与事件控制在**同一序列**内学习\n\n### 贡献二：面向增量生成的事件级监督（Event-scale supervision）\n\n这是本文最关键的技术设计：\n\n- 训练一个**段级（segment-level）教师**，在**连接的多提示视频**上训练 → 教师能看到跨越提示边界的完整事件\n- 用该教师通过**分布匹配蒸馏（distribution-matching distillation）**监督一个**块级（block-level）因果学生**\n- 效果：**事件学习能跨越多个 block，而生成仍保持增量/因果**\n\n> 解决的问题本质：因果/增量生成天然\"看不到未来\"，而事件的语义完整性往往跨越生成块边界。用段级教师跨块监督，是把\"非因果的理解\"蒸馏进\"因果的生成器\"。\n\n### 贡献三：低成本实时交互\n\n| 技术 | 作用 |\n|---|---|\n| 四步生成（four-step generation） | 把去噪步数压到 4 |\n| 上下文保持流式（context-preserving streaming） | 保持历史上下文不丢失地持续生成 |\n\n**产出指标**：832×480 @ **24 FPS**，估计服务器租赁成本 **≈ $0.009 / 流分钟**。\n\n### 联合控制的实际表现\n\n演示显示：用户可在**持续导航过程中**用文本改变雪橇骑手的行为，且**无需重启生成**。"},{"h":"实验与结果","body":"**设置**：WBench Navigation 分集的 **158 个用例**，使用提供的初始图像与规定动作控制。视频以 **1248×704** 分辨率、每 block 四次去噪生成，保存为 24 fps。\n\n| 指标 | Zing-0.5 |\n|---|---|\n| WBench Navigation 总分 | **81.0** |\n| WBench Navigation 一致性分 | **88.5** |\n| 参数量 | 5B |\n\n**作者自己划定的三条边界**（§6 Discussion，本文最诚实的部分）：\n\n1. **有意义交互需要\"持久后果\"**：§5.2 的样例只显示\"在选定区间内有可见响应\"，**并未证明其后果在后续交互或视角变化后仍然成立**。被挪开的物体在用户返回时是否仍被挪开？通过一次交互学到的规则是否仍适用于下一次？——**未建立**。\n2. **视觉历史不能完全确定世界状态**：仅凭已生成画面不足以唯一确定世界状态。\n3. **状态与规则持久化是开放挑战**：未来架构应使生成结果与先前动作保持一致，让用户能从反馈中学习、形成预期。"},{"h":"创新点与贡献","body":"1. **联合控制的工程实现**：键盘（连续、直接）+ 文本（离散、语义）在同一自回归序列中统一，且验证了\"导航不中断、文本改事件\"的可行性。\n2. **段级教师 → 块级学生的蒸馏范式**：为\"因果生成如何学到跨块事件语义\"提供了可复用的解法。\n3. **成本量化到\"$ / 流分钟\"**：把交互式世界模型从\"能不能跑\"推进到\"跑得起吗\"，这是工程成熟度的标志。\n4. **完全开源**：权重 + 推理代码 + Zing-SGLang 服务实现，可直接复现与二次开发。"},{"h":"局限与风险","body":"- **后果不持久**（作者自承）：这是\"可玩性\"的根本性缺口。若动作后果不跨交互保持，用户无法学习环境规律，也无法形成目标导向行为。\n- **评测范围窄**：仅 WBench Navigation 158 例；无真机部署、无用户研究。\n- **与同期工作的可比性存疑**：见下方\"与文献库的关系\"。\n- 分辨率 480p（832×480）对头显远不够——XR 应用需 2K×2K 以上单眼分辨率，差距在数量级。"},{"h":"与文献库的关系","body":"- ⚠️ **与 Astronex-World 1.0（arXiv:2609.20034，S 4.32，09-17）同期同规模直接竞争**：\n\n| 模型 | 参数 | WBench 导航类 | 一致性 | 实时性 |\n|---|---:|---:|---:|---|\n| **Zing-0.5**（09-15） | 5B | Navigation **81.0** | **88.5** | 832×480 @ 24 FPS，$0.009/流分钟 |\n| Astronex-World 1.0（09-17） | 5B | Navi **73.5**（Full 70.0） | 未报 | 单张 L20 实时流式 832×480 @ 24 fps |\n\n**数值上 Zing-0.5 更高，但两者 WBench 评测口径可能不同**（Astronex 未报一致性分，Zing 仅报 Navigation 分集）。**不可直接比较，需同口径复测**。Astronex 的优势在于提供了完整的五阶段训练路径与开源基座，工程透明度更高。\n\n- **赛道定位**：库内 `世界模型与仿真` 天花板仍为 Astronex-World 4.32；本文 3.85 未超，但开辟\"可玩性/联合控制\"子方向。\n- **互补**：库内 GAVEL（2609.19315）做规划校验、PointZero（2609.19142）做 3D 点轨迹补全——Zing-0.5 提供的是可交互的生成前端，三者可构成\"生成 + 校验 + 规划\"的链条。"},{"h":"可复现性","body":"- 代码：https://github.com/seedleap/zing-world-model\n- 权重：https://huggingface.co/seedleap/zing-0.5\n- 项目页：https://zing.loopit.me/\n- 服务实现：Zing-SGLang（已随论文发布）\n- **复现门槛低**——这是本工作相对同期工作最实际的优势"},{"h":"行动建议","body":"1. **直接拉权重跑**：开源完整，成本已量化到 $0.009/流分钟，是评估\"交互式世界模型能否落地\"的最佳现成基线。\n2. **跟进的最大空白 = 状态持久化**：作者已明确把\"状态与规则持久化\"列为开放挑战。谁能先解决\"动作后果跨交互保持一致\"，谁就真正拿到\"可玩世界\"。\n3. **XR 落地前需先过分辨率关**：480p 距头显需求差一个数量级；短期更现实的应用是\"云端世界模型 + 低延迟视频回流\"而非本地渲染。\n4. **与 Astronex 做同口径对照实验**：两者同为 5B、同为 24 FPS 480p，是本季度最值得做的一次 head-to-head 复现。"}]},{"file":"../papers/notes/2609.18232__UMI-Bridge动作锚定跨本体对齐.md","id":"2609.18232","title":"UMI-Bridge: Action-Anchored Latent Alignment across Human and Robot Manipulation Data","title_zh":"UMI-Bridge：跨人类与机器人操作数据的动作锚定潜空间对齐","track":"交互与输入","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.8,"evidence":"FULL","tags":["潜动作模型","UMI","跨本体迁移","VLA","第一人称视频","数据高效","双臂机器人"],"flags":[],"sections":[{"h":"一句话结论","body":"以手持式 **UMI（Universal Manipulation Interface）** 作为**中间域**，把人类操作数据（第一人称视频 + UMI 演示）与机器人数据按**动作等价**而非像素相似对齐：先用 UMI 动作监督把潜表征锚定到末端运动与夹爪行为，再冻结其 wrist teacher 与动力学模型去正则化 VLA 后训练。**3 个真机任务平均成功率 91.7%（Naive Co-training 73.3%）**；在仅用 **25% 机器人演示**时即达到 77.5%，**超过全量数据的 Robot-only 基线（62.5%）15 个百分点**。"},{"h":"要解决的问题","body":"VLA 模型依赖\"视觉观测 + 任务指令 → 可执行动作\"的配对演示，而获取机器人演示需要机器人与操作员投入，构成新任务的数据瓶颈。\n\n替代思路是用**无需机器人的人类操作数据**（第一人称视频、手持 UMI 演示）。但三类差异构成障碍：\n\n| 差异 | 后果 |\n|---|---|\n| 视角（viewpoint） | 人手视角 vs 机器人头/腕视角 |\n| 本体（embodiment） | 人手 vs 夹爪 |\n| 动作监督可用性 | 人类视频无动作标注，UMI 有 |\n\n**核心挑战**：应该让这些域共享什么信息？——**同一个操作动作，由人手或夹爪执行、从不同的视角观察，会产生完全不同的视觉变化**。按像素相似对齐必然失败。"},{"h":"方法详解","body":"### 总体：两阶段\n\n- **Stage 1**：在**仅 Ego + UMI 数据**（无机器人演示）上训练双视角潜动作模型（LAM）\n- **Stage 2**：冻结 LAM 的 wrist latents 与前向动力学模型，用它**正则化 VLA 在 UMI + 机器人数据上的后训练**\n\n关键设计：**共享的 wrist 接口**使训练时监督可跨域进行，同时**保持策略的标准推理架构不变**（推理时不增加额外分支）。\n\n### Stage 1：动作锚定的潜空间对齐\n\n**在冻结的 DINOv2 特征空间而非像素空间**中放置 IDM/FDM（继承 latent action model 的逆/前向动力学脉络）。\n\n- **逆动力学模型（IDM）**：视角无关，读取相邻特征\n\n```\nz_t^v = Q_φ(f_t^v, f_{t+Δ}^v),   v ∈ {E, UH, UW}\n```\n\n其中 E = Ego，UH = UMI head，UW = UMI wrist。\n\n- **前向动力学模型（FDM）**：从潜变量 + 视角嵌入 `e_v` 预测未来特征残差\n\n```\nΔf̂_t^v = F_ω(f_t^v, z_t^v, e_v),   Δf_t^v = f_{t+Δ}^v − f_t^v\n```\n\n**三个刻意的设计选择**：\n1. IDM **不使用 VQ codebook、不做语言条件化**\n2. 腕部图像**保留其鱼眼投影**，不引入可训练的视觉适配器\n3. Stage 2 中**冻结 LAM 与视觉编码器**，固定 teacher 映射\n\n**三类损失**\n| 损失 | 作用 |\n|---|---|\n| `L_dyn` | 特征空间动力学（残差损失 `ℓ_f(a,b) = ‖a−b‖₁ + β(1−cos(a,b))`，β=0.2） |\n| `L_U` | **UMI 动作回归**——把表征锚定到末端运动与夹爪行为 |\n| `L_EH` / `L_HW` | 配对 Ego-UMI head 片段上的潜交换、同步 UMI head-wrist 片段上的对齐 |\n\n### Stage 2：潜空间正则化的 VLA 后训练\n\n- arm queries 对高层 VLM 特征做注意力，预测 `ẑ`\n- 由**冻结的 wrist teacher** 通过 `L_align` 监督\n- 由**冻结的 FDM** 通过 `L_policy-dyn` 监督\n- `L_R` 在 UMI 与机器人数据上监督标准动作专家\n- 虚线框内的分支**仅训练时存在**，推理架构不变"},{"h":"实验与结果","body":"**平台**：Tianji Marvin 半人形双臂机器人，两条 7-DoF 手臂，各装与 UMI 数据采集时**相同的 3D 打印 UMI 夹爪**；3 个 RGB 相机（1 个头戴 + 2 个腕部），224×224。每个任务-策略组合评估 **20 次 rollout**，所有方法共享任务特定的二值成功判据。\n\n### Q1：LAM 正则化是否有效？\n\n| 方法 | 3 个真机任务平均成功率 |\n|---|---:|\n| Naive Co-training（匹配的 UMI + 机器人数据） | 73.3% |\n| **UMI-Bridge** | **91.7%** |\n\n**Stage 1 消融的关键发现**：\n- 移除 `L_U`（保留两个对齐损失）→ 腕部 RMSE 升至 **0.224 / 0.280**，HW R@5 从 **0.180 掉到 0.039**\n- **结论：视觉可预测性本身不能保证动作锚定（action grounding）**。动作监督同时改善动作解码与 head-wrist 对应。\n\n### Q2：能减少多少机器人演示？（数据效率）\n\n| 机器人数据预算 | Ours | Robot-only | 增益 |\n|---|---:|---:|---:|\n| 25% | **77.5%** | 35.0% | **+42.5 点** |\n| 50% | **80.0%** | 47.5% | **+32.5 点** |\n| 100% | **95.0%** | 62.5% | **+32.5 点** |\n\n**最关键的一行**：仅用 **25% 机器人演示 + UMI 数据**即达 77.5%，**超过用全量数据的 Robot-only（62.5%）15 个百分点**。\n\n分任务同样成立：Stain Wiping **65% vs 60%**；Produce Sorting **90% vs 65%**。\n\n定性观察（Produce Sorting，倾斜物体摆放）：**Ours 在抬起过程中保住蔬菜并完成两次放置；全量数据的 Robot-only 反复尝试抓取但两个物体都留在桌上。**\n\n### Q3：能否做 UMI→机器人的任务迁移？\n\n在**没有目标任务的机器人演示**的条件下：\n\n| 任务 | 成功率 |\n|---|---:|\n| Cup Placement on Coaster | **85%** |\n| 另一迁移任务 | **90%** |"},{"h":"创新点与贡献","body":"1. **按\"动作等价\"而非\"像素相似\"对齐**：这是本文的范式主张，也是解决跨本体/跨视角问题的正确抽象层级。\n2. **UMI 作为中间域的选择**：UMI 同时具备人类可采集性与动作标注，天然是人与机器人之间的桥梁。\n3. **不牺牲推理架构**：额外的监督分支只在训练时存在，部署无成本——这是工程上很干净的设计。\n4. **数据效率的数量级证据**：25% 数据超全量基线，是本文最硬的量化结果。"},{"h":"局限与风险","body":"- 8 页短文，细节展开有限（如 UMI 数据规模、Ego 数据来源未充分说明）。\n- 真机实验在**单一机器人平台**（Tianji Marvin）上完成，且夹爪与 UMI 采集时**相同**——这削弱了\"跨本体\"主张的强度：真正的跨本体应包含不同夹爪形态。\n- UMI-Bridge 依赖能拿到 UMI 数据；纯第一人称视频（无动作标注）场景的上界未单独给出。\n- 任务集较小（3 + 2 + 2 个任务）。"},{"h":"与文献库的关系","body":"- **库内无同类工作**：此前无跨本体表征对齐的条目，本文建立该子方向。\n- **赛道定位**：库内 `交互与输入` 天花板为 RoboFind（arXiv:2609.20330，4.15）；本文 3.80 未超，但子方向完全不同（操作表征对齐 vs 视障寻物）。\n- **与本期 Project Kitchen（arXiv:2609.18650）形成有趣对照**：\n  - Project Kitchen：用 **VR 游戏化**采集人类操作数据 → Game2Policy 提取 embodiment-invariant 可供性线索\n  - UMI-Bridge：用 **UMI 硬件**采集 → 按动作等价对齐\n  两条路线都在解决\"如何把人类操作数据变成机器人能力\"，**可组合**：VR 游戏化负责规模，UMI 负责动作锚定。\n- **可服务**：库内 WorldContact（2609.19600）做以接触为中心的世界模型，需要动作锚定的表征作为输入。"},{"h":"可复现性","body":"- 代码：未声明\n- 硬件：Tianji Marvin 半人形双臂机器人 + 3D 打印 UMI 夹爪 + 3 路 RGB 相机\n- **复现门槛主要在硬件**：需自建 UMI 采集装置与对应夹爪\n- 方法本身描述清晰，DINOv2 + IDM/FDM 为标准组件"},{"h":"行动建议","body":"1. **机器人 / 遥操作团队**：若已在用 UMI 采集数据，本文的两阶段方案可直接套用，且**推理架构零改动**——这是低风险高回报的改进。\n2. **XR 视角的独特价值**：本文证明\"第一人称人类视频 + 轻量动作锚定\"可大幅替代机器人演示。对 XR 而言，这意味着**头显采集的日常第一人称数据**具备成为机器人训练数据的潜力——关键是要有一个\"动作锚定\"的中间域。\n3. **最值得跟进的空白**：跨夹爪形态的泛化。本文的夹爪与 UMI 采集时相同，若换成不同形态夹爪，\"动作等价\"如何定义是真正的开放问题。"}]},{"file":"../papers/notes/2609.18430__StrucPhysVideo结构化caption物理视频世界模型.md","id":"2609.18430","title":"StrucPhysVideo: Learning Physical Dynamics from Structured Captions and Robot Actions","title_zh":"StrucPhysVideo：从结构化字幕与机器人动作学习物理动力学","track":"世界模型与仿真","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.77,"evidence":"FULL","tags":["视频世界模型","物理动力学","MoE","结构化标注","课程学习","少步蒸馏","Physics-IQ"],"flags":[],"sections":[{"h":"一句话结论","body":"用一套**物理导向的数据策管管线**（运动感知分割 + 质量/内容过滤 + 物理相关性验证 + 物体/材质/时序局部化交互的结构化标注，并显式解耦相机运动与物体行为）产出监督信号，训练稀疏 MoE 的 TI2V 模型；在 **Physics-IQ Verified 上以 45.5% 位列 17 个模型第一**（超 Cosmos3-Super-Image2Video 2.8 点、超最强闭源对比 MiniMax H3 Max 9.3 点），并扩展出**四步蒸馏的交互式 IA2V 世界模型**。"},{"h":"要解决的问题","body":"视频世界模型要真正服务具身 AI，必须建模**物理动力学**——物体如何移动、交互、改变状态。但现有视频生成模型的训练信号里，物理是被\"顺带\"学到的：\n\n- 通用 caption 描述\"发生了什么\"，不描述**接触、形变、状态转移**\n- 相机运动与物体行为混在一起，模型分不清\"是物体动了还是镜头动了\"\n\n结果就是模型能生成\"看起来合理\"的视频，但物理上不成立。"},{"h":"方法详解","body":"### 数据管线（本文的第一贡献）\n\n| 环节 | 做法 |\n|---|---|\n| 运动感知视频分割 | motion-aware video segmentation |\n| 过滤 | quality + content filtering |\n| 物理相关性验证 | physical relevance verification |\n| 结构化标注 | 物体、**材质**、**时序局部化的交互** |\n| **解耦** | 显式分离**相机运动**与**物体行为** |\n| 显式描述 | **接触（contact）、形变（deformation）、状态转移（state transitions）** |\n\n核心主张：这套管线提供的是**锚定在可观测物理事件上的监督**。\n\n### StrucPhysVideo-TI2V（文本-图像到视频）\n\n- 骨干：**LingBot-Video 30B** 稀疏 MoE，从官方 checkpoint 起步\n- 训练：81 帧片段，15 fps，480×832\n- **课程学习（curriculum）**：通用域池 / 物理聚焦池的采样比例按阶段变化\n\n| 训练阶段 | 通用域 : 物理聚焦 |\n|---|---|\n| 前 60% | 70% : 30% |\n| 中间 30% | 40% : 60% |\n| 最后 10% | 20% : 80% |\n\n即**渐进强调物理动力学，同时保留通用域视频数据**——避免物理微调导致通用能力崩塌。\n\n### StrucPhysVideo-IA2V（交互式图像-动作到视频）\n\n在 TI2V 基础上扩展为**机器人末端指令 → 视觉结果**的预测：\n\n- 动作条件化\n- **因果自回归生成**\n- **少步蒸馏**：仅需 **4 次去噪**即可做增量机器人 rollout"},{"h":"实验与结果","body":"### TI2V：Physics-IQ Verified\n\n评测口径说明：Verified 协议修正了歧义提示与虚假参考运动，并对每个样本取平均分；分数**等权结合**空间 IoU、时空 IoU、加权空间 IoU 与经配对视频变异归一化的反向归一化像素 MSE。基准快照日期为 **2026-09-16**。\n\n| 模型 | Physics-IQ Verified |\n|---|---:|\n| **StrucPhysVideo（LingBot-Video-30B 骨干）** | **45.5%** |\n| Cosmos3-Super-Image2Video | 42.7%（−2.8 点） |\n| MiniMax H3 Max（最强闭源对比） | 36.2%（−9.3 点） |\n\n**caption 消融（跨两个骨干，验证\"物理导向标注\"本身的价值）**\n\n| 骨干 | 无 caption / 原始 | + raw captions | + physics-focused captions |\n|---|---:|---:|---:|\n| Wan2.2-5B | 24.8% | 31.0% | **33.2%** |\n| LingBot-Video-30B | 37.9% | 43.9% | **45.5%** |\n\n关键读数：\n- 加 raw captions 已有巨大增益（24.8→31.0、37.9→43.9，即 **+6.2 / +6.0 点**）\n- **物理导向 caption 在 raw caption 之上再 +2.2 / +1.6 点**\n- 结论在两个不同规模/架构的骨干上一致 → **不是骨干特定的巧合**\n\n### IA2V：交互式预测\n\n对比 DreamDojo-AgiBot，**在所有评测指标上一致更优**：帧级保真度（PSNR / SSIM / LPIPS）更高、运动误差更低，且**轨迹准确率高得多（0.8330 vs. 对照）**。\n\n另在 A2World 默认设置（21 帧、256×256/视角、前 21 帧、5 fps）下做了同口径重算。\n\n### Teacher Dropout 与 Guidance 消融（Table 4）\n\n1. **即使不用 CFG，仅对动作条件做 dropout 也不会掉点**\n2. **动作 CFG 显著改善动作条件化与 IA2V 生成质量**"},{"h":"创新点与贡献","body":"1. **把\"数据策管\"提升到与模型架构同等地位**：本文最硬的证据是 caption 消融——同一骨干、仅换标注策略，Physics-IQ 就能涨 7~8 点。这说明物理能力的瓶颈**在数据不在架构**。\n2. **显式解耦相机运动与物体行为**：这是物理监督能否成立的前提，很多工作忽略了。\n3. **课程学习比例的具体配方**：70/30 → 40/60 → 20/80 的三段式，可直接复用。\n4. **从 TI2V 到 IA2V 的完整路径**：四步蒸馏 + 因果自回归，使交互式 rollout 可行。"},{"h":"局限与风险","body":"- 无代码发布声明（仅项目页）。\n- 主实验集中在 Physics-IQ 单一基准；无真机闭环控制实验，IA2V 的\"交互式 rollout\"仍是开环预测层面的验证。\n- 30B MoE 骨干算力门槛极高，绝大多数团队无法复现训练过程。\n- 相对最强基线的增益为 **+2.8 点**，属\"稳健 SOTA\"而非数量级突破。"},{"h":"与文献库的关系","body":"- **与本期 MiniMax-H3 评测（arXiv:2609.18323）形成交叉印证**：\n  - StrucPhysVideo 报告 MiniMax H3 Max 在 Physics-IQ Verified 上仅 **36.2%**\n  - MiniMax-H3 评测论文报告其在自建物理推理基准上总体成功率 **41.97%**，其中 Audio-based Disambiguation Reasoning 最弱（27.40%）\n  两者一致指向：**当前全模态生成模型的物理/跨模态消歧能力仍是短板**。\n- **赛道定位**：库内 `世界模型与仿真` 天花板为 Astronex-World（arXiv:2609.20034，4.32）；本文 3.77 未超，但开辟\"物理动力学建模\"子方向。\n- **互补**：库内 PointZero（2609.19142）做 3D 点轨迹补全、WorldContact（2609.19600）做以接触为中心的世界模型——三者共同覆盖\"轨迹 / 接触 / 视频生成\"三个物理层面。\n- **可服务**：任何需要物理一致性的 XR 仿真（如库内 SemSafe-3DGS 的导航风险场景）都需要这类物理世界模型作生成引擎。"},{"h":"可复现性","body":"- 代码：未声明；项目页 https://westlakedi-awomo.github.io/StrucPhysVideo-Page/\n- 骨干：LingBot-Video 30B（公开 checkpoint）\n- **训练复现门槛极高**（30B MoE）；但**数据管线的思路可低成本复用**到小骨干上——caption 消融已在 Wan2.2-5B 上验证有效"},{"h":"行动建议","body":"1. **最值得抄的是数据管线，不是模型**：即使只有 5B 骨干，\"运动感知分割 + 物理相关性过滤 + 显式描述接触/形变/状态转移 + 解耦相机运动\"这套标注策略也能带来 +6~8 点。这是性价比最高的部分。\n2. **课程学习配方直接复用**：70/30 → 40/60 → 20/80 的三段式可迁移到任何\"通用能力 + 专项能力\"的微调场景。\n3. **XR 仿真应用**：把 StrucPhysVideo-IA2V 接进机器人/虚拟人仿真，用末端指令驱动视觉演化，可低成本生成大量物理合理的交互数据。\n4. **跟进空白**：开环预测 → 闭环控制。本文的 rollout 仍是预测层面，真正的物理世界模型需要在闭环中验证动作后果。"}]},{"file":"../papers/notes/2609.18473__CADSplat稀疏视角数字孪生重建.md","id":"2609.18473","title":"CADSplat: Sparse-View 3D Gaussian Splatting Aided by CAD Models for Robust, Photorealistic Digital-Twin Reconstruction","title_zh":"CADSplat：以 CAD 模型辅助的稀疏视角 3D 高斯泼溅鲁棒逼真数字孪生重建","track":"神经渲染","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"S","value":4.28,"evidence":"FULL","tags":["3DGS","稀疏视角重建","CAD先验","数字孪生","无标记AR注册","位姿估计","非刚性形变"],"flags":[],"sections":[{"h":"一句话结论","body":"把**可检索的 CAD 模型当作形状先验**注入 3DGS：先用轮廓匹配从 CAD 库里挑出形状近似的模型并同时定出相机-物体位姿，再把 60 万个高斯锚定到该模型表面、联合优化外观/位姿/非刚性形变场。在 <15 视角、宽基线的真实拍摄下显著超越无约束 3DGS、few-shot 与网格贴图三类基线，**到 3 视角仍优雅退化不崩**，并把每个相机都放进\"物体自身坐标系\"——这直接打通了无标记 AR 注册、单图位姿估计、物理仿真与设计部件标签迁移。"},{"h":"要解决的问题","body":"两条 3D 表示路线各有硬伤：\n\n| 路线 | 优点 | 硬伤 |\n|---|---|---|\n| CAD 等显式设计模型 | 刚性、语义可解释、拓扑干净，是设计真值 | 人工成本高；缺纹理、材质与真实物体的几何瑕疵，不逼真 |\n| NeRF / 3DGS 等学习式 NVS | 从图像直接得到逼真表示 | **欠定**：视角稀疏时几何变噪、为拟合训练视角而幻觉出假几何，新视角泛化差 |\n\n核心矛盾：**密集拍摄假设**在工业/电商场景不成立（往往只有几张宽基线照片）。本文要解决的正是\"稀疏 + 宽基线\"下同时拿到**逼真外观**与**准确几何**。"},{"h":"方法详解","body":"### 三阶段管线\n\n**① CAD 检索与相机-物体配准（silhouette matching）**\n把图像中分割出的物体轮廓，与 CAD 库逐模型渲染出的轮廓做匹配，取匹配最佳者，同时保留其相机-物体位姿。这一步一举两得：既拿到形状先验，又把每个相机放进物体自身坐标系。\n\n**② 高斯锚定到 CAD 表面**\n在规范化后的 CAD 网格表面初始化 `N_splats = 600,000` 个高斯：\n\n- 初始 `log`-scale 设为覆盖到最近 3 个邻居的平均距离\n- 四元数设为与表面法线对齐的最短弧旋转\n- 不透明度初始化为 sigmoid 后的 0.5\n\n关键设计：**高斯数量固定，不做 densification 或 pruning**。所有形变由一个单一的平滑形变场承担。\n\n**③ 联合优化（三件事一起学）**\n- Stage I（pose + deform）：3k iterations\n- Stage II（photometric）：24k iterations，其中 splat dropout 比例在前 20k iterations 内余弦退火到 0\n- 测试时精化：每个留出相机单独优化 400 步，**只允许位姿增量可学、重建被冻结**——保证重建不会去拟合留出视角\n\n联合优化的对象：3DGS 参数、相机-物体配准、非刚性形变场（用于吸收物理物体与 CAD 模型之间的形状差异）。\n\n### 评测协议的重构（本文一个被低估的贡献）\n\n作者指出常见协议的不公平：物体级渲染与场景级真值在**物体边界的薄带**上天然不一致，会被逐像素指标重罚，即使重建本身是准的。因此改为：\n\n- 对每个留出相机单独做 400 步位姿精化后再比较\n- 分三层指标：整图裁剪质量（PSNR/SSIM/LPIPS/FLIP）、mask 内质量（mPSNR/mSSIM/mLPIPS/mFLIP）、前景（fgPSNR）与轮廓 IoU"},{"h":"实验与结果","body":"**数据**：3 个物体中心数据集——自建 SCO-CAD（6 个真实物体 + 近似 CAD，CC 协议；刻意选近似模型以规避工业 CAD 的 IP 问题）、NeRS 公开集（car 类 3,533 个 ShapeNetCore 模型 + NeRS Misc）。\n\n| 关键结果 | 数值 |\n|---|---|\n| 3 视角下 CAD 初始化的增益 | PSNR **+1.4 dB**、mPSNR **+1.1 dB**、fgPSNR **+1.0 dB**、轮廓 IoU **+4.9 点**（0.929 vs. 对照） |\n| 球面初始化的 CADSplat vs. 原生 3DGS（全视角预算） | mPSNR **+2.8 dB**、fgPSNR **+2.6 dB**、IoU **+0.03** |\n| 相机-物体配准误差（最差场景 carjack） | **4.2° / 14.3%**（该场景相对标定最不准） |\n\n**消融（Table 5 设计决策，PSNR / mPSNR / IoU）**\n\n| 配置 | PSNR | mPSNR | IoU | 解读 |\n|---|---:|---:|---:|---|\n| 无形变、无位姿优化 | — | — | — | 纹理被拟合到未配准的表面，几何永不恢复 |\n| 无 mask align 预热 | 18.88 | — | 0.784 | **塌缩**，低于任一几何组件单独使用 |\n| 仅形变场 | 22.92 | 28.38 | 0.941 | **已逼近完整方法 0.3 dB 以内**——形变场能\"把 CAD 网格包到物理观测上\"，并自主刚性纠正位姿失配 |\n| 仅位姿优化 | 22.67 | — | — | 六场景均值上边际增益小，但**集中在标定最不准的场景** |\n| 完整方法 | — | — | — | 基准 |\n\n> 最重要的发现（作者自述）：**渲染质量增益的大头来自\"约束方式\"而非 CAD 形状本身**——即\"固定数量的 splat 被绑在表面上、由单一平滑形变场驱动\"这一表示约束。CAD 的真正价值只在**视角最稀缺时**显现（最稀疏的拍摄、强自遮挡物体），以及把所有相机放进物体坐标系。"},{"h":"创新点与贡献","body":"1. **CAD 先验进入 3DGS 的完整可工程化路径**：检索 → 配准 → 锚定 → 联合优化，四步闭环。\n2. **表示约束 > 形状先验**这一反直觉的量化发现，为后续稀疏视角工作指明方向（不必执着于更准的 CAD）。\n3. **相机-物体坐标系的输出形式**：使重建结果超越新视角合成，可直接服务 AR 注册/位姿估计/仿真/部件标签迁移。\n4. **评测协议重构**：把\"边界薄带惩罚\"这个系统性偏差显式化。"},{"h":"局限与风险","body":"- **前提依赖强**：必须有形状近似的 CAD 模型可检索。作者的 SCO-CAD 刻意用 CC 协议的近似模型，恰恰说明工业场景的真实 CAD 拿不到（IP 保护）。这是落地最大风险。\n- 过拟合被 SH-neighbor smoothness 与 splat dropout 两个正则缓解，但**作者承认未根除**。\n- 近对称物体（carjack、skateboard）的轮廓无法区分 180° 旋转，只能报\"较近的对称参考位姿\"的误差。\n- 未见代码发布声明。"},{"h":"与文献库的关系","body":"- **填补空白**：库内 `神经渲染` 赛道此前 **0 篇**，本文与 NormLift（arXiv:2609.18898）共同建立该赛道基线。\n- **互补非竞争**：库内 PhGS（2609.20623）、STAR（2609.19747）、GS-PI（2609.19907）均为 **feed-forward 3DGS** 路线（单次前向推理出高斯），追求速度；CADSplat 是**逐场景优化**路线，追求稀疏视角下的几何准确性。二者适用场景不同。\n- **潜在协同**：NormLift 的语义可靠性评分可叠加到 CADSplat 的高斯上，为其开放词汇部件理解提供 training-free 方案。"},{"h":"可复现性","body":"- 代码：未声明\n- 数据：SCO-CAD 未公开（CC 协议 CAD 可自行获取）；NeRS 为公开集\n- 硬件：未明确，但 600k splat + 27k iterations 属单卡可承受量级"},{"h":"行动建议","body":"1. **工业 AR / 数字孪生团队**：这是目前把\"设计模型\"与\"实拍外观\"缝合得最完整的工作，优先评测其无标记 AR 注册路径。\n2. **研究跟进点**：文中\"表示约束贡献大于形状先验\"的结论值得在自己数据上复现——若成立，则无需投入 CAD 库建设，改用球面/简单代理几何 + 强形变场即可拿到大部分收益。\n3. **AR 注册方向**：可尝试与库内 SnapPhysics（2609.19815）的物理场景图结合，把\"几何注册\"推进到\"物理可用注册\"。"}]},{"file":"../papers/notes/2609.18548__HAP手部驱动头动预测.md","id":"2609.18548","title":"HAP: A Hand-Driven Active Perception Framework for Egocentric Head Motion Prediction","title_zh":"HAP：手部驱动的第一人称头动主动感知预测框架","track":"感知与认知","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.75,"evidence":"FULL","tags":["头动预测","主动感知","第一人称视觉","6-DoF","遮挡图","注视点渲染","视口预取"],"flags":[],"sections":[{"h":"一句话结论","body":"把**未来 6-DoF 头动预测**形式化为\"以观测到的手部运动与推断的目标上下文为条件\"的主动感知问题，提出 HAP：先从手部运动与物体几何推断各候选目标的置信度，构建动态的 **P-TAOG（Predictive Target-Centric Amodal Occlusion Graph，预测性以目标为中心的非模态遮挡图）** 表达候选目标间当前与潜在的遮挡关系，用有向图 + 因果时序推理编码演化的感知状态，最后用 horizon-wise gate 把学习到的轨迹与常速先验混合。同时发布 **Bottle**——一个带协调头手运动、目标可见性变化的面向目标操作的第一人称 RGB-D 数据集。"},{"h":"要解决的问题","body":"第一人称运动预测的研究重心长期在**手**与**被操作物体**上，**未来头动**被相对忽视。但头动不是手轨迹的副产品：\n\n- 操作过程中，头会**主动重新朝向目标**以获取任务相关的视觉证据\n- 头同时与身体、手部运动协调\n\n因此这是一个**独特的主动感知问题**，而非手轨迹预测的二阶推论。作者明确指出：即便是联合建模手与头动的 Uni-Hand，也**没有显式建模\"指向目标的感知需求\"作为未来头动的驱动因素**。\n\n**为什么这件事对 XR 重要**：头动直接决定**未来会获取到哪些任务相关的视觉证据**。能预测头动 = 能预取视口 = 直接影响注视点渲染、带宽调度、内容预加载的预算。"},{"h":"方法详解","body":"### 问题形式化\n\n用刚性安装的第一人称 RGB-D 相机姿态表示头动。`T_t ∈ SE(3)` 为时刻 t 的相机姿态，目标是预测到未来各步的**相对头动**：\n\n```\nΔT_{t,h} = T_t^{-1} T_{t+h},   h = 1, …, H\n```\n\n每个相对变换用平移 `p_{t,h} ∈ ℝ³` 与 **6D 旋转向量** `θ_{t,h} ∈ ℝ⁶` 表示：\n\n```\nθ_{t,h} = [ (r_{t,h}^{(1)})ᵀ, (r_{t,h}^{(2)})ᵀ ]ᵀ ∈ ℝ⁶\ny_{t,h} = [ p_{t,h}ᵀ, θ_{t,h}ᵀ ]ᵀ ∈ ℝ⁹\n```\n\n6D 旋转表示经正交化转为合法旋转矩阵。\n\n**基础特征** `b_τ`（每个观测时刻 τ 的协调手头运动）：\n\n```\nb_τ = [ h_τ, h_τ − h_{τ−1}, ρ(T_{τ−1}^{-1} T_τ) ] ∈ ℝ¹⁵\n```\n\n其中 `h_τ ∈ ℝ³` 为重建的手部位置，ρ(·) 施加式(2) 的平移与 6D 旋转表示。每个片段首帧，相对头动初始化为单位、手部位移置零。\n\n### 三个核心模块\n\n**① 手部驱动的目标意图估计（Hand-Driven Target Intention Estimation）**\n从观测的手部运动与目标物体几何推断每个候选目标的置信度。保留**接触前候选目标之间的歧义**（此时手部轨迹仍与多个物体相容），而不是过早做硬指派。\n\n**② 动态 P-TAOG 构建**\n为每个候选目标，用 SAM 3D Objects 的 Stage 1（首帧 RGB + 物体 mask 输入，4 次去噪）得到补全的稀疏点集；每帧把最多 **1,024 个点**变换到当前相机坐标系，以 4 像素半径光栅化，估计可见性并构建**动态非模态遮挡图**。\n\n**③ 有向图 + 因果时序推理 + horizon-wise gate**\n- 有向图编码候选目标间的遮挡关系\n- 因果时序推理编码\"以目标为条件\"的演化感知状态\n- 与手、头运动历史融合\n- **horizon-wise gate** 决定每个预测步应多大程度**偏离常速先验**\n\n### 实现细节\n\n| 组件 | 选择 |\n|---|---|\n| 相机轨迹估计 | Depth Anything 3（DA3），平滑后作为头动的可观测代理 |\n| 物体检测与跟踪 | YOLO11 + SAM 2 |\n| 3D 手部位置 | WiLoR 关键点 + 对齐深度 |\n| 目标意图估计器 | 在 curated EgoPAT3Dv2 片段上预训练，Bottle 实验中固定 |\n| 训练 | 20 epochs，AdamW，batch 64，lr 1e-3，weight decay 3e-4，rotation loss weight 0.25 |"},{"h":"实验与结果","body":"**评测**：公开数据集 + 自建 **Bottle**（第一人称 RGB-D，面向指定目标的操作，含协调的头手运动与目标可见性变化）。\n\n**主要结论**\n- HAP 在公开数据集与 Bottle 上均取得**低于代表性基线的头动预测误差**\n- 基线覆盖状态空间、循环、变分、注意力与扩散五类形式；CVH 为外推观测轨迹平均速度的基线\n\n**消融要点**\n\n| 发现 | 解读 |\n|---|---|\n| **gated P-TAOG 优于 Motion Gated Direct**（平移与旋转的平均与最终误差） | 遮挡图 + 门控有效 |\n| **未加 gate 的版本反而落后于纯运动模型** | **gate 是决定性的**——它控制每步应多大程度偏离常速先验 |\n| 保留候选目标歧义优于硬指派 | 接触前的**不确定性本身携带有用信息** |\n| 目标意图估计器（仅用接触前观测前缀）在 curated EgoPAT3Dv2 验证集上 **top-1 准确率 92.79%** | 观测到的手部状态与手-物几何中**确实包含关于交互目标的先行信息** |\n\n> 最后一条是本文最有价值的发现：**在手接触目标之前，仅凭手部状态与几何就能以 92.79% 的准确率预测目标**——这为所有需要\"提前预判用户意图\"的 XR 系统（预加载、预渲染、主动提示）提供了可行性证据。"},{"h":"创新点与贡献","body":"1. **把头动预测确立为独立问题**：明确论证它不是手轨迹预测的副产品，而是主动感知问题。\n2. **P-TAOG**：用非模态（amodal）遮挡图表达\"当前与潜在\"的遮挡关系，是对可见性/遮挡的动态结构化建模。\n3. **Bottle 数据集**：填补\"面向指定目标的操作 + 协调头手运动 + 变化的目标可见性\"这一数据空白。\n4. **horizon-wise gate 的关键性**：消融证明去掉 gate 会不如纯运动基线——这是一个反直觉但重要的工程发现。"},{"h":"局限与风险","body":"- **增益幅度未充分量化**：文中表述为\"lower errors than representative baselines\"，但摘要与正文均**未给出相对基线的具体百分比**，难以判断改进幅度是否实用。\n- **无系统级验证**：论文停留在\"预测更准\"，**未验证其下游收益**——即更准的头动预测究竟能省多少带宽/算力。这是从算法到 XR 系统落地之间缺失的一环。\n- 头动由 DA3 估计的相机轨迹代理，估计误差会传导到训练与评测。\n- 代码尚未发布。"},{"h":"与文献库的关系","body":"- **库内无头动预测工作**：本文建立该子方向。\n- **赛道定位**：库内 `感知与认知` 天花板为 PROVIA（arXiv:2609.20638，3.93，程序状态追踪）；本文 3.75 未超，但开辟\"运动预测/主动感知\"子方向。\n- **与本期 GazeDiT（arXiv:2609.17814）构成上下游**：GazeDiT 让**注视估计**更准（3.05°→2.80°），HAP 让**头动预测**更准。注视点渲染需要\"头动 + 眼动\"联合预测——二者可串成完整链路。\n- **与本期 VibeAvatar（arXiv:2609.18632）可组合**：语音驱动口型 + 手部意图驱动头动 = 更完整的化身行为模型。\n- **与库内 BinoGen（2609.19881）互补**：BinoGen 提供规模化第一人称双眼数据，可作为 HAP 的训练数据底座。"},{"h":"可复现性","body":"- 代码：https://HAP-ego.github.io/HAP （论文称 will be released，**当前未见**）\n- 数据：Bottle 数据集待随代码发布；公开数据集为 EgoPAT3Dv2 等\n- 依赖栈：DA3 / YOLO11 / SAM 2 / WiLoR / SAM 3D Objects，均为公开模型\n- 训练成本：20 epochs、batch 64，单卡可承受"},{"h":"行动建议","body":"1. **XR 系统团队应重点跟踪**：头动预测是注视点渲染、视口预取、云渲染带宽调度的直接输入。92.79% 的接触前目标准确率意味着**预取窗口可以显著提前**。\n2. **补齐缺失的一环**：本文最大的空白是\"更准的预测 → 省了多少带宽/算力\"。谁先做出这个系统级量化，谁就把这篇算法论文变成了可落地的 XR 技术。\n3. **horizon-wise gate 的教训要记住**：\"学习轨迹 + 常速先验混合\"的门控设计，其收益可能大于复杂的图结构本身。做时间序列预测时应先验证这类简单基线的门控是否到位。"}]},{"file":"../papers/notes/2609.18624__MoQSplat基于MoQ的3DGS渐进流式.md","id":"2609.18624","title":"MoQSplat: Adaptive Progressive Streaming of 3D Gaussian Splatting via MoQ","title_zh":"MoQSplat：基于 Media over QUIC 的 3D 高斯泼溅自适应渐进流式传输","track":"系统与平台","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.75,"evidence":"FULL","tags":["3DGS","流式传输","Media over QUIC","队头阻塞","视口自适应","6-DoF","注视点"],"flags":["⚠️ 仅原型验证，无端到端带宽/QoE 数字"],"sections":[{"h":"一句话结论","body":"把 3DGS 内容映射到 **Media over QUIC（MoQ）** 的传输层级：场景划分为**空间 Track**、splat 聚类为**语义连贯的 Group**、构造**渐进质量的 Subgroup** 并映射到**独立的 QUIC 流**，从而**消除连接级队头阻塞（HOL blocking）**；客户端用无状态的订阅者驱动自适应环，按 **6-DoF 视锥可见性 + 距离 + 注视点对齐**动态请求空间区域与质量档位。原型验证显示**基于不透明度的剪枝优于基于尺度的剪枝**。"},{"h":"要解决的问题","body":"3DGS 能实时高保真新视角合成，但对 VR 远程临场、数字孪生这类沉浸式应用，传输仍是瓶颈：\n\n| 瓶颈 | 具体表现 |\n|---|---|\n| **数据规模** | 为捕捉复杂的视角相关高光需到三阶球谐（每基元 **45 个参数**）；真实场景数百万 splat，**超过数 GB** |\n| **TCP 队头阻塞** | 现有方案（LapisGS、LTS、L3GS）沿用 HAS/DASH/SVC 思路跑在 TCP 上：丢包会**阻塞后续所有数据的重传** |\n| **分割粒度粗** | DASH 的固定时长分段不适合 3DGS 的细粒度交付 |\n\nMoQ 相对 TCP/HAS 的结构性优势：**多流独立、无连接级队头阻塞**。"},{"h":"方法详解","body":"### 三层映射（对应 MoQ 传输层级）\n\n| MoQ 层级 | MoQSplat 的映射 | 作用 |\n|---|---|---|\n| **Track** | 空间划分（spatial partition） | 场景按空间切成多个 Track |\n| **Group** | 语义连贯的 splat 聚类 | 把 splat 聚成语义上有意义的簇，使\"只传相关 splat\"成为可能 |\n| **Subgroup** | 渐进质量层 | 映射到**独立的 QUIC 流**，消除连接级 HOL 阻塞 |\n\n### 客户端自适应：无状态的订阅者驱动循环\n\n客户端根据三个因素动态请求**空间区域 + 质量档位**：\n\n1. **6-DoF 视锥可见性**（frustum visibility）\n2. **距离**（distance）\n3. **注视点对齐**（foveal alignment）\n\n\"**无状态**（stateless）\"是关键设计——服务端不需要维护每个客户端的状态，便于水平扩展。\n\n### 渐进质量层的构造：不透明度 vs. 尺度\n\n这是论文给出的核心实验结论：**opacity-based pruning（基于不透明度的剪枝）在渐进交付上一致优于 scale-based pruning（基于尺度的剪枝）**——在渲染**相同数量 splat** 的条件下取得更高的感知质量。\n\n> 含义：优先级应该按\"对最终图像的贡献度\"（不透明度直接对应 alpha 混合贡献）排序，而不是按几何尺度。"},{"h":"实验与结果","body":"**评测对象**：Mip-NeRF360 数据集的 **Bicycle** 内容，作为两个阶段的共同参考。\n\n**质量指标**：VMAF。计算方式：绕目标 3DGS 簇（Bench–Bicycle）做 ±90° 方位角平滑环绕，保持距离、仰角与相机内参固定；每段 10 s / 30 fps（300 帧），以**未剪枝模型**作为剪枝模型的参考。\n\n**环境**：Ubuntu 22.04 集群，Intel Xeon Gold 5218 @ 2.30 GHz，双 NVIDIA Quadro GV100。\n\n**两阶段结论**\n\n| 阶段 | 结论 |\n|---|---|\n| **Publisher 端内容准备（离线）** | Group 策略能从完整 Bicycle 场景中识别出语义有意义的簇（Bench–Bicycle 对象），使自适应渐进流式可只传相关 splat |\n| **渐进 Subgroup** | 不透明度剪枝与尺度剪枝都随接收 splat 增多而提升视觉质量；但**不透明度剪枝在同等渲染 splat 数下一致更优**，使订阅者无需等全部 splat 即可在请求视口内获得满意质量 |\n\n**实验强度评估（重要）**：论文自述为\"**preliminary evaluation（初步评测）**\"与\"**prototype implementation（原型实现）**\"。\n\n- 仅 1 个场景（Bicycle）\n- **无端到端带宽节省数字**\n- **无 QoE / 用户研究**\n- 无真实网络条件（丢包/抖动）下的对比曲线\n- 7 页短文\n\n这正是 EXP 仅给 2 分的原因——**问题重要性与设计完整度高，但实证证据明显不足**。"},{"h":"创新点与贡献","body":"1. **把 3DGS 与 MoQ 传输层级做结构化映射**：Track / Group / Subgroup 三层对应清晰，是\"内容表示\"与\"传输协议\"之间的正确抽象。\n2. **消除连接级队头阻塞**：这是 MoQ 相对 TCP/HAS 的结构性优势，本文首次把它引入 3DGS 交付。\n3. **6-DoF + 注视点驱动的无状态自适应**：把渲染端的视口/注视信息直接用于传输调度，跨层优化。\n4. **不透明度优于尺度剪枝**这一可复用的优先级设计原则。"},{"h":"局限与风险","body":"- **证据强度不足（首要局限）**：原型 + 单场景 + 无端到端数字。与库内 DELUGE（arXiv:2609.19750，S 4.65，Apple Vision Pro 端到端 60fps 部署、BD-Rate −73.5%、G-PCC 解码 31 ms → 2.5 ms）相比，实证差距明显。\n- 未量化 MoQ 相对 DASH/HAS 在真实丢包网络下的收益——而这恰恰是本文的核心主张。\n- Group 的\"语义连贯性\"如何定义与自动化，短文未充分展开。\n- 7 页篇幅限制，消融有限。"},{"h":"与文献库的关系","body":"- **与 DELUGE（arXiv:2609.19750，S 4.65）分层互补、可叠加**：\n  - DELUGE 在**编解码层**（粒子流的分解式熵编码、轴分离 Planar ANS、扁平反量化 LUT）\n  - MoQSplat 在**传输层**（MoQ 多流映射、视口自适应）\n  - 二者解决不同层次的问题，理论上可组合成\"高效编码 + 无阻塞传输\"的完整链路\n- **与本期 GenStream（arXiv:2609.18634）形成对照**：\n  - GenStream 主张**根本不传几何**（传骨骼 + 视点）\n  - MoQSplat 主张**把几何传得更好**\n  - **MoQSplat 保留了视点一致性，GenStream 没有**——在需要自由视点的 XR 场景中，MoQSplat 的路线更正确\n- **赛道定位**：库内 `系统与平台` 天花板为 DELUGE 4.65；本文 3.75 未超，但开辟\"3DGS 传输协议\"子方向。\n- **可服务**：库内 RawSLAM（2609.20589）、AMB3R-SLAM（2609.19518）产出的 3DGS 地图，可经 MoQSplat 分发出去——构成\"在线建图 → 实时分发\"的完整链路。"},{"h":"可复现性","body":"- 代码：https://github.com/emanuele-artioli/MoQSplat （已开源）\n- 数据：Mip-NeRF360（公开）\n- 环境：Ubuntu + Quadro GV100\n- **复现门槛低**（原型实现已开源），但需自建 MoQ 协议栈环境"},{"h":"行动建议","body":"1. **先补齐证据再采信**：在真实丢包网络下测 MoQ vs. DASH 的端到端 QoE，是判断本文主张是否成立的关键实验。目前只有\"不透明度剪枝更优\"这一条是硬结论。\n2. **不透明度优先这条可以直接用**：无论是否采用 MoQ，按 alpha 贡献而非几何尺度做渐进优先级排序都是更优选择，可立即应用到现有 3DGS 流式系统。\n3. **与 DELUGE 组合是最有前景的方向**：DELUGE 解决了\"编码慢/码率高\"，MoQSplat 解决了\"传输阻塞\"，两者叠加才可能真正支撑 GB 级 3DGS 的实时分发。\n4. **注意时间**：MMSP 2026 于 9 月 22–24 日在伊斯坦布尔召开，正式版可能补充实验，建议跟踪 camera-ready 版本。"}]},{"file":"../papers/notes/2609.18632__VibeAvatar语音运动学与美学解耦化身.md","id":"2609.18632","title":"VibeAvatar: Aligning Phonetic Kinematics and Human Aesthetics for High-Fidelity Talking Avatar Synthesis","title_zh":"VibeAvatar：对齐语音运动学与人类美学的高保真说话人化身合成","track":"化身与人体","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.93,"evidence":"FULL","tags":["说话人化身","数字人","唇音同步","GRPO","流匹配","运动美学","端侧推理"],"flags":["⚠️ 基于 LIA(2022) 潜 warp 空间"],"sections":[{"h":"一句话结论","body":"指出**唇音准确性**与**运动美学**来源根本不同，不应由同一个生成器隐式学出，而应在**两个互补阶段**分别解决：条件阶段用 **PKA（Phonetic Kinematics Adapter）** 把识别导向的语音特征转成语音-运动学条件；后训练阶段用 **AMP（Aesthetic Motion Policy）** 把流采样重构成随机策略并用 **GRPO** 优化到人类偏好。最终 **0.7B 参数 / ~3GB 显存 / 10 秒 512px 视频 <10 秒生成**，在客观指标与用户研究上均达 SOTA。"},{"h":"要解决的问题","body":"说话人化身（talking avatar）的\"不可能三角\"：\n\n| 目标 | 现有方法的困难 |\n|---|---|\n| **准确的唇部发音** | 通用语音特征面向识别优化，不是面向面部运动学 |\n| **人类偏好的运动美学** | 与唇音准确性来源不同，强行让一个生成器同时学，会相互干扰 |\n| **高效推理** | 端到端扩散模型通常需数分钟、显存数十 GB |\n\n本文的核心洞察：**前两者应在互补阶段解决，而非让单一生成器隐式学习。**"},{"h":"方法详解","body":"### 整体架构（三件协同设计）\n\n1. **Flow-based Motion Generator**：在紧凑潜空间中高效预测运动，帧级条件注入\n2. **PKA（Phonetic Kinematics Adapter）**：条件阶段，把 raw speech feature 转成保留音素细节的 phonetic-kinematic condition\n3. **AMP（Aesthetic Motion Policy）**：后训练阶段，把 flow 采样重构为随机策略，用 **GRPO**（Shao et al., 2024）优化到人类偏好动态\n4. **两阶段训练**：先学运动先验，再把运动采样对齐到人类美学偏好\n\n### 1D 运动表示（基于 LIA 潜 warp 空间）\n\n给定参考图 `S ∈ ℝ^(3×H×W)`，自编码器产生身份 warp、运动 warp 与多尺度特征：\n\n```\nEnc: S ↦ (w_{S→r}, w_{r→S}, F_S)\n```\n\n- `w_{S→r} ∈ ℝ^{d_w}`：把**身份**编码为从 S 到规范中性姿态 r 的 warp\n- `w_{r→S} ∈ ℝ^{d_w}`：把**运动**编码为从 r 回 S 的 warp\n- `F_S`：保留高频外观细节\n\n再把运动码在一个可学习的低维正交基 `Λ = {λ_1, …, λ_m}` 上展开，得到面部动态的**紧凑 1D 轨迹**。动画化时：\n\n```\nDec: (w_{S→r}, w_{r→D}, F_S) ↦ D̂(S)\n```\n\n通过 `(w_{S→r}, F_S)` 保持身份、通过 `w_{r→D}` 替换运动。这个因式分解把可控的面部动态**限制在低维子空间内**，是高效推理的关键。\n\n### PKA 的分层移位音频上下文建模\n\n消融了多种音频上下文策略，结论（Table 3）：\n\n| 策略 | 表现 |\n|---|---|\n| Causal attention | 优于基线，证明音频条件应尊重运动生成的时间结构 |\n| Full attention | 进一步增益，但**忽略因果性** |\n| Fixed chunk size | 用更宽上下文，但**各层感受野不自适应** |\n| **Hierarchical shifted（本文）** | **整体最佳** |\n\n结论：准确的唇音需要**局部双向交互 + 逐层渐进扩展的音素上下文**二者兼备。"},{"h":"实验与结果","body":"**设置**\n- 每视频取一个主体，音频重采样 16 kHz，归一化 25 FPS，裁剪 **512×512** 人脸区域，丢弃 <2 s 或严重损坏片段\n- HDTF：选 **15 个未见说话人**的视频，各均匀裁剪 15 s 段，构成固定 15×15 s 测试集\n- 指标：Sync-C / Sync-D（唇同步）、FID / FVD（视觉与时间质量）、CSIM（身份一致性）、ASE + VQA（Q-Align，美学质量）\n- 基线：FantasyTalking（MM'25）、EchoMimic（AAAI'25）、Hallo3、Wan-S2V 等\n\n**结果**\n\n| 项 | 数值 |\n|---|---|\n| 参数量 | **0.7 B** |\n| 显存 | **~3 GB** |\n| 10 秒 512px 视频生成耗时 | **< 10 秒** |\n| 对比 | 更大的扩散/商用基线需**数分钟** |\n\n在**唇音准确性、视觉质量、身份保持、美学质量**四项上均优于先前方法。定性对比显示：Hallo3 在嘴颊周围偶发夸张形变，Wan-S2V 跨帧表情连贯性较差；VibeAvatar 在多帧一致性上更稳。\n\n**消融结论链**\n- 加 PKA → 主要提升**发音准确性与语义对齐**（同步指标增益最明显），为后续建立更强的发音先验\n- 再加 AMP → 在**保住 PKA 发音增益的前提下**提升整体感知质量（保真度、身份、美学）\n- 这个模式很关键：**AMP 不是孤立地让视频变好看，而是在不牺牲唇音准确性的前提下提升人类偏好的运动质量**"},{"h":"创新点与贡献","body":"1. **问题解耦的框架性主张**：把\"唇音准确\"与\"运动美学\"识别为两个不同来源、应在不同阶段解决的问题——这比堆参数更有效。\n2. **用 GRPO 做视频生成的美学对齐**：把 flow 采样重构成随机策略，使 RL 后训练可直接作用于采样过程。\n3. **工程效率的真实突破**：0.7B / 3GB / <10 s 的组合，使消费级乃至端侧部署成为可能。\n4. **分层移位音频上下文**：给出\"局部双向 + 逐层扩展\"这一可复用的音频条件设计原则。"},{"h":"局限与风险","body":"- **LIA(2022) 潜 warp 空间**：以 LIA 的 warp 潜空间作 1D 运动表示。已对比 Hallo3 / Wan-S2V / FantasyTalking(MM'25) / EchoMimic(AAAI'25) 并取胜，但**未对比 2026 年更新的 3DMM-free 方案**。\n- 1D 运动表示的表达上限：低维正交基展开在**大姿态、极端表情**下是否足够，文中未给压力测试。\n- 美学评估依赖 Q-Align（ASE/VQA）与用户研究，主观性较强。\n- 无代码发布声明。"},{"h":"与文献库的关系","body":"- **抬升赛道天花板**：库内 `化身与人体` 原最高为 ViLoMan（arXiv:2609.19340，3.72），本文 **3.93** 成为新天花板。\n- **互补**：ViLoMan 做视觉-本体感知的全身移动操作，本文做面部说话人化身，二者可组合成完整虚拟化身。\n- **潜在协同**：与本期 GazeDiT（arXiv:2609.17814）结合可得到\"眼神 + 口型 + 表情\"完整对齐的化身——眼动与唇音同属\"低维标签 → 局部精细几何\"的控制问题。\n- **可服务**：库内 KoUniTalk（2609.19840）为轻量多语言口型方案，本文在质量维度上是其上位替代候选。"},{"h":"可复现性","body":"- 代码：未声明\n- 数据：HDTF、RAVDESS（均公开）\n- 硬件：**~3 GB 显存**即可推理 —— 这是本工作最实际的复现优势\n- 训练：需 GRPO 后训练流程，RL 基础设施是主要门槛"},{"h":"行动建议","body":"1. **XR 通信 / 虚拟主播团队优先试点**：3GB 显存 + <10 s 生成意味着可跑在消费级 GPU 甚至高端头显的协处理器上，是少数具备端侧潜力的高保真方案。\n2. **解耦思路可迁移**：\"识别导向特征 → 运动学条件\"这一适配层设计，适用于任何\"通用预训练特征驱动具体运动\"的场景（手势、眼动、全身姿态）。\n3. **跟进点**：把 PKA 的思路与本期 HAP（arXiv:2609.18548）的头动预测结合，做\"语音 + 手部意图 → 头动 + 表情\"的统一化身驱动模型。"}]},{"file":"../papers/notes/2609.18634__GenStream语义流式生成式重建.md","id":"2609.18634","title":"GenStream: Semantic Streaming Framework for Generative Reconstruction of Human-centric Media","title_zh":"GenStream：面向以人为中心媒体的语义流式生成式重建框架","track":"系统与平台","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":3.94,"evidence":"FULL","tags":["视频流式传输","语义通信","生成式重建","后编解码器","骨骼关键点","带宽削减","Unity"],"flags":["⚠️ 路线落后（部分）：2D sprite 合成，作者自承应转体积化"],"sections":[{"h":"一句话结论","body":"把视频流式的传输对象从**像素**换成**结构化语义元数据**——骨骼关键点 + 相机视点参数 + 静态 3D 背景模型；客户端用生成模型重建逼真人物并合成进 3D 场景。在 2018 平昌冬奥花样滑冰素材上，**连续数据流从 HEVC 的 134 MB 压到约 110 kB，带宽削减 >99.9%**。"},{"h":"要解决的问题","body":"传统编解码器的结构性浪费：\n\n- **像素一视同仁**：AVC / HEVC / AV1 / VVC 在块级操作，**对场景语义无感知**。前景背景同等重编码。\n- **长期重复模式无法利用**：分段独立编码 → 帧间预测只限于短时间窗；体育赛事中\"运动员在静止场馆背景前运动\"这类长时结构冗余被反复重编码。\n- **边际收益递减**：AV1 / VVC 相对前代最多省 50%，但编码端算力代价陡增。\n\n核心命题：当场景是**结构化的、以人为中心的**（体育、演出、交互媒体），且背景静止、运动只集中在少数显著主体时，传像素是根本性的浪费。"},{"h":"方法详解","body":"### 服务端\n\n**① 分割与背景重建**\n- 提取带 mask 的 RGBA 背景层\n- 对被运动员遮挡的区域做**上下文感知修复（inpainting）**，还原完整背景\n- 用 SfM（COLMAP）从修复后的背景推断相机视点\n\n**② 关键点提取**（三档空间密度对比）\n| 方法 | 特点 |\n|---|---|\n| Canny 边缘滤波 | 检测高梯度边缘，勾轮廓 |\n| 网格采样滤波 | 在边缘图上叠规则网格，从高细节区选代表点 |\n| **YOLOv11 Pose 骨骼检测器** | 基于 body landmark 的骨架 |\n\n关键点提取与分割阶段并行执行。\n\n**③ 传输内容**\n| 项目 | 大小 |\n|---|---:|\n| 骨骼关键点 | 64 kB |\n| 包围盒 | < 4 kB |\n| 相机视点参数 | 42 kB |\n| **合计** | **≈ 110 kB** |\n| 对照：HEVC 编码视频 | **134 MB** |\n\n### 客户端\n\n- **引擎**：Unity。因 Unity 用四元数 `q ∈ ℝ⁴` 表示旋转，需把相机外参的旋转矩阵 `R ∈ ℝ³ˣ³` 经四元数代数转换，以减少表示 `T`（4×4 齐次变换矩阵）所需的数值量\n- **生成模型**：训练一个 **cGAN**，输入为配对图像数据（一肢为基于骨骼重建的人物图像）\n- **合成**：逐帧把生成的人物合成进 3D 背景，时序上由关键点与视点元数据的演化引导\n- **播放**：重建序列送入播放器，低延迟回放\n\n### 设计要点\n\n因为依赖学习到的先验与稀疏表示，GenStream **对带宽骤降、抖动、中间帧丢失天然鲁棒**——它的行为更像一个生成式动画系统，而非经典视频流系统。"},{"h":"实验与结果","body":"**数据**：2018 平昌冬奥会 4 场花样滑冰表演中提取的 **48 个场景、40,000+ 帧**，时长 9 s–55 s，**30 fps / 1080p**。共享特征：(i) 同一冰场背景、静止物体与观众为主；(ii) 一名花样滑冰运动员在中心运动。\n\n**主结果**\n\n| 指标 | 数值 |\n|---|---|\n| 连续数据流带宽 | 134 MB（HEVC）→ **≈110 kB** |\n| 削减比例 | **> 99.9%** |\n\n> ⚠️ **口径声明（作者原文明确）**：该计算**仅针对连续数据流**，**不包含**一次性的、流前的 3D 场馆模型与生成模型权重的预分发。这是评估本文真实收益时必须扣除的成本。\n\n**实验强度评估**：本文自述为 **\"partially validate（部分验证）\"**——仅在单一素材类型（花样滑冰）上验证，未做多数据集、无用户研究、未与 DASH/HAS 端到端系统做 QoE 对比。这正是 EXP 仅给 2 分的原因。"},{"h":"创新点与贡献","body":"1. **范式级主张**：明确提出\"后编解码器（post-codec）\"方向——传输语义内容而非像素保真。\n2. **完整的服务端-客户端分工设计**：分割 → 背景修复 → SfM 视点估计 → 关键点提取 → 传输 → 客户端生成 → 合成 → 播放，链路闭合。\n3. **量化到字节级**：把 110 kB vs 134 MB 拆到关键点/包围盒/视点三项，便于后续工作逐项优化。\n4. **对网络波动的天然鲁棒性**：这是语义传输相对像素传输的结构性优势。"},{"h":"局限与风险","body":"- **客户端算力重**：作者把这一点列为\"最直接的挑战\"，并指出需要面向资源受限设备的轻量生成模型研究。在 XR 头显上尤为致命。\n- **泛化性存疑**：仅在单一种类素材（花样滑冰、单人、固定背景）验证。作者自承多演员交互、动态运镜、频繁遮挡是\"非平凡的研究问题\"。\n- **2D sprite 合成无视点一致性**：生成的 2D 人物被合成进 3D 场景，**无法支持自由视点**。作者明确把\"从 2D sprite 演进到全体积化、视点一致的表示\"列为关键未来方向。\n- **一次性预分发成本未计入**：3D 场馆模型 + 生成模型权重的预分发在真实部署中不可忽略。\n- 背景建模依赖 COLMAP 等 SfM 工具的多场景特征融合，作者指出其高效求解本身是开放问题。"},{"h":"与文献库的关系","body":"- **与 DELUGE（arXiv:2609.19750，S 4.65）的关系**：DELUGE 是**编解码层**的工作（粒子流的分解式熵编码，BD-Rate −73.5%，Apple Vision Pro 端到端 60fps 部署）；GenStream 是**内容表示层**的范式替换（不传像素）。二者层次不同，理论上可叠加。\n- **与本期 MoQSplat（arXiv:2609.18624）的关系**：MoQSplat 解决的是 3DGS 场景在**传输层**的队头阻塞与视口自适应；GenStream 解决\"根本不传几何\"。MoQSplat 保留了视点一致性，GenStream 没有——这是 MoQSplat 代表的新一代方案对本文的实质超越。\n- **赛道定位**：库内 `系统与平台` 原最高为 DELUGE 4.65，本文 3.94 未超天花板，但开辟了\"语义流式\"子方向。"},{"h":"可复现性","body":"- 代码：https://github.com/emanuele-artioli/genstream （已开源）\n- 数据：2018 平昌冬奥公开转播素材\n- 引擎：Unity\n- 生成模型：cGAN，需自行在目标素材上训练（**这是复现的主要成本**）"},{"h":"行动建议","body":"1. **不要直接用于 XR 头显**：客户端 cGAN 推理 + Unity 渲染的算力负担在头显上不可承受。先做云渲染 + 视频回流，或等轻量生成模型成熟。\n2. **值得借鉴的是思路而非实现**：在\"背景静止、主体有限\"的 XR 场景（虚拟演唱会、体育观赛、远程教学）中，\"一次传背景 3D + 持续传骨骼\"的带宽结构优势是真实的。\n3. **如果要跟进，直接做体积化版本**：作者已指明方向（3D 骨架驱动体积化 avatar、多视点云融合到规范 3D 表示、单目 2D 骨架提升为可靠 3D 关节）。这三条与本期 MoQSplat、库内 SplashSplat/Deluge 的技术栈高度吻合。"}]},{"file":"../papers/notes/2609.18898__NormLift特征提升闭式解与语义可靠性.md","id":"2609.18898","title":"NormLift: From Lifted Features To Semantic Reliability In 3D Gaussian Splatting","title_zh":"NormLift：从被提升的特征到 3D 高斯泼溅中的语义可靠性","track":"神经渲染","date":"2026-09-16","batch":"2026-09-21","batchLabel":"2026-09-21","grade":"A","value":4.12,"evidence":"FULL","tags":["3DGS","开放词汇场景理解","CLIP","特征提升","闭式解","training-free","语义分割"],"flags":["⚠️ 依赖 CLIP 单位球假设"],"sections":[{"h":"一句话结论","body":"把 3DGS 中被广泛使用却缺乏理论支撑的 **feature back-projection（特征反投影）** 启发式，重新形式化为 **CLIP 单位球上的逐高斯余弦对齐问题**，并证明 **ℓ₂ 归一化的反投影特征正是该问题的闭式最优解**；同一个范数还能分解为\"视图内一致性 × 视图间一致性\"，经有效多视角支持度校准后成为**语义可靠性分数**，指导 KNN 众数投票精化。全程 **training-free**，在 ScanNet 开放词汇 3D 语义分割上 mIoU/mAcc 双第一，后提升阶段比 SFS 快 **6.7×**。"},{"h":"要解决的问题","body":"3DGS 做开放词汇 3D 理解的主流做法极其简单粗暴：把 2D 基础模型（主要是 CLIP）特征，按每个高斯对各像素射线的 alpha 混合贡献加权平均，\"提升\"到 3D 高斯上。这个操作由 Joseph et al. (2025) 引入 3DGS 文献，名字借鉴自 CT 的反投影。\n\n**问题有两个：**\n\n1. **理论错位**：现有分析都从**渲染侧**论证——把高斯特征当作可线性复合的欧氏变量，目标是重建 2D 特征图。但下游实际是**从 3D 侧用**：每个高斯被**独立**地在余弦嵌入空间里查询。论证方式与使用场景不匹配。\n2. **可靠性盲区**：哪些高斯的提升特征是可靠的、哪些只是少视角下的噪声，现有方法给不出信号。"},{"h":"方法详解","body":"### 3.1 预备：把 alpha 混合写成射线视角\n\n把 3DGS 的屏幕空间光栅化用射线形式重写（**仅作分析工具，不意味着标准 3DGS 做光线投射**）。设观测射线 `i` 上按深度排序的高斯为 `j`，标准 alpha 合成权重：\n\n```\nA_ij = α_ij · ∏_{k<j} (1 − α_ik)\n```\n\n渲染颜色 `C_i = Σ_j A_ij c_j + (1 − Σ_j A_ij) C_b`。本文把同一组权重 `A_ij` 当作 2D 语义观测与 3D 高斯之间的桥梁。\n\n标准反投影（被解释的对象）：\n\n```\nf_j = Σ_i A_ij B_i / Σ_i A_ij      （加权平均）\n```\n\n### 3.2 核心：逐高斯提升 = 单位球上的约束优化\n\n把目标换成 **3D 侧的实际用法**——每个高斯独立地在余弦空间被查询，于是形式化为：在 CLIP 单位球上，为每个高斯 `j` 找单位向量 `u_j`，最大化其与所有观测特征的**余弦对齐**（以 `A_ij` 加权）。\n\n**结论：该问题的闭式解恰好是 ℓ₂ 归一化的反投影特征**\n\n```\nu_j* = f_j / ‖f_j‖\n```\n\n这给了沿用已久的\"先反投影再归一化\"这一标准操作一个**互补的、从逐高斯语义指派角度出发的理论解释**。\n\n### 3.3 范数分解：‖f_j‖ 本身就是可靠性信号\n\n同一个范数 `‖f_j‖` 可做代数分解：\n\n```\n‖f_j‖ = (视图内一致性) × (视图间一致性)\n```\n\n- **单位向量** `u_j*` = 最优语义方向\n- **范数** `‖f_j‖` = 该方向的置信度\n\n再用**有效多视角支持度**对范数做校准，得到可靠性分数 `R(j)`。\n\n> 直觉：若多个视角给出的 2D 特征彼此一致且该高斯被足够多视角稳定观测，反投影后的向量模长就大；反之相互抵消，模长趋近 0。\n\n### 3.4 可靠性加权的众数投票精化\n\n用 `R(j)` 指导 KNN **众数投票**：对不可靠的高斯，直接**复制最受支持邻居的特征**，而不是做线性平均。\n\n这一步的动机很关键：**CLIP 特征做线性平均会破坏其有效性**（CLIP 嵌入不是线性可复合的欧氏空间），众数选择可以避开这个陷阱。"},{"h":"实验与结果","body":"**设置**：ScanNet，遵循 OpenGaussian 协议（每个高斯作为独立 3D 语义基元被查询），19 / 15 / 10 三类标签粒度。硬件：1× Tesla V100 + 1× RTX 4090。\n\n**主结果**：NormLift 在 mIoU 与 mAcc 上**均取得最佳**，同时超过 training-based 语言场方法与近期 training-free 提升方法两大家族。\n\n**消融（Table 2，ScanNet / OpenGaussian 协议）**\n\n| 变体 | 19 cls mIoU | 19 cls mAcc | 15 cls mIoU | 10 cls mIoU |\n|---|---:|---:|---:|---:|\n| w/o refinement（无精化） | 32.94 | 50.45 | 36.30 | 45.34 |\n| plain KNN voting（众数投票但不加权） | 34.06 | 51.83 | 38.07 | 46.94 |\n| linear averaging（距离加权线性平均） | 34.78 | 52.36 | 39.27 | 48.50 |\n| norm-only reliability（仅用范数） | 32.87 | 50.41 | 36.26 | 45.08 |\n| support-only reliability（仅用视角多样性） | 33.67 | 51.64 | 37.95 | 47.02 |\n| **Full NormLift** | **35.77** | **54.02** | **39.62** | **48.93** |\n\n关键读数：\n- 去掉精化损失最大，mIoU 掉 **2.4–4.4 点**\n- 精化内部，去掉可靠性权重掉 1.3 点；把众数选择换成线性平均掉 0.6 点\n- `R(j)` 两个因子缺一不可：norm-only 在单视角主导时不稳定；support-only 在 19 类下低 1.7 点\n\n**效率（Table 3，LERF-OVS，Tesla V100）**\n\n| 指标 | SFS | NormLift | 加速 |\n|---|---:|---:|---:|\n| Lift (s) | 242.5 | 359.0* | — |\n| **Post-Lift (s)** | 359.0 | **53.5** | **6.7×** |\n| **Total (s)** | 601.5 | **295.9** | **2.0×** |\n| Peak Mem (GB) | 9.86 | 9.86 | 持平（差异 <0.01 GB） |\n\n> \\* Lift 阶段两者\"共享同一提升阶段\"，表格中 Lift 列在不同场景互有胜负（Figurines 449.2 vs 379.5；Teatime 189.5 vs 532.3），均值差异来自场景构成；真正的可比增益在 Post-Lift。\n\n**2D 迁移**：附录 G 在 LERF-OVS 上做 2D 渲染评测。虽然 2D 协议是复合高斯而非独立查询，NormLift 仍具竞争力，说明有合理的 2D 泛化。"},{"h":"创新点与贡献","body":"1. **理论贡献（首要）**：把启发式证明为闭式最优解。这类\"给已有实践补理论\"的工作价值常被低估，但它决定了后续能否在此基础上做**有保证的改进**而非继续试错。\n2. **可靠性信号的涌现**：`‖f_j‖` 的范数分解不是额外设计的模块，而是同一推导的副产品——这是推导做得漂亮的标志。\n3. **避免线性平均**：明确指出 CLIP 特征线性平均会破坏有效性，用众数投票规避。\n4. **工程价值**：training-free 且后处理提速 6.7×，可直接嵌入任何现有 3DGS-语义管线。"},{"h":"局限与风险","body":"- **CLIP 单位球假设**：全部推导建立在 CLIP 特征位于单位球的前提。若换成 SigLIP-2、Perception Encoder 等不强制单位球的新编码器，闭式解是否仍成立需重新验证。**这是最大的可迁移性风险。**\n- 实验限于 ScanNet + LERF-OVS 两个数据集，无真机 / 无用户实验。\n- 无代码发布声明，复现依赖读者自行实现（不过方法本身 training-free、公式清晰，实现门槛不高）。\n- 增益幅度属\"稳健改进\"而非\"数量级突破\"（mIoU +2.4～4.4 点）。"},{"h":"与文献库的关系","body":"- **填补空白**：与 CADSplat（arXiv:2609.18473）共同建立库内 `神经渲染` 赛道基线（此前 0 篇）。\n- **直接超越**：在 training-free 提升家族中优于 SFS（Xiong et al., 2026），mIoU/mAcc 双第一且后处理快 6.7×。\n- **互补**：库内 GAPrompt++（2609.19716）做多粒度几何感知点云提示、CoRef-GS（2609.20586）做多智能体协作指代，均需语义特征底座——NormLift 可作为其上位的 training-free 特征提取层。\n- **可叠加于 CADSplat**：CADSplat 输出的高斯已有准确几何，NormLift 可为其补开放词汇语义。"},{"h":"可复现性","body":"- 代码：未声明\n- 数据：ScanNet（公开，需协议）、LERF-OVS（公开）\n- 硬件：单张 V100 或 4090 即可，峰值显存 9.86 GB\n- 实现难度：低（纯后处理，无训练）"},{"h":"行动建议","body":"1. **立即试点**：任何在用 3DGS + CLIP 做开放词汇分割的管线，都应把\"反投影后归一化 + 范数可靠性 + 众数投票\"这三步替换进去，成本几乎为零且后处理更快。\n2. **跟进验证**：在自己的编码器上验证单位球假设——这是判断该理论能否迁移到自己系统的唯一门槛。\n3. **与 SLAM 结合**：库内 RawSLAM（2609.20589）、AMB3R-SLAM（2609.19518）在线建图时若接入 NormLift，可在线产出语义地图，且 training-free 特性不会拖累实时性。"}]},{"file":"../papers/notes/2609.19315__GAVEL图世界模型规划校验.md","id":"2609.19315","title":"GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM Task Planning","title_zh":"GAVEL：用于长程 LLM 任务规划校验与修复的图世界模型","track":"世界模型与仿真","date":"2026-09-16","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"A","value":4.1,"evidence":"FULL","tags":["长程规划","LLM","图世界模型","部分可观测","信念推理","BEHAVIOR-1K"],"flags":[],"sections":[{"h":"一句话结论","body":"用**显式图世界模型**在 LLM 生成动作序列后、执行前做前向推演，把\"可从世界模型直接推出的修复\"本地解决，只把需要语义推理的错误回抛给 LLM。BEHAVIOR-1K 上（Qwen3-8B）单任务成功率 **41.2% → 91.8%**，多任务 **19.9% → 92.6%**，且分布信念推理使移动距离再降 **≈5.4%**。"},{"h":"要解决的问题","body":"LLM 作为独立规划器并不可靠，**失败率随规划视界增长**，对面向边缘部署的紧凑模型尤其严重。\n\n场景图方法（如 SayPlan）采用 propose-and-check 循环：结构化环境模型符号执行候选计划，不可行动作返回 LLM 重试。但这里有一个被忽视的浪费：\n\n> **从错误中恢复并不总是需要调用 LLM。** 例如抓取因距离不足而失败，恰当的恢复动作直接由被违反的前置条件决定。既然检测失败的图已经确定了修正方式，再调 LLM 只是增加成本与风险。"},{"h":"方法详解","body":"### 图世界模型的三个组成部分\n1. 相关**物体—关系**；\n2. 动作的**前置条件与效果**；\n3. 对**未观测物体位置的概率信念**。\n\n### 流水线（Algorithm 1）\n1. 指令 $\\mathcal{I}$ 分解为任务 $\\{\\mathcal{I}_i\\}$；\n2. `Task understanding` 抽取初始化图所需的实体、关系与目标；**RSN** 为不确定物体分配房间位置信念 $B_0$；\n3. **单次** LLM 查询产出每个任务的动作计划 $\\pi_i$；\n4. 图世界模型前向 rollout，`Repair` 修复**模型可推导的失败**，`Validate` 检出剩余违例；\n5. 未解决的违例最多回抛 LLM $T$（默认 5）次；\n6. 验证通过后，按当前信念下的代价函数（Eq. 7）对计划排序；\n7. 每完成一个任务，用新观测更新信念并**在线重排**剩余任务。\n\n### 两个关键设计\n- **修复分级**：模型可推导 → 本地修复；需语义推理 → 才回抛 LLM。\n- **分布信念推理**：对多任务指令，在可能的物体位置**分布**上推理以重排子任务，最小化期望搜索代价。"},{"h":"实验与结果","body":"**平台**：BEHAVIOR-1K，符号动作层面（论文明确说明聚焦高层任务规划而非低层操作）。为大规模评测，作者实现了轻量级 2D 执行器，保留原始平面图、物体属性、任务谓词与导航几何。\n\n**规模**：100 个单长程任务 + 500 条多任务指令。\n\n| 配置 | 单任务成功率 ↑ | LLM 调用次数 | 移动步数 |\n|---|---|---|---|\n| Qwen3-8B 仅 LLM | 41.2 ± 1.2 | 1.00 ± 0.0 | 13.3 ± 6.4 |\n| Qwen3-8B + sayplan | 76.4 ± 1.5 | 2.7 ± 1.7 | 24.6 ± 15.8 |\n| Qwen3-8B + gavel-basic | 76.2 ± 1.2 | 1.00 ± 0.0 | 13.5 ± 6.4 |\n| **Qwen3-8B + gavel** | **91.8 ± 1.3** | 1.5 ± 1.1 | 15.5 ± 9.4 |\n\n- **多任务**：19.9% → **92.6%**。\n- **分布信念推理**：相对静态变体，移动距离降低 **≈5.4%**。\n- 对比 sayplan：成功率 +15.4 个百分点，而 **LLM 调用次数从 2.7 降到 1.5**，移动步数从 24.6 降到 15.5——**在更少调用下取得更高成功率**，这是\"修复分级\"设计的直接收益。"},{"h":"创新点与贡献","body":"1. **识别并量化了\"不必要的 LLM 重规划\"这一浪费**——这是本文最有价值的洞察，且具有普适性（不限于机器人）。\n2. 把概率信念（未观测物体位置）显式纳入图世界模型，并在多任务排序上做分布推理。\n3. 给出了完整算法伪代码与代价函数形式化。\n4. 在紧凑模型（Qwen3-8B）上验证了效果，对边缘部署有意义。"},{"h":"局限与风险","body":"- 评测在**符号动作层面**的轻量 2D 执行器上进行，**未在真实机器人或高保真仿真上验证**低层操作可行性。\n- 图世界模型需要**手工/先验定义**物体关系、前置条件与效果——扩展到开放世界仍需解决知识获取问题。\n- 仅报告 Qwen3-8B 的详细表；\"compact local and frontier hosted LLM\" 的跨模型结论需看完整表。\n- 未开源。\n- XR 直接相关度中等：价值在于具身智能的任务规划层，可迁移到 MR 助手的长程指令执行，但本文未做 XR 评测。"},{"h":"与文献库的关系","body":"**新增 + 取代一个范式**。\n\n- 取代证据：`arXiv:2609.19315` Table I —— SayPlan 式全量回抛范式成功率 76.4%、LLM 调用 2.7 次、移动步数 24.6；GAVEL 为 91.8%、1.5 次、15.5。**在成功率更高的同时调用更少**，说明\"所有错误都回抛 LLM\"是次优策略。\n\n**互补关系**：`arXiv:2609.20034`（Astronex-World）是像素级世界模型，GAVEL 是符号级；二者层级不同，不构成取代。\n\n**未被取代**：GAVEL 本身为 CURRENT。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开 |\n| 数据 | BEHAVIOR-1K（公开基准），但 2D 执行器为自建 |\n| 模型 | Qwen3-8B（开源权重） |"},{"h":"行动建议","body":"- **做 LLM Agent / 具身规划**：直接采用\"修复分级\"原则——先判断错误是否可从本地模型直接推导，再决定是否回抛 LLM。这在成本敏感场景下收益立竿见影。\n- **MR 语音助手的长程指令**：可借鉴信念分布推理做子任务排序，减少用户等待。\n- **谨慎外推**：符号层面的成功率不代表真实执行成功率，落地前需在高保真环境中复测。"}]},{"file":"../papers/notes/2609.19518__AMB3R-SLAM公里级分层后端.md","id":"2609.19518","title":"AMB3R-SLAM: Kilometer-scale SLAM with Hierarchical Backend","title_zh":"AMB3R-SLAM：带分层后端的公里级 SLAM","track":"重建与SLAM","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"S","value":4.5,"evidence":"FULL","tags":["SLAM","公里级","分层后端","几何基座模型","动态场景","多模态扩展"],"flags":[],"sections":[{"h":"一句话结论","body":"用\"轻量前端 + 分层后端\"的架构把 3D 几何基座模型（DA3 / VGGT）改造成**真正的流式 SLAM**：在 VBR 上把 ATE 从 26.65 m 降到 7.42 m（**−72%**），Oxford Spires 上从 8.59 m 降到 2.32 m（**−73%**），且**不需要依赖静态世界假设的 BA**，因此天然处理动态场景。"},{"h":"要解决的问题","body":"3D 几何基座模型（VGGT、DepthAnything 3 等）在\"一次性输入几十张图、直接回归深度与位姿\"上表现惊艳，但它们是**离线、双向注意力、二次复杂度**的。而 SLAM 要求**连续流式 rollout、低延迟、有界显存**。\n\n已有的改造路线有两条，都有硬伤：\n- **因果注意力 / 循环记忆压缩**：做到常数帧耗时与有界显存，但牺牲局部重建精度，且因果链不可避免地累积漂移。\n- **依赖静态世界假设的 BA**：无法处理动态场景，且在公里级尺度下优化问题规模爆炸。"},{"h":"方法详解","body":"### 前端（低延迟在线跟踪）\n骨干为 **DA3-Small（80M 参数）**。对每一新帧，构造\"锚点关键帧 + 最近两帧\"的紧凑记忆，用 AMB3R-VO 的鲁棒尺度求解器解位姿与尺度因子。前端置信度用于后端视角选择；后端持续对前端**重新锚定**以清零局部漂移。\n\n| 前端对比（Table 1） | KITTI R_err / ATE% | KITTI FPS / Mem | TUM R_err / ATE% | TUM FPS / Mem |\n|---|---|---|---|---|\n| Two-view | 2.61 / 12.09 | 105.6 / 0.30 GB | 5.87 / 8.84 | 70.3 / 0.45 GB |\n| Ours (S) | 1.41 / 4.43 | 78.3 / 0.40 GB | 2.78 / 5.08 | 44.8 / 0.70 GB |\n| Ours (B) | 1.40 / 2.87 | 48.0 / 1.12 GB | 1.60 / 4.33 | 22.9 / 1.72 GB |\n\n### 分层后端（三级一致性）\n1. **稠密局部建图**：每 Δ 帧在 n 帧滑窗上构造稠密子图 $\\mathcal{M}_k$，取 $\\Delta = n/3$，保证 $\\mathcal{M}_k$ 不仅与 $\\mathcal{M}_{k+1}$ 重叠、还与 $\\mathcal{M}_{k+2}$ 重叠，天然产生 **Span-2 边**用于局部漂移校正。\n2. **稀疏长上下文建图**：引入中程约束。\n3. **回环闭合**：强制全局一致性。\n\n### 多模态可扩展\n同一框架可接入 stereo、RGB-D、LiDAR 作为额外输入。"},{"h":"实验与结果","body":"**数据集（9 个）**：KITTI（0.3k–4.7k 帧，0.4–5.1 km）、VBR（8.8k–18.8k 帧，1.0–5.2 km）、Oxford Spires（4.0k–13.5k 帧，0.26–0.80 km）、TUM、Bonn、ETH3D-SLAM、EuRoC、LaMAR、CroCoDL。\n\n**基线**：LoGeR、LingBot-Map、MASt3R-SLAM、VGGT-SLAM2、AMB3R-VO；另构造受控基线 DA3-SLAM（把 DepthAnything 3 接入 VGGT-SLAM 管线）以分离骨干贡献。\n\n| 数据集 | 先前 SOTA | AMB3R-SLAM | 降幅 |\n|---|---|---|---|\n| **VBR**（城市，最长 18.8k 帧 / 5.2 km） | 26.65 m（LingBot-Map）／31.75 m（LoGeR） | **7.42 m**（Ω 版 7.15 m） | **−72%** |\n| **Oxford Spires**（11 段） | 8.59 m（LoGeR） | **2.32 m**（Ω 版 2.08 m） | **−73%** |\n| **KITTI + LiDAR** | — | **亚米级 ATE** | — |\n\nOxford Spires 上 VGGT-SLAM2 平均 ATE 21.62 m，本文为 2.32 m（约 **9.3×** 提升）。\n\n**域外鲁棒性**：在 CroCoDL（灾害现场建筑，严重分布外）上超过所有在线系统，包括离线的 GLOMAP（76.4%）与 DA3-Long（88.9%）。LaMAR 上优势随窗口长度增长而扩大。\n\n**骨干无关性**：`Ours (Ω)` 把后端换成 VGGT-Ω 后结果相当（7.15 m / 2.08 m），证明框架不绑定特定几何基座模型。\n\n**动态场景**：因避开静态世界假设的 BA，**无需任何任务特定适配**即可处理复杂动态场景。"},{"h":"创新点与贡献","body":"1. 首个在**单张消费级 GPU** 上做到公里级、10k 帧实时单目 SLAM 的系统。\n2. **分层后端**（局部 Span-2 边 → 中程稀疏约束 → 全局回环）给出了流式场景下精度/延迟/显存的可调权衡，而非单点折中。\n3. 明确论证\"避开静态世界假设 BA\"可以同时换来**动态场景鲁棒性**与**全局一致性**，而不是牺牲一个换另一个。\n4. 骨干无关性验证（DA3 / VGGT-Ω 均可）。"},{"h":"局限与风险","body":"- 单目配置下 KITTI Seq. 01（高速）仍会导致灾难性尺度漂移——论文沿用惯例在均值中排除该序列。\n- 后端使用 giant 模型，显存峰值在 TUM 上达 1.72 GB（B 配置），对头显级设备仍偏重。\n- 未开源（仅有项目页）。\n- 论文未报告完整的端到端 FPS（前端 FPS 已给，后端异步但未给整体吞吐）。"},{"h":"与文献库的关系","body":"**新增 + 取代一条主流路线**。\n\n- 取代证据：`arXiv:2609.19518` §4 —— 依赖静态世界假设的 BA 无法开箱处理动态场景；chunk-based 流式方法在 VBR 上 ATE 26.65 m（LingBot-Map）/ 31.75 m（LoGeR），本文 7.42 m。\n- 补充证据：Oxford Spires 上 VGGT-SLAM2 21.62 m vs 本文 2.32 m。\n\n**注意（避免误判）**：与同批 `arXiv:2609.20589`（RawSLAM，HDR 光照鲁棒）、`arXiv:2609.20012`（GRF-Recon，长序列前馈重建）为**互补关系**：AMB3R 解决的是**尺度与长程漂移**，另两篇分别解决**光照**与**前馈重建的全局一致性**。三者不构成互相取代。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开（项目页 henryiwang.github.io/projects/amber-slam） |\n| 数据 | 全部为公开基准（KITTI / VBR / Oxford Spires / TUM / ETH3D / EuRoC / LaMAR / CroCoD / Bonn） |\n| 硬件 | 单张消费级 GPU |"},{"h":"行动建议","body":"- **大规模 AR / 城市级数字孪生**：本文是当前公里级单目 SLAM 的最强基线，应作为新建系统的对比起点。\n- **动态场景（商场、车站、工厂）部署**：其\"无静态假设\"特性省去了动态物体滤除模块，工程价值高。\n- **有 LiDAR 的载体**：多模态扩展路径已验证可降到亚米级，优先接入。"}]},{"file":"../papers/notes/2609.19750__DELUGE实时粒子流压缩.md","id":"2609.19750","title":"DELUGE: Decomposed Entropy-coded Live Unstructured Geometry Exchange for Real-time Particle Streaming","title_zh":"DELUGE：面向实时粒子流传输的分解式熵编码非结构化几何交换","track":"系统与平台","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"S","value":4.65,"evidence":"FULL","tags":["社交VR","粒子仿真","点云压缩","实时流媒体","Apple Vision Pro","数字孪生"],"flags":[],"sections":[{"h":"一句话结论","body":"DELUGE 是首个把**物理仿真粒子的时间相干性与速度可预测性**当作压缩先验的流式编解码架构，在 Apple Vision Pro 上端到端实现了 65K 粒子、60 fps 的**双向**实时交互，把 G-PCC 的解码延迟从 31 ms 压到 2.5 ms（≈20×），把 Draco 的编码延迟从 9.8 ms 压到 1.7 ms（≈6×）。"},{"h":"要解决的问题","body":"社交 VR 与数字孪生的核心诉求是\"多用户在同一份仿真状态上双向交互\"——你搅动水流，我这边立刻看到。这条链路的瓶颈不在渲染，而在**服务端仿真 → 每个客户端**的大规模粒子数据传输。\n\n现有点云压缩标准（MPEG G-PCC / TMC13、Google Draco）的设计前提是**静态几何结构**：它们为一次性的静态点云优化八叉树划分与熵编码。直接套用到逐帧变化的粒子流时，**编码延迟超过一帧的预算（60 fps 下 16.67 ms）**，链路直接不成立。\n\n| 阻塞点 | 具体表现（论文 Table 3） |\n|---|---|\n| G-PCC 编码 | 65K 粒子 46.6 ms / 帧（超出 16.67 ms 预算 2.8×） |\n| G-PCC 解码（Vision Pro 端） | 31.0 ms / 帧（超出预算 1.9×） |\n| Draco 编码 | 65K 粒子 9.8 ms / 帧（勉强，但 RD 效率差） |"},{"h":"方法详解","body":"DELUGE 的三个技术组件，全部针对\"仿真粒子\"而非\"通用点云\"的统计特性：\n\n### 1. 速度自适应位分配（Velocity-Adaptive Bit Allocation）\n物理仿真中**高速运动的粒子在感知上被运动模糊掩蔽**，人眼分辨不出其精确位置。因此把快速粒子提升到八叉树更浅的节点、分配更少比特。\n\n> 论文 Table 4 消融（262K 粒子，B=12）：开启后 I 帧 bppf 从 29.06 降到 23.55（**-19.0%**），D1 PSNR 反而 +0.18 dB，I 帧编/解码从 21.0/13.1 ms 降到 16.2/8.1 ms。\n\n### 2. 轴分离 Planar ANS 熵编码（Axis-Separated Planar ANS）\n粒子坐标三轴的分布偏置并不相同（例如重力方向分布更集中）。分离建模后：bppf 从 6.87 降到 5.77（约 -16%），且支持**三路并行解码**。\n\n### 3. 扁平反量化查找表（Flat Inverse-Quantization LUT）\n用 O(N) 的数组访问替换八叉树遍历，解码退化为\"ANS 解码 + ZigZag 反演\"的**单循环**，可被编译器自动 SIMD 向量化。\n\n> 消融：LUT 使平均解码从 6.1 ms 降到 5.6 ms，且是能在 WebAssembly 里跑满的关键。\n\n### I/P 帧结构\n关键帧（I 帧）完整编码；中间帧（P 帧）只对**粒子 ID 对应的增量**编码。因为仿真器天然保持跨帧粒子 ID 不变，delta 编码极其高效：**P 帧 bppf 仅为 I 帧的 15–30%**（Table 2）。"},{"h":"实验与结果","body":"**数据**：MLS-MPM（Moving Least Squares Material Point Method）流体仿真，APIC 传输 + 二次 B 样条；3 档粒子数 65K/131K/262K × 10 序列 × 600 帧；Tait 状态方程（K=2000, ρ₀=1.0, γ=5），60 fps。\n\n**指标**：D1 PSNR（点对面几何质量）、BD-Rate、每帧编解码耗时。\n\n| 指标（262K 粒子） | DELUGE | G-PCC | Draco |\n|---|---|---|---|\n| BD-Rate（vs G-PCC，全 I+P） | **−73.5%** | 基准 | — |\n| BD-Rate（vs Draco，全 I+P） | **−72.8%** | — | 基准 |\n| 最高 D1 PSNR | ~100 dB（近无损） | ~95 dB | ~100 dB（仅高码率） |\n\n| 每帧耗时（ms，65K） | 桌面编码 | 桌面解码 | Vision Pro 解码 |\n|---|---|---|---|\n| G-PCC | 46.6 | 28.2 | 31.0 |\n| Draco | 9.8 | 3.4 | — |\n| **DELUGE（I / P）** | **4.4 / 1.7** | **2.3 / 1.4** | **2.5 / 1.6** |\n\n**端到端部署**：服务端 M2 Max 编码关键帧 4.4 ms → WebSocket 广播 → Vision Pro 端 8.4 ms 内完成解码并渲染，双手裸手追踪直接反馈进共享仿真。\n\n**用户研究**：Apple Vision Pro 上 N=16 的被试内实验，对比 DELUGE 系统与 TMC13 系统，在**延迟相关的感知项与协作项**上显著更优（Wilcoxon 符号秩，r = .62–.83）。"},{"h":"创新点与贡献","body":"1. **把\"仿真粒子的物理先验\"而非\"通用点云的几何先验\"作为压缩基础**——这是整个工作的立身之本，也是它能做到 sub-frame 延迟的根因。\n2. 明确区分了**被动观看流媒体**（DASH、V-PCC 转码）与**双向交互流媒体**两类需求，指出前者的方法无法迁移到后者。\n3. 解码路径完全由查表与位运算构成，因此能原样编译到 WebAssembly + SIMD（解码约 1.2× 原生耗时，输出**逐比特一致**），覆盖浏览器与原生两端。"},{"h":"局限与风险","body":"- **依赖仿真器提供的跨帧粒子 ID**。论文在 8iVSLF / Owlii 真实采集点云上做了边界测试：只能用 I 帧路径，解码仍快 21×（47–57 ms vs 1019–1166 ms），但**码率反而落后于帧内基线**（15.46 bppf @ 60.12 dB）。作者明确指出瓶颈是 **ID 分配，不是压缩算法**——这决定了 DELUGE 短期内无法用于实拍点云。\n- 用户实验在 **LAN 内**完成，WAN 下的丢包与抖动未评估。\n- 协作二人组恒为\"一名实验者 + 一名被试\"，社交亲近度可能抬高协作评分。\n- 未开源（仅 TVCG/ISMAR 录用，无代码链接）。"},{"h":"与文献库的关系","body":"**新增 + 取代**。本文以量化证据使\"G-PCC / Draco 直接用于动态粒子流\"成为**落后路线**：\n- 取代证据：`arXiv:2609.19750` Table 3 —— G-PCC 编码 46.6 ms / 解码（Vision Pro）31.0 ms，均超 16.67 ms 帧预算；DELUGE 为 4.4 / 2.5 ms。\n- 取代证据：Table 2 BD-Rate −73.5%（vs G-PCC）、−72.8%（vs Draco）。\n\n**未被取代**：DELUGE 本身为 CURRENT（2026-09-17 提交，TVCG 在录）。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开 |\n| 数据 | MLS-MPM 自生成，参数在论文 §4.1.1 完整给出，可复现 |\n| 硬件 | 服务端 Apple M2 Max（12C CPU / 38C GPU / 64GB）；客户端 Apple Vision Pro（visionOS 2.2） |\n| 评测脚本 | 未公开 |"},{"h":"行动建议","body":"- **社交 VR / 多人协作仿真平台**：直接对标 DELUGE 的 I/P + 速度自适应方案替换现有点云压缩链路，这是当日最具备落地确定性的工作。\n- **做实拍点云流式传输的团队**：不要照搬 DELUGE，先解决跨帧 ID 关联（tracking / 场景流），否则拿不到 P 帧收益。\n- **数字孪生可视化**：可先采用其 WASM 解码路径（浏览器端零安装），再逐步迁移到原生。"}]},{"file":"../papers/notes/2609.19815__SnapPhysics单图物理场景图.md","id":"2609.19815","title":"SnapPhysics: A Physics-Aware Scene Graph from a Single View for Interactive Mixed Reality Scenes","title_zh":"SnapPhysics：面向交互式混合现实的物理感知场景图（单视图）","track":"空间计算与UI","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"A","value":4.12,"evidence":"FULL","tags":["混合现实","物理属性估计","场景图","单视图3D重建","VLM","免训练","ISMAR2026"],"flags":[],"sections":[{"h":"一句话结论","body":"**免训练（training-free）**框架：单张 RGB → 实例级 3D 重建 + 度量对齐 + 物理感知场景图 → 以结构化上下文喂给 VLM 推理质量/摩擦/质心。3D-FRONT 上场景级 **F-Score 提升 18.6%**，真实拍摄场景（含真值质量）上 **mALDE 降低最多 20.5%**、对数尺度相关 $r^2_{ls}$ **提升最多 19.6%**（vs VLM-only）。"},{"h":"要解决的问题","body":"MR 研究已经从\"视觉保真\"走向\"物理一致\"——物体行为可预测、操作精确、临场感成立。但标准游戏引擎（Unity / Unreal）对真实 3D 扫描内容需要**大量手工参数调节**才能让物理表现合理。\n\n已有的自动化物理属性赋值有三条路线，各有硬伤：\n\n| 路线 | 代表 | 问题 |\n|---|---|---|\n| 仿真方法 + 3DGS | MPM / XPBD 结合 | 把物理参数当作**任意常数** |\n| 从视频预测运动 | PAC-NeRF、Galileo | 计算成本**过高** |\n| LLM/VLM 从世界知识推断 | — | 从单图抽取物理属性**缺乏几何依据**，且无物体间关系 |\n\nSnapPhysics 的定位：把**实例级 3D 重建与空间对齐**和**物理感知场景图**结合，用后者把物体间关系与逐物体**度量几何**编码为 VLM 的结构化上下文。"},{"h":"方法详解","body":"两阶段流水线：\n\n### 阶段 1：单视图 3D 重建（深度锚定对齐）\n从单张 RGB 提取两类几何线索：\n- **实例级 3D 形状**：给定物体 mask，实例级重建器产出每个物体 $O_i$ 的点集 $\\mathbf{P}_i = \\{\\mathbf{p}_{i,j} \\in \\mathbb{R}^3\\}$。优点：边界精确。**缺点：处于规范坐标系、尺度任意**，与全局场景无度量一致性——直接放置会得到不合理的物体尺寸与布局。\n- **场景级度量深度**：由 DA3 在无位姿信息下估计稠密深度 $D$ 与相机内参 $\\mathbf{K}$（无需 EXIF 或已知相机参数），反投影：\n  $$\\mathbf{q}(x,y) = D(x,y)\\,\\mathbf{K}^{-1}[x,y,1]^{\\intercal}$$\n  优点：全局尺度一致。**缺点：缺乏实例级边界精度与物体分离**。\n\n**深度锚定对齐**把两者对齐——用度量深度提供全局尺度，用实例重建提供边界精度，从而**在免训练的前提下**得到度量几何估计。\n\n### 阶段 2：物理感知场景图 → VLM 推理\n场景图编码物体间关系 + 逐物体度量几何，作为**结构化上下文**交给 VLM 做属性推理（mass / friction / CoG）。"},{"h":"实验与结果","body":"**数据**：3D-FRONT（大规模合成室内场景，精确 3D 几何与家具网格）+ 真实拍摄场景（含真值质量）。\n\n**实现**：PyTorch，单张 NVIDIA A6000；每个实验条件对每张输入图评估 100 次（10 次独立运行 × 10 次重复），报告均值。\n\n**3D 重建（对比 MIDI 等，含在 3D-FRONT 上训练的 SOTA）**：\n\n| 方法 | CD-S ↓ | F-Score-S ↑ | CD-O ↓ |\n|---|---|---|---|\n| MIDI（3D-FRONT 上训练的 SOTA） | 0.080 | 50.19% | 0.103 |\n| **SnapPhysics** | **0.078** | **59.53%** | 0.168 |\n\n> 作者诚实说明：物体级 CD-O 0.168 高于 MIDI 的 0.103，原因是深度锚定对齐会留下小的逐物体位姿残差，而**逐轴方向敏感的指标会不成比例地放大**这些残差；且 MIDI 在 3D-FRONT 上训练、本文免训练，因此认为结果具有竞争力。\n\n**度量尺度正确性（2D 投影验证，无 3D 配准）**：\n\n| 配置 | Depth Ratio | 平均 F1 |\n|---|---|---|\n| SAM3D 单独 | 0.683 | 0.029（中位 F1 为 0，多数投影不与 GT mask 重叠） |\n| **SnapPhysics（深度锚定对齐）** | **1.011** | **0.607** |\n\nRMSE 下降一个数量级，逼近 DA3 上界。\n\n**物理属性估计**：3D-FRONT 场景级 F-Score **+18.6%**（超过最佳学习方法）；真实场景 mALDE **−20.5%**、$r^2_{ls}$ **+19.6%**（vs VLM-only）。"},{"h":"创新点与贡献","body":"1. **免训练**——不训练任何网络即可从单图得到度量一致的实例级几何 + 物理属性，这对 MR 内容管线意义重大（无需为目标场景准备训练数据）。\n2. 明确指出并解决了\"实例形状 vs 场景度量\"的表示鸿沟，深度锚定对齐是一个轻量且有效的桥接。\n3. 把**物理感知场景图**作为 VLM 的结构化上下文，补上了 VLM-only 路线缺失的几何依据与物体间关系。"},{"h":"局限与风险","body":"- 物体级 CD-O 劣于在目标数据集上训练的方法（0.168 vs 0.103），对物体形状精度要求高的场景需谨慎。\n- 依赖 DA3 深度与 SAM3D 式实例重建的质量，两者任一失败会级联。\n- 物理属性真值仅在有限真实场景上可得，\"最多 20.5%\"是最好情况。\n- 未开源（仅项目页）。\n- 论文自述按物体遮挡率与场景物体数分层后，物体级指标随拥挤度上升**平缓**——即拥挤场景仍是弱项。"},{"h":"与文献库的关系","body":"**新增 + 取代两条具体路线**。\n\n- 取代证据：`arXiv:2609.19815` §3 —— 相对 VLM-only 估计，真实场景 mALDE 降低最多 20.5%、$r^2_{ls}$ 提升最多 19.6%；相对学习类方法（含在 3D-FRONT 上训练的 MIDI），场景级 F-Score +18.6%。\n- 取代对象：PHYRECON（多视角）、PAC-NeRF（多视角/视频）、Galileo（视频）——这些方法或需预重建 3DGS、或需视频、或计算成本高，且多数**不支持多物体联合输出**。\n\n**未被取代**：SnapPhysics 本身为 CURRENT（2026-09-17 提交，ISMAR 2026 已录用）。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开（项目页 snapphysics-ismar2026.github.io） |\n| 数据 | 3D-FRONT（公开）+ 自建真实场景（含真值质量，未声明公开） |\n| 硬件 | 单张 NVIDIA A6000 |\n| 统计 | 每条件 100 次评估，报告均值 |"},{"h":"行动建议","body":"- **MR 内容管线**：这是当日最贴近\"MR 物理一致性\"这一具体痛点的工作，免训练特性使其可直接接入现有扫描资产流程。\n- **物体形状精度优先的场景**：需自行补充逐物体位姿精修，本文的 CD-O 短板是明确的。\n- **等代码**：当前不可复现，建议以方法借鉴为主。"}]},{"file":"../papers/notes/2609.20012__GRF-Recon全局射线场重建.md","id":"2609.20012","title":"GRF-Recon: Global Ray-Field Optimization for Long-Sequence Feed-forward Reconstruction","title_zh":"GRF-Recon：面向长序列前馈重建的全局射线场优化","track":"重建与SLAM","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"A","value":4.07,"evidence":"FULL","tags":["前馈重建","射线场","长序列","轨迹拼接","LoRA","ECCV2026"],"flags":[],"sections":[{"h":"一句话结论","body":"针对前馈 3D 重建在**长单目序列**上的三大瓶颈（显存爆炸、局部几何退化、长程轨迹漂移），给出\"粗到细轨迹对齐 + 轻量几何先验注入 + 混合权重稀疏射线场优化 + 射线误差联合优化的轨迹拼接\"的统一框架，在保持可与代表性 SLAM 系统竞争的轨迹精度的同时维持全局一致的 3D 重建。"},{"h":"要解决的问题","body":"前馈（feed-forward）3D 重建提供了从图像序列高效建模场景的范式，但向**大规模单目场景**扩展时受三个约束：\n1. **GPU 显存占用过大**；\n2. **局部几何退化**；\n3. **长程轨迹漂移**。\n\n已有的 chunk-based 优化策略提供**有限的几何约束**，且**无法在长轨迹上维持全局一致性**。"},{"h":"方法详解","body":"### 1. 粗到细轨迹对齐 + 轻量几何先验注入\n作者观察到：DA3 虽在大规模数据上预训练，直接用于序列重建常出现**几何过平滑**与**遮挡边界附近退化**（对细结构如电线杆、树叶、车辆结构尤其明显）。\n\n对策借鉴 Fin3R，采用**重归一化 LoRA（Re-normalized LoRA, r=8）**微调 DA3 编码器，注入高频单目几何先验，同时保持模型的多视角匹配泛化能力。\n\n为避免单目蒸馏引起的**特征范数漂移**（与冻结解码器期望的输入分布不匹配），对更新后的有效权重做重归一化约束：\n\n$$\\mathbf{W}' = \\frac{(\\mathbf{W}_0 + \\mathbf{B}\\mathbf{A}) \\cdot \\|\\mathbf{W}_0\\|_F}{\\|\\mathbf{W}_0 + \\mathbf{B}\\mathbf{A}\\|_F}$$\n\n其中 $\\|\\cdot\\|_F$ 为 Frobenius 范数。该策略**增加的可训练参数 < 1%**（论文另处表述为总量 < 3%），却保持了原始权重范数，稳定了特征激活分布。\n\n- 冻结解码器，只在 DINOv2 编码器注意力的 Q/K/V 投影插入低秩适配器；\n- 只更新图像编码器与深度头；\n- 单张 RTX 3090，AMP，batch 16，15 epoch（≈14 小时）。\n\n### 2. 混合权重稀疏射线场优化（Hybrid-weight Sparse Ray-Field Optimization）\n利用高频几何特征引导局部点云精化，并强制**帧间射线约束一致**。与 chunk-based 方法不同，这建立了**强跨帧几何耦合**，同时保持可扩展性。\n\n### 3. 射线误差联合优化的高效轨迹拼接\n显式降低累积漂移。"},{"h":"实验与结果","body":"**数据集**：KITTI、Waymo Open Dataset（轨迹估计与场景重建）；ETH3D、SINTEL、DIODE（深度估计）。\n\n**硬件**：i9-13900K + 128GB RAM + 单张 RTX 3090（24GB）——明确在 **24GB 显存预算**下工作。\n\n**指标**：ATE RMSE（全局一致性/累积漂移）；深度用 Rel ↓ 与 $\\delta_1$ ↑；点云用 Accuracy ↓ / Completeness ↓ / Chamfer ↓；NVS 用 PSNR / SSIM。单目尺度歧义通过全局 Sim(3) 对齐到 LiDAR 真值后计算。\n\n**深度改进（DA3 + Ours，Table 1）**：\n\n| 数据集 | Rel ↓ | $\\delta_1$ ↑ |\n|---|---|---|\n| KITTI（原始 DA3） | 5.14 | 92.4 |\n| KITTI（Ours） | **4.50** | **97.1** |\n| ETH3D / SINTEL / DIODE 平均（Ours） | 6.95 | 91.4 |\n| MoGe（教师） | 4.39 / 2.10 | 97.2 / 99.8 |\n\n相对全量微调，LoRA 方案**有效缓解过拟合**，同时产出锐利、高保真的局部几何。\n\n**效率**（论文给出）：\n- 跨 chunk 射线匹配 ≈ 0.16 s / 关键帧；chunk 对齐 ≈ 0.15 s / chunk；\n- 主导的前馈推理 ≈ 8 s / chunk，因此前两者的开销被**流水线并行完全隐藏**；\n- 即使超过一千帧的序列，完整 Levenberg–Marquardt 优化**约 10 秒内收敛**。\n\n论文结论：在无标定单目设置下，GRF-Recon 在多数序列上取得一致的 Accuracy / Completeness / Chamfer；射线场表示施加的全局约束**主动缓解了长轨迹上的点云分层与鬼影**。"},{"h":"创新点与贡献","body":"1. **重归一化 LoRA**——用 Frobenius 范数约束解决低秩适配中\"特征范数漂移导致冻结解码器失配\"这一具体问题，代价 <1% 参数。这是可独立复用的技巧。\n2. 混合权重稀疏射线场建立了 chunk-based 方法缺失的**强跨帧几何耦合**。\n3. 明确在 24GB 消费级显存预算下完成长序列重建，工程约束清晰。\n4. ECCV 2026 Spotlight。"},{"h":"局限与风险","body":"- 评测数据集以**室外驾驶**为主（KITTI / Waymo），论文未充分覆盖室内 AR 场景。\n- 前馈推理 8 s / chunk 仍偏慢，未达到实时。\n- 与 LiDAR 真值做 Sim(3) 对齐后计算指标，实际无真值场景下的表现需另行评估。\n- 未开源。\n- 论文给出的定量对比多为\"在多数序列上一致\"的定性表述，缺少一张汇总的 ATE 对比主表（KITTI Table 2 的完整数值在抽取文本中被截断）。"},{"h":"与文献库的关系","body":"**新增 + 取代一条具体路线**。\n\n- 取代证据：`arXiv:2609.20012` §1/§4 —— chunk-based 优化策略\"提供有限的几何约束，且无法在扩展轨迹上维持全局一致性\"；本文的射线场跨帧耦合 + 联合射线误差拼接直接针对该缺陷，并在 Chamfer / Completeness 上缓解了点云分层与鬼影。\n\n**注意（避免误判）**：与 `arXiv:2609.19518`（AMB3R-SLAM）虽同属长程重建，但 AMB3R 是**在线流式 SLAM**、解决公里级定位；GRF-Recon 是**前馈重建的全局优化**、解决显存与几何一致性。二者目标与评测协议不同，**不构成互相取代**。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | 未公开 |\n| 数据 | KITTI / Waymo / ETH3D / SINTEL / DIODE（均公开） |\n| 硬件 | i9-13900K + 128GB + 单张 RTX 3090 24GB |\n| 训练 | LoRA r=8，batch 16，15 epoch，≈14 小时 |"},{"h":"行动建议","body":"- **长序列重建管线**：重归一化 LoRA 是一个低风险、高收益的即插即用改进，值得先在自有骨干上验证。\n- **显存受限团队**：其\"流水线并行隐藏后端开销\"的工程思路可直接借鉴。\n- **室内 AR 场景**：需自行补充评测，本文证据集中在室外驾驶。"}]},{"file":"../papers/notes/2609.20034__Astronex-World实时世界模型基座.md","id":"2609.20034","title":"Astronex-World 1.0: Real-Time Interactive World Model Foundation","title_zh":"Astronex-World 1.0：实时交互式世界模型基座","track":"世界模型与仿真","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"S","value":4.32,"evidence":"FULL","tags":["世界模型","视频扩散","因果生成","相机控制","动作条件","开源基座"],"flags":[],"sections":[{"h":"一句话结论","body":"基于 Wan2.2-TI2V-5B 构建的**开源可控视频世界模型基座**，通过五阶段训练把双向视频扩散模型改造成 block-causal 的少步因果生成器，在 WBench Full 上以 70.0 分**超过 13.6B LongCat-Video 与 14B Helios**，与 22B LTX-2.3 相差 0.9 分，且**单张 L20 即可实时流式生成 832×480 @ 24fps**。"},{"h":"要解决的问题","body":"把预训练视频扩散 Transformer 转成交互式世界模型，存在三重张力：\n\n1. **注意力方向冲突**：预训练 DiT 用双向注意力（每个位置可读取整个含噪序列），而交互式生成是因果的、只能访问历史。\n2. **控制信息不可执行**：文本 + 首帧无法完全指定可执行控制，模型必须理解**时间对齐的相机几何**与**连续动作**。\n3. **自回归误差累积**：rollout 把模型误差反馈进上下文，导致运动衰减、几何漂移、色彩偏移与细节逐步丢失。"},{"h":"方法详解","body":"### 统一 T2V / I2V\n继承 Wan2.2-TI2V-5B 的设计：T2V 与 I2V 共享权重，仅 latent 初始化与去噪帧集合不同。RGB 片段经 Wan2.2 VAE 编码为 $z \\in \\mathbb{R}^{F \\times 48 \\times H/16 \\times W/16}$；$1\\times2\\times2$ patch embedding 转 token。\n\n### 控制注入\n- **PRoPE**：把相机内参 $K_i$ 与外参 $E_i$ 注入 self-attention。\n- **64 维动作流** $a_i$：通过逐帧调制进入**每一个 Transformer 层**。\n- **embodiment ID** $e$：区分不同载体。\n- Flow matching 目标：$\\mathcal{L}_{\\text{flow}} = \\mathbb{E}\\|v_\\theta(z_t,t,c_{\\text{text}},c_{\\text{ctrl}}) - (\\epsilon - z_0)\\|_2^2$，推理用 UniPC，CFG 权重 $w=3$。\n\n### 五阶段训练路径（本文核心工程贡献）\n\n| 阶段 | 目标 | 注意力与目标 | 产出 | 数据 |\n|---|---|---|---|---|\n| I. 双向控制适配 | 加 PRoPE 相机控制 + 64-D 动作控制 | 全时间注意力；flow matching | Wan2.2-TI2V-5B → restore-2200（双向发布版） | Control2V, DROID |\n| II. Block-causal 转换 | 全注意力 → 仅历史块注意力 | Block-causal mask；对干净历史 teacher forcing | 多步 AR 扩散模型 | Control2V |\n| III. 在线轨迹蒸馏 | 减少因果下采样步数 | 25 步 UniPC 教师 → 12 步学生 | few-step 因果初始化 | Control2V |\n| IV. 混合域因果 SFT | 恢复主体运动；学习游戏/驾驶/机器人动力学 | Block-causal；window 20, sink 4；rolling forcing | SFT1500 | Control2V, CrossFPS, DrivingDojo, PhysicalAI |\n| V. 非对称 DMD/DMD2 | 匹配 few-step 输出分布且保留运动 | 因果自 rollout；双向真实分数 + 在线伪分数 | DMD1545（因果发布版） | 同 IV |"},{"h":"实验与结果","body":"| 基准 | Astronex-World 1.0 | 对比 |\n|---|---|---|\n| WBench Navi | **73.5** | — |\n| WBench Full | **70.0** | YUME 1.5（同 5B 先验，A100 训练）68.9；Kairos 3.0（4B）65.7；LongCat-Video（13.6B）69.9；Helios（14B）69.7；LTX-2.3（22B）70.9 |\n\n**训练成本**：全部五个阶段在 **2× NVIDIA L20 48GB** 上完成；因果模型**单张 L20** 即可实时流式推理。\n\n**主体运动抑制的量化**（本文最诚实的自我披露）：\n\n| 模型状态 | 残差幅度 | 相对双向教师 |\n|---|---|---|\n| Bidirectional | 88.8 px | 100% |\n| SFT1500 | 36.1 px | 41% |\n| DMD1515 | 21.2 px | 24% |\n| DMD1545 | 16.6 px | 19% |\n\n作者明确承认：最终 DMD 提升了少步质量与整体一致性，但**强烈抑制主体运动**；运动项只是防止完全冻结，未恢复到双向教师幅度——这与\"Visual Plausibility\"与\"Subject Action\"两项得分中等相互印证。**Physical 68.1 分**也说明接触与物体动力学仍有明显空间。"},{"h":"创新点与贡献","body":"1. 完整公开了一条\"双向视频扩散 → 实时因果世界模型\"的**可复现五阶段路径**，包括各阶段的数据配比与目标设计。\n2. 全部训练仅用 2×L20（消费级/工作站级），推理单卡实时——对算力受限团队有直接参考价值。\n3. 预留动作输入/输出接口，可直接后训练接入具身智能与自动驾驶。\n4. **代码开源**（github.com/Astronex-Robotics/Astronex-World），这在同级别世界模型工作中少见。"},{"h":"局限与风险","body":"- **主体运动被显著抑制**（19% 残差幅度）——作为\"世界模型\"若物体不动，其在需要交互动力学的下游任务上价值打折。这是当前最需要关注的点。\n- WBench 分数由作者自己用官方代码与默认 VLM judge 评测，对比方分数取自榜单，协议一致性需保留判断。\n- XR 直接相关度中等：主要面向具身智能与自动驾驶，对 XR 的价值在于**仿真内容生成**，非头显链路本身。\n- 论文为 Technical Report，未经同行评审。"},{"h":"与文献库的关系","body":"**新增**。本批次内无论文在\"实时因果视频世界模型基座\"这一具体问题上给出更优结果，因此**不标记 OUTDATED**。\n\n- 与 `arXiv:2609.19315`（GAVEL，图世界模型做 LLM 规划校验）为**互补**：GAVEL 是符号层，Astronex-World 是像素层。\n- 与 `arXiv:2609.20649`（DexTouch-WM，触觉世界模型）为**互补**：后者加触觉模态，前者是视觉基座。"},{"h":"可复现性","body":"| 项 | 状态 |\n|---|---|\n| 代码 | **已开源** |\n| 权重 | 双向版 restore-2200 + 因果版 DMD1545 |\n| 训练硬件 | 2× L20 48GB |\n| 推理硬件 | 单张 L20 实时（832×480 @ 24 fps） |"},{"h":"行动建议","body":"- **算力受限但需要世界模型基座**：直接基于其开源权重做后训练，这是当日性价比最高的选择。\n- **需要强物体动力学的任务**：先用 SFT1500（41% 运动幅度）而非 DMD1545（19%），或自行在阶段 V 加大运动项权重。\n- **XR 团队**：可作为 MR 场景的**动态环境内容生成器**，但不要指望它提供可交互的物理正确性。"}]},{"file":"../papers/notes/2609.20330__RoboFind多智能体个性化寻物.md","id":"2609.20330","title":"RoboFind: Multi-Agent Personalized Object Search for People Who Are Blind or Have Low Vision","title_zh":"RoboFind：面向盲人与低视力者的多智能体个性化寻物","track":"交互与输入","date":"2026-09-17","batch":"2026-09-20","batchLabel":"2026-09-20 · 基线建库","grade":"A","value":4.15,"evidence":"FULL","tags":["无障碍","BLV","多智能体","四足机器人","AR引导","实例级验证","真机实验"],"flags":[],"sections":[{"h":"一句话结论","body":"把\"找个人物品\"从**一次性的教学→导航流水线**改造成**带实例级验证反馈的多智能体闭环**：32 次真机任务中成功率 **85.0%**（对比 sequential first-stop 基线 25.0%），**误报成功率从 75.0% 降到 5.0%**。"},{"h":"要解
