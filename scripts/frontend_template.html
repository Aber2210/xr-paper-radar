<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR 论文雷达 · 每日解读知识库</title>
<style>
:root{
  --bg:#0d1220; --panel:#141b2e; --panel2:#1a2338; --border:#263353; --border2:#2e3d63;
  --text:#e8edf7; --text2:#98a5c0; --text3:#6b7a99;
  --accent:#5b8cff; --accent2:#7c6cff;
  --s:#f5c542; --a:#5b8cff; --b:#3fbf9f; --c:#8a93a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:#0a0f1c;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px;
  font-family:Consolas,"Courier New",monospace;color:#a8c6ff}
header{position:sticky;top:0;z-index:50;background:rgba(13,18,32,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border)}
.hd{max-width:1440px;margin:0 auto;padding:14px 24px 0}
.hd-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.hd-top h1{font-size:19px;font-weight:650;letter-spacing:.5px}
.hd-top h1 .em{color:var(--accent)}
.hd-sub{color:var(--text2);font-size:12.5px}
nav.tabs{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap}
nav.tabs button{background:none;border:none;color:var(--text2);font-size:14px;padding:9px 16px;cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button .cnt{font-size:11px;color:var(--text3);margin-left:4px}
main{max-width:1440px;margin:0 auto;padding:22px 24px 60px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
  border-radius:10px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;color:var(--accent)}
.kpi .v small{font-size:12px;color:var(--text2);font-weight:400;margin-left:4px}
.kpi .k{font-size:12px;color:var(--text2);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:16px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.panel h3{font-size:14.5px;font-weight:650;margin-bottom:12px;color:var(--text)}
.panel h3 .hint{font-size:11.5px;color:var(--text2);font-weight:400;margin-left:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--text2)}
.legend .it{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.bar-row .lb{width:118px;text-align:right;color:var(--text2);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:#0a0f1c;border-radius:4px;height:14px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-row .val{width:74px;flex:none;color:var(--text2);font-size:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12.8px}
table.tb th{background:var(--panel2);color:var(--text2);font-weight:600;text-align:left;padding:8px 9px;
  border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:5}
table.tb td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
table.tb tr.row{cursor:pointer}
table.tb tr.row:hover{background:#1a2440}
table.tb tr.detail>td{background:#101728;padding:14px 18px}
.chip{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:650;line-height:1.5;
  border:1px solid transparent;white-space:nowrap}
.chip.S{background:rgba(245,197,66,.14);color:var(--s);border-color:rgba(245,197,66,.4)}
.chip.A{background:rgba(91,140,255,.14);color:var(--a);border-color:rgba(91,140,255,.4)}
.chip.B{background:rgba(63,191,159,.13);color:var(--b);border-color:rgba(63,191,159,.4)}
.chip.C{background:rgba(138,147,168,.13);color:var(--c);border-color:rgba(138,147,168,.4)}
.chip.track{background:rgba(124,108,255,.12);color:#b7adff;border-color:rgba(124,108,255,.35)}
.chip.ev{background:rgba(63,191,159,.1);color:#7fd8c2;border-color:rgba(63,191,159,.3)}
.chip.ev.ABSTRACT_ONLY{background:rgba(245,197,66,.08);color:#d8bc63;border-color:rgba(245,197,66,.25)}
.chip.ev.PARTIAL{background:rgba(249,115,98,.1);color:#f5a495;border-color:rgba(249,115,98,.3)}
.chip.top10{background:rgba(245,197,66,.12);color:var(--s);border-color:rgba(245,197,66,.45)}
.chip.warn{background:rgba(249,115,98,.12);color:#f5a495;border-color:rgba(249,115,98,.4)}
.mono{font-family:Consolas,monospace;font-size:12px;color:#a8c6ff}
.tt{color:var(--text)}
.tt2{color:var(--text2);font-size:11.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input[type=text],.filters select{background:#0a0f1c;border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:7px 10px;font-size:12.8px;font-family:inherit;outline:none}
.filters input[type=text]{min-width:220px}
.filters input[type=text]:focus,.filters select:focus{border-color:var(--accent)}
.filters label{font-size:12.3px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.filters .count{margin-left:auto;color:var(--text2);font-size:12.3px}
.info-wrap{position:relative;display:inline-flex;align-items:center;margin-left:7px;vertical-align:middle}
.info-btn{width:15px;height:15px;border-radius:50%;border:1px solid var(--border2);background:#0d1424;color:var(--text2);
  font-size:9.5px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.info-btn:hover{border-color:var(--accent);color:var(--accent)}
.info-pop{display:none;position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);width:310px;
  background:#141c33;border:1px solid var(--border2);border-radius:9px;padding:11px 13px;font-size:12px;color:#cfd8ec;
  line-height:1.8;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:60;text-align:left;white-space:normal;font-weight:400}
.info-pop::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#2a3a63}
.info-wrap:hover .info-pop,.info-pop.show{display:block}
.btn{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:7px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:rgba(91,140,255,.15);border-color:rgba(91,140,255,.5);color:var(--accent)}
.tw{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:76vh}
.minibar{display:flex;gap:2px;align-items:flex-end;height:16px}
.minibar i{width:5px;border-radius:1px;display:block}
.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.bcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px 17px;
  display:flex;flex-direction:column;gap:9px;transition:border-color .15s}
.bcard:hover{border-color:var(--border2)}
.bcard .bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bcard .bd{font-size:15.5px;font-weight:700}
.bcard .bn{font-size:11.5px;color:var(--text2)}
.bcard .stats{display:flex;flex-wrap:wrap;gap:6px}
.bcard .top{font-size:12.3px;color:var(--text2);display:flex;flex-direction:column;gap:3px}
.bcard .top .t{display:flex;gap:7px;align-items:baseline}
.bcard .top .t .rk{color:var(--text3);font-size:11px;width:14px;flex:none;text-align:right}
.bcard .top .t .nm{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .top .t .vl{font-family:Consolas,monospace;color:var(--accent);font-size:11.5px;flex:none}
.bcard .note{font-size:12px;color:var(--text2);background:#0d1424;border:1px solid var(--border);
  border-radius:7px;padding:8px 10px;max-height:96px;overflow:auto}
.bcard .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.bcard .links a{font-size:11.5px;background:#0d1424;border:1px solid var(--border);border-radius:6px;
  padding:3px 9px;color:var(--text2)}
.bcard .links a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.bcard.empty{opacity:.62}
.bcard.hidden{opacity:.78;background:#0c1220}
.bcard.hidden:hover{border-color:var(--border)}
.bcard .bh-r{display:flex;align-items:center;gap:9px}
.bcard .eye{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:3px 5px;border-radius:5px;line-height:1;font-family:inherit}
.bcard .eye:hover{color:var(--accent);background:#0d1424}
.bcard .vhint{font-size:11.8px;color:var(--text3);padding:1px 0 2px}
.prow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #1c2742;font-size:12.3px}
.prow:last-child{border-bottom:none}
.prow .rk{color:var(--text3);font-size:11px;width:15px;flex:none;text-align:right;font-family:Consolas,monospace}
.prow .pname{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pname:hover{color:var(--accent)}
.prow .pv{color:var(--accent);font-size:11.5px;flex:none;width:38px;text-align:right}
.prow .pbadges{display:flex;gap:4px;flex:none;align-items:center}
.prow .pbadges .btn{padding:1px 7px;font-size:11px;border-radius:6px}
.pfull{margin-top:6px;border-top:1px solid var(--border);padding-top:6px;max-height:300px;overflow:auto}
.notes-wrap{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:1024px){.notes-wrap{grid-template-columns:1fr}}
.nlist{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;max-height:82vh}
.nlist .nhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.nlist .nitems{overflow:auto;flex:1}
.nitem{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;
  flex-direction:column;gap:3px}
.nitem:hover{background:#1a2440}
.nitem.sel{background:#1d2a4d;border-left:3px solid var(--accent);padding-left:11px}
.nitem .nt{font-size:12.8px;color:var(--text);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem .nm{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text2)}
.ndetail{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px 26px;
  max-height:82vh;overflow:auto}
.ndetail h2{font-size:18px;line-height:1.5;margin-bottom:6px}
.ndetail .meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.ndetail .sec{margin:16px 0}
.ndetail .sec h4{font-size:13.8px;color:var(--accent);border-left:3px solid var(--accent);
  padding-left:9px;margin-bottom:7px}
.ndetail .sec .bd{font-size:13.2px;color:#cfd8ec}
.ndetail .sec .bd p{margin:5px 0}
.ndetail .sec .bd ul{margin:5px 0 5px 18px}
.ndetail .sec .bd li{margin:3px 0}
.ndetail .sec .bd table{border-collapse:collapse;margin:8px 0;font-size:12px}
.ndetail .sec .bd th,.ndetail .sec .bd td{border:1px solid var(--border2);padding:4px 8px}
.ndetail .sec .bd th{background:var(--panel2)}
.subh{font-weight:650;color:#a8c6ff;margin:9px 0 3px;font-size:13px}
.banner{border-radius:8px;padding:9px 13px;font-size:12.5px;margin:10px 0}
.banner.warn{background:rgba(249,115,98,.1);border:1px solid rgba(249,115,98,.35);color:#f5bdb2}
.banner.info{background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.3);color:#b9cdff}
.dimcell{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:2px 4px;
  font-family:Consolas,monospace;font-size:11.8px;font-weight:650}
.axis-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.8px;color:var(--text2);margin-bottom:10px}
.axis-legend b{color:var(--text);font-family:Consolas,monospace}
.foot{color:var(--text3);font-size:11.5px;margin-top:26px;border-top:1px solid var(--border);padding-top:12px}
.placeholder{color:var(--text3);text-align:center;padding:60px 0;font-size:13px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#263353;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="hd-top">
      <h1>XR 论文雷达 <span class="em">·</span> 每日解读知识库</h1>
      <span class="hd-sub" id="hdSub"></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="active">总览</button>
      <button data-tab="daily">每日解读<span class="cnt" id="cntDaily"></span></button>
      <button data-tab="library">论文库<span class="cnt" id="cntLib"></span></button>
      <button data-tab="dim7">七维对比<span class="cnt" id="cntDim"></span></button>
      <button data-tab="notes">笔记精读<span class="cnt" id="cntNotes"></span></button>
    </nav>
  </div>
</header>
<main>
  <section class="tab active" id="tab-overview"></section>
  <section class="tab" id="tab-daily"></section>
  <section class="tab" id="tab-library"></section>
  <section class="tab" id="tab-dim7"></section>
  <section class="tab" id="tab-notes"></section>
  <div class="foot" id="foot"></div>
</main>
<script>
const DATA = /*__DATA__*/;
</script>
<script>
"use strict";
const DIMS=[
 {k:"IMP",zh:"问题重要性",w:0.20},{k:"NOV",zh:"方法创新性",w:0.20},
 {k:"TEC",zh:"技术完整度",w:0.15},{k:"EXP",zh:"实验强度",w:0.15},
 {k:"PER",zh:"性能增益",w:0.15},{k:"TRL",zh:"落地成熟度",w:0.08},
 {k:"REP",zh:"可复现与影响力",w:0.07}];
const TRACK_COLORS={"神经渲染":"#7c6cff","重建与SLAM":"#3fbf9f","化身与人体":"#ff7a9e","感知与认知":"#f5a623",
 "内容生成":"#5bc8f5","渲染与显示":"#c588ff","空间计算与UI":"#6ee7b7","交互与输入":"#f97362",
 "触觉与多模态":"#e879c7","世界模型与仿真":"#60a5fa","系统与平台":"#b8c45e","评估与数据集":"#8ab4d8"};
const NONXR_TRACK="—（非 XR）";
const GRADE_COLOR={S:"#f5c542",A:"#5b8cff",B:"#3fbf9f",C:"#8a93a8"};
const SCORE_BG=["#1b2440","#22335c","#2c4a86","#3566b8","#4d86ef"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const isXR=p=>p.track!==NONXR_TRACK;
const fmt=v=>(v==null?"—":Number(v).toFixed(2));
function loadDailyHidden(){try{const v=JSON.parse(localStorage.getItem("xrhub.daily.hidden")||"{}");return (v&&typeof v==="object")?v:{}}catch(e){return{}}}
function saveDailyHidden(){try{localStorage.setItem("xrhub.daily.hidden",JSON.stringify(state.daily.hidden))}catch(e){}}
const state={tab:"overview",
  lib:{q:"",track:"",grade:"",ev:"",batch:"",top10:false,flag:false,nonxr:false,sort:"value"},
  dim:{q:"",track:"",grade:"",batch:"",nonxr:false},
  note:{q:"",track:"",sel:null},
  daily:{sort:"date-desc",hidden:loadDailyHidden()}};

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]");if(!b)return;
  state.tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("active",s.id==="tab-"+state.tab));
  if(state.tab==="daily")renderDaily();
  if(state.tab==="library")renderLibrary();
  if(state.tab==="dim7")renderDim7();
  if(state.tab==="notes")renderNotes();
});

/* ---------- shared svg ---------- */
function radarSVG(scores,size,color){
  size=size||240;color=color||"#5b8cff";
  const cx=size/2,cy=size/2,R=size/2-36,n=7;let g="",dp=[];
  for(let ring=1;ring<=5;ring++){
    const rr=R*ring/5,p=[];
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}
    g+='<polygon points="'+p.join(" ")+'" fill="none" stroke="#263353" stroke-width="1"/>';
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n;
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#263353"/>';
    const lx=cx+(R+19)*Math.cos(a),ly=cy+(R+19)*Math.sin(a);
    g+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#98a5c0" font-size="11" text-anchor="middle" dominant-baseline="middle">'+DIMS[i].k+'</text>';
    const v=Math.max(0,Math.min(5,scores[DIMS[i].k]||0)),rr=R*Math.max(v,0.12)/5;
    dp.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+g+
    '<polygon points="'+dp.join(" ")+'" fill="'+color+'33" stroke="'+color+'" stroke-width="2"/></svg>';
}
function donutSVG(series,size){
  size=size||210;const r=72,cx=size/2,cy=size/2,C=2*Math.PI*r;
  const total=series.reduce((a,s)=>a+s.value,0)||1;let acc=0,g="";
  series.forEach(s=>{
    const frac=s.value/total;
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="26" '+
       'stroke-dasharray="'+(frac*C-1.5).toFixed(2)+' '+(C-frac*C+1.5).toFixed(2)+'" '+
       'stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    acc+=frac;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+g+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" fill="#e8edf7" font-size="22" font-weight="700">'+total+'</text>'+
    '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" fill="#98a5c0" font-size="11">篇</text></svg>';
}
function trendSVG(rows){
  const W=940,H=250,pl=42,pr=44,pt=14,pb=52;
  const iw=W-pl-pr,ih=H-pt-pb;
  const maxC=Math.max.apply(null,rows.map(r=>r.count).concat([1]));
  const bw=Math.max(10,iw/rows.length-14);
  let g="",xs=[],ys=[];
  rows.forEach((r,i)=>{
    const x=pl+iw*(i+0.5)/rows.length;
    const h=ih*r.count/maxC;
    const col=r.xrCount!=null?"#5b8cff":"#3a4a75";
    g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'" opacity="0.9"><title>'+esc(r.label)+'：新增 '+r.count+' 篇</title></rect>';
    if(r.count>0)g+='<text x="'+x.toFixed(1)+'" y="'+(pt+ih-h-5).toFixed(1)+'" text-anchor="middle" fill="#98a5c0" font-size="10.5">'+r.count+'</text>';

    if(yv!=null){xs.push(x.toFixed(1));ys.push(yv.toFixed(1));}

  xs.forEach((x,i)=>{g+='<circle cx="'+x+'" cy="'+ys[i]+'" r="3" fill="#f5c542"/>';});

  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>';

function prow(p,i){
  const ni=DATA.noteIndex[p.id];
  const badges=[];
  if(p.top10)badges.push('<span class="chip top10" style="transform:scale(.82)">TOP10</span>');
  if(p.evidence)badges.push(evChip(p.evidence));
  if(p.outdated||(p.flags&&p.flags.length))badges.push('<span class="chip warn" style="transform:scale(.82)" title="'+esc((p.flags||[]).join("；")||"方法路线落后")+'">⚠️</span>');
  if(ni!=null)badges.push('<button class="btn" data-gonote="'+ni+'">📖 笔记</button>');
  return '<div class="prow"><span class="rk">'+(i+1)+'</span>'+
    '<a class="pname" href="https://arxiv.org/abs/'+p.id+'" target="_blank" title="'+esc(p.title_zh)+'">'+esc(p.title_zh)+'</a>'+
    '<span class="chip '+p.grade+'" style="transform:scale(.82)">'+p.grade+'</span>'+
    '<span class="mono pv">'+fmt(p.value)+'</span>'+
    '<span class="pbadges">'+badges.join("")+'</span></div>';
}
const DAILY_SORTS=[["date-desc","排序：时间 新→旧"],["date-asc","排序：时间 旧→新"],
  ["count-desc","排序：新稿数 多→少"],["count-asc","排序：新稿数 少→多"],
  ["avg-desc","排序：均分 高→低"],["avg-asc","排序：均分 低→高"],["max-desc","排序：最高分 高→低"]];
function dailySorted(){
  const arr=DATA.batches.slice();
  const skAsc=(a,b)=>{const x=a._sort||[a.key,0],y=b._sort||[b.key,0];
    if(x[0]!==y[0])return x[0]<y[0]?-1:1;return x[1]-y[1];};
  const skDesc=(a,b)=>{const x=a._sort||[a.key,0],y=b._sort||[b.key,0];
    if(x[0]!==y[0])return x[0]<y[0]?1:-1;return x[1]-y[1];};
  const num=(av,bv,desc)=>{const a=(av==null?Infinity:av),b=(bv==null?Infinity:bv);if(a===b)return 0;return desc?(b-a):(a-b);};
  switch(state.daily.sort){
    case "date-asc":arr.sort(skAsc);break;
    case "count-desc":arr.sort((a,b)=>(b.papers.length-a.papers.length)||skDesc(a,b));break;
    case "count-asc":arr.sort((a,b)=>(a.papers.length-b.papers.length)||skAsc(a,b));break;
    case "avg-desc":arr.sort((a,b)=>num(a.avg,b.avg,true)||skDesc(a,b));break;
    case "avg-asc":arr.sort((a,b)=>num(a.avg,b.avg,false)||skAsc(a,b));break;
    case "max-desc":arr.sort((a,b)=>num(a.max,b.max,true)||skDesc(a,b));break;
    default:arr.sort(skDesc);
  }
  return arr;
}

/* ---------- notes ---------- */
function mdLite(src){
  const lines=String(src).split("\n");let out=[],i=0;
  const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  while(i<lines.length){
    const ln=lines[i];
    if(/^\s*$/.test(ln)){i++;continue;}
    if(/^#{3,6}\s+/.test(ln)){
      out.push('<div class="subh">'+inline(ln.replace(/^#{3,6}\s+/,""))+'</div>');i++;continue;
    }
    if(/^\s*\|/.test(ln)){
      const rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const head=cells(rows[0]);
      const isSep=rows[1]&&/^[\s|:-]+$/.test(rows[1]);
      const body=isSep?rows.slice(2):rows.slice(1);
      let t="<table><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr>";
      body.forEach(r=>{t+="<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";});
      out.push(t+"</table>");continue;
    }
    if(/^\s*-\s+/.test(ln)){
      const items=[];
      while(i<lines.length&&/^\s*-\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*-\s+/,""));i++;}
      out.push("<ul>"+items.map(s=>"<li>"+inline(s)+"</li>").join("")+"</ul>");continue;
    }
    const para=[];
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*-\s+/.test(lines[i])&&!/^\s*\|/.test(lines[i])){para.push(lines[i]);i++;}
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("");
}
function renderNotes(){
  const n=state.note;
  const tracks=Object.keys(DATA.facets.noteTracks);
  const list=DATA.notes.map((nt,i)=>({nt,i})).filter(o=>{
    if(n.track&&o.nt.track!==n.track)return false;
    if(n.q){const q=n.q.toLowerCase();
      return ((o.nt.title_zh||"")+" "+(o.nt.title||"")+" "+o.nt.id+" "+(o.nt.tags||[]).join(" ")).toLowerCase().includes(q);}
    return true;
  });
  $("#tab-notes").innerHTML=
   '<div class="notes-wrap"><div class="nlist"><div class="nhead">'+
   '<input type="text" id="noteQ" placeholder="搜索笔记 / 标签…" value="'+esc(n.q)+'" style="background:#0a0f1c;border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:7px 10px;font-size:12.8px;outline:none;width:100%">'+
   '<select id="noteTrack" style="background:#0a0f1c;border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:6px 9px;font-size:12.5px;outline:none;width:100%">'+
   '<option value="">全部赛道（'+DATA.notes.length+'）</option>'+
   tracks.map(t=>'<option'+(n.track===t?" selected":"")+'>'+esc(t)+'（'+DATA.facets.noteTracks[t]+'）</option>').join("")+'</select>'+
   '<span class="tt2">命中 '+list.length+' 篇</span></div>'+
   '<div class="nitems" id="noteItems">'+
   (list.length?list.map(o=>{const nt=o.nt;
     return '<div class="nitem'+(o.i===n.sel?" sel":"")+'" data-ni="'+o.i+'">'+
      '<div class="nt">'+esc(nt.title_zh||nt.title)+'</div>'+
      '<div class="nm"><span class="chip '+nt.grade+'" style="transform:scale(.82)">'+nt.grade+'</span>'+
      '<span class="mono">'+nt.id+'</span><span>'+fmt(nt.value)+'</span>'+
      (nt.flags&&nt.flags.length?'<span class="chip warn" style="transform:scale(.82)">⚠️</span>':"")+'</div></div>';}).join(""):
     '<div class="placeholder">无匹配笔记</div>')+
   '</div></div><div class="ndetail" id="noteDetail">'+
   (n.sel!=null&&DATA.notes[n.sel]?noteDetail(DATA.notes[n.sel]):'<div class="placeholder">← 从左侧选择一篇原子笔记开始精读<br><span style="font-size:12px">共 '+DATA.notes.length+' 篇结构化笔记（一句话结论 / 方法详解 / 实验与结果 / 创新点 / 局限 / 复现性）</span></div>')+
   '</div></div>';
  $("#noteQ").addEventListener("input",e=>{n.q=e.target.value;renderNotes();});
  $("#noteTrack").addEventListener("change",e=>{n.track=e.target.value;renderNotes();});
}
function noteDetail(nt){
  const p=DATA.paperIndex[nt.id];
  const flagHtml=(nt.flags&&nt.flags.length)?'<div class="banner warn">⚠️ 路线/局限警示（索引进库标记）：'+nt.flags.map(esc).join("；")+'</div>':"";
  const meta='<div class="meta">'+gradeChip(nt.grade)+
    '<span class="chip" style="background:#0d1424;color:#98a5c0;border-color:#263353">加权 '+fmt(nt.value)+'</span>'+
    trackChip(nt.track)+evChip(nt.evidence)+
    '<span class="chip" style="background:#0d1424;color:#98a5c0;border-color:#263353">提交日 '+nt.date+'</span>'+
    '<span class="chip" style="background:#0d1424;color:#98a5c0;border-color:#263353">批次 '+esc(nt.batchLabel)+'</span>'+
    (nt.tags||[]).map(t=>'<span class="chip" style="background:rgba(124,108,255,.1);color:#b7adff;border-color:rgba(124,108,255,.3)">'+esc(t)+'</span>').join("")+'</div>';
  const secs=(nt.sections||[]).map(s=>'<div class="sec"><h4>'+esc(s.h)+'</h4><div class="bd">'+mdLite(s.body)+'</div></div>').join("");
  const head='<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">'+
    '<div style="flex:1;min-width:280px"><h2>'+esc(nt.title_zh||nt.title)+'</h2>'+
    '<div class="tt2" style="margin-top:2px">'+esc(nt.title)+' · <span class="mono">'+nt.id+'</span></div>'+meta+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
    '<a class="btn" href="https://arxiv.org/abs/'+nt.id+'" target="_blank">arXiv 原文</a>'+
    (p&&p.top10?'<span class="chip top10">TOP10 入选</span>':"")+
    (nt.file?'<a class="btn" href="'+nt.file+'" target="_blank">原笔记 .md</a>':"")+'</div></div>';
  return head+flagHtml+secs;
}
